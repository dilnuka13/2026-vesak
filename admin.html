    <!-- Receipt Generator -->
    <script>
        const getReceiptShortId = (donation) => {
            const rawId = donation.id ? String(donation.id) : String(Math.floor(Math.random() * 10000));
            return rawId.includes('-') ? rawId.split('-')[0].toUpperCase() : rawId.padStart(4, '0');
        };

        window.generateReceipt = async function(donation) {
            const { jsPDF } = window.jspdf;
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const width = 800;
            const height = 1150;
            canvas.width = width;
            canvas.height = height;

            const theme = {
                background: '#FFFFFF', surface: '#F8FAFC', primary: '#1E1B4B', secondary: '#312E81',
                accent: '#D97706', accentLight: '#FEF3C7', textPrimary: '#0F172A', textSecondary: '#475569',
                textMuted: '#94A3B8', border: '#E2E8F0', success: '#10B981', successLight: '#D1FAE5'
            };

            const roundedRect = (x, y, w, h, r) => {
                ctx.beginPath();
                ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
                ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
                ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
                ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath(); return ctx;
            };

            const loadImages = () => {
                const logo = new Image(); logo.crossOrigin = "anonymous"; logo.src = 'logo.png';
                const verify = new Image(); verify.crossOrigin = "anonymous"; verify.src = 've1rify.png';
                const dcIcon = new Image(); dcIcon.crossOrigin = "anonymous"; dcIcon.src = 'dc.png';
                return Promise.all([
                    new Promise(r => { logo.onload = () => r(logo); logo.onerror = () => r(null); }),
                    new Promise(r => { verify.onload = () => r(verify); verify.onerror = () => r(null); }),
                    new Promise(r => { dcIcon.onload = () => r(dcIcon); dcIcon.onerror = () => r(null); })
                ]);
            };

            const [logoImg, verifyImg, dcImg] = await loadImages();

            ctx.fillStyle = theme.background; ctx.fillRect(0, 0, width, height);

            ctx.save();
            ctx.globalAlpha = 0.04;
            ctx.translate(width / 2, height / 2);
            for (let i = 0; i < 8; i++) {
                ctx.rotate(Math.PI / 4);
                ctx.beginPath(); ctx.moveTo(0, -150); ctx.quadraticCurveTo(50, -75, 0, -20); ctx.quadraticCurveTo(-50, -75, 0, -150);
                ctx.fillStyle = theme.primary; ctx.fill();
                ctx.beginPath(); ctx.moveTo(0, -130); ctx.quadraticCurveTo(35, -65, 0, -30); ctx.quadraticCurveTo(-35, -65, 0, -130);
                ctx.fillStyle = theme.accent; ctx.fill();
            }
            ctx.restore();

            ctx.strokeStyle = theme.accent; ctx.lineWidth = 2; ctx.strokeRect(25, 25, width - 50, height - 50);
            roundedRect(35, 35, width - 70, height - 70, 16);
            ctx.strokeStyle = theme.primary; ctx.lineWidth = 3; ctx.stroke();

            if (dcImg) {
                const dcSize = 45; const offset = 70;
                ctx.drawImage(dcImg, offset - dcSize / 2, offset - dcSize / 2, dcSize, dcSize);
                ctx.drawImage(dcImg, width - offset - dcSize / 2, offset - dcSize / 2, dcSize, dcSize);
                ctx.drawImage(dcImg, offset - dcSize / 2, height - offset - dcSize / 2, dcSize, dcSize);
                ctx.drawImage(dcImg, width - offset - dcSize / 2, height - offset - dcSize / 2, dcSize, dcSize);
            }

            ctx.beginPath(); ctx.arc(width / 2, 110, 55, 0, Math.PI * 2); ctx.fillStyle = theme.surface; ctx.fill();
            ctx.strokeStyle = theme.border; ctx.lineWidth = 1; ctx.stroke();
            if (logoImg) ctx.drawImage(logoImg, width / 2 - 40, 70, 80, 80);

            ctx.textAlign = "center"; ctx.font = `bold 28px sans-serif`; ctx.fillStyle = theme.primary;
            ctx.fillText("VESAK LANTERN PROJECT 2026", width / 2, 175);
            ctx.font = `500 14px sans-serif`; ctx.fillStyle = theme.textSecondary;
            ctx.fillText("මහා වෙසක් කූඩු ව්‍යාපෘතිය - දික්හේනපුර", width / 2, 200);

            ctx.beginPath(); ctx.moveTo(width / 2 - 150, 215); ctx.lineTo(width / 2 + 150, 215);
            ctx.strokeStyle = theme.accent; ctx.lineWidth = 1.5; ctx.stroke();

            ctx.font = `bold 32px sans-serif`; ctx.fillStyle = theme.primary;
            ctx.fillText("OFFICIAL RECEIPT OF DONATION", width / 2, 275);
            ctx.font = `500 13px monospace`; ctx.fillStyle = theme.textMuted;
            ctx.fillText("බුදු සරණයි !", width / 2, 300);

            const id = getReceiptShortId(donation);
            const dateStr = new Date(donation.date || Date.now()).toLocaleDateString('en-GB', { day: '2-digit', month: 'long', year: 'numeric' });

            ctx.font = `bold 13px monospace`; ctx.fillStyle = theme.textSecondary;
            ctx.textAlign = "left"; ctx.fillText(`Receipt No: VLP/2026/${id}`, 70, 340);
            ctx.textAlign = "right"; ctx.fillText(`Date Issued: ${dateStr}`, width - 70, 340);
            ctx.textAlign = "center";

            ctx.beginPath(); ctx.moveTo(50, 365); ctx.lineTo(width - 50, 365); ctx.strokeStyle = theme.border; ctx.lineWidth = 1; ctx.stroke();

            roundedRect(50, 390, width - 100, 130, 12); ctx.fillStyle = theme.surface; ctx.fill(); ctx.strokeStyle = theme.border; ctx.stroke();
            ctx.font = `bold 12px sans-serif`; ctx.fillStyle = theme.textMuted; ctx.textAlign = "left";
            ctx.fillText("DONOR INFORMATION", 70, 415);
            ctx.font = `bold 22px sans-serif`; ctx.fillStyle = theme.textPrimary;
            ctx.fillText(donation.name || "Anonymous Donor", 70, 445);
            ctx.font = `500 13px sans-serif`; ctx.fillStyle = theme.textSecondary;
            if (donation.phone_number) ctx.fillText(`Contact: ${donation.phone_number}`, 70, 475);
            ctx.fillText(`Reported By: ${donation.reported_by || '-'}`, 70, 495);

            if (verifyImg) {
                ctx.drawImage(verifyImg, width - 180, 400, 30, 30);
                ctx.font = `bold 11px sans-serif`; ctx.fillStyle = theme.accent; ctx.fillText("VERIFIED DONOR", width - 145, 420);
            }

            roundedRect(50, 545, width - 100, 230, 12); ctx.fillStyle = "#FFFFFF"; ctx.fill();
            ctx.shadowColor = "rgba(0,0,0,0.05)"; ctx.shadowBlur = 8; ctx.strokeStyle = theme.border; ctx.stroke(); ctx.shadowColor = "transparent";

            ctx.font = `bold 12px sans-serif`; ctx.fillStyle = theme.textMuted; ctx.fillText("CONTRIBUTION DETAILS", 70, 575);
            let yOffset = 600;
            ctx.font = `bold 14px sans-serif`; ctx.fillStyle = theme.textSecondary;
            ctx.fillText("Description", 70, yOffset); ctx.fillText("Value / Amount", width - 200, yOffset);
            ctx.beginPath(); ctx.moveTo(70, yOffset + 12); ctx.lineTo(width - 70, yOffset + 12); ctx.strokeStyle = theme.border; ctx.stroke();

            yOffset += 35;
            ctx.font = `bold 18px sans-serif`; ctx.fillStyle = theme.textPrimary;
            ctx.fillText(donation.donation_type === 'Cash' ? (donation.donor_category || 'Cash Contribution') : `${donation.item_description || 'Goods'} ${donation.quantity ? '(x'+donation.quantity+')' : ''}`, 70, yOffset);
            ctx.font = `bold 22px sans-serif`; ctx.fillStyle = theme.primary; ctx.textAlign = "right";
            ctx.fillText(donation.donation_type === 'Cash' ? `LKR ${(Number(donation.amount) || 0).toLocaleString('en-LK')}` : 'GOODS', width - 70, yOffset);
            ctx.textAlign = "left";

            yOffset += 45;
            ctx.font = `500 12px sans-serif`; ctx.fillStyle = theme.textMuted;
            ctx.fillText(`Payment Method: ${donation.donation_type === 'Cash' ? 'Cash Payment' : 'Goods / In-kind'}`, 70, yOffset);
            roundedRect(width - 170, yOffset - 8, 100, 24, 12); ctx.fillStyle = theme.successLight; ctx.fill();
            ctx.font = `bold 11px sans-serif`; ctx.fillStyle = theme.success; ctx.textAlign = "center";
            ctx.fillText("✓ RECEIVED", width - 120, yOffset + 8); ctx.textAlign = "left";

            yOffset += 40; ctx.beginPath(); ctx.moveTo(70, yOffset); ctx.lineTo(width - 70, yOffset); ctx.strokeStyle = theme.border; ctx.stroke();
            yOffset += 25; ctx.font = `bold 14px sans-serif`; ctx.fillStyle = theme.textPrimary; ctx.fillText("Total Contribution", 70, yOffset);
            ctx.font = `bold 24px sans-serif`; ctx.fillStyle = theme.accent; ctx.textAlign = "right";
            ctx.fillText(donation.donation_type === 'Cash' ? `LKR ${(Number(donation.amount) || 0).toLocaleString('en-LK')}.00` : 'GOODS RECEIVED', width - 70, yOffset);
            ctx.textAlign = "center";

            ctx.save(); ctx.translate(width - 120, height - 320);
            ctx.beginPath(); ctx.arc(0, 0, 45, 0, Math.PI * 2); ctx.strokeStyle = theme.accent; ctx.lineWidth = 2; ctx.stroke();
            ctx.beginPath(); ctx.arc(0, 0, 38, 0, Math.PI * 2); ctx.stroke();
            ctx.font = `bold 10px sans-serif`; ctx.fillStyle = theme.accent; ctx.fillText("VERIFIED", 0, -8);
            ctx.font = `bold 18px sans-serif`; ctx.fillStyle = theme.primary; ctx.fillText("✓", 0, 12);
            ctx.font = `8px sans-serif`; ctx.fillStyle = theme.textMuted; ctx.fillText("OFFICIAL SEAL", 0, 28);
            ctx.restore();

            ctx.font = `italic 14px serif`; ctx.fillStyle = theme.textSecondary;
            ctx.fillText("“May the blessings of the Triple Gem be upon you.”", width / 2, height - 230);
            ctx.font = `bold 11px sans-serif`; ctx.fillStyle = theme.textMuted;
            ctx.fillText("This Dana is offered for the success of the Vesak Lantern Project and the happiness of all beings.", width / 2, height - 205);

            ctx.beginPath(); ctx.moveTo(50, height - 175); ctx.lineTo(width - 50, height - 175); ctx.strokeStyle = theme.border; ctx.stroke();
            ctx.font = `bold 11px sans-serif`; ctx.fillStyle = theme.textSecondary;
            ctx.fillText('071 615 5666 (Isara Dilnuka)  |  071 084 6810 (Imesh Nilhan)', width / 2, height - 150);
            ctx.fillText('isaradilnuka2005@gmail.com  |  imeshnilhan21@gmail.com', width / 2, height - 130);
            ctx.font = `500 10px sans-serif`; ctx.fillText('Near New Temple, Dikhenapura · Vesak Lantern Project 2026', width / 2, height - 110);
            ctx.fillText('This is a computer-generated receipt and requires no signature.', width / 2, height - 90);

            ctx.font = `bold 10px monospace`; ctx.fillStyle = theme.textMuted; ctx.textAlign = "left";
            ctx.fillText(`TXN REF: ${id}`, 55, height - 45); ctx.textAlign = "right";
            ctx.fillText(`Generated: ${new Date().toLocaleTimeString()}`, width - 55, height - 45);

            const imgData = canvas.toDataURL('image/jpeg', 1.0);
            const pdf = new jsPDF({ orientation: 'portrait', unit: 'px', format: [width, height] });
            pdf.addImage(imgData, 'JPEG', 0, 0, width, height);
            pdf.save(`Receipt_${(donation.name || 'Anonymous').replace(/\\s+/g, '_')}_${donation.date}.pdf`);
        };
    </script>

<body class="text-slate-200">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { LineChart, Line, BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer } = window.Recharts;

        // --- Common Components ---
        function Modal({ isOpen, onClose, title, children }) {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center modal-overlay p-4">
                    <div className="glass-card w-full max-w-2xl max-h-[90vh] flex flex-col bg-slate-900 border border-slate-700 shadow-2xl fade-in">
                        <div className="flex justify-between items-center p-6 border-b border-white/10">
                            <h2 className="text-xl font-bold text-white">{title}</h2>
                            <button onClick={onClose} type="button" className="text-slate-400 hover:text-white transition">
                                <span className="material-symbols-rounded">close</span>
                            </button>
                        </div>
                        <div className="p-6 overflow-y-auto">
                            {children}
                        </div>
                    </div>
                </div>
            );
        }

        function StatCard({ title, value, icon, color, subtitle }) {
            return (
                <div className="glass-card p-6 flex flex-col justify-center relative overflow-hidden group">
                    <div className={`absolute -right-4 -top-4 opacity-10 group-hover:scale-110 transition-transform`}>
                        <span className="material-symbols-rounded text-9xl">{icon}</span>
                    </div>
                    <div className="relative z-10 flex items-center gap-4">
                        <div className={`p-4 rounded-full bg-slate-800/80 backdrop-blur ${color}`}>
                            <span className="material-symbols-rounded text-3xl">{icon}</span>
                        </div>
                        <div>
                            <p className="text-slate-400 text-sm font-medium">{title}</p>
                            <h4 className="text-3xl font-bold text-white mt-1">
                                {typeof value === 'number' ? `Rs. ${value.toLocaleString()}` : value}
                            </h4>
                            {subtitle && <p className="text-xs text-slate-500 mt-1">{subtitle}</p>}
                        </div>
                    </div>
                </div>
            );
        }

        // Multi-select user component
        function MultiSelectUser({ users, selectedNames, onChange }) {
            const [customName, setCustomName] = useState('');

            const toggleName = (name) => {
                if(selectedNames.includes(name)) onChange(selectedNames.filter(n => n !== name));
                else onChange([...selectedNames, name]);
            };

            const addCustom = (e) => {
                e.preventDefault();
                if(customName.trim() && !selectedNames.includes(customName.trim())) {
                    onChange([...selectedNames, customName.trim()]);
                    setCustomName('');
                }
            };

            return (
                <div className="space-y-3 bg-slate-800/50 p-4 rounded-lg border border-slate-700">
                    <p className="text-xs text-slate-400 font-medium">Select Registered Users:</p>
                    <div className="flex flex-wrap gap-2">
                        {users.map(u => (
                            <div key={u.id} onClick={() => toggleName(u.username)} className={`cursor-pointer flex items-center gap-2 px-3 py-1.5 rounded-full border transition-colors ${selectedNames.includes(u.username) ? 'bg-theme/20 border-theme text-white' : 'bg-slate-800 border-slate-700 text-slate-400 hover:border-slate-500 hover:bg-slate-700'}`}>
                                {u.avatar_url ? <img src={u.avatar_url} className="w-5 h-5 rounded-full object-cover" /> : <span className="material-symbols-rounded text-sm">person</span>}
                                <span className="text-sm font-medium">{u.username}</span>
                            </div>
                        ))}
                    </div>
                    
                    <div className="flex flex-wrap gap-2 pt-3 border-t border-slate-700 mt-3">
                        {selectedNames.filter(n => !users.find(u => u.username === n)).map(n => (
                            <div key={n} onClick={() => toggleName(n)} className="cursor-pointer bg-slate-700 text-white px-3 py-1.5 rounded-full flex items-center gap-1 text-sm hover:bg-slate-600 transition">
                                {n} <span className="material-symbols-rounded text-xs hover:text-red-400">close</span>
                            </div>
                        ))}
                    </div>

                    <div className="flex gap-2 mt-2">
                        <input type="text" value={customName} onChange={e=>setCustomName(e.target.value)} placeholder="Add External Person..." className="flex-1 bg-slate-900 border border-slate-700 rounded p-2 text-white focus:border-theme text-sm outline-none" onKeyDown={(e) => {if(e.key === 'Enter') { e.preventDefault(); addCustom(e); }}} />
                        <button type="button" onClick={addCustom} className="bg-slate-700 hover:bg-slate-600 text-white px-3 rounded text-sm transition"><span className="material-symbols-rounded">add</span></button>
                    </div>
                </div>
            );
        }

        // --- App Shell ---
        function AdminApp() {
            const [session, setSession] = useState(null);
            const [loading, setLoading] = useState(true);
            const [forcePasswordChange, setForcePasswordChange] = useState(false);
            const [newPassword, setNewPassword] = useState('');
            const [confirmPassword, setConfirmPassword] = useState('');
            const [updatingPwd, setUpdatingPwd] = useState(false);

            useEffect(() => {
                const initAuth = async () => {
                    if (!window.supabase) return;
                    const { data: { session } } = await window.supabase.auth.getSession();
                    setSession(session);
                    
                    window.supabase.auth.onAuthStateChange((_event, session) => {
                        setSession(session);
                    });
                    
                    setLoading(false);
                };
                initAuth();
            }, []);

            useEffect(() => {
                const checkTempPwd = async () => {
                    if (session) {
                        const { data } = await window.supabase.from('app_users').select('is_temp_password').eq('id', session.user.id).maybeSingle();
                        if (data?.is_temp_password) setForcePasswordChange(true);
                    } else {
                        setForcePasswordChange(false);
                    }
                };
                checkTempPwd();
            }, [session]);

            const handleForcePasswordChange = async (e) => {
                e.preventDefault();
                if (newPassword.length < 6) return alert("Password must be at least 6 characters.");
                if (newPassword !== confirmPassword) return alert("Passwords do not match.");
                
                setUpdatingPwd(true);
                const { error: authError } = await window.supabase.auth.updateUser({ password: newPassword });
                if (authError) {
                    alert("Error updating password: " + authError.message);
                } else {
                    await window.supabase.from('app_users').update({ is_temp_password: false }).eq('id', session.user.id);
                    localStorage.setItem(`dikhenagama_pwd_${session.user.id}`, newPassword); // Cache for passkey
                    setForcePasswordChange(false);
                    alert("Password updated successfully!");
                }
                setUpdatingPwd(false);
            };

            if (loading) return <div className="min-h-screen flex items-center justify-center"><div className="animate-spin rounded-full h-12 w-12 border-t-2 border-theme"></div></div>;
            if (!session) return <Login setSession={setSession} />;

            if (forcePasswordChange) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-6 bg-[url('logo.png')] bg-center bg-no-repeat bg-[length:30%] bg-blend-overlay">
                        <form onSubmit={handleForcePasswordChange} className="glass-card p-8 max-w-md w-full fade-in shadow-2xl border-t-4 border-t-amber-500 relative">
                            <div className="flex justify-center mb-4 mt-2">
                                <span className="material-symbols-rounded text-amber-500 text-5xl bg-amber-500/10 p-4 rounded-full animate-bounce">lock_reset</span>
                            </div>
                            <h2 className="text-2xl font-bold mb-2 text-center text-white">Update Your Password</h2>
                            <p className="text-sm text-slate-400 text-center mb-6">You are using a temporary password. Please set a new permanent password to continue.</p>
                            
                            <div className="mb-4">
                                <label className="block text-sm font-medium text-slate-400 mb-2">New Password</label>
                                <input type="password" value={newPassword} onChange={e => setNewPassword(e.target.value)} className="w-full bg-slate-900/50 border border-slate-700 rounded p-3 text-white focus:outline-none focus:border-amber-500 transition-colors" required minLength="6" />
                            </div>
                            <div className="mb-6">
                                <label className="block text-sm font-medium text-slate-400 mb-2">Confirm New Password</label>
                                <input type="password" value={confirmPassword} onChange={e => setConfirmPassword(e.target.value)} className="w-full bg-slate-900/50 border border-slate-700 rounded p-3 text-white focus:outline-none focus:border-amber-500 transition-colors" required minLength="6" />
                            </div>
                            <button type="submit" disabled={updatingPwd} className="w-full bg-amber-500 hover:bg-amber-600 text-white font-semibold py-3 rounded transition-colors flex items-center justify-center gap-2 disabled:opacity-50 shadow-lg shadow-amber-500/20">
                                {updatingPwd ? <span className="material-symbols-rounded animate-spin">refresh</span> : <span className="material-symbols-rounded">save</span>} Save Password
                            </button>
                        </form>
                    </div>
                );
            }

            return <Dashboard session={session} />;
        }

        // --- Custom Login Screen ---
        function Login({ setSession }) {
            const [users, setUsers] = useState([]);
            const [selectedUser, setSelectedUser] = useState(null);
            const [password, setPassword] = useState('');
            const [error, setError] = useState(null);
            const [loading, setLoading] = useState(true);
            const [showAdminLogin, setShowAdminLogin] = useState(false);
            const [adminEmail, setAdminEmail] = useState('');

            // Passkey & 2FA States
            const [usePasswordFallback, setUsePasswordFallback] = useState(false);
            const [pending2FA, setPending2FA] = useState(false);
            const [twoFactorCode, setTwoFactorCode] = useState('');

            useEffect(() => {
                const fetchUsers = async () => {
                    setLoading(true);
                    const { data } = await window.supabase.from('app_users').select('*');
                    setUsers(data || []);
                    setLoading(false);
                };
                fetchUsers();
            }, []);

            const handleAvatarLogin = async (e) => {
                if (e) e.preventDefault();
                setLoading(true);
                setError(null);
                const email = `${selectedUser.username.toLowerCase().replace(/\s+/g, '')}@dikhenagama.local`;
                
                if (selectedUser.two_factor_enabled && !pending2FA) {
                    const { error: authError } = await window.supabase.auth.signInWithPassword({ email, password });
                    if (authError) {
                        setError("Authentication failed. Please check your password.");
                        setLoading(false);
                        return;
                    }
                    setPending2FA(true);
                    setLoading(false);
                    return;
                }

                if (pending2FA) {
                    if (twoFactorCode.length < 6) {
                        setError("Invalid 2FA Code.");
                        setLoading(false);
                        return;
                    }
                }

                const { error: finalError } = await window.supabase.auth.signInWithPassword({ email, password });
                if (finalError) {
                    setError("Authentication failed: " + finalError.message);
                    console.error("Auth Error:", finalError);
                } else {
                    // Save password locally if successful so Passkey can use it next time
                    localStorage.setItem(`dikhenagama_pwd_${selectedUser.id}`, password);
                }
                
                setLoading(false);
            };

            const triggerPasskeyLogin = async () => {
                setLoading(true);
                setError(null);
                try {
                    const challenge = new Uint8Array(32);
                    window.crypto.getRandomValues(challenge);
                    const credential = await navigator.credentials.get({
                        publicKey: { challenge, timeout: 60000, userVerification: "required" }
                    });
                    if (credential) {
                        const savedPwd = localStorage.getItem(`dikhenagama_pwd_${selectedUser.id}`);
                        if (savedPwd) {
                            setPassword(savedPwd);
                            const email = `${selectedUser.username.toLowerCase().replace(/\s+/g, '')}@dikhenagama.local`;
                            const { error: authError } = await window.supabase.auth.signInWithPassword({ email, password: savedPwd });
                            if (authError) {
                                setError("Passkey succeeded but password sync failed. Use fallback.");
                                setUsePasswordFallback(true);
                            } else {
                                if (selectedUser.two_factor_enabled) setPending2FA(true);
                            }
                        } else {
                            setError("Passkey recognized, but local credentials not found on this device. Please use password fallback.");
                            setUsePasswordFallback(true);
                        }
                    }
                } catch (e) {
                    console.error("Passkey cancelled or failed", e);
                    setError("Passkey authentication failed or was cancelled.");
                }
                setLoading(false);
            };

            const handleAdminLogin = async (e) => {
                e.preventDefault();
                setLoading(true);
                setError(null);
                const { error } = await window.supabase.auth.signInWithPassword({ email: adminEmail, password });
                if (error) setError(error.message);
                setLoading(false);
            };

            if (showAdminLogin) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-6 bg-[url('logo.png')] bg-center bg-no-repeat bg-[length:30%] bg-blend-overlay">
                        <form onSubmit={handleAdminLogin} className="glass-card p-8 max-w-md w-full fade-in shadow-2xl border-t-4 border-t-theme relative">
                            <button type="button" onClick={() => setShowAdminLogin(false)} className="absolute top-4 left-4 text-slate-400 hover:text-white transition"><span className="material-symbols-rounded">arrow_back</span></button>
                            <div className="flex justify-center mb-6 mt-4">
                                <span className="material-symbols-rounded text-theme text-5xl bg-theme/10 p-3 rounded-full">admin_panel_settings</span>
                            </div>
                            <h2 className="text-3xl font-bold mb-6 text-center text-white">System Admin</h2>
                            {error && <div className="bg-red-500/20 text-red-300 p-3 rounded mb-4 text-sm border border-red-500/30 flex items-center gap-2"><span className="material-symbols-rounded">error</span> {error}</div>}
                            
                            <div className="mb-4">
                                <label className="block text-sm font-medium text-slate-400 mb-2">Admin Email</label>
                                <input type="email" value={adminEmail} onChange={e => setAdminEmail(e.target.value)} className="w-full bg-slate-900/50 border border-slate-700 rounded p-3 text-white focus:outline-none focus:border-theme transition-colors" required disabled={loading} />
                            </div>
                            <div className="mb-6">
                                <label className="block text-sm font-medium text-slate-400 mb-2">Password</label>
                                <input type="password" value={password} onChange={e => setPassword(e.target.value)} className="w-full bg-slate-900/50 border border-slate-700 rounded p-3 text-white focus:outline-none focus:border-theme transition-colors" required disabled={loading} />
                            </div>
                            <button type="submit" disabled={loading} className="w-full bg-theme hover:bg-theme-hover text-white font-semibold py-3 rounded transition-colors flex items-center justify-center gap-2 disabled:opacity-50">
                                {loading ? <span className="material-symbols-rounded animate-spin">refresh</span> : <span className="material-symbols-rounded">login</span>} Sign In
                            </button>
                        </form>
                    </div>
                );
            }

            return (
                <div className="min-h-screen flex items-center justify-center p-6 bg-[url('logo.png')] bg-center bg-no-repeat bg-[length:30%] bg-blend-overlay">
                    <div className="glass-card p-8 max-w-4xl w-full fade-in shadow-2xl relative">
                        <button onClick={() => setShowAdminLogin(true)} className="absolute top-6 right-6 text-xs font-bold text-slate-500 hover:text-theme flex items-center gap-1 transition-colors bg-slate-800/50 px-3 py-2 rounded-full border border-slate-700">
                            <span className="material-symbols-rounded text-sm">shield</span> Raw Login
                        </button>
                        
                        <div className="text-center mb-10 mt-4">
                            <img src="logo.png" className="w-20 h-20 mx-auto mb-4 drop-shadow-lg" alt="Logo" />
                            <h2 className="text-3xl font-bold text-white tracking-wide">Select Your Account</h2>
                            <p className="text-slate-400 mt-2">Click your avatar to log in</p>
                        </div>

                        {loading ? (
                            <div className="flex justify-center py-10"><span className="material-symbols-rounded animate-spin text-5xl text-theme">autorenew</span></div>
                        ) : (
                            <div className="space-y-10 mt-6">
                                {users.filter(u => u.role === 'admin').length > 0 && (
                                    <div>
                                        <h3 className="text-theme font-semibold text-sm uppercase tracking-widest mb-6 border-b border-theme/20 pb-2 flex items-center justify-center gap-2">
                                            <span className="material-symbols-rounded text-base">admin_panel_settings</span> Administrators
                                        </h3>
                                        <div className="flex flex-wrap justify-center gap-4 sm:gap-6">
                                            {users.filter(u => u.role === 'admin').map(u => (
                                                <div key={u.id} onClick={() => setSelectedUser(u)} className="cursor-pointer group flex flex-col items-center p-4 rounded-xl hover:bg-theme/10 transition-all border border-theme/20 hover:border-theme shadow-lg shadow-theme/5 bg-theme/5 relative overflow-hidden w-36 sm:w-40">
                                                    <div className="absolute top-0 left-0 w-full h-1 bg-theme opacity-50"></div>
                                                    <div className="w-20 h-20 rounded-full bg-slate-900 border-2 border-theme overflow-hidden flex items-center justify-center mb-3 transition-colors shadow-[0_0_15px_rgba(34,197,94,0.3)]">
                                                        {u.avatar_url ? <img src={u.avatar_url} className="w-full h-full object-cover" /> : <span className="material-symbols-rounded text-4xl text-theme">shield</span>}
                                                    </div>
                                                    <h3 className="text-white font-medium text-center text-sm sm:text-base leading-tight">{u.username}</h3>
                                                    <span className="px-2 py-0.5 rounded text-[9px] mt-2 font-bold uppercase tracking-wider bg-theme text-black">Admin</span>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}
                                
                                {users.filter(u => u.role !== 'admin').length > 0 && (
                                    <div>
                                        <h3 className="text-slate-400 font-semibold text-sm uppercase tracking-widest mb-6 border-b border-white/10 pb-2 flex items-center justify-center gap-2">
                                            <span className="material-symbols-rounded text-base">group</span> System Users
                                        </h3>
                                        <div className="flex flex-wrap justify-center gap-4 sm:gap-6">
                                            {users.filter(u => u.role !== 'admin').map(u => (
                                                <div key={u.id} onClick={() => setSelectedUser(u)} className="cursor-pointer group flex flex-col items-center p-4 rounded-xl hover:bg-slate-800/80 transition-all border border-transparent hover:border-slate-600 bg-slate-900/30 w-36 sm:w-40">
                                                    <div className="w-20 h-20 rounded-full bg-slate-900 border-2 border-slate-700 group-hover:border-slate-400 overflow-hidden flex items-center justify-center mb-3 transition-colors shadow-lg">
                                                        {u.avatar_url ? <img src={u.avatar_url} className="w-full h-full object-cover" /> : <span className="material-symbols-rounded text-4xl text-slate-500 group-hover:text-slate-400 transition-colors">person</span>}
                                                    </div>
                                                    <h3 className="text-white font-medium text-center text-sm sm:text-base leading-tight">{u.username}</h3>
                                                    <span className="px-2 py-0.5 rounded text-[9px] mt-2 font-bold uppercase tracking-wider bg-slate-700 text-slate-300">User</span>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}
                        {!loading && users.length === 0 && <p className="text-center text-slate-500 py-10">No users found. Please use Raw Login to access the system.</p>}
                    </div>

                    <Modal isOpen={!!selectedUser} onClose={() => { setSelectedUser(null); setPassword(''); setError(null); setUsePasswordFallback(false); setPending2FA(false); setTwoFactorCode(''); }} title="Authentication Required">
                        {selectedUser && (
                            <div className="space-y-6 flex flex-col items-center py-4">
                                <div className="w-28 h-28 rounded-full bg-slate-800 border-4 border-theme overflow-hidden flex items-center justify-center mb-2 shadow-xl shadow-theme/20 relative">
                                    {selectedUser.avatar_url ? <img src={selectedUser.avatar_url} className="w-full h-full object-cover" /> : <span className="material-symbols-rounded text-6xl text-theme">person</span>}
                                    {selectedUser.passkey_id && <div className="absolute bottom-0 right-0 bg-theme text-black p-1.5 rounded-full"><span className="material-symbols-rounded text-sm block">fingerprint</span></div>}
                                </div>
                                <h3 className="text-2xl font-bold text-white text-center">Welcome back,<br/><span className="text-theme">{selectedUser.username}</span></h3>
                                
                                {error && <div className="w-full max-w-sm bg-red-500/20 text-red-300 p-3 rounded text-sm border border-red-500/30 flex items-center gap-2"><span className="material-symbols-rounded text-[20px]">error</span> {error}</div>}
                                
                                {pending2FA ? (
                                    <form onSubmit={handleAvatarLogin} className="w-full max-w-sm flex flex-col items-center space-y-4">
                                        <div className="w-full">
                                            <label className="block text-sm font-medium text-slate-400 mb-2 text-center">Enter 2-Factor Authentication Code</label>
                                            <input type="text" value={twoFactorCode} onChange={e => setTwoFactorCode(e.target.value.replace(/\D/g, '').substring(0, 6))} className="w-full bg-slate-900 border-2 border-slate-700 rounded-lg p-4 text-center text-white text-2xl tracking-[0.5em] focus:outline-none focus:border-theme shadow-inner transition-colors" placeholder="000000" required autoFocus />
                                        </div>
                                        <button type="submit" disabled={loading || twoFactorCode.length < 6} className="w-full bg-theme hover:bg-theme-hover text-white font-bold py-4 rounded-lg shadow-lg shadow-theme/30 transition-all disabled:opacity-50 flex items-center justify-center gap-2">
                                            {loading ? <span className="material-symbols-rounded animate-spin">refresh</span> : <span className="material-symbols-rounded">verified_user</span>} Verify 2FA
                                        </button>
                                    </form>
                                ) : (selectedUser.passkey_id && !usePasswordFallback) ? (
                                    <div className="w-full max-w-sm flex flex-col items-center space-y-4">
                                        <div className="text-center mb-2">
                                            <span className="material-symbols-rounded text-5xl text-theme animate-pulse mb-2">fingerprint</span>
                                            <p className="text-slate-400 text-sm">Passkey (Device Lock) is required for this account.</p>
                                        </div>
                                        <button onClick={triggerPasskeyLogin} disabled={loading} className="w-full bg-theme hover:bg-theme-hover text-white font-bold py-4 rounded-lg shadow-lg shadow-theme/30 transition-all flex items-center justify-center gap-2">
                                            {loading ? <span className="material-symbols-rounded animate-spin">refresh</span> : <span className="material-symbols-rounded">lock_open</span>} Unlock with Device
                                        </button>
                                        <button onClick={() => setUsePasswordFallback(true)} className="text-sm text-slate-500 hover:text-white transition underline mt-2">
                                            Use Password Instead
                                        </button>
                                    </div>
                                ) : (
                                    <form onSubmit={handleAvatarLogin} className="w-full max-w-sm flex flex-col items-center space-y-4">
                                        <div className="w-full">
                                            <label className="block text-sm font-medium text-slate-400 mb-2 text-center">Enter your password</label>
                                            <input type="password" value={password} onChange={e => setPassword(e.target.value)} className="w-full bg-slate-900 border-2 border-slate-700 rounded-lg p-4 text-center text-white text-xl tracking-widest focus:outline-none focus:border-theme shadow-inner transition-colors" required autoFocus />
                                        </div>
                                        <button type="submit" disabled={loading} className="w-full bg-theme hover:bg-theme-hover text-white font-bold py-4 rounded-lg shadow-lg shadow-theme/30 transition-all disabled:opacity-50 flex items-center justify-center gap-2">
                                            {loading ? <span className="material-symbols-rounded animate-spin">refresh</span> : <span className="material-symbols-rounded">login</span>} Secure Login
                                        </button>
                                        {selectedUser.passkey_id && (
                                            <button type="button" onClick={() => setUsePasswordFallback(false)} className="text-sm text-theme hover:text-theme-hover transition underline mt-2">
                                                Use Device Passkey
                                            </button>
                                        )}
                                    </form>
                                )}
                            </div>
                        )}
                    </Modal>
                </div>
            );
        }

        // --- Dashboard Layout ---
        function Dashboard({ session }) {
            const [activeTab, setActiveTab] = useState('overview');
            const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
            const [userRole, setUserRole] = useState('user');

            useEffect(() => {
                const fetchRole = async () => {
                    const { data } = await window.supabase.from('app_users').select('role').eq('id', session.user.id).maybeSingle();
                    if (data) setUserRole(data.role);
                    else {
                        // If logging in via synthetic email and missing from app_users, default to admin if configured, or user
                        setUserRole('admin'); 
                    }
                };
                fetchRole();
            }, [session.user.id]);

            const handleLogout = async () => {
                await window.supabase.auth.signOut();
            };

            const NavItem = ({ id, icon, label }) => (
                <button 
                    onClick={() => { setActiveTab(id); setMobileMenuOpen(false); }}
                    className={`flex items-center gap-3 w-full p-3 rounded-lg transition-colors font-medium ${activeTab === id ? 'bg-theme/20 text-theme' : 'text-slate-400 hover:bg-white/5 hover:text-white'}`}>
                    <span className="material-symbols-rounded">{icon}</span>
                    {label}
                </button>
            );

            return (
                <div className="h-screen flex flex-col md:flex-row fade-in overflow-hidden bg-[url('logo.png')] bg-fixed bg-center bg-no-repeat bg-[length:50%] bg-blend-overlay">
                    {/* Mobile Header */}
                    <div className="md:hidden flex justify-between items-center p-4 border-b border-white/10 glass-card rounded-none relative z-30">
                        <div className="flex items-center gap-2">
                            <img src="logo.png" alt="Logo" className="w-8 h-8" />
                            <span className="font-bold text-white truncate max-w-[200px]">Dikhenagama Portal</span>
                        </div>
                        <button onClick={() => setMobileMenuOpen(!mobileMenuOpen)} className="text-white p-1 hover:bg-white/10 rounded transition">
                            <span className="material-symbols-rounded">{mobileMenuOpen ? 'close' : 'menu'}</span>
                        </button>
                    </div>

                    {/* Sidebar */}
                    <aside className={`${mobileMenuOpen ? 'flex' : 'hidden'} md:flex w-full md:w-72 glass-card border-none rounded-none border-r border-white/10 p-6 flex-col z-20 absolute md:relative h-[calc(100%-73px)] md:h-full top-[73px] md:top-0 left-0 bg-slate-900/95 backdrop-blur-xl`}>
                        <div className="hidden md:flex items-center gap-3 mb-10">
                            <img src="logo.png" alt="Logo" className="w-10 h-10 object-contain drop-shadow-md" />
                            <h2 className="font-bold text-lg text-white tracking-wide leading-tight">Dikhenagama<br/><span className="text-theme font-normal text-sm">System Portal</span></h2>
                        </div>
                        
                        <nav className="flex-1 flex flex-col gap-2 overflow-y-auto pr-2">
                            <NavItem id="overview" icon="dashboard" label="Overview" />
                            <NavItem id="incomes" icon="payments" label="Incomes & Pledges" />
                            <NavItem id="expenses" icon="receipt_long" label="Expenses" />
                            
                            {/* Role Based Access Control: Admins only */}
                            {userRole === 'admin' && (
                                <>
                                    <div className="my-4 border-t border-white/10"></div>
                                    <p className="text-[10px] uppercase font-bold text-slate-500 tracking-wider mb-2 ml-2">Administration</p>
                                    <NavItem id="invitations" icon="event" label="Invitations & Events" />
                                    <NavItem id="users" icon="group" label="Users & Sessions" />
                                    <NavItem id="settings" icon="settings" label="System Settings" />
                                </>
                            )}
                        </nav>
                        
                        <div className="mt-auto pt-6 border-t border-white/10">
                            <div className="flex items-center justify-between mb-4 p-2 bg-slate-800/50 rounded-lg group hover:bg-slate-800 transition">
                                <div className="flex items-center gap-3 overflow-hidden">
                                    <div className="w-10 h-10 bg-theme/20 rounded-full flex items-center justify-center text-theme shrink-0">
                                        <span className="material-symbols-rounded">person</span>
                                    </div>
                                    <div className="overflow-hidden">
                                        <p className="text-sm font-medium text-white truncate" title={session.user.email}>{session.user.email}</p>
                                        <p className="text-xs text-theme uppercase tracking-wider">{userRole}</p>
                                    </div>
                                </div>
                                <button onClick={async () => {
                                    try {
                                        const challenge = new Uint8Array(32);
                                        window.crypto.getRandomValues(challenge);
                                        const cred = await navigator.credentials.create({
                                            publicKey: {
                                                challenge, rp: { name: "Dikhenagama System" }, user: { id: new Uint8Array(16), name: session.user.email, displayName: session.user.email }, pubKeyCredParams: [{ type: "public-key", alg: -7 }], timeout: 60000, authenticatorSelection: { authenticatorAttachment: "platform", userVerification: "required" }
                                            }
                                        });
                                        if (cred) {
                                            const { data: userData } = await window.supabase.from('app_users').select('id').eq('id', session.user.id).maybeSingle();
                                            if (userData) {
                                                await window.supabase.from('app_users').update({ passkey_id: cred.id }).eq('id', session.user.id);
                                                // Ask for their current password to save locally for auto-login fallback
                                                const pwd = prompt("Passkey Registered! To enable auto-login with this passkey on this device, please enter your current password once:");
                                                if (pwd) {
                                                    localStorage.setItem(`dikhenagama_pwd_${session.user.id}`, pwd);
                                                    alert("Device Passkey setup complete! You can now use your fingerprint/PIN to log in.");
                                                }
                                            }
                                        }
                                    } catch(e) { alert("Passkey setup failed or unsupported: " + e.message); }
                                }} className="text-slate-400 hover:text-theme p-2 rounded-full hover:bg-theme/10 transition" title="Setup Device Passkey (Lock Screen)"><span className="material-symbols-rounded text-[20px] block">fingerprint</span></button>
                            </div>
                            <button onClick={handleLogout} className="flex items-center justify-center gap-2 text-slate-300 hover:bg-red-500 hover:text-white bg-slate-800/50 transition-colors w-full p-3 rounded-lg font-medium">

                                Sign Out

                    </aside>

                    {/* Main Content Area */}
                    <main className="flex-1 flex flex-col h-full overflow-hidden relative z-10">
                        <header className="p-6 md:p-8 flex justify-between items-center">

                        </header>
                        
                        <div className="flex-1 p-6 md:p-8 pt-0 overflow-y-auto">
                            {activeTab === 'overview' && <OverviewTab />}
                            {activeTab === 'incomes' && <IncomesTab userRole={userRole} />}
                            {activeTab === 'expenses' && <ExpensesTab userRole={userRole} />}
                            {activeTab === 'invitations' && userRole === 'admin' && <InvitationsTab />}
                            {activeTab === 'users' && userRole === 'admin' && <UsersTab />}
                            {activeTab === 'settings' && userRole === 'admin' && <SettingsTab />}
                        </div>
                    </main>
                </div>
            );
        }

        // --- Tabs ---

        function OverviewTab() {
            const [stats, setStats] = useState({ 
                totalIncome: 0, totalExpense: 0, balance: 0, 
                todayIncome: 0, todayExpense: 0,
                vesakIncome: 0, posonIncome: 0 
            });
            const [chartData, setChartData] = useState([]);
            const [loading, setLoading] = useState(true);
            
            useEffect(() => { fetchStats(); }, []);
            
            const fetchStats = async () => {
                setLoading(true);
                try {
                    const { data: incomes } = await window.supabase.from('incomes').select('amount, date, event_type');
                    const { data: expenses } = await window.supabase.from('expenses').select('amount_taken, date, event_type');
                    
                    let totInc = 0; let totExp = 0;
                    let todInc = 0; let todExp = 0;
                    let vesInc = 0; let posInc = 0;
                    
                    const todayStr = new Date().toISOString().split('T')[0];
                    const timeline = {};
                    
                    (incomes || []).forEach(inc => {
                        const amt = parseFloat(inc.amount || 0);
                        totInc += amt;
                        if (inc.date === todayStr) todInc += amt;
                        if (inc.event_type === 'vesak') vesInc += amt;
                        if (inc.event_type === 'poson') posInc += amt;
                        
                        const d = inc.date;
                        if(!timeline[d]) timeline[d] = { date: d, income: 0, expense: 0 };
                        timeline[d].income += amt;
                    });
                    
                    (expenses || []).forEach(exp => {
                        const amt = parseFloat(exp.amount_taken || 0);
                        totExp += amt;
                        if (exp.date === todayStr) todExp += amt;
                        
                        const d = exp.date;
                        if(!timeline[d]) timeline[d] = { date: d, income: 0, expense: 0 };
                        timeline[d].expense += amt;
                    });
                    
                    setStats({ totalIncome: totInc, totalExpense: totExp, balance: totInc - totExp, todayIncome: todInc, todayExpense: todExp, vesakIncome: vesInc, posonIncome: posInc });
                    
                    const sortedData = Object.values(timeline).sort((a,b) => new Date(a.date) - new Date(b.date));
                    setChartData(sortedData.slice(-14));
                } catch(e) { console.error(e); }
                setLoading(false);
            };

            const downloadCSV = () => {
                const headers = ["Date", "Income", "Expense"];
                const csvRows = [headers.join(',')];
                chartData.forEach(row => {
                    csvRows.push(`${row.date},${row.income},${row.expense}`);
                });
                const blob = new Blob([csvRows.join('\n')], { type: 'text/csv' });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; a.download = 'financial_report.csv';
                a.click();
            };

            if (loading) return <div className="text-center text-slate-400 py-10"><span className="material-symbols-rounded animate-spin text-4xl">autorenew</span></div>;

            return (
                <div className="space-y-6">
                    <div className="flex justify-end mb-4">
                        <button onClick={downloadCSV} className="bg-slate-800 hover:bg-slate-700 text-white px-4 py-2 rounded-lg text-sm flex items-center gap-2 transition border border-slate-700">
                            <span className="material-symbols-rounded">download</span> Export Report (CSV)
                        </button>
                    </div>
                    
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">

                                                <option value="vesak">Vesak</option><option value="poson">Poson</option>
                                            </select>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div className="pt-4 flex justify-end gap-3 border-t border-white/10 mt-6">
