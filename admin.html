                                <button type="submit" className="bg-theme hover:bg-theme-hover text-white px-6 py-2 rounded shadow-lg shadow-theme/20 font-medium transition">Save Expense</button>
                            </div>
                        </form>
                    </Modal>
                </div>
            );
        }

        function InvitationsTab() {
            const [vesak, setVesak] = useState({});
            const [poson, setPoson] = useState({});
            
            useEffect(() => {
                const load = async () => {
                    const { data: vData } = await window.supabase.from('vesak_invitation').select('*').limit(1).maybeSingle();
                    const { data: pData } = await window.supabase.from('poson_invitation').select('*').limit(1).maybeSingle();
                    if(vData) setVesak(vData);
                    if(pData) setPoson(pData);
                };
                load();
            }, []);

            const handleSave = async (table, data) => {
                if(!data.id) await window.supabase.from(table).insert([{...data, id: 1}]);
                else await window.supabase.from(table).update(data).eq('id', 1);
                alert(`${table} updated successfully.`);
            };

            const Editor = ({ title, data, setData, onSave, themeColor }) => {
                const parseGallery = (str) => {
                    if(!str) return [];
                    try { return JSON.parse(str); } catch(e) { return []; }
                };
                
                const gallery = parseGallery(data.gallery_links);

                const handleAddLink = () => {
                    const url = prompt("Enter Image URL or YouTube Video Link:");
                    if(!url) return;
                    const newGallery = [...gallery, { type: url.includes('youtube') || url.includes('youtu.be') ? 'video' : 'image', url }];
                    setData({...data, gallery_links: JSON.stringify(newGallery)});
                };

                const handleImageUpload = async (e) => {
                    const file = e.target.files[0];
                    if(!file) return;
                    
                    const fileExt = file.name.split('.').pop();
                    const fileName = `${Math.random()}.${fileExt}`;
                    const { error } = await window.supabase.storage.from('gallery_images').upload(fileName, file);
                    if (error) { alert('Error uploading image!'); return; }
                    
                    const { data: pubData } = window.supabase.storage.from('gallery_images').getPublicUrl(fileName);
                    const newGallery = [...gallery, { type: 'image', url: pubData.publicUrl }];
                    setData({...data, gallery_links: JSON.stringify(newGallery)});
                };

                const handleRemoveItem = (idx) => {
                    if(!confirm('Remove this item?')) return;
                    const newGallery = gallery.filter((_, i) => i !== idx);
                    setData({...data, gallery_links: JSON.stringify(newGallery)});
                };

                return (
                <div className="glass-card p-6 relative overflow-hidden group">
                    <div className={`absolute top-0 left-0 w-1 h-full ${themeColor}`}></div>
                    <h3 className="text-xl font-bold text-white mb-6 flex items-center gap-2"><span className="material-symbols-rounded">festival</span> {title}</h3>
                    <div className="space-y-4">
                        <div className="grid grid-cols-2 gap-4">
                            <div><label className="text-xs text-slate-400">Anniversary (e.g. 1st)</label><input type="text" value={data.anniversary || ''} onChange={e=>setData({...data, anniversary: e.target.value})} className="w-full mt-1 bg-slate-900/50 border border-slate-700 rounded p-2 text-sm text-white focus:outline-none focus:border-theme" /></div>
                            <div><label className="text-xs text-slate-400">Published Status</label>
                                <select value={data.is_published || false} onChange={e=>setData({...data, is_published: e.target.value === 'true'})} className="w-full mt-1 bg-slate-900/50 border border-slate-700 rounded p-2 text-sm text-white focus:outline-none focus:border-theme">
                                    <option value="true">Published</option><option value="false">Hidden</option>
                                </select>
                            </div>
                        </div>
                        <div><label className="text-xs text-slate-400">Description</label><textarea value={data.description || ''} onChange={e=>setData({...data, description: e.target.value})} className="w-full mt-1 bg-slate-900/50 border border-slate-700 rounded p-2 text-sm text-white h-20 focus:outline-none focus:border-theme"></textarea></div>
                        <div><label className="text-xs text-slate-400">Google Map Iframe Link</label><input type="text" value={data.map_link || ''} onChange={e=>setData({...data, map_link: e.target.value})} className="w-full mt-1 bg-slate-900/50 border border-slate-700 rounded p-2 text-sm text-white focus:outline-none focus:border-theme" placeholder="https://www.google.com/maps/embed?..." /></div>
                        
                        <div>
                            <label className="text-xs text-slate-400 mb-2 block">Gallery Media</label>
                            <div className="flex gap-2 mb-3">
                                <button onClick={handleAddLink} className="bg-slate-800 text-xs px-3 py-1.5 rounded hover:bg-slate-700 border border-slate-700 transition flex items-center gap-1"><span className="material-symbols-rounded text-sm">link</span> Add URL</button>
                                <label className="bg-slate-800 text-xs px-3 py-1.5 rounded hover:bg-slate-700 border border-slate-700 transition flex items-center gap-1 cursor-pointer">
                                    <span className="material-symbols-rounded text-sm">upload</span> Upload Image
                                    <input type="file" accept="image/*" onChange={handleImageUpload} className="hidden" />
                                </label>
                            </div>
                            <div className="grid grid-cols-2 sm:grid-cols-3 gap-2">
                                {gallery.map((item, idx) => (
                                    <div key={idx} className="relative aspect-video bg-slate-900 rounded overflow-hidden border border-slate-700 group">
                                        {item.type === 'video' ? (
                                            <div className="flex items-center justify-center h-full text-slate-500"><span className="material-symbols-rounded text-3xl">play_circle</span></div>
                                        ) : (
                                            <img src={item.url} className="w-full h-full object-cover" />
                                        )}
                                        <button onClick={() => handleRemoveItem(idx)} className="absolute top-1 right-1 bg-red-500/80 hover:bg-red-500 text-white p-1 rounded backdrop-blur opacity-0 group-hover:opacity-100 transition"><span className="material-symbols-rounded text-sm block">delete</span></button>
                                    </div>
                                ))}
                            </div>
                        </div>

                        <div className="pt-4 border-t border-white/10 flex justify-end">
                            <button onClick={onSave} className="bg-slate-800 hover:bg-slate-700 border border-slate-600 text-white px-6 py-2 rounded font-medium transition">Save {title}</button>
                        </div>
                    </div>
                </div>
                );
            };

            return (
                <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                    <Editor title="Vesak Invitation Settings" data={vesak} setData={setVesak} onSave={() => handleSave('vesak_invitation', vesak)} themeColor="bg-green-500" />
                    <Editor title="Poson Invitation Settings" data={poson} setData={setPoson} onSave={() => handleSave('poson_invitation', poson)} themeColor="bg-amber-500" />
                </div>
            );
        }

        function UsersTab() {
            const [users, setUsers] = useState([]);
            const [sessions, setSessions] = useState([]);
            const [loading, setLoading] = useState(true);
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [formData, setFormData] = useState({ id: '', username: '', role: 'user', avatar_url: '', password: '', phone_number: '', address: '', account_status: 'active', is_contributor: true, contribution_goal: 10000 });

            useEffect(() => { fetchUsers(); }, []);

            const fetchUsers = async () => {
                setLoading(true);
                const { data } = await window.supabase.from('app_users').select('*').order('username', { ascending: true });
                setUsers(data || []);
                setLoading(false);
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                setLoading(true);

                const payload = { 
                    username: formData.username, 
                    role: formData.role, 
                    avatar_url: formData.avatar_url,
                    phone_number: formData.phone_number,
                    address: formData.address,
                    account_status: formData.account_status,
                    is_contributor: formData.is_contributor,
                    contribution_goal: formData.contribution_goal
                };

                if (formData.id) {
                    await window.supabase.from('app_users').update(payload).eq('id', formData.id);
                    setIsModalOpen(false);
                    fetchUsers();
                } else {
                    if (!formData.password || formData.password.length < 6) {
                        alert("Password must be at least 6 characters long.");
                        setLoading(false);
                        return;
                    }
                    
                    const tempClient = window.supabase.createClient(supabaseUrl, supabaseKey, { auth: { persistSession: false, autoRefreshToken: false } });
                    const email = `${formData.username.toLowerCase().replace(/\s+/g, '')}@dikhenagama.local`;
                    
                    const { data: authData, error: authError } = await tempClient.auth.signUp({ email, password: formData.password });

                    if (authError) { alert("Failed to create Auth User: " + authError.message); setLoading(false); return; }

                    const userId = authData?.user?.id;
                    if (!userId) { alert("Failed to retrieve user ID."); setLoading(false); return; }

                    const { error: dbError } = await window.supabase.from('app_users').insert([{ id: userId, password_hash: 'managed_via_supabase_auth', ...payload }]);

                    if (dbError) alert("Failed to create App User profile: " + dbError.message);
                    else { setIsModalOpen(false); fetchUsers(); }
                }
                setLoading(false);
            };

            const handleEdit = async (u) => {
                setFormData({ 
                    id: u.id, username: u.username, role: u.role, avatar_url: u.avatar_url || '', password: '', phone_number: u.phone_number || '', address: u.address || '', account_status: u.account_status || 'active', is_contributor: u.is_contributor !== false, contribution_goal: u.contribution_goal || 10000
                });
                setIsModalOpen(true);
                const { data } = await window.supabase.from('user_sessions').select('*').eq('user_id', u.id).order('last_active', { ascending: false });
                setSessions(data || []);
            };

            const handleDelete = async (id, username) => {
                if(confirm(`Are you sure you want to delete ${username}'s profile? Note: For complete removal, you must also delete them from the Supabase Auth Dashboard.`)) {
                    await window.supabase.from('app_users').delete().eq('id', id);
                    fetchUsers();
                }
            };

            const handleClearPasskey = async () => {
                if(!confirm("Remove the stored passkey for this user? They will need to register a new one next time.")) return;
                await window.supabase.from('app_users').update({ passkey_id: null }).eq('id', formData.id);
                alert("Passkey removed successfully.");
                fetchUsers();
            };

            const handleClear2FA = async () => {
                if(!confirm("Disable Two-Factor Authentication for this user?")) return;
                await window.supabase.from('app_users').update({ totp_enabled: false, totp_secret: null, two_factor_enabled: false, two_factor_secret: null }).eq('id', formData.id);
                alert("2FA Disabled.");
                fetchUsers();
            };

            const handleResetPassword = async () => {
                const generatedPass = Math.floor(100000 + Math.random() * 900000).toString();
                const tempPass = prompt("Generate or enter a new temporary password:", generatedPass);
                if(!tempPass) return;
                if(tempPass.length < 6) return alert("Password must be at least 6 characters.");
                
                const { error } = await window.supabase.auth.admin.updateUserById(formData.id, { password: tempPass });
                
                if(error) {
                    alert("Could not update Auth password. Error: " + error.message);
                } else {
                    await window.supabase.from('app_users').update({ is_temp_password: true }).eq('id', formData.id);
                    alert(`Temporary Password saved successfully!\n\nNew Password: ${tempPass}\n\nPlease share this securely with the user.`);
                    fetchUsers();
                }
            };

            return (
                <div className="space-y-6">
                    <div className="flex justify-between items-center">
                        <p className="text-slate-400">Manage registered system users and their roles.</p>
                        <button onClick={() => { setFormData({ id: '', username: '', role: 'user', avatar_url: '', password: '', phone_number: '', address: '', account_status: 'active', is_contributor: true, contribution_goal: 10000 }); setSessions([]); setIsModalOpen(true); }} 
                            className="bg-theme text-white px-5 py-2.5 rounded-lg hover:bg-theme-hover transition flex items-center gap-2 font-medium shadow-lg shadow-theme/20">
                            <span className="material-symbols-rounded">person_add</span> Add New User
                        </button>
                    </div>

                    <div className="glass-card overflow-hidden">
                        <div className="overflow-x-auto">
                            <table className="w-full text-left text-sm text-slate-300">
                                <thead className="bg-slate-800/50 text-slate-400 border-b border-white/10 uppercase text-xs">
                                    <tr>
                                        <th className="p-4 font-semibold">User</th>
                                        <th className="p-4 font-semibold">Role</th>
                                        <th className="p-4 font-semibold">Status</th>
                                        <th className="p-4 font-semibold">Security</th>
                                        <th className="p-4 font-semibold text-right">Actions</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-white/5">
                                    {loading ? (
                                        <tr><td colSpan="5" className="p-8 text-center"><span className="material-symbols-rounded animate-spin text-3xl">autorenew</span></td></tr>
                                    ) : users.map(u => (
                                        <tr key={u.id} className="hover:bg-white/5 transition-colors group">
                                            <td className="p-4 font-medium text-white flex items-center gap-3">
                                                <div className="w-10 h-10 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center overflow-hidden">
                                                    {u.avatar_url ? <img src={u.avatar_url} className="w-full h-full object-cover" /> : <span className="material-symbols-rounded text-slate-500">person</span>}
                                                </div>
                                                <div>
                                                    <p>{u.username}</p>
                                                    <p className="text-xs text-slate-500 font-normal">{u.phone_number || 'No phone'}</p>
                                                </div>
                                            </td>
                                            <td className="p-4">
                                                <span className={`px-2 py-1 rounded text-xs border uppercase font-bold tracking-wider ${u.role === 'admin' ? 'bg-theme/20 text-theme border-theme/30' : 'bg-slate-700 text-slate-300 border-slate-600'}`}>
                                                    {u.role}
                                                </span>
                                            </td>
                                            <td className="p-4">
                                                <span className={`px-2 py-1 rounded text-xs border uppercase font-bold tracking-wider ${u.account_status === 'active' ? 'text-green-400 border-green-500/30' : 'text-red-400 border-red-500/30'}`}>
                                                    {u.account_status || 'active'}
                                                </span>
                                            </td>
                                            <td className="p-4">
                                                <div className="flex flex-wrap gap-1.5 max-w-[150px]">
                                                    {u.passkey_id ? <span className="bg-theme/20 text-theme border border-theme/30 px-1.5 py-0.5 rounded text-[10px] flex items-center gap-1" title="Device Passkey Enabled"><span className="material-symbols-rounded text-[12px]">fingerprint</span> Passkey</span> : null}
                                                    {u.two_factor_enabled ? <span className="bg-blue-500/20 text-blue-400 border border-blue-500/30 px-1.5 py-0.5 rounded text-[10px] flex items-center gap-1" title="Two-Factor Auth Enabled"><span className="material-symbols-rounded text-[12px]">verified_user</span> 2FA</span> : null}
                                                    {u.is_temp_password ? <span className="bg-amber-500/20 text-amber-500 border border-amber-500/30 px-1.5 py-0.5 rounded text-[10px] flex items-center gap-1" title="Using Temporary Password"><span className="material-symbols-rounded text-[12px]">warning</span> Temp Pwd</span> : <span className="bg-green-500/20 text-green-400 border border-green-500/30 px-1.5 py-0.5 rounded text-[10px] flex items-center gap-1" title="User has set a permanent password"><span className="material-symbols-rounded text-[12px]">lock</span> Pwd Set</span>}
                                                </div>
                                            </td>
                                            <td className="p-4 text-right">
                                                <button onClick={() => handleEdit(u)} className="p-2 text-slate-400 hover:text-blue-400 transition" title="Edit"><span className="material-symbols-rounded text-sm">edit</span></button>
                                                <button onClick={() => handleDelete(u.id, u.username)} className="p-2 text-slate-400 hover:text-red-400 transition" title="Delete"><span className="material-symbols-rounded text-sm">delete</span></button>
                                            </td>
                                        </tr>
                                    ))}
                                    {!loading && users.length === 0 && (
                                        <tr><td colSpan="5" className="p-8 text-center text-slate-500">No users found.</td></tr>
                                    )}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <Modal isOpen={isModalOpen} onClose={() => setIsModalOpen(false)} title={formData.id ? "Edit User Profile" : "Create New User"}>
                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div className="flex flex-col items-center mb-6">
                                <div className="w-24 h-24 rounded-full bg-slate-800 border-2 border-dashed border-slate-600 flex items-center justify-center overflow-hidden mb-3 relative group">
                                    {formData.avatar_url ? <img src={formData.avatar_url} className="w-full h-full object-cover" /> : <span className="material-symbols-rounded text-4xl text-slate-500">add_a_photo</span>}
                                    <div className="absolute inset-0 bg-black/50 hidden group-hover:flex items-center justify-center transition-all cursor-pointer">
                                        <span className="material-symbols-rounded text-white">edit</span>
                                    </div>
                                </div>
                                <input type="url" placeholder="Paste Image URL here..." value={formData.avatar_url} onChange={e => setFormData({...formData, avatar_url: e.target.value})} className="w-full max-w-xs bg-slate-900 border border-slate-700 rounded p-2 text-white text-xs text-center focus:border-theme outline-none" />
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 max-h-[50vh] overflow-y-auto p-1 pr-2">
                                <div><label className="block text-sm text-slate-400 mb-1">Display Name</label><input type="text" value={formData.username} onChange={e => setFormData({...formData, username: e.target.value})} className="w-full bg-slate-800 border border-slate-700 rounded p-2.5 text-white focus:border-theme outline-none" required /></div>
                                <div><label className="block text-sm text-slate-400 mb-1">System Role</label>
                                    <select value={formData.role} onChange={e => setFormData({...formData, role: e.target.value})} className="w-full bg-slate-800 border border-slate-700 rounded p-2.5 text-white focus:border-theme outline-none">
                                        <option value="user">Standard User (user)</option>
                                        <option value="admin">System Administrator (admin)</option>
                                    </select>
                                </div>
                                
                                <div><label className="block text-sm text-slate-400 mb-1">Phone Number</label><input type="text" value={formData.phone_number} onChange={e => setFormData({...formData, phone_number: e.target.value})} className="w-full bg-slate-800 border border-slate-700 rounded p-2.5 text-white focus:border-theme outline-none" /></div>
                                <div><label className="block text-sm text-slate-400 mb-1">Account Status</label>
                                    <select value={formData.account_status} onChange={e => setFormData({...formData, account_status: e.target.value})} className="w-full bg-slate-800 border border-slate-700 rounded p-2.5 text-white focus:border-theme outline-none">
                                        <option value="active">Active</option>
                                        <option value="suspended">Suspended</option>
                                    </select>
                                </div>
                                
                                <div className="md:col-span-2"><label className="block text-sm text-slate-400 mb-1">Address</label><input type="text" value={formData.address} onChange={e => setFormData({...formData, address: e.target.value})} className="w-full bg-slate-800 border border-slate-700 rounded p-2.5 text-white focus:border-theme outline-none" /></div>
                                
                                <div><label className="block text-sm text-slate-400 mb-1">Is Contributor?</label>
                                    <select value={formData.is_contributor} onChange={e => setFormData({...formData, is_contributor: e.target.value === 'true'})} className="w-full bg-slate-800 border border-slate-700 rounded p-2.5 text-white focus:border-theme outline-none">
                                        <option value="true">Yes</option>
                                        <option value="false">No</option>
                                    </select>
                                </div>
                                <div><label className="block text-sm text-slate-400 mb-1">Contribution Goal (Rs.)</label><input type="number" value={formData.contribution_goal} onChange={e => setFormData({...formData, contribution_goal: parseFloat(e.target.value) || 0})} className="w-full bg-slate-800 border border-slate-700 rounded p-2.5 text-white focus:border-theme outline-none" /></div>

                                {!formData.id && (
                                    <div className="md:col-span-2">
                                        <label className="block text-sm text-slate-400 mb-1">Initial Password</label>
                                        <input type="password" value={formData.password} onChange={e => setFormData({...formData, password: e.target.value})} className="w-full bg-slate-800 border border-slate-700 rounded p-2.5 text-white focus:border-theme outline-none" required placeholder="Minimum 6 characters" />
                                        <p className="text-xs text-slate-500 mt-2 flex items-center gap-1"><span className="material-symbols-rounded text-[14px]">info</span> You cannot change passwords later from here. Use the Supabase Dashboard for password resets.</p>
                                    </div>
                                )}

                                {formData.id && (
                                    <div className="md:col-span-2 bg-slate-900 p-4 rounded-lg border border-slate-700 mt-2">
                                        <h4 className="text-theme font-semibold text-xs mb-3 uppercase tracking-wider flex items-center gap-2 border-b border-slate-700/50 pb-2">
                                            <span className="material-symbols-rounded text-sm">security</span> Security Actions
                                        </h4>
                                        <div className="flex flex-wrap gap-2 mb-6">
                                            <button type="button" onClick={handleResetPassword} className="bg-amber-500/10 text-amber-500 border border-amber-500/30 px-3 py-1.5 rounded text-xs hover:bg-amber-500 hover:text-white transition flex items-center gap-1">
                                                <span className="material-symbols-rounded text-sm">key</span> Temp Password
                                            </button>
                                            <button type="button" onClick={handleClearPasskey} className="bg-slate-800 text-slate-300 border border-slate-600 px-3 py-1.5 rounded text-xs hover:bg-slate-700 transition flex items-center gap-1">
                                                <span className="material-symbols-rounded text-sm">vpn_key_off</span> Remove Passkey
                                            </button>
                                            <button type="button" onClick={handleClear2FA} className="bg-slate-800 text-slate-300 border border-slate-600 px-3 py-1.5 rounded text-xs hover:bg-slate-700 transition flex items-center gap-1">
                                                <span className="material-symbols-rounded text-sm">phonelink_erase</span> Disable 2FA
                                            </button>
                                        </div>

                                        <h4 className="text-slate-400 font-semibold text-xs mb-3 uppercase tracking-wider flex items-center gap-2 border-b border-slate-700/50 pb-2">

                                                <div key={s.id} className="bg-slate-800/80 p-2.5 rounded border border-slate-700 flex justify-between items-center">

                                                        <p className="text-sm text-white font-medium flex items-center gap-2 mb-0.5">
                                                            <span className="material-symbols-rounded text-[16px] text-theme">{s.device_name?.toLowerCase().includes('mobile') || s.device_name?.toLowerCase().includes('phone') || s.device_name?.toLowerCase().includes('android') || s.device_name?.toLowerCase().includes('ios') ? 'smartphone' : 'computer'}</span>
                                                            {s.device_name || 'Unknown Device'}
                                                        </p>
                                                        <p className="text-[10px] text-slate-400 flex items-center gap-2">
                                                            <span className="flex items-center gap-1"><span className="material-symbols-rounded text-[12px]">location_on</span> {s.ip_address || 'Unknown IP'}</span>
                                                            <span className="flex items-center gap-1"><span className="material-symbols-rounded text-[12px]">schedule</span> {new Date(s.last_active).toLocaleString()}</span>
                                                        </p>
                                                    </div>
                                                    {s.is_online && <span className="w-2.5 h-2.5 rounded-full bg-green-500 shadow-[0_0_8px_#22c55e]" title="Online"></span>}
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}
                            </div>
                            <div className="pt-4 flex justify-end gap-3 border-t border-white/10 mt-6">
                                <button type="button" onClick={() => setIsModalOpen(false)} className="px-4 py-2 text-slate-300 hover:text-white transition">Cancel</button>
                                <button type="submit" disabled={loading} className="bg-theme hover:bg-theme-hover text-white px-6 py-2 rounded shadow-lg shadow-theme/20 font-medium transition disabled:opacity-50">
                                    {loading ? 'Processing...' : formData.id ? 'Update User' : 'Create User'}
                                </button>
                            </div>
                        </form>
                    </Modal>
                </div>
            );
        }

        function SettingsTab() {
            const [settings, setSettings] = useState({ allow_income_entry: true, allow_expense_entry: true });
            
            useEffect(() => {
                const load = async () => {
                    const { data } = await window.supabase.from('project_settings').select('*').eq('id', 'global').maybeSingle();
                    if(data) setSettings(data);
                };
                load();
            }, []);

            const saveSettings = async () => {
                const { error } = await window.supabase.from('project_settings').upsert({ id: 'global', ...settings });
                if(!error) alert('Settings saved');
            };

            return (
                <div className="max-w-3xl">
                    <div className="glass-card p-8">
                        <h3 className="text-xl font-bold text-white mb-6 border-b border-white/10 pb-4">Global Security Settings</h3>
                        
                        <div className="space-y-6">
                            <label className="flex items-center gap-4 cursor-pointer group">
                                <div className={`w-12 h-6 rounded-full p-1 transition-colors ${settings.allow_income_entry ? 'bg-theme' : 'bg-slate-700'}`}>
                                    <div className={`w-4 h-4 bg-white rounded-full transition-transform ${settings.allow_income_entry ? 'translate-x-6' : ''}`}></div>
                                </div>
                                <div>
                                    <h4 className="text-white font-medium group-hover:text-theme transition">Allow Income Entries</h4>
                                    <p className="text-xs text-slate-400">Users can add new incomes to the database.</p>
                                </div>
                                <input type="checkbox" className="hidden" checked={settings.allow_income_entry} onChange={e => setSettings({...settings, allow_income_entry: e.target.checked})} />
                            </label>

                            <label className="flex items-center gap-4 cursor-pointer group">
                                <div className={`w-12 h-6 rounded-full p-1 transition-colors ${settings.allow_expense_entry ? 'bg-theme' : 'bg-slate-700'}`}>
                                    <div className={`w-4 h-4 bg-white rounded-full transition-transform ${settings.allow_expense_entry ? 'translate-x-6' : ''}`}></div>
                                </div>
                                <div>
                                    <h4 className="text-white font-medium group-hover:text-theme transition">Allow Expense Entries</h4>
                                    <p className="text-xs text-slate-400">Users can withdraw and record new expenses.</p>
                                </div>
                                <input type="checkbox" className="hidden" checked={settings.allow_expense_entry} onChange={e => setSettings({...settings, allow_expense_entry: e.target.checked})} />
                            </label>
                        </div>
                        
                        <div className="mt-8 pt-6 border-t border-white/10 flex justify-end">
                            <button onClick={saveSettings} className="bg-theme hover:bg-theme-hover text-white px-8 py-3 rounded-lg font-bold shadow-lg shadow-theme/20 transition">
                                Apply Changes
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        // Initialize React app
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AdminApp />);
    </script>
</body>
</html>
