                  <InputField label="Status" type="select" options={['Received Today', 'Promised']} value={editIncome.status} onChange={e => setEditIncome({...editIncome, status: e.target.value})} />
                  <InputField label="Reported By" value={editIncome.reported_by} onChange={e => setEditIncome({...editIncome, reported_by: e.target.value})} />
                  <InputField label="Event Type / උත්සවය" type="select" options={['vesak', 'poson']} value={editIncome.event_type || 'vesak'} onChange={e => setEditIncome({...editIncome, event_type: e.target.value})} />
                  
                  <div className="md:col-span-2">
                    <InputField label="Description / Notes" type="textarea" value={editIncome.description} onChange={e => setEditIncome({...editIncome, description: e.target.value})} />
                  </div>
                </div>
                <div className="flex gap-3 mt-4">
                  <button type="button" onClick={() => setEditIncome(null)} className="m3-button m3-button-tonal flex-1 h-12">Cancel</button>
                  <button type="submit" disabled={actionLoading} className="m3-button m3-button-filled magnetic-button flex-1 h-12 disabled:opacity-50">Save Changes</button>
                </div>
              </form>
            </Modal>
          )}

          {/* Edit Expense Modal */}
          {editExpense && (
            <Modal title={`Edit Expense Record (#${editExpense.id})`} onClose={() => setEditExpense(null)}>
              <form onSubmit={handleSaveExpense}>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-x-4">
                  <div className="md:col-span-2">
                    <InputField label="Reason" value={editExpense.reason} onChange={e => setEditExpense({...editExpense, reason: e.target.value})} />
                  </div>
                  <InputField label="Withdrawer Name" value={editExpense.withdrawer_name} onChange={e => setEditExpense({...editExpense, withdrawer_name: e.target.value})} />
                  <InputField label="Amount Taken" type="number" value={editExpense.amount_taken} onChange={e => setEditExpense({...editExpense, amount_taken: e.target.value})} prefix="Rs." />
                  <InputField label="Date" type="date" value={editExpense.date} onChange={e => setEditExpense({...editExpense, date: e.target.value})} />
                  <InputField label="Time" type="time" value={editExpense.time} onChange={e => setEditExpense({...editExpense, time: e.target.value})} />
                  <div className="md:col-span-2">
                    <InputField label="Event Type / උත්සවය" type="select" options={['vesak', 'poson']} value={editExpense.event_type || 'vesak'} onChange={e => setEditExpense({...editExpense, event_type: e.target.value})} />
                  </div>
                  <div className="md:col-span-2 mt-2">
                    <label className="text-sm font-medium text-slate-300 block mb-2">Receipt / රිසිට් පත</label>
                    <div className="flex items-center gap-4">
                      {editExpense.receipt_url ? (
                        <div className="relative group">
                          <SafeImage src={editExpense.receipt_url} className="w-20 h-20 object-cover rounded-lg border border-slate-700" alt="Receipt" iconClassName="text-xl" />
                          <button type="button" onClick={() => window.open(editExpense.receipt_url, '_blank')} className="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition flex items-center justify-center rounded-lg">
                            <svg className="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>
                          </button>
                        </div>
                      ) : (
                        <div className="w-20 h-20 rounded-lg border border-dashed border-slate-700 flex items-center justify-center text-slate-500">
                          <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1} d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>
                        </div>
                      )}
                      <label className="m3-button m3-button-tonal flex-1">
                        <input type="file" accept="image/*" className="hidden" onChange={(e) => handleReceiptUpload(editExpense.id, e.target.files[0])} />
                        <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" /></svg>
                        <span className="text-xs font-bold">{editExpense.receipt_url ? 'Change Receipt' : 'Upload Receipt'}</span>
                      </label>
                    </div>
                  </div>
                </div>
                <div className="flex gap-3 mt-6">
                  <button type="button" onClick={() => setEditExpense(null)} className="m3-button m3-button-tonal flex-1 h-12">Cancel</button>
                  <button type="submit" disabled={actionLoading} className="m3-button m3-button-filled !bg-red-600 hover:!bg-red-500 !text-white magnetic-button flex-1 h-12 disabled:opacity-50">Save Changes</button>
                </div>
              </form>
            </Modal>
          )}
          {/* Edit User Modal */}
          {editUser && (
            <Modal title={`Edit User (${editUser.username})`} onClose={() => setEditUser(null)}>
              <form onSubmit={handleSaveUser}>
                <div className="flex flex-col items-center mb-8 bg-slate-900/50 p-6 rounded-[2rem] border border-slate-800">
                  <div className="relative group">
                    <div className="w-24 h-24 rounded-full overflow-hidden border-4 border-brand-500/30 shadow-[0_0_20px_rgba(34,197,94,0.2)] bg-slate-800">
                      {editUser.avatar_url ? (
                        <SafeImage src={editUser.avatar_url} className="w-full h-full object-cover" alt="Avatar" iconClassName="text-2xl" />
                      ) : (
                        <div className="w-full h-full flex items-center justify-center text-slate-600">
                          <svg className="w-12 h-12" fill="currentColor" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                        </div>
                      )}
                    </div>
                    <label className="absolute inset-0 flex items-center justify-center bg-black/60 opacity-0 group-hover:opacity-100 transition-opacity rounded-full cursor-pointer">
                      <input type="file" accept="image/*" className="hidden" onChange={async (e) => {
                        const file = e.target.files[0];
                        if (!file) return;
                        setActionLoading(true);
                        try {
                          const reader = new FileReader();
                          reader.readAsDataURL(file);
                          reader.onload = () => {
                            const img = new Image();
                            img.src = reader.result;
                            img.onload = async () => {
                              const canvas = document.createElement('canvas');
                              const MAX_SIZE = 400;
                              let width = img.width, height = img.height;
                              if (width > height && width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; }
                              else if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; }
                              canvas.width = width; canvas.height = height;
                              const ctx = canvas.getContext('2d');
                              ctx.drawImage(img, 0, 0, width, height);
                              const base64 = canvas.toDataURL('image/jpeg', 0.6);
                              
                              const { error } = await supabase.from('app_users').update({ avatar_url: base64 }).eq('id', editUser.id);
                              if (error) throw error;
                              setEditUser({ ...editUser, avatar_url: base64 });
                              window.showToast("Avatar updated successfully!", "success");
                              fetchData();
                            };
                          };
                        } catch (err) {
                          window.showToast("Error: " + err.message, "error");
                        } finally {
                          setActionLoading(false);
                        }
                      }} disabled={actionLoading} />
                      <svg className="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
                    </label>
                  </div>
                  <div className="flex gap-2 mt-4">
                    <button type="button" onClick={() => {
                      const input = document.createElement('input');
                      input.type = 'file';
                      input.accept = 'image/*';
                      input.onchange = (e) => {
                        const file = e.target.files[0];
                        if (file) {
                          // Trigger the same upload logic
                          const event = { target: { files: [file] } };
                          // We can't easily trigger the inline onChange, so we'll just handle it here or refactor
                        }
                      };
                      // input.click(); // This is just a backup if needed
                    }} className="text-[10px] font-bold uppercase tracking-widest text-brand-400 hover:text-brand-300 transition">Change Photo</button>
                    {editUser.avatar_url && (
                      <button type="button" onClick={async () => {
                        if (!confirm("Remove avatar?")) return;
                        setActionLoading(true);
                        try {
                          const { error } = await supabase.from('app_users').update({ avatar_url: null }).eq('id', editUser.id);
                          if (error) throw error;
                          setEditUser({ ...editUser, avatar_url: null });
                          window.showToast("Avatar removed.", "success");
                          fetchData();
                        } catch (err) {
                          window.showToast("Error: " + err.message, "error");
                        } finally {
                          setActionLoading(false);
                        }
                      }} className="text-[10px] font-bold uppercase tracking-widest text-red-400 hover:text-red-300 transition">Remove</button>
                    )}
                  </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-x-4">
                  <InputField label="Phone Number" value={editUser.phone_number} onChange={e => setEditUser({...editUser, phone_number: e.target.value})} />
                  <InputField label="Role / භූමිකාව" type="select" options={['user', 'admin']} value={editUser.role} onChange={e => setEditUser({...editUser, role: e.target.value})} required />
                  
                  <div className="md:col-span-2 bg-slate-950/30 p-5 rounded-2xl border border-slate-800 mb-5">
                    <div className="flex items-center justify-between mb-4">
                      <label className="text-xs font-bold text-slate-400 uppercase tracking-widest">Contribution Type / දායකත්ව වර්ගය</label>
                      <button 
                        type="button" 
                        onClick={() => {
                          const isNewContr = !editUser.is_contributor;
                          setEditUser({
                            ...editUser, 
                            is_contributor: isNewContr,
                            contribution_goal: isNewContr ? (editUser.contribution_goal || 10000) : editUser.contribution_goal
                          });
                        }}
                        className={`px-4 py-1.5 rounded-xl text-[10px] font-black transition-all ${editUser.is_contributor ? 'bg-brand-500/20 text-brand-400' : 'bg-slate-800 text-slate-500'}`}
                      >
                        {editUser.is_contributor ? 'MONEY USER' : 'NON-MONEY USER'}
                      </button>
                    </div>

                    {editUser.is_contributor && (
                      <div className="animate-fade-in space-y-4">
                        <div className="flex flex-wrap gap-2 mb-2">
                          {[10000, 5000, 2000, 1000].map(amt => (
                            <button
                              key={amt}
                              type="button"
                              onClick={() => setEditUser({...editUser, contribution_goal: amt})}
                              className={`px-4 py-2 rounded-xl text-xs font-bold transition-all border ${editUser.contribution_goal == amt ? 'bg-brand-500 border-brand-400 text-white shadow-lg' : 'bg-slate-900 border-slate-700 text-slate-400 hover:border-slate-500'}`}
                            >
                              Rs. {amt.toLocaleString()}
                            </button>
                          ))}
                        </div>
                        <InputField 
                          label="Custom Money Goal (Rs.) / මුදල් ඉලක්කය" 
                          type="number" 
                          value={editUser.contribution_goal} 
                          onChange={e => setEditUser({...editUser, contribution_goal: e.target.value})} 
                          prefix="Rs."
                        />
                      </div>
                    )}
                  </div>

                  <div className="md:col-span-2">
                    <InputField label="Address" type="textarea" value={editUser.address} onChange={e => setEditUser({...editUser, address: e.target.value})} />
                  </div>
                  
                  <div className="md:col-span-2 bg-slate-950/30 p-5 rounded-2xl border border-slate-800 mb-5">
                    <h4 className="text-xs font-bold text-brand-400 uppercase tracking-widest mb-4">Section Access Control</h4>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                      <div className="flex items-center justify-between bg-slate-900/50 p-3 rounded-lg border border-slate-800">
                        <div>
                          <p className="text-xs font-bold text-white">Income Access</p>
                          <p className="text-[10px] text-slate-500">Allow adding incomes</p>
                        </div>
                        <label className="relative inline-flex items-center cursor-pointer">
                          <input type="checkbox" checked={editUser.income_access} onChange={e => setEditUser({...editUser, income_access: e.target.checked})} className="sr-only peer" />
                          <div className="w-12 h-7 bg-slate-950/40 border border-slate-800 rounded-full peer transition-all duration-300 peer-checked:bg-brand-500/20 peer-checked:border-brand-500 after:content-[''] after:absolute after:top-[4px] after:left-[4px] after:bg-slate-500 after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:after:translate-x-5 peer-checked:after:bg-brand-400"></div>
                        </label>
                      </div>
                      <div className="flex items-center justify-between bg-slate-900/50 p-3 rounded-lg border border-slate-800">
                        <div>
                          <p className="text-xs font-bold text-white">Expense Access</p>
                          <p className="text-[10px] text-slate-500">Allow adding expenses</p>
                        </div>
                        <label className="relative inline-flex items-center cursor-pointer">
                          <input type="checkbox" checked={editUser.expense_access} onChange={e => setEditUser({...editUser, expense_access: e.target.checked})} className="sr-only peer" />
                          <div className="w-12 h-7 bg-slate-950/40 border border-slate-800 rounded-full peer transition-all duration-300 peer-checked:bg-brand-500/20 peer-checked:border-brand-500 after:content-[''] after:absolute after:top-[4px] after:left-[4px] after:bg-slate-500 after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:after:translate-x-5 peer-checked:after:bg-brand-400"></div>
                        </label>
                      </div>
                      <div className="flex items-center justify-between bg-slate-900/50 p-3 rounded-lg border border-slate-800">
                        <div>
                          <p className="text-xs font-bold text-white">Pledge Access</p>
                          <p className="text-[10px] text-slate-500">Allow confirming pledges</p>
                        </div>
                        <label className="relative inline-flex items-center cursor-pointer">
                          <input type="checkbox" checked={editUser.pledge_access} onChange={e => setEditUser({...editUser, pledge_access: e.target.checked})} className="sr-only peer" />
                          <div className="w-12 h-7 bg-slate-950/40 border border-slate-800 rounded-full peer transition-all duration-300 peer-checked:bg-brand-500/20 peer-checked:border-brand-500 after:content-[''] after:absolute after:top-[4px] after:left-[4px] after:bg-slate-500 after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:after:translate-x-5 peer-checked:after:bg-brand-400"></div>
                        </label>
                      </div>
                    </div>
                  </div>
                </div>
                <div className="flex gap-3 mt-4">
                  <button type="button" onClick={() => setEditUser(null)} className="m3-button m3-button-tonal flex-1 h-12">Cancel</button>
                  <button type="submit" disabled={actionLoading} className="m3-button m3-button-filled magnetic-button flex-1 h-12 disabled:opacity-50">Save Details</button>
                </div>
              </form>
            </Modal>
          )}

          {/* Add User Modal */}
          {addUserModal && (
            <Modal title="Add New User" onClose={() => setAddUserModal(false)}>
              <form onSubmit={handleAddUser}>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-x-4">
                  <InputField label="Username (Full Name)" value={newUser.username} onChange={e => setNewUser({...newUser, username: e.target.value})} required />
                  <InputField label="Password" type="password" value={newUser.password} onChange={e => setNewUser({...newUser, password: e.target.value})} required />
                  <InputField label="Phone Number" value={newUser.phone_number} onChange={e => setNewUser({...newUser, phone_number: e.target.value})} />
                  <InputField label="Role" type="select" options={['user', 'admin']} value={newUser.role} onChange={e => setNewUser({...newUser, role: e.target.value})} required />
                  
                  <div className="md:col-span-2 bg-slate-950/30 p-5 rounded-2xl border border-slate-800 mb-5">
                    <div className="flex items-center justify-between mb-4">
                      <label className="text-xs font-bold text-slate-400 uppercase tracking-widest">Contribution Type / දායකත්ව වර්ගය</label>
                      <button 
                        type="button" 
                        onClick={() => setNewUser({...newUser, is_contributor: !newUser.is_contributor})}
                        className={`px-4 py-1.5 rounded-xl text-[10px] font-black transition-all ${newUser.is_contributor ? 'bg-brand-500/20 text-brand-400' : 'bg-slate-800 text-slate-500'}`}
                      >
                        {newUser.is_contributor ? 'MONEY USER' : 'NON-MONEY USER'}
                      </button>
                    </div>

                    {newUser.is_contributor && (
                      <div className="animate-fade-in space-y-4">
                        <div className="flex flex-wrap gap-2 mb-2">
                          {[10000, 5000, 2000, 1000].map(amt => (
                            <button
                              key={amt}
                              type="button"
                              onClick={() => setNewUser({...newUser, contribution_goal: amt})}
                              className={`px-4 py-2 rounded-xl text-xs font-bold transition-all border ${newUser.contribution_goal == amt ? 'bg-brand-500 border-brand-400 text-white shadow-lg' : 'bg-slate-900 border-slate-700 text-slate-400 hover:border-slate-500'}`}
                            >
                              Rs. {amt.toLocaleString()}
                            </button>
                          ))}
                        </div>
                        <InputField 
                          label="Money Goal (Rs.) / මුදල් ඉලක්කය" 
                          type="number" 
                          value={newUser.contribution_goal} 
                          onChange={e => setNewUser({...newUser, contribution_goal: e.target.value})} 
                          prefix="Rs."
                        />
                      </div>
                    )}
                  </div>

                  <div className="md:col-span-2">
                    <InputField label="Address" type="textarea" value={newUser.address} onChange={e => setNewUser({...newUser, address: e.target.value})} />
                  </div>
                </div>
                <div className="bg-slate-900/50 border border-slate-800 p-3 rounded-lg mb-4 mt-2">
                  <p className="text-[10px] text-slate-400">Note: New users will be forced to change this temporary password upon their first login. Since they are added here, they will instantly appear as selectable Main Donors and Withdrawers.</p>
                </div>
                <div className="flex gap-3 mt-4">
                  <button type="button" onClick={() => setAddUserModal(false)} className="m3-button m3-button-tonal flex-1 h-12">Cancel</button>
                  <button type="submit" disabled={actionLoading} className="m3-button m3-button-filled magnetic-button w-full sm:w-auto shadow-[0_0_15px_rgba(34,197,94,0.3)]">Create User</button>
                </div>
              </form>
            </Modal>
          )}

        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<AdminApp />);
  </script>

  <script>
    // 3D Animated Background with Three.js
    (function() {
      const canvas = document.getElementById('bg-canvas');
      if (!canvas || !window.THREE) return;
      
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

      // Create floating particles
      const particlesGeometry = new THREE.BufferGeometry();
      const particlesCount = 1500;
      const posArray = new Float32Array(particlesCount * 3);
      const colorsArray = new Float32Array(particlesCount * 3);
      
      for(let i = 0; i < particlesCount * 3; i += 3) {
        posArray[i] = (Math.random() - 0.5) * 50;
        posArray[i+1] = (Math.random() - 0.5) * 50;
        posArray[i+2] = (Math.random() - 0.5) * 30;
        
        const colorChoice = Math.random();
        if(colorChoice < 0.5) {
          colorsArray[i] = 0.13; colorsArray[i+1] = 0.77; colorsArray[i+2] = 0.37; // green
        } else if(colorChoice < 0.8) {
          colorsArray[i] = 0.18; colorsArray[i+1] = 0.83; colorsArray[i+2] = 0.75; // teal
        } else {
          colorsArray[i] = 0.39; colorsArray[i+1] = 0.40; colorsArray[i+2] = 0.95; // indigo
        }
      }
      
      particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
      particlesGeometry.setAttribute('color', new THREE.BufferAttribute(colorsArray, 3));
      
      const particlesMaterial = new THREE.PointsMaterial({
        size: 0.05,
        vertexColors: true,
        transparent: true,
        opacity: 0.8,
        blending: THREE.AdditiveBlending
      });
      
      const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
      scene.add(particlesMesh);

      // Create connecting lines (neural network)
      const linesMaterial = new THREE.LineBasicMaterial({ 
        color: 0x22c55e, 
        transparent: true, 
        opacity: 0.08 
      });
      const linesGeometry = new THREE.BufferGeometry();
      const linePositions = [];
      for(let i = 0; i < 200; i++) {
        const x1 = (Math.random() - 0.5) * 40;
        const y1 = (Math.random() - 0.5) * 40;
        const z1 = (Math.random() - 0.5) * 20;
        const x2 = x1 + (Math.random() - 0.5) * 10;
        const y2 = y1 + (Math.random() - 0.5) * 10;
        const z2 = z1 + (Math.random() - 0.5) * 5;
        linePositions.push(x1, y1, z1, x2, y2, z2);
      }
      linesGeometry.setAttribute('position', new THREE.Float32BufferAttribute(linePositions, 3));
      const lines = new THREE.LineSegments(linesGeometry, linesMaterial);
      scene.add(lines);

      camera.position.z = 15;

      let mouseX = 0, mouseY = 0;
      document.addEventListener('mousemove', (e) => {
        mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
        mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
      });

      function animate() {
        requestAnimationFrame(animate);
        
        particlesMesh.rotation.y += 0.0005;
        particlesMesh.rotation.x += 0.0003;
        lines.rotation.y -= 0.0003;
        
        camera.position.x += (mouseX * 2 - camera.position.x) * 0.02;
        camera.position.y += (-mouseY * 2 - camera.position.y) * 0.02;
        camera.lookAt(scene.position);
        
        renderer.render(scene, camera);
      }
      animate();

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      // Add 3D tilt to cards
      document.addEventListener('mousemove', (e) => {
        const cards = document.querySelectorAll('.m3-card-elevated, .magnetic-button');
        cards.forEach(card => {
          const rect = card.getBoundingClientRect();
          const x = e.clientX - rect.left - rect.width/2;
          const y = e.clientY - rect.top - rect.height/2;
          if(Math.abs(x) < rect.width && Math.abs(y) < rect.height) {
            const rotateY = (x / rect.width) * 5;
            const rotateX = -(y / rect.height) * 5;
            card.style.transform = `translateY(-8px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.02)`;
          }
        });
      });
      
      document.addEventListener('mouseleave', () => {
        document.querySelectorAll('.m3-card-elevated').forEach(card => {
          card.style.transform = '';
        });
      }, true);
    })();
  </script>

</body>
</html>
