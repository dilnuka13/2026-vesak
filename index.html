                  {show2FASetup && (
                    <TwoFactorSetup
                      user={currentUser}
                      onComplete={(secret) => {
                        const updated = { ...currentUser, two_factor_enabled: true, two_factor_secret: secret };
                        localStorage.setItem('vesak_current_user', JSON.stringify(updated));
                        setShow2FASetup(false);
                        alert("2FA Enabled Successfully!");
                      }}
                      onCancel={() => setShow2FASetup(false)}
                    />
                  )}
                </div>
              )}
            </div>


            <div className="glass rounded-2xl border border-slate-800 mb-6 overflow-hidden">
              {/* Clickable Header */}
              <button
                onClick={() => setShowDevices(v => !v)}
                className="w-full flex justify-between items-center p-6 hover:bg-white/[0.02] transition-colors group"
              >
                <div className="flex items-center gap-3">
                  <div className={`w-2 h-2 rounded-full shrink-0 transition-colors ${sessions.length > 0 ? 'bg-brand-400 animate-pulse' : 'bg-slate-600'}`}></div>
                  <h3 className="text-lg font-semibold text-white">Active Devices / සක්‍රීය උපාංග</h3>
                  {sessions.length > 0 && (
                    <span className="px-2 py-0.5 rounded-full bg-brand-500/20 text-brand-400 text-[10px] font-bold">{sessions.length}</span>
                  )}
                </div>
                <div className="flex items-center gap-2">
                  {sessions.length > 1 && showDevices && (
                    <button
                      onClick={(e) => { e.stopPropagation(); handleClearAllSessions(); }}
                      className="text-[10px] bg-red-500/10 text-red-400 px-3 py-1 rounded-full border border-red-500/20 hover:bg-red-500/20 transition-colors uppercase font-bold tracking-widest"
                    >Clear All</button>
                  )}
                  <svg
                    className={`w-5 h-5 text-slate-400 transition-transform duration-300 ${showDevices ? 'rotate-180' : ''}`}
                    fill="none" stroke="currentColor" viewBox="0 0 24 24"
                  >
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 9l-7 7-7-7" />
                  </svg>
                </div>
              </button>

              {/* Collapsible Device List */}
              {showDevices && (
                <div className="px-6 pb-6 border-t border-slate-800/60">
                  {loadingSessions ? (
                    <div className="text-center py-4 text-slate-500 text-sm">Loading devices...</div>
                  ) : sessions.length === 0 ? (
                    <div className="text-center py-4 text-slate-500 text-sm">No other devices found.</div>
                  ) : (
                    <div className="space-y-3 mt-4">
                      {sessions.map(session => {
                        const isCurrent = session.session_token === localStorage.getItem('vesak_session_token');
                        return (
                          <div key={session.id} className={`flex items-center justify-between p-4 rounded-xl border transition group ${isCurrent ? 'bg-brand-500/5 border-brand-500/30 shadow-[0_0_15px_rgba(34,197,94,0.05)]' : 'bg-slate-900/50 border-slate-700/50 hover:border-slate-600'}`}>
                            <div className="flex items-center gap-3">
                              <div className={`w-10 h-10 rounded-full flex items-center justify-center shrink-0 ${isCurrent ? 'bg-brand-500/20 text-brand-400' : 'bg-slate-800 text-slate-400'}`}>
                                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z" /></svg>
                              </div>
                              <div className="flex flex-col">
                                <div className="flex items-center gap-2">
                                  <span className="font-semibold text-white text-sm">{session.device_name || 'Unknown Device'}</span>
                                  {isCurrent && <span className="bg-brand-500 text-white text-[8px] font-black uppercase tracking-widest px-1.5 py-0.5 rounded-full">This Device</span>}
                                </div>
                                <span className="text-[10px] text-slate-400 mt-0.5">IP: {session.ip_address || 'Unknown'} • {session.location || 'Unknown Location'}</span>
                                <span className="text-[9px] text-slate-500 mt-0.5">Last active: {new Date(session.last_active).toLocaleString()}</span>
                              </div>
                            </div>
                            {!isCurrent && (
                              <button onClick={() => handleRemoveSession(session.id)} className="p-2 text-slate-500 hover:text-red-400 hover:bg-red-500/10 rounded-lg transition" title="Log out this device">
                                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" /></svg>
                              </button>
                            )}
                          </div>
                        );
                      })}
                    </div>
                  )}
                </div>
              )}
            </div>

            <div className="glass p-6 rounded-2xl border border-slate-800 mb-6 relative">
              <h3 className="text-lg font-semibold text-white mb-4">Contact Details / සම්බන්ධ වීමේ විස්තර</h3>
              <button onClick={() => setIsEditingProfile(true)} className="absolute top-6 right-6 p-2 text-brand-400 hover:bg-brand-500/10 rounded-lg transition" title="Edit Profile">
                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" /></svg>
              </button>

              <div className="space-y-3 mt-2">
                <div className="flex items-start gap-4 bg-slate-900/40 p-4 rounded-xl border border-slate-800 hover:border-slate-700 transition group">
                  <div className="w-10 h-10 rounded-full bg-brand-500/10 text-brand-400 flex items-center justify-center shrink-0 group-hover:scale-110 transition-transform">
                    <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" /></svg>
                  </div>
                  <div className="flex flex-col justify-center min-h-[40px]">
                    <p className="text-[10px] text-slate-400 uppercase tracking-wider font-semibold mb-0.5">Phone Number</p>
                    <p className="text-sm font-medium text-white">{currentUser?.phone_number || <span className="text-slate-500 italic text-xs">Not provided</span>}</p>
                  </div>
                </div>
                <div className="flex items-start gap-4 bg-slate-900/40 p-4 rounded-xl border border-slate-800 hover:border-slate-700 transition group">
                  <div className="w-10 h-10 rounded-full bg-blue-500/10 text-blue-400 flex items-center justify-center shrink-0 group-hover:scale-110 transition-transform">
                    <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.243-4.243a8 8 0 1111.314 0z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
                  </div>
                  <div className="flex flex-col justify-center min-h-[40px]">
                    <p className="text-[10px] text-slate-400 uppercase tracking-wider font-semibold mb-0.5">Address</p>
                    <p className="text-sm font-medium text-white whitespace-pre-wrap leading-relaxed">{currentUser?.address || <span className="text-slate-500 italic text-xs">Not provided</span>}</p>
                  </div>
                </div>
              </div>

              {/* Edit Profile Modal */}
              {isEditingProfile && (
                <div className="fixed inset-0 z-[400] flex items-center justify-center bg-black/80 backdrop-blur-md p-4 animate-fade-in" onClick={() => setIsEditingProfile(false)}>
                  <div className="glass p-8 rounded-[2.5rem] max-w-md w-full border border-white/10 shadow-[0_30px_60px_rgba(0,0,0,0.8)] relative overflow-hidden flex flex-col" onClick={e => e.stopPropagation()}>
                    <div className="absolute top-0 left-0 w-full h-1.5 bg-brand-500/20">
                      <div className="h-full bg-brand-500 animate-pulse" style={{ width: '100%' }}></div>
                    </div>

                    <button onClick={() => setIsEditingProfile(false)} className="absolute top-6 right-6 text-slate-400 hover:text-white bg-slate-800/50 w-8 h-8 flex items-center justify-center rounded-full transition">&times;</button>

                    <div className="mb-8 text-center">
                      <h3 className="text-xl font-black text-white tracking-tight">Edit Contact Details</h3>
                      <p className="text-[10px] font-bold text-brand-400 uppercase tracking-widest mt-1">සම්බන්ධ වීමේ විස්තර යාවත්කාලීන කිරීම</p>
                    </div>

                    <form onSubmit={handleSaveProfile} className="space-y-6">
                      <div className="space-y-4">
                        <div className="space-y-1.5">
                          <label className="text-[10px] font-black text-slate-500 uppercase tracking-widest ml-1">Phone Number</label>
                          <div className="relative">
                            <input
                              type="text"
                              value={profileData.phone_number}
                              onChange={e => setProfileData({ ...profileData, phone_number: e.target.value })}
                              className="w-full bg-slate-900 border border-slate-700 text-white rounded-2xl p-4 pl-12 outline-none focus:border-brand-500 font-medium transition-all"
                              placeholder="Enter phone number"
                              autoFocus
                            />
                            <MaterialIcon name="phone" className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-500" />
                          </div>
                        </div>

                        <div className="space-y-1.5">
                          <label className="text-[10px] font-black text-slate-500 uppercase tracking-widest ml-1">Home Address</label>
                          <div className="relative">
                            <textarea
                              value={profileData.address}
                              onChange={e => setProfileData({ ...profileData, address: e.target.value })}
                              className="w-full bg-slate-900 border border-slate-700 text-white rounded-2xl p-4 pl-12 outline-none focus:border-brand-500 font-medium transition-all h-32 resize-none leading-relaxed"
                              placeholder="Enter your address"
                            ></textarea>
                            <MaterialIcon name="home" className="absolute left-4 top-6 text-slate-500" />
                          </div>
                        </div>
                      </div>

                      <div className="flex gap-3 pt-2">
                        <button type="button" onClick={() => setIsEditingProfile(false)} className="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-4 rounded-2xl text-xs uppercase tracking-widest transition">
                          Cancel
                        </button>
                        <button type="submit" disabled={savingProfile} className="flex-[2] bg-brand-600 hover:bg-brand-500 text-white font-black py-4 rounded-2xl text-xs uppercase tracking-[0.2em] transition shadow-lg shadow-brand-500/20 disabled:opacity-50">
                          {savingProfile ? 'Saving...' : 'Save Details'}
                        </button>
                      </div>
                    </form>
                  </div>
                </div>
              )}
            </div>

            {currentUser?.role === 'admin' && (
              <div className="glass p-6 rounded-2xl border border-slate-800 mb-6 animate-fade-in">
                <div className="flex justify-between items-center mb-4">
                  <h3 className="text-lg font-semibold text-white">System Settings</h3>
                  <span className="text-[10px] text-slate-500 font-bold uppercase tracking-widest">පද්ධති සැකසුම්</span>
                </div>

                <div className="grid grid-cols-3 gap-3">
                  <button onClick={() => setActiveAccessModal('income')} className="bg-slate-900/80 hover:bg-slate-800 p-2.5 rounded-xl border border-slate-700/50 flex flex-col items-center justify-center gap-1.5 transition group">
                    <div className="w-7 h-7 rounded-full bg-brand-500/10 text-brand-400 flex items-center justify-center group-hover:scale-110 transition-transform">
                      <IconIncome />
                    </div>
                    <span className="text-[10px] font-bold text-brand-400 text-center leading-tight">Income Access</span>
                  </button>

                  <button onClick={() => setActiveAccessModal('expense')} className="bg-slate-900/80 hover:bg-slate-800 p-2.5 rounded-xl border border-slate-700/50 flex flex-col items-center justify-center gap-1.5 transition group">
                    <div className="w-7 h-7 rounded-full bg-red-500/10 text-red-400 flex items-center justify-center group-hover:scale-110 transition-transform">
                      <IconExpense />
                    </div>
                    <span className="text-[10px] font-bold text-red-400 text-center leading-tight">Expense Access</span>
                  </button>

                  <button onClick={() => setActiveAccessModal('pending')} className="bg-slate-900/80 hover:bg-slate-800 p-2.5 rounded-xl border border-slate-700/50 flex flex-col items-center justify-center gap-1.5 transition group">
                    <div className="w-7 h-7 rounded-full bg-yellow-500/10 text-yellow-500 flex items-center justify-center group-hover:scale-110 transition-transform">
                      <IconPledges />
                    </div>
                    <span className="text-[10px] font-bold text-yellow-500 text-center leading-tight">Pledges Access</span>
                  </button>
                </div>
              </div>
            )}

            <h3 className="text-lg font-semibold text-white mb-4 mt-8">My Recorded Data / මා වාර්තා කල දත්ත</h3>
            <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-6">
              <button onClick={() => setViewCategory('income')} className="bg-slate-900/80 hover:bg-slate-800 p-4 rounded-xl border border-slate-700/50 flex flex-col items-center justify-center gap-2 transition">
                <svg className="w-6 h-6 text-brand-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 6v6m0 0v6m0-6h6m-6 0H6" /></svg>
                <span className="text-xs font-semibold text-brand-400">Cash Incomes</span>
                <span className="text-[10px] text-slate-400 bg-slate-800 px-2 rounded-full">{myIncomes.length}</span>
              </button>
              <button onClick={() => setViewCategory('expense')} className="bg-slate-900/80 hover:bg-slate-800 p-4 rounded-xl border border-slate-700/50 flex flex-col items-center justify-center gap-2 transition">
                <svg className="w-6 h-6 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M20 12H4" /></svg>
                <span className="text-xs font-semibold text-red-400">Expenses</span>
                <span className="text-[10px] text-slate-400 bg-slate-800 px-2 rounded-full">{myExpenses.length}</span>
              </button>
              <button onClick={() => setViewCategory('pledges')} className="bg-slate-900/80 hover:bg-slate-800 p-4 rounded-xl border border-slate-700/50 flex flex-col items-center justify-center gap-2 transition">
                <svg className="w-6 h-6 text-yellow-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                <span className="text-xs font-semibold text-yellow-400">Pledges</span>
                <span className="text-[10px] text-slate-400 bg-slate-800 px-2 rounded-full">{myPledges.length}</span>
              </button>
              <button onClick={() => setViewCategory('goods')} className="bg-slate-900/80 hover:bg-slate-800 p-4 rounded-xl border border-slate-700/50 flex flex-col items-center justify-center gap-2 transition">
                <svg className="w-6 h-6 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" /></svg>
                <span className="text-xs font-semibold text-blue-400">Goods</span>
                <span className="text-[10px] text-slate-400 bg-slate-800 px-2 rounded-full">{myGoods.length}</span>
              </button>
            </div>

            {viewCategory && (() => {

              let data = [];
              let title = '';
              if (viewCategory === 'income') { data = myIncomes; title = 'My Cash Incomes'; }
              if (viewCategory === 'expense') { data = myExpenses; title = 'My Recorded Expenses'; }
              if (viewCategory === 'pledges') { data = myPledges; title = 'My Recorded Pledges'; }
              if (viewCategory === 'goods') { data = myGoods; title = 'My Recorded Goods'; }

              return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/80 backdrop-blur-sm p-4 animate-fade-in">
                  <div className="glass p-6 rounded-2xl max-w-2xl w-full border border-brand-500/30 max-h-[80vh] flex flex-col">
                    <div className="flex justify-between items-center mb-4">
                      <h3 className="text-xl font-bold text-white">{title}</h3>
                      <button onClick={() => setViewCategory(null)} className="text-slate-400 hover:text-white border-none bg-transparent">
                        <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" /></svg>
                      </button>
                    </div>
                    <div className="overflow-y-auto flex-1 custom-scrollbar pr-2">
                      {data.length === 0 ? (
                        <div className="text-center py-8 text-slate-500">No records found. / වාර්තා නොමැත.</div>
                      ) : (
                        <div className="space-y-2">
                          {data.map(item => (
                            <div key={item.id} className="bg-slate-900/50 p-3 rounded-lg border border-slate-800 flex justify-between items-center">
                              <div>
                                <div className="font-semibold text-white text-sm">{item.name || item.reason}</div>
                                <div className="text-[10px] text-slate-400">{item.date}</div>
                              </div>
                              <div className={`font-bold text-sm ${viewCategory === 'expense' ? 'text-red-400' : 'text-brand-400'}`}>
                                {item.donation_type === 'Goods' ? `${item.item_description} (x${item.quantity})` : `Rs. ${Math.round(Number(item.amount || item.amount_taken)).toLocaleString()}`}
                              </div>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                  </div>
                </div>
              );
            })()}

            <h3 className="text-lg font-semibold text-white mb-4">Contribution History</h3>
            {userIncomes.length === 0 ? (
              <p className="text-slate-400 text-sm text-center py-6 border border-dashed border-slate-700 rounded-lg">No contributions recorded yet.</p>
            ) : (
              <div className="overflow-x-auto custom-scrollbar">
                <table className="w-full text-left text-sm whitespace-nowrap">
                  <thead className="bg-slate-900/80 text-slate-400 text-xs uppercase border-b border-slate-800">
                    <tr>
                      <th className="p-3 rounded-tl-lg">Date</th>
                      <th className="p-3">Type</th>
                      <th className="p-3">Amount / Details</th>
                      <th className="p-3 rounded-tr-lg">Reported By</th>
                    </tr>
                  </thead>
                  <tbody>
                    {userIncomes.map((inc, idx) => (
                      <tr key={idx} className="border-b border-slate-800/50 hover:bg-slate-800/40 transition">
                        <td className="p-3 text-slate-300">
                          <div>{inc.date}</div>
                          <div className="text-[10px] text-slate-500">{inc.created_at ? new Date(inc.created_at).toLocaleTimeString() : ''}</div>
                        </td>
                        <td className="p-3">
                          <span className={`px-2 py-1 rounded text-[10px] ${inc.donation_type === 'Cash' ? 'bg-brand-500/10 text-brand-400' : 'bg-purple-500/10 text-purple-400'}`}>
                            {inc.donation_type}
                          </span>
                        </td>
                        <td className="p-3">
                          {inc.donation_type === 'Cash' ? (
                            <span className="text-brand-400 font-bold">Rs. {Math.round(Number(inc.amount)).toLocaleString()}</span>
                          ) : (
                            <span className="text-slate-300">{inc.item_description} (x{inc.quantity})</span>
                          )}
                        </td>
                        <td className="p-3"><ReporterBadge name={inc.reported_by} users={users} showFullName={true} /></td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}
          </div>
        </div>
      );
    }

    function DashboardView({ incomes, expenses, setActiveTab, currentUser, userTotalContribution, balanceToPay, users, onViewReceipt, projectSettings, onUpdateAccess, handleTabSwitch }) {
      const [summaryType, setSummaryType] = useState(null); // 'income', 'expense', 'balance', 'goods'
      const [selectedActivity, setSelectedActivity] = useState(null);
      const totalIncome = useMemo(() =>
        incomes.filter(i => i.status === 'Received Today' && i.donation_type === 'Cash').reduce((sum, item) => sum + Number(item.amount || 0), 0)
        , [incomes]);

      const totalExpense = useMemo(() =>
        expenses.reduce((sum, item) => sum + Number(item.amount_taken || 0), 0)
        , [expenses]);

      const currentBalance = totalIncome - totalExpense;

      const totalGoods = useMemo(() =>
        incomes.filter(i => i.status === 'Received Today' && i.donation_type === 'Goods').length
        , [incomes]);

      const recentActivities = useMemo(() => {
        const inc = incomes.map(i => ({ ...i, type: 'income', dateStr: i.created_at || i.date }));
        const exp = expenses.map(e => ({ ...e, type: 'expense', dateStr: e.created_at || e.date }));
        const combined = [...inc, ...exp].sort((a, b) => new Date(b.dateStr) - new Date(a.dateStr));
        return combined.slice(0, 8);
      }, [incomes, expenses]);

      return (
        <div className="space-y-6" id="dashboard">
          <h2 className="text-2xl font-bold text-white mb-6 flex flex-col">
            <span>Overview</span>
            <span className="text-sm text-slate-400 font-normal">සාරාංශය</span>
          </h2>

          <VesakCountdown currentUser={currentUser} />

          {/* Mobile Only - User Contribution Tracker */}
          {currentUser && currentUser.is_contributor && (
            <div className="sm:hidden glass-card rounded-3xl p-6 border border-slate-800 shadow-[0_10px_30px_rgba(0,0,0,0.4)] mb-8 relative overflow-hidden group animate-fade-in">
              <div className="absolute top-0 right-0 w-32 h-32 bg-brand-500/10 blur-3xl rounded-full pointer-events-none group-hover:scale-110 transition-transform duration-700"></div>
              <div className="flex justify-between items-center mb-4 relative z-10 cursor-pointer" onClick={() => setActiveTab('profile')}>
                <div className="flex items-center gap-4">
                  <div className="w-12 h-12 rounded-2xl overflow-hidden bg-slate-900 border border-slate-700 shadow-[0_0_15px_rgba(34,197,94,0.2)]">
                    <img src={currentUser.avatar_url || 'logo.png'} alt="Avatar" className="w-full h-full object-cover" />
                  </div>
                  <div className="flex flex-col">
                    <span className="text-[10px] text-slate-500 font-bold uppercase tracking-widest">{currentUser.username}</span>
                    <span className="text-sm text-white font-bold tracking-tight">Your Contribution</span>
                  </div>
                </div>
                <span className="text-xl font-bold text-brand-400 tracking-tight drop-shadow-[0_0_10px_rgba(34,197,94,0.3)]">Rs. {Math.round(userTotalContribution).toLocaleString()}</span>
              </div>

              {balanceToPay > 0 ? (
                <div className="flex items-start gap-2 bg-yellow-500/10 border border-yellow-500/20 p-3 rounded-xl mt-3 animate-fade-in relative z-10">
                  <svg className="w-5 h-5 text-yellow-500 shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                  <p className="text-xs text-yellow-400 font-medium leading-relaxed">
                    කරුණාකර ඔබගේ ඉතිරි දායකත්ව මුදල වන <span className="font-bold text-yellow-300">Rs. {Math.round(balanceToPay).toLocaleString()}</span> ක මුදල හැකි ඉක්මනින් ලබා දෙන්න.
                  </p>
                </div>
              ) : balanceToPay < 0 ? (
                <div className="flex items-center gap-3 bg-amber-500/10 border border-amber-500/30 p-3 rounded-xl mt-3 animate-fade-in relative z-10 shadow-[0_0_15px_rgba(245,158,11,0.2)]">
                  <div className="w-10 h-10 rounded-full bg-gradient-to-br from-amber-400 to-yellow-600 flex items-center justify-center shrink-0 shadow-lg text-white text-xl">
                    🏆
                  </div>
                  <div className="flex flex-col">
                    <span className="text-xs text-amber-400 font-bold uppercase tracking-wider">Top Contributor!</span>
                    <span className="text-[10px] text-slate-300 mt-0.5 leading-tight">අපේක්ෂිත මුදලටත් වඩා ලබාදීම සම්බන්ධයෙන් ඔබට විශේෂ ස්තූතිය! 🙏✨</span>
                  </div>
                </div>
              ) : (
                <div className="flex items-center gap-3 bg-brand-500/10 border border-brand-500/20 p-3 rounded-xl mt-3 animate-fade-in relative z-10">
                  <div className="w-8 h-8 rounded-full bg-brand-500/20 text-brand-400 flex items-center justify-center shrink-0 shadow-[0_0_10px_rgba(34,197,94,0.3)]">
                    <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={3} d="M5 13l4 4L19 7" /></svg>
                  </div>
                  <div className="flex flex-col">
                    <span className="text-xs text-brand-400 font-bold uppercase tracking-wider">Target Reached!</span>
                    <span className="text-[10px] text-slate-300 mt-0.5">විශේෂ ස්තූතියි! ඔබගේ සම්පූර්ණ දායකත්වය ලබා දී ඇත. 🎉</span>
                  </div>
                </div>
              )}
            </div>
          )}

          {/* Target Goal Tracker */}
          {(() => {
            const targetGoal = projectSettings?.project_financial_goal || 100000;
            const rawPercent = targetGoal > 0 ? (totalIncome / targetGoal) * 100 : 0;
            const progressPercent = Math.min(rawPercent, 100);
            const isSuccess = totalIncome >= targetGoal;

            React.useEffect(() => {
              if (isSuccess) {
                const script = document.createElement('script');
                script.src = "https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js";
                script.onload = () => {
                  window.confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
                };
                document.body.appendChild(script);
              }
            }, [isSuccess]);

            return (
              <div className={`glass-card rounded-3xl p-4 sm:p-6 border animate-fade-in relative overflow-hidden transition-all duration-500 ${isSuccess ? 'border-brand-500/50 shadow-[0_20px_50px_rgba(34,197,94,0.15)] bg-brand-500/5' : 'border-slate-800/50'}`}>
                <div className="absolute top-0 left-0 w-full h-1 bg-slate-800"></div>
                <div className="absolute top-0 left-0 h-1 bg-brand-500 shadow-[0_0_10px_rgba(34,197,94,0.8)] transition-all duration-1000" style={{ width: `${progressPercent}%` }}></div>

                {isSuccess && (
                  <div className="absolute -right-6 -top-6 w-24 h-24 bg-brand-500/20 blur-2xl rounded-full"></div>
                )}

                <div className="flex justify-between items-end mb-4 relative z-10">
                  <div className="flex flex-col">
                    <div className="flex items-center gap-2">
                      <h3 className="text-lg font-bold text-white">Project Financial Goal</h3>
                      {isSuccess && <span className="bg-brand-500 text-white text-[9px] px-2 py-0.5 rounded-full font-bold uppercase tracking-wider shadow-[0_0_10px_rgba(34,197,94,0.5)]">Most Success</span>}
                    </div>
                    <span className="text-xs text-brand-400">වෙසක් ව්‍යාපෘතියේ මූල්‍ය ඉලක්කය</span>
                  </div>
                  <div className="text-right flex flex-col">
                    <span className={`text-2xl font-bold ${isSuccess ? 'text-white drop-shadow-[0_0_10px_rgba(34,197,94,0.8)]' : 'text-brand-400'}`}>
                      {(() => {
                        const [pct, setPct] = React.useState(0);
                        React.useEffect(() => {
                          let start = 0;
                          const duration = 1500;
                          const inc = rawPercent / (duration / 16);
                          const timer = setInterval(() => {
                            start += inc;
                            if (start >= rawPercent) { clearInterval(timer); setPct(rawPercent); }
                            else setPct(start);
                          }, 16);
                          return () => clearInterval(timer);
                        }, [rawPercent]);
                        return pct.toFixed(1) + '%';
                      })()}
                    </span>
                  </div>
                </div>

                <div className="w-full bg-slate-900 rounded-full h-4 mb-2 border border-slate-700/50 p-0.5 overflow-hidden relative z-10">
                  <div className={`h-full rounded-full transition-all duration-1000 relative ${isSuccess ? 'bg-gradient-to-r from-yellow-400 via-brand-400 to-brand-500' : 'bg-gradient-to-r from-brand-600 to-brand-400'}`} style={{ width: `${progressPercent}%` }}>
                    <div className="absolute inset-0 bg-white/20 w-full animate-pulse rounded-full"></div>
                  </div>
                </div>

                <div className="flex justify-between text-xs text-slate-400 font-medium relative z-10">
                  <span>Collected: <NumberCounter value={totalIncome} /></span>
                  <span>Target: {formatCurrency(targetGoal)}</span>
                </div>
              </div>
            );
          })()}

          <div className="grid grid-cols-2 lg:grid-cols-4 gap-3 md:gap-6">
            <DashboardCard
              title="Total Cash Income"
              sTitle="මුළු මුදල් ආදායම"
              amount={totalIncome}
              icon={<IconTrendingUp />}
              onClick={() => setSummaryType('income')}
            />
            <DashboardCard
              title="Total Expenses"
              sTitle="මුළු වියදම්"
              amount={totalExpense}
              icon={<IconTrendingDown />}
              isExpense={true}
              onClick={() => setSummaryType('expense')}
            />
            <DashboardCard title="Current Balance" sTitle="ඉතිරි මුදල" amount={currentBalance} icon={<IconWallet />} onClick={() => setSummaryType('balance')} />
            <div onClick={() => setSummaryType('goods')} className="glass-card rounded-3xl p-6 border border-slate-800/50 hover:border-purple-500/30 transition-all group relative overflow-hidden cursor-pointer hover:-translate-y-2 duration-500">
              <div className="absolute top-0 right-0 w-24 h-24 bg-purple-500/5 blur-2xl rounded-full"></div>
              <div className="flex justify-between items-start mb-6 relative z-10">
                <div className="flex flex-col">
                  <h3 className="text-slate-400 text-[10px] font-bold uppercase tracking-widest mb-1">Total Goods</h3>
                  <span className="text-purple-400 text-[11px] font-semibold">මුළු ද්‍රව්‍ය ආධාර</span>
                </div>
                <div className="p-3 rounded-2xl bg-purple-500/10 text-purple-400 group-hover:bg-purple-500 group-hover:text-white transition-all duration-300">
                  <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4" /></svg>
                </div>
              </div>
              <div className="flex items-baseline gap-2 relative z-10">
                <span className="text-3xl font-bold text-white tracking-tight drop-shadow-[0_0_10px_rgba(168,85,247,0.4)]">{totalGoods}</span>
                <span className="text-slate-500 text-xs font-medium">Records</span>
              </div>
            </div>
          </div>

          <div className="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-5 gap-3 md:gap-6 mt-8">
            <button onClick={() => handleTabSwitch('income-list')} className="glass-card rounded-3xl p-5 flex flex-col items-center justify-center gap-3 hover:bg-slate-800/80 border border-slate-700/30 hover:border-brand-500/50 transition-all group animate-fade-in delay-100">
              <div className="w-14 h-14 rounded-2xl bg-brand-500/10 text-brand-400 flex items-center justify-center group-hover:bg-brand-500 group-hover:text-white transition-all duration-500 shadow-inner group-hover:shadow-[0_0_20px_rgba(34,197,94,0.4)]">
                <IconIncome />
              </div>
              <div className="flex flex-col text-center">
                <span className="font-bold text-slate-200 text-sm">Income List</span>
                <span className="text-[10px] text-slate-400 group-hover:text-brand-300 mt-0.5 font-medium">ආදායම් ලැයිස්තුව</span>
              </div>
            </button>

            <button onClick={() => handleTabSwitch('expense-list')} className="glass-card rounded-3xl p-5 flex flex-col items-center justify-center gap-3 hover:bg-slate-800/80 border border-slate-700/30 hover:border-red-500/50 transition-all group animate-fade-in delay-200">
              <div className="w-14 h-14 rounded-2xl bg-red-500/10 text-red-400 flex items-center justify-center group-hover:bg-red-500 group-hover:text-white transition-all duration-500 shadow-inner group-hover:shadow-[0_0_20px_rgba(239,68,68,0.4)]">
                <IconExpense />
              </div>
              <div className="flex flex-col text-center">
                <span className="font-bold text-slate-200 text-sm">Expense List</span>
                <span className="text-[10px] text-slate-400 group-hover:text-red-300 mt-0.5 font-medium">වියදම් ලැයිස්තුව</span>
              </div>
            </button>

            <button onClick={() => handleTabSwitch('goods-list')} className="glass-card rounded-3xl p-5 flex flex-col items-center justify-center gap-3 hover:bg-slate-800/80 border border-slate-700/30 hover:border-purple-500/50 transition-all group animate-fade-in delay-100">
              <div className="w-14 h-14 rounded-2xl bg-purple-500/10 text-purple-400 flex items-center justify-center group-hover:bg-purple-500 group-hover:text-white transition-all duration-500 shadow-inner group-hover:shadow-[0_0_20px_rgba(168,85,247,0.4)]">
                <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4" /></svg>
              </div>
              <div className="flex flex-col text-center">
                <span className="font-bold text-slate-200 text-sm">Goods List</span>
                <span className="text-[10px] text-slate-400 group-hover:text-purple-300 mt-0.5 font-medium">ද්‍රව්‍ය ලැයිස්තුව</span>
              </div>
            </button>

            <button onClick={() => handleTabSwitch('pledges')} className="glass-card rounded-3xl p-5 flex flex-col items-center justify-center gap-3 hover:bg-slate-800/80 border border-slate-700/30 hover:border-yellow-500/50 transition-all group relative animate-fade-in delay-200">
              <div className="w-14 h-14 rounded-2xl bg-yellow-500/10 text-yellow-500 flex items-center justify-center group-hover:bg-yellow-500 group-hover:text-white transition-all duration-500 shadow-inner group-hover:shadow-[0_0_20px_rgba(234,179,8,0.4)]">
                <IconPledges />
              </div>
              <div className="flex flex-col text-center">
                <span className="font-bold text-slate-200 text-sm">Pledges List</span>
                <span className="text-[10px] text-slate-400 group-hover:text-yellow-300 mt-0.5 font-medium">පොරොන්දු ලැයිස්තුව</span>
              </div>
              {incomes.filter(i => i.status === 'Promised').length > 0 && (
                <span className="absolute top-4 right-12 w-5 h-5 text-[10px] flex items-center justify-center rounded-full bg-yellow-500 text-slate-900 font-black border-2 border-slate-900 shadow-[0_0_15px_rgba(234,179,8,0.6)]">
                  {incomes.filter(i => i.status === 'Promised').length}
                </span>
              )}
            </button>

            <button onClick={() => handleTabSwitch('event-income-list')} className="glass-card rounded-3xl p-5 flex flex-col items-center justify-center gap-3 hover:bg-slate-800/80 border border-slate-700/30 hover:border-pink-500/50 transition-all group animate-fade-in delay-200">
              <div className="w-14 h-14 rounded-2xl bg-pink-500/10 text-pink-400 flex items-center justify-center group-hover:bg-pink-500 group-hover:text-white transition-all duration-500 shadow-inner group-hover:shadow-[0_0_20px_rgba(236,72,153,0.4)]">
                <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 8v13m0-13V6a2 2 0 112 2h-2zm0 0V5.5A2.5 2.5 0 109.5 8H12zm-7 4h14M5 12a2 2 0 110-4h14a2 2 0 110 4M5 12v7a2 2 0 002 2h10a2 2 0 002-2v-7" /></svg>
              </div>
              <div className="flex flex-col text-center">
                <span className="font-bold text-slate-200 text-sm">Event Incomes</span>
                <span className="text-[10px] text-slate-400 group-hover:text-pink-300 mt-0.5 font-medium">උත්සව ආදායම්</span>
              </div>
            </button>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6 mt-6">
            <div className="lg:col-span-1 flex flex-col gap-6 h-auto">
              <SimpleChart income={totalIncome} expense={totalExpense} />
              <TodayStatsChart incomes={incomes} expenses={expenses} />
              <LastWeekStatsChart incomes={incomes} expenses={expenses} />
            </div>

            <div className="lg:col-span-2 glass rounded-2xl p-6 border border-slate-800 flex flex-col h-auto">
              <h3 className="text-xl font-semibold mb-4 text-white flex flex-col">
                <span>Recent Activities</span>
                <span className="text-sm text-slate-400 font-normal mt-0.5">මෑත කාලීන ක්‍රියාකාරකම්</span>
              </h3>

              {recentActivities.length === 0 ? (
                <div className="text-center text-slate-400 py-8 flex flex-col flex-1 justify-center">
                  <span>No activities recorded yet.</span>
                  <span className="text-xs mt-1">ක්‍රියාකාරකම් කිසිවක් වාර්තා වී නොමැත.</span>
                </div>
              ) : (
                <div className="space-y-4 flex-1">
                  {recentActivities.map((act, idx) => (
                    <div key={idx} onClick={() => setSelectedActivity(act)} className="flex items-center justify-between p-4 rounded-xl bg-slate-800/50 hover:bg-slate-800 transition cursor-pointer group">
                      <div className="flex items-center gap-4">
                        <div className={`w-2 h-10 rounded-full shrink-0 ${act.type === 'income' ? (act.status === 'Promised' ? 'bg-yellow-500' : 'bg-brand-500') : 'bg-red-500'}`}></div>
                        <div className="flex flex-col overflow-hidden max-w-[150px] sm:max-w-xs md:max-w-sm">
                          <div className="font-medium text-slate-200 text-sm md:text-base flex items-center gap-1.5 truncate">
                            {act.type === 'income' ? (
                              <>
                                <ReporterBadge name={act.name} users={users} showFullName={true} />
                                <span className="text-xs text-slate-500 font-normal truncate">(Donation)</span>
                              </>
                            ) : (
                              <>
                                <span className="truncate">{act.reason}</span>
                                <span className="text-xs text-slate-500 font-normal truncate">(Expense)</span>
                              </>
                            )}
                          </div>
                          <div className="text-xs text-slate-400 mt-1 flex items-center gap-1.5 truncate">
                            <span>{formatDate(act.dateStr)} •</span>
                            {act.type === 'income' ? (
                              <span className="truncate">{act.donation_type === 'Goods' ? act.item_description : act.status}</span>
                            ) : (
                              <span className="flex items-center gap-1 truncate">By <ReporterBadge name={act.withdrawer_name} users={users} /></span>
                            )}
                          </div>
                        </div>
                      </div>
                      <div className={`font-semibold shrink-0 text-right ${act.type === 'income' ? 'text-brand-400' : 'text-red-400'} text-sm md:text-base`}>
                        {act.type === 'income' ? (act.donation_type === 'Goods' ? 'Goods' : '+' + formatCurrency(act.amount)) : '-' + formatCurrency(act.amount_taken)}
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          </div>

          <DailyBarChart incomes={incomes} expenses={expenses} />

          {/* Public Portal Link Section */}
          <div className="glass-card rounded-[2.5rem] p-8 border border-white/10 relative overflow-hidden animate-fade-in delay-500 mt-6 group">
            <div className="absolute top-0 right-0 w-64 h-64 bg-brand-500/5 blur-[100px] rounded-full group-hover:bg-brand-500/10 transition-colors"></div>

            <div className="flex flex-col md:flex-row items-center gap-8 relative z-10">
              {/* QR Code */}
              <div className="shrink-0 p-4 bg-white rounded-3xl shadow-2xl rotate-[-3deg] hover:rotate-0 transition-transform duration-500 group/qr relative">
                <img
                  src={`https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(window.location.origin + window.location.pathname.replace('index.html', '').replace(/\/$/, '') + '/view_income.html')}`}
                  alt="QR Code"
                  className="w-32 h-32 md:w-40 md:h-40"
                />
                <div className="absolute -bottom-2 -right-2 bg-brand-500 text-white p-2 rounded-xl shadow-lg scale-0 group-hover/qr:scale-100 transition-transform">
                  <MaterialIcon name="qr_code_2" className="text-xl" />
                </div>
              </div>

              <div className="flex-1 space-y-6 text-center md:text-left">
                <div className="space-y-2">
                  <h3 className="text-2xl font-black text-white tracking-tight">Public Transparency Portal</h3>
                  <p className="text-brand-400 font-bold text-[10px] uppercase tracking-[0.3em]">ප්‍රසිද්ධ විනිවිදභාවය පද්ධතිය</p>
                  <p className="text-sm text-slate-400 leading-relaxed font-medium">
                    Share this link with donors so they can verify their contributions and download official receipts independently.
                  </p>
                  <p className="text-[10px] text-slate-500 font-bold uppercase tracking-widest mt-2">මෙම සබැඳිය පරිත්‍යාගශීලීන් සමඟ බෙදා ගන්න. ඔවුන්ට තම දායකත්වය තහවුරු කර ගැනීමට සහ රිසිට්පත් ලබා ගැනීමට මෙය භාවිතා කළ හැක.</p>
                </div>

                <div className="flex flex-wrap items-center justify-center md:justify-start gap-4">
                  <a
                    href="view_income.html"
                    target="_blank"
                    className="px-8 py-4 bg-brand-600 hover:bg-brand-500 text-white font-black text-xs uppercase tracking-widest rounded-2xl transition shadow-xl shadow-brand-500/20 active:scale-95 flex items-center gap-2 group/btn"
                  >
                    <MaterialIcon name="open_in_new" className="text-sm group-hover/btn:rotate-12 transition-transform" />
                    Open Portal
                  </a>

                  <button
                    onClick={() => {
                      const url = window.location.origin + window.location.pathname.replace('index.html', '').replace(/\/$/, '') + '/view_income.html';
                      navigator.clipboard.writeText(url);
                      alert('Portal link copied to clipboard!');
                    }}
                    className="px-8 py-4 bg-slate-900 hover:bg-slate-800 text-slate-300 font-black text-xs uppercase tracking-widest rounded-2xl border border-slate-700 transition active:scale-95 flex items-center gap-2"
                  >
                    <MaterialIcon name="content_copy" className="text-sm" />
                    Copy Link
                  </button>
                </div>
              </div>
            </div>
          </div>

          {summaryType && (() => {
            let data = [];
            let title = '';
            let sTitle = '';
            let accentColor = 'brand';

            if (summaryType === 'income') {
              data = incomes.filter(i => i.status === 'Received Today' && i.donation_type === 'Cash').map(i => ({ ...i, displayAmount: `Rs. ${Math.round(i.amount).toLocaleString()}`, type: 'income' }));
              title = 'Cash Income Summary';
              sTitle = 'මුදල් ආදායම් සාරාංශය';
              accentColor = 'brand';
            } else if (summaryType === 'expense') {
              data = expenses.map(e => ({ ...e, name: e.reason, displayAmount: `Rs. ${Math.round(e.amount_taken).toLocaleString()}`, type: 'expense' }));
              title = 'Expense Summary';
              sTitle = 'වියදම් සාරාංශය';
              accentColor = 'red';
            } else if (summaryType === 'goods') {
              data = incomes.filter(i => i.status === 'Received Today' && i.donation_type === 'Goods').map(i => ({ ...i, displayAmount: `${i.item_description} (x${i.quantity})`, type: 'goods' }));
              title = 'Goods Contribution Summary';
              sTitle = 'ද්‍රව්‍ය ආධාර සාරාංශය';
              accentColor = 'purple';
            } else if (summaryType === 'balance') {
              const inc = incomes.filter(i => i.status === 'Received Today' && i.donation_type === 'Cash').map(i => ({ ...i, displayAmount: `+ Rs. ${Math.round(i.amount).toLocaleString()}`, type: 'income' }));
              const exp = expenses.map(e => ({ ...e, name: e.reason, displayAmount: `- Rs. ${Math.round(e.amount_taken).toLocaleString()}`, type: 'expense' }));
              data = [...inc, ...exp].sort((a, b) => new Date(b.created_at || b.date) - new Date(a.created_at || a.date)).slice(0, 20);
              title = 'Current Balance Details';
              sTitle = 'වත්මන් ශේෂ විස්තර';
              accentColor = 'blue';
            }

            const colorClasses = {
              brand: 'text-brand-400 border-brand-500/30',
              red: 'text-red-400 border-red-500/30',
              purple: 'text-purple-400 border-purple-500/30',
              blue: 'text-blue-400 border-blue-500/30'
            };

            return (
              <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/80 backdrop-blur-md p-4 animate-fade-in" onClick={() => setSummaryType(null)}>
                <div className={`glass p-6 rounded-[2rem] max-w-2xl w-full border ${colorClasses[accentColor]} max-h-[85vh] flex flex-col shadow-[0_20px_50px_rgba(0,0,0,0.5)]`} onClick={e => e.stopPropagation()}>
                  <div className="flex justify-between items-center mb-6">
                    <div className="flex flex-col">
                      <h3 className="text-xl font-bold text-white tracking-tight">{title}</h3>
                      <p className="text-xs text-slate-400 mt-0.5">{sTitle}</p>
                    </div>
                    <button onClick={() => setSummaryType(null)} className="w-10 h-10 flex items-center justify-center rounded-full bg-slate-800/50 text-slate-400 hover:text-white transition-all">
                      <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" /></svg>
                    </button>
                  </div>

                  <div className="overflow-y-auto flex-1 custom-scrollbar pr-2 space-y-3">
                    {data.length === 0 ? (
                      <div className="text-center py-12 text-slate-500 font-medium">No records found. / වාර්තා කිසිවක් නැත.</div>
                    ) : (
                      data.map((item, idx) => (
                        <div key={idx} className="bg-slate-900/40 p-4 rounded-2xl border border-slate-800/50 flex justify-between items-center group hover:bg-slate-800/50 transition-colors">
                          <div className="flex items-center gap-3">
                            <div className={`w-10 h-10 rounded-xl flex items-center justify-center shrink-0 ${item.type === 'income' ? 'bg-brand-500/10 text-brand-400' : item.type === 'expense' ? 'bg-red-500/10 text-red-400' : 'bg-purple-500/10 text-purple-400'}`}>
                              {item.type === 'income' ? <IconTrendingUp className="w-5 h-5" /> : item.type === 'expense' ? <IconTrendingDown className="w-5 h-5" /> : <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" /></svg>}
                            </div>
                            <div className="flex flex-col">
                              <span className="font-bold text-white text-sm group-hover:text-brand-400 transition-colors"><ReporterBadge name={item.name} users={users} showFullName={true} /></span>
                              <span className="text-[10px] text-slate-500 font-medium uppercase tracking-wider flex items-center gap-1 mt-1">
                                {formatDate(item.date)}
                                {item.reported_by && (
                                  <>
                                    <span className="mx-1 text-slate-700">•</span> By <ReporterBadge name={item.reported_by} users={users} />
                                  </>
                                )}
                              </span>
                            </div>
                          </div>
                          <div className={`font-black text-sm tracking-tight ${item.type === 'income' ? 'text-brand-400' : item.type === 'expense' ? 'text-red-400' : 'text-purple-400'}`}>
                            {item.displayAmount}
                          </div>
                        </div>
                      ))
                    )}
                  </div>

                  <div className="mt-6 pt-4 border-t border-slate-800 flex justify-between items-center">
                    <div className="text-xs text-slate-500 font-medium">Showing {data.length} records</div>
                    <button onClick={() => setSummaryType(null)} className="px-6 py-2 bg-slate-800 hover:bg-slate-700 text-white rounded-xl text-sm font-bold transition-all active:scale-95 m3-button m3-button-tonal">Close / වසන්න</button>
                  </div>
                </div>
              </div>
            );
          })()}

          {selectedActivity && (() => {
            const act = selectedActivity;
            const isIncome = act.type === 'income';
            const title = isIncome ? 'Income Details' : 'Expense Details';
            const sTitle = isIncome ? 'ආදායම් විස්තර' : 'වියදම් විස්තර';
            const accentColor = isIncome ? (act.status === 'Promised' ? 'text-yellow-400' : 'text-brand-400') : 'text-red-400';

            const details = isIncome ? [
              { label: 'Donor Name (නම)', value: <div className="mt-1 inline-block"><ReporterBadge name={act.name} users={users} showFullName={true} /></div> },
              { label: 'Date (දිනය)', value: formatDate(act.date) },
              { label: 'Donation Type (වර්ගය)', value: act.donation_type },
              { label: 'Details (විස්තර)', value: act.donation_type === 'Cash' ? formatCurrency(act.amount) : `${act.item_description} (x${act.quantity})` },
              { label: 'Reported By (වාර්තා කළේ)', value: <div className="mt-1 inline-block"><ReporterBadge name={act.reported_by} users={users} showFullName={true} /></div> },
              { label: 'Status (තත්ත්වය)', value: act.status }
            ] : [
              { label: 'Reason (හේතුව)', value: act.reason },
              { label: 'Date (දිනය)', value: formatDate(act.date) },
              { label: 'Time (වේලාව)', value: act.time || 'N/A' },
              { label: 'Amount (මුදල)', value: formatCurrency(act.amount_taken) },
              { label: 'Recorded By (වාර්තා කළේ)', value: <div className="mt-1 inline-block"><ReporterBadge name={act.withdrawer_name} users={users} showFullName={true} /></div> }
            ];

            return (
              <div className="fixed inset-0 z-[200] flex items-center justify-center bg-black/90 backdrop-blur-sm p-4 animate-fade-in" onClick={() => setSelectedActivity(null)}>
                <div className="glass p-8 rounded-[2.5rem] max-w-sm w-full border border-white/10 shadow-[0_30px_60px_rgba(0,0,0,0.8)] relative overflow-hidden" onClick={e => e.stopPropagation()}>
                  <div className={`absolute top-0 left-0 w-full h-1.5 ${isIncome ? (act.status === 'Promised' ? 'bg-yellow-500' : 'bg-brand-500') : 'bg-red-500'}`}></div>

                  <button onClick={() => setSelectedActivity(null)} className="absolute top-6 right-6 text-slate-400 hover:text-white bg-slate-800/50 w-8 h-8 flex items-center justify-center rounded-full transition">&times;</button>

                  <div className="mb-6">
                    <h3 className="text-xl font-black text-white tracking-tight">{title}</h3>
                    <p className={`text-xs font-bold uppercase tracking-widest mt-1 ${accentColor}`}>{sTitle}</p>
                  </div>

                  <div className="space-y-4">
                    {details.map((d, i) => (
                      <div key={i} className="flex flex-col gap-1 border-b border-slate-800/50 pb-3 last:border-0">
                        <span className="text-[10px] text-slate-500 font-bold uppercase tracking-widest">{d.label}</span>
                        <span className="text-sm text-slate-200 font-semibold">{d.value || '-'}</span>
                      </div>
                    ))}

                    {!isIncome && act.receipt_url && (
                      <div className="pt-2">
                        <span className="text-[10px] text-slate-500 font-bold uppercase tracking-widest block mb-2">Receipt (බිල්පත)</span>
                        <div className="rounded-xl overflow-hidden border border-slate-700 bg-slate-900 aspect-video relative group cursor-pointer" onClick={() => onViewReceipt(act.receipt_url)}>
                          <img src={act.receipt_url} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" />
                          <div className="absolute inset-0 bg-black/40 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
                            <span className="text-xs text-white font-bold bg-black/60 px-3 py-1.5 rounded-full">View Full Bill</span>
                          </div>
                        </div>
                      </div>
                    )}
                  </div>

                  <button onClick={() => setSelectedActivity(null)} className={`mt-8 w-full py-3.5 rounded-2xl text-xs font-black uppercase tracking-widest transition-all active:scale-95 shadow-lg ${isIncome ? 'bg-brand-600 hover:bg-brand-500' : 'bg-red-600 hover:bg-red-500'} text-white`}>
                    Got It / හරි
                  </button>
                </div>
              </div>
            );
          })()}
        </div>
      );
    }

    function InputField({ label, sLabel, type = "text", name, value, onChange, required, options, prefix }) {
      return (
        <div className="flex flex-col gap-1.5 mb-4">
          <label className="text-sm font-medium text-slate-300 flex flex-col gap-0.5 leading-tight">
            <span>{label} {required && <span className="text-brand-500">*</span>}</span>
            {sLabel && <span className="text-[10.5px] text-brand-400 opacity-90">{sLabel}</span>}
          </label>

          {type === 'select' ? (
            <select name={name} value={value} onChange={onChange} required={required} className="bg-slate-900 border border-slate-700 text-white text-sm rounded-lg focus:ring-brand-500 focus:border-brand-500 block w-full p-2.5 transition outline-none">
              <option value="">Select Option / තෝරන්න</option>
              {options.map(o => <option key={o} value={o}>{o}</option>)}
            </select>
          ) : type === 'textarea' ? (
            <textarea name={name} value={value} onChange={onChange} required={required} className="bg-slate-900 border border-slate-700 text-white text-sm rounded-lg focus:ring-brand-500 focus:border-brand-500 block w-full p-2.5 transition min-h-[100px] outline-none"></textarea>
          ) : (
            <div className="relative">
              {prefix && (
                <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                  <span className="text-slate-400 sm:text-sm text-xs font-semibold">{prefix}</span>
                </div>
              )}
              <input type={type} name={name} value={value} onChange={onChange} required={required} className={`bg-slate-900 border border-slate-700 text-white text-sm rounded-lg focus:ring-brand-500 focus:border-brand-500 block w-full p-2.5 transition outline-none ${prefix ? 'pl-[2.2rem]' : ''}`} />
            </div>
          )}
        </div>
      );
    }

    function GoodsList({ incomes, users, setActiveTab }) {
      const [searchTerm, setSearchTerm] = useState('');
      const [sortBy, setSortBy] = useState('date-desc');
      const [filterDate, setFilterDate] = useState('');

      const validIncomes = incomes.filter(i => {
        if (i.status !== 'Received Today' || i.donation_type !== 'Goods') return false;
        if (filterDate && i.date !== filterDate) return false;
        if (searchTerm) {
          const lower = searchTerm.toLowerCase();
          return (i.name?.toLowerCase().includes(lower) ||
            i.item_description?.toLowerCase().includes(lower) ||
            i.reported_by?.toLowerCase().includes(lower));
        }
        return true;
      });

      const sortedIncomes = [...validIncomes].sort((a, b) => {
        if (sortBy === 'date-desc') return new Date(b.date) - new Date(a.date);
        if (sortBy === 'date-asc') return new Date(a.date) - new Date(b.date);
        if (sortBy === 'name-asc') return (a.name || '').localeCompare(b.name || '');
        return 0;
      });

      const handleCSV = () => {
        const headers = ["Date", "Name", "Phone", "Item description", "Quantity", "Reported By"];
        const rows = [headers, ...sortedIncomes.map(i => [
          formatDate(i.date), i.name, i.phone_number || '-', i.item_description, i.quantity, i.reported_by
        ])];
        exportToCSV("Goods_Records_Vesak", rows);
      };

      const handlePDF = () => {
        const headers = ["Date", "Name", "Item description", "Quantity", "Reported By"];
        const rows = sortedIncomes.map(i => [
          formatDate(i.date), i.name, i.item_description, i.quantity, i.reported_by
        ]);
        exportToPDF("Total Goods Records", headers, rows, "Goods_Records_Vesak");
      };

      return (
        <div className="glass rounded-2xl p-6 overflow-x-auto border border-slate-800">
          <button onClick={() => setActiveTab('dashboard')} className="mb-6 flex items-center gap-2 text-slate-400 hover:text-white transition group">
            <svg className="w-4 h-4 group-hover:-translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.5} d="M15 19l-7-7 7-7" /></svg>
            <span className="text-xs font-bold uppercase tracking-widest">Back to Dashboard</span>
          </button>
          <div className="flex flex-col sm:flex-row sm:items-center justify-between mb-6 gap-4">
            <h2 className="text-xl font-bold text-white flex flex-col">
              <span>All Goods Records</span>
              <span className="text-sm text-slate-400 font-normal mt-0.5">සියලුම ද්‍රව්‍ය ආධාර වාර්තා</span>
            </h2>
            <ExportButtons onCsv={handleCSV} onPdf={handlePDF} />
          </div>

          <div className="flex flex-col md:flex-row gap-4 mb-6">
            <input type="text" placeholder="Search keyword..." value={searchTerm} onChange={e => setSearchTerm(e.target.value)} className="bg-slate-900 border border-slate-700 text-white text-sm rounded-lg p-2.5 outline-none flex-1 focus:border-brand-500" />
            <input type="date" value={filterDate} onChange={e => setFilterDate(e.target.value)} className="bg-slate-900 border border-slate-700 text-white text-sm rounded-lg p-2.5 outline-none focus:border-brand-500" />
            <select value={sortBy} onChange={e => setSortBy(e.target.value)} className="bg-slate-900 border border-slate-700 text-white text-sm rounded-lg p-2.5 outline-none focus:border-brand-500">
              <option value="date-desc">Newest Date / අලුත්ම දිනය</option>
              <option value="date-asc">Oldest Date / පැරණිතම දිනය</option>
              <option value="name-asc">Alphabetical (A-Z) / අකුරු පිළිවෙළට</option>
            </select>
          </div>

          {sortedIncomes.length === 0 ? (
            <div className="text-center py-10 text-slate-400 border border-dashed border-slate-700 rounded-xl">
              No goods records found. / ද්‍රව්‍ය වාර්තා නොමැත.
            </div>
          ) : (
            <div className="overflow-x-auto min-w-full">
              <table className="w-full text-left text-sm text-slate-300 min-w-[700px]">
                <thead className="text-xs text-slate-400 uppercase bg-slate-900/50">
                  <tr>
                    <th className="px-4 py-3 rounded-tl-lg">Date</th>
                    <th className="px-4 py-3">Donor Info</th>
                    <th className="px-4 py-3">Reporter</th>
                    <th className="px-4 py-3">Goods Details</th>
                    <th className="px-4 py-3 text-center rounded-tr-lg">Action <br /><span className="text-[9px] font-normal tracking-wide text-brand-400">ක්‍රියාව</span></th>
                  </tr>
                </thead>
                <tbody>
                  {sortedIncomes.map(p => (
                    <tr key={p.id} className="border-b border-slate-800 hover:bg-slate-800/30 transition">
                      <td className="px-4 py-4 whitespace-nowrap">{formatDate(p.date)}</td>
                      <td className="px-4 py-4">
                        <div className="font-medium text-slate-200"><ReporterBadge name={p.name} users={users} showFullName={true} /></div>
                        {p.phone_number && <span className="block text-xs text-slate-500 font-normal mt-1">{p.phone_number}</span>}
                      </td>
                      <td className="px-4 py-4"><ReporterBadge name={p.reported_by} users={users} /></td>
                      <td className="px-4 py-4 font-semibold text-purple-400 max-w-[200px] truncate">
                        {p.item_description} <span className="text-[10px] text-slate-500 ml-1">x{p.quantity}</span>
                      </td>
                      <td className="px-4 py-4 text-center">
                        <div className="flex gap-2 justify-center">
                          <button onClick={() => downloadReceipt(p)} className="inline-flex items-center gap-1 px-2.5 py-2 bg-brand-500/20 text-brand-400 hover:bg-brand-500/30 border border-brand-500/50 rounded-lg transition text-xs font-semibold">
                            <IconDownload /> PNG
                          </button>

    function ExpenseList({ expenses, onRefresh, users, onViewReceipt, setActiveTab }) {
      const [searchTerm, setSearchTerm] = useState('');
      const [sortBy, setSortBy] = useState('date-desc');
      const [filterDate, setFilterDate] = useState('');
      const [uploadingId, setUploadingId] = useState(null);
      const handleViewReceipt = (url, reason) => {
        if (onViewReceipt) {
          onViewReceipt({ url, title: reason });
        }
      };

      const handleReceiptUpload = async (e, recordId) => {
        const file = e.target.files[0];
        if (!file) return;

        // Compress image client side
        setUploadingId(recordId);

        try {
          const reader = new FileReader();
          reader.readAsDataURL(file);
          reader.onload = async () => {
            const img = new Image();
            img.src = reader.result;
            img.onload = async () => {
              const canvas = document.createElement('canvas');
              const MAX_WIDTH = 800;
              let width = img.width;
              let height = img.height;
              if (width > MAX_WIDTH) {
                height *= MAX_WIDTH / width;
                width = MAX_WIDTH;
              }
              canvas.width = width;
              canvas.height = height;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, width, height);
              const compressedBase64 = canvas.toDataURL('image/jpeg', 0.5);

              try {
                const { error: fbErr } = await supabase.from('expenses').update({ receipt_url: compressedBase64 }).eq('id', recordId);
                if (fbErr) throw fbErr;
                alert("Receipt uploaded successfully! / බිල්පත සාර්ථකව උඩුගත කරන ලදි.");
                if (onRefresh) onRefresh();
              } catch (err) {
                alert("Error: To save receipts, please manually add a 'receipt_url' (Type: text) column to your 'expenses' table in Supabase!\nSupabase හි 'expenses' table එකට 'receipt_url' ලෙස අලුත් text column එකක් එකතු කරන්න!");
              } finally {
                setUploadingId(null);
              }
            };
          };
        } catch (err) {
          alert('Failed to process image');
          setUploadingId(null);
        }
      };

      const validExpenses = expenses.filter(e => {
        if (filterDate && e.date !== filterDate) return false;
        if (searchTerm) {
          const lower = searchTerm.toLowerCase();
          return (e.reason?.toLowerCase().includes(lower) ||
            e.withdrawer_name?.toLowerCase().includes(lower) ||
            (e.amount_taken && e.amount_taken.toString().includes(lower)));
        }
        return true;
      });

      const sortedExpenses = [...validExpenses].sort((a, b) => {
        if (sortBy === 'date-desc') return new Date(b.date) - new Date(a.date);
        if (sortBy === 'date-asc') return new Date(a.date) - new Date(b.date);

        if (sortBy === 'amount-desc') return (b.amount_taken || 0) - (a.amount_taken || 0);
        if (sortBy === 'amount-asc') return (a.amount_taken || 0) - (b.amount_taken || 0);
        return 0;
      });

      const handleCSV = () => {
        const headers = ["Date", "Time", "Reason", "Withdrawer", "Amount"];
        const rows = [headers, ...sortedExpenses.map(e => [
          formatDate(e.date), e.time, e.reason, e.withdrawer_name, e.amount_taken

        exportToCSV("Expense_Records_Vesak", rows);

      const handlePDF = () => {

          formatDate(e.date), e.reason, e.withdrawer_name, formatCurrency(e.amount_taken)

              <svg className="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" /></svg>
            </div>
            <h2 className="text-2xl font-bold text-white mb-4">Access Restricted</h2>
            <p className="text-slate-400 leading-relaxed mb-0">මෙම අංශයට දත්ත ඇතුළත් කිරීමට ඔබට අවසර නොමැත.</p>
            <p className="text-slate-500 text-xs mt-2 italic">Please contact your system administrator for permission.</p>
          </div>
        );
      }

      const [step, setStep] = useState(1);
      const totalSteps = 3;
      const [formData, setFormData] = useState({
        name: '', address: '', phone_number: '', date: new Date().toISOString().split('T')[0],
        donation_type: 'Cash', amount: '', donor_category: 'Regular Donor',
        item_description: '', quantity: '', description: '',
        status: 'Received Today'
      });
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');

      const handleChange = (e) => setFormData(prev => ({ ...prev, [e.target.name]: e.target.value }));

      const handleFormSubmit = async (e) => {
        e.preventDefault();
        if (step < totalSteps) {
          setStep(step + 1);
          return;
        }

        setLoading(true); setError('');

        try {
          const payload = {
            name: formData.name, date: formData.date, donation_type: formData.donation_type, description: formData.description, status: formData.status,
            address: formData.address || null, phone_number: formData.phone_number || null,
            reported_by: currentUser.username,
            event_type: 'vesak'
          };
          if (formData.donation_type === 'Cash') {
            payload.amount = parseFloat(formData.amount);
            payload.donor_category = formData.donor_category;
          } else {
            payload.item_description = formData.item_description;
            payload.quantity = parseFloat(formData.quantity);
          }

          const { data: dbData, error: dbErr } = await supabase.from('incomes').insert([payload]).select();
          if (dbErr) throw dbErr;

          const insertedRecord = dbData[0];

          // Add Notification Record
          const notifBody = `${payload.name} added a ${payload.donation_type === 'Cash' ? 'donation of Rs.' + payload.amount : 'contribution of ' + payload.item_description}`;
          await supabase.from('notifications').insert([{
            title: `New ${payload.donation_type} Record`,
            body: notifBody,
            type: 'income',
            record_id: insertedRecord.id
          }]);

          if (typeof supabase.functions !== 'undefined') {
            supabase.functions.invoke('send_fcm_notification', {
              body: { record: payload, type: 'INSERT' }
            }).catch(e => console.error("FCM invoke error:", e));
          }

          if (onComplete) onComplete(payload);
          setStep(1); // reset to first step implicitly
          setFormData({
            name: '', address: '', phone_number: '', date: new Date().toISOString().split('T')[0],
            donation_type: 'Cash', amount: '', donor_category: 'Regular Donor',
            item_description: '', quantity: '', description: '',
            status: 'Received Today'
          });
        } finally {
          setLoading(false);
        }
      };

      const generateAIDescription = () => {
        const { name, amount, donation_type, item_description, donor_category, quantity } = formData;
        if (!name && !item_description) return;

        const prefix = donor_category === 'Main Donor' ? 'ගෞරවනීය ප්‍රධාන ආධාරකරු ' : '';
        const ePrefix = donor_category === 'Main Donor' ? 'Honorable Main Donor ' : '';
        const donorName = name || "Anonymous";

        const cashOpenings = [
          { s: `${prefix}${donorName} පින්වතා විසින්`, e: `By ${ePrefix}${donorName},` },
          { s: `ශාසනික අභිවෘද්ධිය පතන ${prefix}${donorName} විසින්`, e: `By ${ePrefix}${donorName}, for the prosperity of Sasana,` },
          { s: `මෙවර වෙසක් උත්සවය වෙනුවෙන් ${prefix}${donorName} පින්වතා විසින්`, e: `For this Vesak festival, by ${ePrefix}${donorName},` }
        ];

        const cashBodies = [
          { s: ` රු. ${Number(amount).toLocaleString()} ක ආධාර මුදලක් පූජා කරන ලදී.`, e: ` a donation of Rs. ${Number(amount).toLocaleString()} was offered.` },
          { s: ` රු. ${Number(amount).toLocaleString()} ක මුදලක් වෙසක් කුඩුව සඳහා පරිත්‍යාග කරන ලදී.`, e: ` a sum of Rs. ${Number(amount).toLocaleString()} was donated for the lantern.` },
          { s: ` රු. ${Number(amount).toLocaleString()} ක මුදලකින් දායක විය.`, e: ` contributed with an amount of Rs. ${Number(amount).toLocaleString()}.` }
        ];

        const goodsOpenings = [
          { s: `${prefix}${donorName} පින්වතා විසින්`, e: `By ${ePrefix}${donorName},` },
          { s: `වෙසක් පින්කමට දායක වෙමින් ${prefix}${donorName} පින්වතා විසින්`, e: `Contributing to the Vesak merit, by ${ePrefix}${donorName},` }
        ];

        const goodsBodies = [
          { s: ` ${item_description} (x${quantity || 1}) පරිත්‍යාග කරන ලදී.`, e: ` ${item_description} (x${quantity || 1}) were donated.` },
          { s: ` වෙසක් කුඩුව සඳහා ${item_description} (x${quantity || 1}) ලබා දී සහයෝගය දැක්වූහ.`, e: ` provided ${item_description} (x${quantity || 1}) in support of the lantern.` }
        ];

        const closings = [
          { s: " පින් අනුමෝදන් වේවා!", e: " May you be blessed!" },
          { s: " මෙම උතුම් පින්කම නිවන් මගට හේතු වේවා!", e: " May this noble deed lead to Nibbana!" },
          { s: " සියලු සම්පත් සම්පූර්ණ වේවා!", e: " May all your wishes be fulfilled!" }
        ];

        const op = donation_type === 'Cash'
          ? cashOpenings[Math.floor(Math.random() * cashOpenings.length)]
          : goodsOpenings[Math.floor(Math.random() * goodsOpenings.length)];

        const bd = donation_type === 'Cash'
          ? cashBodies[Math.floor(Math.random() * cashBodies.length)]
          : goodsBodies[Math.floor(Math.random() * goodsBodies.length)];

        const cl = closings[Math.floor(Math.random() * closings.length)];

        const sText = `${op.s}${bd.s}${cl.s}`;
        const eText = `${op.e}${bd.e}${cl.e}`;

        setFormData(prev => ({ ...prev, description: `${sText}\n\n${eText}` }));
      };

      const SUGGESTIONS = [
        "පින්වතුන්ගේ මාසික දායකත්වය",
        "විශේෂ ආධාරයක් ලෙස ලබා දෙන ලදී",
        "වෙසක් කූඩුව සඳහා ලබා දුන් මුදල්",
        "පුණ්‍යානුමෝදනා පත්‍රිකා සඳහා ලැබුණු මුදල්",
        "පින් අනුමෝදන් වේවා!"
      ];

      const StepIndicator = ({ current, total }) => (
        <div className="flex gap-2 mb-6">
          {Array.from({ length: total }).map((_, i) => (
            <div key={i} className={`h-2 flex-1 rounded-full transition-all duration-300 ${i + 1 <= current ? 'bg-brand-500 shadow-[0_0_8px_rgba(34,197,94,0.5)]' : 'bg-slate-800'}`}></div>
          ))}
