<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <base href="../" />
    <title>Vesak System</title>
    <link rel="icon" href="logo.png" type="image/png" />

    <!-- Restore GitHub Pages SPA routes, matching the original entry page. -->
    <script>
      (function (location) {
        if (location.search[1] === "/") {
          var decoded = location.search
            .slice(1)
            .split("&")
            .map(function (segment) {
              return segment.replace(/~and~/g, "&");
            })
            .join("?");

          window.history.replaceState(
            null,
            "",
            location.pathname.slice(0, -1) + decoded + location.hash,
          );
        }
      })(window.location);
    </script>

    <!--
      The production bundle uses /2026-vesak/ as its router base. Normalize the
      clone entry URL before React starts so every original route works here too.
    -->
    <script>
      (function () {
        var appBase = "/2026-vesak/";
        if (!window.location.pathname.startsWith(appBase)) {
          window.history.replaceState(
            null,
            "",
            appBase + window.location.search + window.location.hash,
          );
        } else if (window.location.pathname !== appBase) {
          window.history.replaceState(
            null,
            "",
            appBase + window.location.search + window.location.hash,
          );
        }
      })();
    </script>

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    />

    <script src="https://unpkg.com/three@0.149.0/build/three.min.js"></script>
    <script
      type="module"
      crossorigin
      src="assets/index-DXw9kV3Z.js"
    ></script>
    <link
      rel="stylesheet"
      crossorigin
      href="assets/index-Ch6i61B_.css"
    />

    <!-- Keep hard-coded app images working when the clone is served locally. -->
    <script>
      (function () {
        var appPrefix = "/2026-vesak/";
        var localBase = new URL(document.baseURI);
        if (localBase.pathname === appPrefix) return;

        function fixImage(image) {
          var source = image.getAttribute("src");
          if (!source) return;

          var resolved = new URL(source, window.location.origin);
          if (
            resolved.origin === window.location.origin &&
            resolved.pathname.startsWith(appPrefix)
          ) {
            image.src = new URL(
              resolved.pathname.slice(appPrefix.length) + resolved.search,
              localBase,
            ).href;
          }
        }

        function fixImages(root) {
          if (root.nodeType === 1 && root.matches("img[src]")) fixImage(root);
          if (root.querySelectorAll) {
            root.querySelectorAll("img[src]").forEach(fixImage);
          }
        }

        new MutationObserver(function (mutations) {
          mutations.forEach(function (mutation) {
            if (mutation.type === "attributes") {
              fixImage(mutation.target);
              return;
            }
            mutation.addedNodes.forEach(fixImages);
          });
        }).observe(document.documentElement, {
          attributes: true,
          attributeFilter: ["src"],
          childList: true,
          subtree: true,
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
