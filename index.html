      );

      function LoadingScreen() {
        return (
          <div className="fixed inset-0 z-[500] bg-[#020617] flex flex-col items-center justify-center p-8 overflow-hidden">
            <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-brand-500/10 blur-[120px] rounded-full animate-pulse"></div>
            <div className="relative space-y-12 flex flex-col items-center">
              <div className="relative">
                <div className="loader-ring">
                  <div className="loader-inner">
                    <img src="logo.png" className="w-10 h-10 object-contain loader-logo-pulse" alt="Logo" />
                  </div>
                </div>
                <div className="absolute -inset-4 border border-white/5 rounded-full"></div>
              </div>
              <div className="text-center space-y-4">
                <div className="space-y-1">
                  <h2 className="text-white text-2xl font-black tracking-tighter uppercase animate-fade-in">Vesak Finance</h2>
                  <p className="text-brand-500 font-black text-[10px] tracking-[0.5em] uppercase animate-fade-in delay-100">Control Dashboard</p>
                </div>
                <div className="flex flex-col items-center gap-3">
                  <div className="w-48 h-1 bg-white/5 rounded-full overflow-hidden">
                    <div className="h-full bg-brand-500 w-1/3 animate-[shimmer-sweep_1.5s_infinite]"></div>
                  </div>
                  <p className="text-slate-500 text-[9px] font-black uppercase tracking-widest animate-pulse">Establishing Secure Neural Link...</p>
                </div>
              </div>
              <div className="absolute bottom-[-100px] flex items-center gap-4 opacity-20">
                <img src="ve1rify.png" className="w-8 h-8 grayscale" />
                <div className="h-4 w-px bg-white/20"></div>
                <p className="text-[8px] text-white font-black uppercase tracking-[0.3em]">BEYOND VERIFIED</p>
              </div>
            </div>
          </div>
        );
      }

      const urlParams = new URLSearchParams(window.location.search);
      const isRemoteScan = urlParams.get('action') === 'remote-scan';
      const remoteSessionId = urlParams.get('session');

      if (isRemoteScan && remoteSessionId) {
        return <RemoteScannerView sessionId={remoteSessionId} />;
      }

      if (loading) return <LoadingScreen />;

      return (
        <div className={`flex flex-col md:flex-row min-h-screen relative overflow-hidden ${currentUser?.role === 'admin' ? 'admin-theme' : ''}`}>
          <div className="neural-flow"></div>

          <NotificationToast show={!!notification} data={notification} onClose={() => setNotification(null)} />
          {isNotificationModalOpen && <NotificationModal />}

          {showFaceIdSetup && (
            <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/80 backdrop-blur-xl p-4 animate-fade-in">
              <div className="surface-container p-10 rounded-m3-xl max-w-sm w-full text-center border border-white/5 shadow-2xl luminous">
                <div className="w-20 h-20 mx-auto bg-m3-primaryContainer text-m3-onPrimaryContainer rounded-2xl flex items-center justify-center mb-8 shadow-lg">
                  <MaterialIcon name="faceid" className="text-4xl" />
                </div>
                <h3 className="text-2xl font-black text-white mb-2 tracking-tight">Set Up Face ID</h3>
                <p className="text-sm text-slate-400 mb-8 leading-relaxed px-4">ඊලඟ වතාවේ මුරපදය නොමැතිව පහසුවෙන් පිවිසීමට Face ID හෝ Fingerprint සකසන්න.</p>
                <div className="flex flex-col gap-3">
                  <button onClick={async () => {
                    try {
                      const deviceName = getDeviceName();
                      const newPasskeyId = await registerFaceId(currentUser, deviceName);
                      const updatedUser = { ...currentUser, passkey_id: newPasskeyId };
                      setCurrentUser(updatedUser);
                      localStorage.setItem('vesak_current_user', JSON.stringify(updatedUser));
                      setShowFaceIdSetup(false);
                      showNotification({ type: 'success', title: 'Face ID Setup Successful!', sTitle: 'සාර්ථකව සැකසුනි.' });
                    } catch (e) {
                      alert("Setup Failed: " + e.message);
                    }
                  }} className="m3-button m3-button-filled h-14 !rounded-2xl w-full shadow-lg font-black uppercase tracking-widest">
                    Set Up Now / සකසන්න
                  </button>
                  <button onClick={() => setShowFaceIdSetup(false)} className="m3-button m3-button-tonal w-full text-xs font-bold uppercase tracking-widest opacity-70">
                    Skip / පසුවට
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* M3 Navigation Rail (Desktop) */}
          <aside className="hidden md:flex flex-col w-20 bg-m3-surfaceContainerLow border-r border-white/5 fixed left-0 top-0 h-screen z-40 items-center py-8 gap-6 animate-slide-right">
            <button
              onClick={() => setActiveTab('dashboard')}
              className="w-12 h-12 bg-m3-primaryContainer rounded-2xl flex items-center justify-center text-m3-onPrimaryContainer shadow-lg mb-4 hover:scale-110 active:scale-95 transition-all duration-300 group cursor-pointer"
              title="Home"
            >
              <img src="logo.png" className="w-8 h-8 object-contain group-hover:rotate-12 transition-transform duration-500" />
            </button>

            <nav className="flex flex-col gap-6 flex-1">
              {[
                { id: 'dashboard', icon: 'dashboard', tooltip: 'Dashboard' },
                { id: 'income-page', icon: 'payments', tooltip: 'Income' },
                { id: 'expense-page', icon: 'account_balance_wallet', tooltip: 'Expense' },
                { id: 'pledges', icon: 'history', tooltip: 'Pledges' },
                { id: 'donations-view', icon: 'visibility', tooltip: 'View All' },
                ...(currentUser?.role === 'admin' ? [{ id: 'admin-link', icon: 'shield', tooltip: 'Admin', isLink: true }] : [])
              ].map(item => (
                <button
                  key={item.id}
                  onClick={() => {
                    if (item.isLink) {
                      if (confirm("Are you sure you want to open Admin Panel? / ඇඩ්මින් පැනලය විවෘත කිරීමට ඔබට අවශ්‍ය බව සහතිකද?")) {
                        window.location.href = 'admin.html';
                      }
                    } else {
                      setActiveTab(item.id);
                    }
                  }}
                  className={`w-16 py-2 flex flex-col items-center justify-center rounded-2xl transition-all duration-300 ${item.isLink
                      ? 'text-indigo-400 hover:bg-indigo-500/10 border border-indigo-500/20'
                      : activeTab === item.id
                        ? 'bg-m3-secondaryContainer text-m3-onSecondaryContainer'
                        : 'text-m3-onSurface hover:bg-white/5'
                    }`}
                  title={item.tooltip}
                >
                  <MaterialIcon name={item.icon} className={activeTab === item.id ? 'FILL' : ''} />
                  <span className="text-[10px] font-bold mt-1 uppercase tracking-tighter opacity-80">{item.tooltip}</span>
                </button>
              ))}
            </nav>

            <div className="flex flex-col items-center gap-4 mb-4 mt-auto">
              <button onClick={() => setActiveTab('profile')} className="flex flex-col items-center gap-1.5 group">
                <div className="relative">
                  <div className={`w-12 h-12 rounded-full overflow-hidden border-2 transition-all duration-300 shadow-lg ${currentUser?.role === 'admin' ? 'border-indigo-400 group-hover:border-indigo-300 shadow-[0_0_12px_rgba(99,102,241,0.4)]' : 'border-transparent group-hover:border-m3-primary'}`}>
                    <img src={currentUser?.avatar_url || 'logo.png'} className="w-full h-full object-cover" />
                  </div>
                  {currentUser?.role === 'admin' && (
                    <div className="absolute -bottom-0.5 -right-0.5 w-5 h-5 z-10 bg-slate-900 rounded-full border border-slate-800/50 p-0.5">
                      <img src="ve1rify.png" alt="Verified" className="w-full h-full object-contain drop-shadow-md" />
                    </div>
                  )}
                </div>
                <div className="flex flex-col items-center leading-none">
                  <span className="text-[9px] font-black text-slate-500 uppercase tracking-[0.1em] truncate w-16 text-center">{currentUser?.username?.split(' ')[0]}</span>
                  {currentUser?.username?.split(' ')[1] && (
                    <span className="text-[8px] font-bold text-slate-600 uppercase tracking-[0.05em] truncate w-16 text-center mt-0.5">{currentUser?.username?.split(' ')[1]}</span>
                  )}
                  <span className={`text-[7px] font-bold uppercase tracking-[0.2em] mt-1 ${currentUser?.role === 'admin' ? 'text-indigo-400/80' : 'text-brand-500/60'}`}>{currentUser?.role}</span>
                </div>
              </button>

              <button onClick={() => setCurrentUser(null)} className="w-10 h-10 flex items-center justify-center rounded-2xl text-red-400/60 hover:text-red-400 hover:bg-red-500/10 transition-all duration-300 mt-2" title="Logout">
                <MaterialIcon name="logout" className="text-xl" />
              </button>
            </div>
          </aside>

          <div className="flex-1 md:ml-20 flex flex-col min-h-screen relative z-10 overflow-x-hidden animate-fade-in delay-100">
            {/* Header */}
            <header className="px-6 py-6 md:px-12 md:py-8 flex justify-between items-center sticky top-0 bg-m3-surface/60 backdrop-blur-xl z-30" style={{ paddingTop: 'max(env(safe-area-inset-top), 1.5rem)' }}>
              <div className="flex items-center gap-4">
                <div className="md:hidden w-10 h-10 bg-m3-primaryContainer rounded-xl flex items-center justify-center text-m3-onPrimaryContainer shadow-md">
                  <img src="logo.png" className="w-6 h-6 object-contain" />
                </div>
                <div className="flex flex-col">
                  <h1 className="text-xl md:text-2xl font-black text-white m-0 tracking-tight">Vesak Lantern 2026</h1>
                  <p className="text-m3-primary text-[10px] md:text-xs font-bold tracking-[0.3em] uppercase opacity-80">Finance Control Center</p>
                </div>
              </div>

              <div className="flex items-center gap-2">
                {currentUser?.role === 'admin' && (
                  <div className="hidden sm:flex items-center gap-1.5 px-3 py-1.5 bg-indigo-500/10 border border-indigo-500/30 rounded-xl">
                    <div className="bg-slate-900 rounded-full border border-slate-800/50 p-0.5 flex items-center justify-center">
                      <img src="ve1rify.png" alt="Verified" className="w-3.5 h-3.5 object-contain" />
                    </div>
                    <span className="text-[10px] font-black text-indigo-400 uppercase tracking-widest">Admin</span>
                  </div>
                )}
                <button
                  onClick={() => { setIsNotificationModalOpen(true); setHasUnreadNotifications(false); }}
                  className="relative w-10 h-10 md:w-12 md:h-12 flex items-center justify-center rounded-2xl bg-m3-surfaceContainerHigh text-m3-onSurface hover:bg-white/10 transition-all"
                >
                  <MaterialIcon name="notifications" className={hasUnreadNotifications ? 'animate-bounce' : ''} />
                  {hasUnreadNotifications && <span className="absolute top-2 right-2 w-2.5 h-2.5 bg-red-500 rounded-full border-2 border-m3-surfaceContainerHigh"></span>}
                </button>

                <button onClick={() => setCurrentUser(null)} className="m3-button m3-button-tonal !h-10 md:!h-12 !px-4 md:!px-6 !rounded-2xl">
                  <MaterialIcon name="logout" className="text-red-400" />
                  <span className="hidden sm:inline">Logout</span>
                </button>
              </div>
            </header>

            <main
              className="flex-1 px-4 md:px-12 pb-32 md:pb-8"
              onTouchStart={handleTouchStart}
              onTouchEnd={handleTouchEnd}
            >
              <div className="animate-fade-in max-w-5xl mx-auto">
                {activeTab === 'profile' && <ProfileView currentUser={currentUser} incomes={incomes} expenses={expenses} userTotalContribution={userTotalContribution} balanceToPay={balanceToPay} users={users} projectSettings={projectSettings} onUpdateAccess={updateProjectAccess} />}
                {activeTab === 'dashboard' && <DashboardView incomes={incomes} expenses={expenses} setActiveTab={setActiveTab} currentUser={currentUser} userTotalContribution={userTotalContribution} balanceToPay={balanceToPay} users={users} onViewReceipt={setViewingReceipt} projectSettings={projectSettings} onUpdateAccess={updateProjectAccess} handleTabSwitch={handleTabSwitch} />}

                {activeTab === 'income-page' && (
                  <div className="space-y-8 animate-fade-in">
                    <IncomeForm currentUser={currentUser} users={users} projectSettings={projectSettings} onComplete={(data) => {
                      fetchData();
                      if (data) showNotification({
                        type: 'success',
                        title: 'Donation Added successfully!',
                        sTitle: 'ආධාර වාර්තාව සාර්ථකව එකතු කරන ලදි!',
                        details: [
                          { label: 'Name (නම)', value: data.name },
                          { label: 'Type (වර්ගය)', value: data.donation_type === 'Cash' ? 'Cash (මුදල්)' : 'Goods (ද්‍රව්‍ය)' },
                          { label: 'Amount/Qty (ප්‍රමාණය)', value: data.donation_type === 'Cash' ? formatCurrency(data.amount) : `${data.item_description} (x${data.quantity})` }
                        ]
                      });
                    }} />
                  </div>
                )}

                {activeTab === 'income-list' && (
                  <div className="space-y-8 animate-fade-in">
                    <IncomeList incomes={incomes} users={users} setActiveTab={setActiveTab} />
                  </div>
                )}

                {activeTab === 'event-income-list' && (
                  <div className="space-y-8 animate-fade-in">
                    <IncomeList incomes={incomes} users={users} setActiveTab={setActiveTab} eventOnly={true} />
                  </div>
                )}

                {activeTab === 'goods-list' && (
                  <div className="space-y-8 animate-fade-in">
                    <GoodsList incomes={incomes} users={users} setActiveTab={setActiveTab} />
                  </div>
                )}

                {activeTab === 'expense-page' && (
                  <div className="space-y-8 animate-fade-in">
                    <ExpenseForm currentUser={currentUser} users={users} projectSettings={projectSettings} showNotification={showNotification} onComplete={(data) => {
                      fetchData();
                      if (data) showNotification({
                        type: 'blue',
                        title: 'Expense Recorded successfully!',
                        sTitle: 'වියදම් වාර්තාව සාර්ථකව එකතු කරන ලදි!',
                        details: [
                          { label: 'Reason (හේතුව)', value: data.reason },
                          { label: 'Amount (මුදල)', value: formatCurrency(data.amount_taken) },
                          { label: 'Withdrawer (ලබාගත්තේ)', value: data.withdrawer_name }
                        ]
                      });
                    }} />
                  </div>
                )}

                {activeTab === 'expense-list' && (
                  <div className="space-y-8 animate-fade-in">
                    <ExpenseList expenses={expenses} onRefresh={fetchData} users={users} onViewReceipt={setViewingReceipt} setActiveTab={setActiveTab} />
                  </div>
                )}

                {activeTab === 'pledges' && <PromisedList incomes={incomes} onRefresh={fetchData} showNotification={showNotification} users={users} setActiveTab={setActiveTab} projectSettings={projectSettings} currentUser={currentUser} />}

                {activeTab === 'donations-view' && <DonationsView incomes={incomes} users={users} setActiveTab={setActiveTab} />}
              </div>

              {currentUser?.role === 'admin' && (
                <div className="text-center mt-12 mb-8 flex justify-center animate-fade-in">
                  <button
                    onClick={() => {
                      if (confirm("Are you sure you want to open Admin Panel? / ඇඩ්මින් පැනලය විවෘත කිරීමට ඔබට අවශ්‍ය බව සහතිකද?")) {
                        window.location.href = 'admin.html';
                      }
                    }}
                    className="m3-button m3-button-tonal !h-14 !rounded-2xl !px-8 border border-white/5 hover:border-m3-primary/30 shadow-xl group"
                  >
                    <MaterialIcon name="shield" className="text-m3-primary group-hover:scale-110 transition-transform" />
                    <span className="font-black uppercase tracking-widest text-xs">System Admin Portal</span>
                    <MaterialIcon name="chevron_right" />
                  </button>
                </div>
              )}
            </main>
          </div>

          {/* M3 Navigation Bar (Mobile) - Moved Outside Animated Container to Fix Scrolling Issue */}
          <footer className="md:hidden fixed bottom-0 left-0 right-0 glass-m3 border-t border-white/5 z-50 flex justify-around items-center px-4 pt-3 shadow-[0_-10px_40px_rgba(0,0,0,0.5)]" style={{ paddingBottom: 'max(env(safe-area-inset-bottom), 1.25rem)' }}>
            {[
              { id: 'dashboard', icon: 'dashboard', label: 'Home' },
              { id: 'income-page', icon: 'payments', label: 'Income' },
              { id: 'expense-page', icon: 'account_balance_wallet', label: 'Expense' },
              ...(currentUser?.role === 'admin'
                ? [{ id: 'admin-page', icon: 'shield', label: 'Admin', isLink: true }]
                : [{ id: 'pledges', icon: 'history', label: 'Pledges' }]),
              { id: 'profile', icon: 'person', label: 'Profile' }
            ].map(item => (
              <button
                key={item.id}
                onClick={() => {
                  if (item.isLink) {
                    if (confirm("Are you sure you want to open Admin Panel? / ඇඩ්මින් පැනලය විවෘත කිරීමට ඔබට අවශ්‍ය බව සහතිකද?")) {
                      window.location.href = 'admin.html';
                    }
                  } else {
                    setActiveTab(item.id);
                  }
                }}
                className={`flex flex-col items-center gap-1 flex-1 py-1 transition-all duration-300 ${activeTab === item.id ? 'text-m3-primary' : 'text-m3-outline'}`}
              >
                <div className={`w-12 h-8 rounded-full flex items-center justify-center transition-all ${activeTab === item.id ? 'bg-m3-secondaryContainer text-m3-onSecondaryContainer' : ''}`}>
                  <MaterialIcon name={item.icon} className={activeTab === item.id ? 'FILL' : ''} />
                </div>
                <span className="text-[10px] font-bold tracking-wider">{item.label}</span>
              </button>
            ))}
          </footer>

          {viewingReceipt && (
            <ReceiptModal
              url={typeof viewingReceipt === 'string' ? viewingReceipt : viewingReceipt.url}
              title={typeof viewingReceipt === 'string' ? 'Receipt / බිල්පත' : (viewingReceipt.title || 'Receipt / බිල්පත')}
              onClose={() => setViewingReceipt(null)}
            />
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').then(registration => {
          console.log('ServiceWorker registration successful');
        }).catch(err => {
          console.log('ServiceWorker registration failed: ', err);
        });
      });
    }
  </script>
</body>

</html>
