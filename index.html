        </div>
      );

      return (
        <div className="max-w-3xl mx-auto glass rounded-2xl p-8 border border-slate-800" id="income-page">
          <div className="flex justify-between items-end mb-6">
            <h2 className="text-2xl font-bold text-white flex flex-col">
              <span>Add New Donation</span>
              <span className="text-sm text-slate-400 font-normal mt-0.5">නව ආධාරයක් එකතු කරන්න - පියවර {step} / {totalSteps}</span>
            </h2>
          </div>
          <StepIndicator current={step} total={totalSteps} />

          {error && <div className="bg-red-500/20 text-red-300 p-3 rounded-lg mb-4 text-sm">{error}</div>}

          <form onSubmit={handleFormSubmit}>
            {step === 1 && (
              <div className="grid grid-cols-1 md:grid-cols-2 gap-x-6 animate-fade-in">
                <div className="flex flex-col gap-1.5 mb-4 md:col-span-2">
                  <label className="text-sm font-medium text-slate-300 flex flex-col gap-0.5 leading-tight">
                    <span>Donor Category *</span>
                    <span className="text-[10.5px] text-brand-400 opacity-90">ආධාරකරුගේ වර්ගය</span>
                  </label>
                  <div className="flex flex-wrap gap-4 mt-2">
                    <label className="flex items-center gap-2 cursor-pointer flex-col sm:flex-row bg-slate-900/50 p-2 px-4 rounded-lg border border-slate-800 hover:border-slate-700 transition">
                      <input type="radio" name="donor_category" value="Regular Donor" checked={formData.donor_category === 'Regular Donor'} onChange={(e) => setFormData({ ...formData, donor_category: e.target.value, name: '' })} className="text-brand-500 focus:ring-brand-500" />
                      <div className="flex flex-col text-center sm:text-left">
                        <span className="text-sm">Regular Donor</span>
                        <span className="text-[10px] text-slate-400">සාමාන්‍ය ආධාරකරු</span>
                      </div>
                    </label>
                    <label className="flex items-center gap-2 cursor-pointer flex-col sm:flex-row bg-slate-900/50 p-2 px-4 rounded-lg border border-slate-800 hover:border-slate-700 transition">
                      <input type="radio" name="donor_category" value="Main Donor" checked={formData.donor_category === 'Main Donor'} onChange={(e) => setFormData({ ...formData, donor_category: e.target.value, name: '' })} className="text-brand-500 focus:ring-brand-500" />
                      <div className="flex flex-col text-center sm:text-left">
                        <span className="text-sm">Main Donor</span>
                        <span className="text-[10px] text-slate-400">ප්‍රධාන ආධාරකරු</span>
                      </div>
                    </label>
                    <label className="flex items-center gap-2 cursor-pointer flex-col sm:flex-row bg-slate-900/50 p-2 px-4 rounded-lg border border-slate-800 hover:border-slate-700 transition">
                      <input type="radio" name="donor_category" value="Event Collection" checked={['Kuuduwa Open', 'Exhibition Box - Day 1', 'Exhibition Box - Day 2', 'Exhibition Box - Day 3', 'Exhibition Box - Day 4', 'Exhibition Box - Day 5'].includes(formData.donor_category)} onChange={(e) => setFormData({ ...formData, donor_category: 'Kuuduwa Open', name: '' })} className="text-brand-500 focus:ring-brand-500" />
                      <div className="flex flex-col text-center sm:text-left">
                        <span className="text-sm">Event Collections</span>
                        <span className="text-[10px] text-slate-400">උත්සව / පින්කැට</span>
                      </div>
                    </label>
                  </div>
                </div>

                {['Kuuduwa Open', 'Exhibition Box - Day 1', 'Exhibition Box - Day 2', 'Exhibition Box - Day 3', 'Exhibition Box - Day 4', 'Exhibition Box - Day 5'].includes(formData.donor_category) && (
                  <div className="flex flex-col gap-1.5 mb-4 md:col-span-2">
                    <label className="text-sm font-medium text-slate-300">Select Event / උත්සවය තෝරන්න</label>
                    <select
                      value={formData.donor_category}
                      onChange={(e) => setFormData({
                        ...formData,
                        donor_category: e.target.value,
                        name: e.target.value.includes('Exhibition Box') ? e.target.value : ''
                      })}
                      className="bg-slate-900 border border-slate-700 text-slate-300 text-sm rounded-lg p-2.5 outline-none focus:border-brand-500"
                    >
                      <option value="Kuuduwa Open">Kuuduwa Open (කූඩුව විවෘත කළ දින මුදල්)</option>
                      <option value="Exhibition Box - Day 1">Exhibition Day 1 Box (ප්‍රදර්ශන දිනය 1 - පින්කැටය)</option>
                      <option value="Exhibition Box - Day 2">Exhibition Day 2 Box (ප්‍රදර්ශන දිනය 2 - පින්කැටය)</option>
                      <option value="Exhibition Box - Day 3">Exhibition Day 3 Box (ප්‍රදර්ශන දිනය 3 - පින්කැටය)</option>
                      <option value="Exhibition Box - Day 4">Exhibition Day 4 Box (ප්‍රදර්ශන දිනය 4 - පින්කැටය)</option>
                      <option value="Exhibition Box - Day 5">Exhibition Day 5 Box (ප්‍රදර්ශන දිනය 5 - පින්කැටය)</option>
                    </select>
                  </div>
                )}

                {formData.donor_category === 'Main Donor' ? (
                  <div className="flex flex-col gap-1.5 mb-4 md:col-span-2">
                    <label className="text-sm font-medium text-slate-300">Select Main Donor / ප්‍රධාන ආධාරකරු තෝරන්න</label>
                    <div className="flex flex-wrap gap-4 mt-2">
                      {users && users.map(u => (
                        <div key={u.id} onClick={() => setFormData({ ...formData, name: u.username, phone_number: u.phone_number || '', address: u.address || '' })} className={`flex flex-col items-center cursor-pointer transition-all duration-300 ${formData.name === u.username ? 'scale-110 opacity-100' : 'opacity-50 hover:opacity-100 hover:scale-105'}`}>
                          <div className={`w-12 h-12 rounded-full overflow-hidden border-2 ${formData.name === u.username ? 'border-brand-500 shadow-[0_0_10px_rgba(34,197,94,0.5)]' : 'border-slate-700'}`}>
                            <img src={u.avatar_url || 'logo.png'} alt={u.username} className="w-full h-full object-cover" />
                          </div>
                          <span className="text-[10px] mt-1 text-slate-300 font-medium whitespace-nowrap">{u.username.split(' ')[0]}</span>
                        </div>
                      ))}
                    </div>
                  </div>
                ) : ['Exhibition Box - Day 1', 'Exhibition Box - Day 2', 'Exhibition Box - Day 3', 'Exhibition Box - Day 4', 'Exhibition Box - Day 5'].includes(formData.donor_category) ? null : (
                  <InputField label="Name" sLabel="නම" name="name" value={formData.name} onChange={handleChange} required />
                )}
                <InputField label="Phone Number" sLabel="දුරකථන අංකය (අත්‍යවශ්‍ය නොවේ)" name="phone_number" value={formData.phone_number} onChange={handleChange} />
                <div className="md:col-span-2">
                  <InputField label="Address" sLabel="ලිපිනය (අත්‍යවශ්‍ය නොවේ)" name="address" value={formData.address} onChange={handleChange} />
                </div>
                <InputField label="Date" sLabel="දිනය" type="date" name="date" value={formData.date} onChange={handleChange} required />
              </div>
            )}

            {step === 2 && (
              <div className="grid grid-cols-1 md:grid-cols-2 gap-x-6 animate-fade-in">
                <div className="flex flex-col gap-1.5 mb-4 md:col-span-2">
                  <label className="text-sm font-medium text-slate-300 flex flex-col gap-0.5 leading-tight">
                    <span>Donation Type *</span>
                    <span className="text-[10.5px] text-brand-400 opacity-90">ආධාර වර්ගය</span>
                  </label>
                  <div className="flex gap-4 mt-2">
                    <label className="flex items-center gap-2 cursor-pointer flex-col sm:flex-row bg-slate-900/50 p-2 px-4 rounded-lg border border-slate-800 hover:border-slate-700 transition">
                      <input type="radio" name="donation_type" value="Cash" checked={formData.donation_type === 'Cash'} onChange={handleChange} className="text-brand-500 focus:ring-brand-500" />
                      <div className="flex flex-col text-center sm:text-left">
                        <span className="text-sm">Cash</span>
                        <span className="text-[10px] text-slate-400">මුදල්</span>
                      </div>
                    </label>
                    <label className="flex items-center gap-2 cursor-pointer flex-col sm:flex-row bg-slate-900/50 p-2 px-4 rounded-lg border border-slate-800 hover:border-slate-700 transition">
                      <input type="radio" name="donation_type" value="Goods" checked={formData.donation_type === 'Goods'} onChange={handleChange} className="text-brand-500 focus:ring-brand-500" />
                      <div className="flex flex-col text-center sm:text-left">
                        <span className="text-sm">Goods</span>
                        <span className="text-[10px] text-slate-400">ද්‍රව්‍ය</span>
                      </div>
                    </label>
                  </div>
                </div>

                {formData.donation_type === 'Cash' && (
                  <div className="md:col-span-2 mb-4">
                    <InputField label="Amount (Rs)" sLabel="ප්‍රමාණය (රු)" type="number" name="amount" value={formData.amount} onChange={handleChange} required prefix="Rs." />
                    <div className="flex flex-wrap gap-2 mt-3">
                      {[500, 1000, 2000, 5000, 10000].map(val => (
                        <button
                          key={val}
                          type="button"
                          onClick={() => setFormData(prev => ({ ...prev, amount: val }))}
                          className={`px-4 py-2 rounded-xl text-[10px] font-black transition-all border ${formData.amount == val ? 'bg-brand-500 text-white border-brand-500 shadow-[0_0_15px_rgba(34,197,94,0.4)]' : 'bg-slate-900/50 border-slate-700 text-slate-400 hover:border-brand-500/50 hover:bg-slate-800'}`}
                        >
                          Rs. {val.toLocaleString()}
                        </button>
                      ))}
                    </div>
                  </div>
                )}

                {formData.donation_type === 'Goods' && (
                  <>
                    <div className="md:col-span-2">
                      <InputField label="Item Description" sLabel="ද්‍රව්‍ය විස්තරය" name="item_description" value={formData.item_description} onChange={handleChange} required />
                    </div>
                    <InputField label="Quantity" sLabel="ප්‍රමාණය" type="number" name="quantity" value={formData.quantity} onChange={handleChange} required />
                  </>
                )}
              </div>
            )}

            {step === 3 && (
              <div className="grid grid-cols-1 md:grid-cols-2 gap-x-6 animate-fade-in">
                <div className="flex flex-col gap-1.5 mb-4">
                  <label className="text-sm font-medium text-slate-300">Recorded By / වාර්තා කළේ</label>
                  <div className="bg-slate-900 border border-slate-700 text-slate-400 text-sm rounded-lg p-2.5 outline-none font-semibold flex items-center gap-2">
                    <ReporterBadge name={currentUser.username} users={users} showFullName={true} />
                  </div>
                </div>

                <div className="flex flex-col gap-1.5 mb-4 md:col-span-2">
                  <label className="text-sm font-medium text-slate-300 flex flex-col gap-0.5 leading-tight">
                    <span>Record Status *</span>
                    <span className="text-[10.5px] text-brand-400 opacity-90">තත්වය</span>
                  </label>
                  <div className="flex gap-4 mt-2">
                    <label className="flex items-center gap-2 cursor-pointer flex-col sm:flex-row bg-slate-900/50 p-2 px-4 rounded-lg border border-slate-800 hover:border-slate-700 transition">
                      <input type="radio" name="status" value="Received Today" checked={formData.status === 'Received Today'} onChange={handleChange} className="text-brand-500 focus:ring-brand-500" />
                      <div className="flex flex-col text-center sm:text-left">
                        <span className="text-sm text-brand-400 font-medium">Received Today</span>
                        <span className="text-[10px] text-slate-400">අද දිනයේ ලැබුණි</span>
                      </div>
                    </label>
                    <label className="flex items-center gap-2 cursor-pointer flex-col sm:flex-row bg-slate-900/50 p-2 px-4 rounded-lg border border-slate-800 hover:border-slate-700 transition">
                      <input type="radio" name="status" value="Promised" checked={formData.status === 'Promised'} onChange={handleChange} className="text-yellow-500 focus:ring-yellow-500" />
                      <div className="flex flex-col text-center sm:text-left">
                        <span className="text-sm text-yellow-400 font-medium">Promised (Pending)</span>
                        <span className="text-[10px] text-slate-400">පොරොන්දු වූ</span>
                      </div>
                    </label>
                  </div>
                </div>

                <div className="md:col-span-2 relative group">
                  <div className="flex justify-between items-center mb-1.5">
                    <label className="text-sm font-medium text-slate-300">Notes / Description (සටහන් / විස්තර)</label>
                    <button
                      type="button"
                      onClick={generateAIDescription}
                      className="bg-white hover:bg-slate-100 px-4 py-2 rounded-2xl border border-slate-200 transition-all flex items-center justify-center shadow-2xl active:scale-95 group gap-2"
                      title="Generate with Gemini AI"
                    >
                      <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/d/d9/Google_Gemini_logo_2025.svg/330px-Google_Gemini_logo_2025.svg.png" className="h-5 object-contain group-hover:scale-105 transition-transform" />
                    </button>
                  </div>
                  <textarea
                    name="description"
                    value={formData.description}
                    onChange={handleChange}
                    placeholder="Enter description or use suggestions below..."
                    className="w-full bg-slate-900 border border-slate-700 text-white rounded-xl p-4 text-sm focus:border-brand-500 outline-none min-h-[120px] transition-all"
                  />
                  <div className="flex flex-wrap gap-2 mt-3">
                    {SUGGESTIONS.map((s, idx) => (
                      <button
                        key={idx}
                        type="button"
                        onClick={() => setFormData(prev => ({ ...prev, description: prev.description ? prev.description + ' ' + s : s }))}
                        className="text-[9px] bg-slate-800/50 hover:bg-slate-700 text-slate-400 px-3 py-1.5 rounded-lg border border-slate-700/50 transition-all whitespace-nowrap"
                      >
                        + {s}
                      </button>
                    ))}
                  </div>
                </div>
              </div>
            )}

            <div className="flex gap-4 mt-8">
              {step > 1 && (
                <button type="button" onClick={() => setStep(step - 1)} className="m3-button m3-button-tonal flex-1">
                  Back / ආපසු
                </button>
              )}
              {step < totalSteps && (
                <button type="submit" className="flex-1 bg-brand-600/80 hover:bg-brand-500 text-white font-semibold py-4 px-6 rounded-lg transition-all duration-300 shadow-[0_0_15px_rgba(34,197,94,0.3)] m3-button m3-button-filled magnetic-button">
                  Next Step / මීලඟ පියවර
                </button>
              )}
              {step === totalSteps && (
                <button type="submit" disabled={loading} className="flex-1 bg-brand-600 hover:bg-brand-500 text-white font-semibold py-4 px-6 rounded-lg transition-all duration-300 shadow-[0_0_15px_rgba(34,197,94,0.4)] disabled:opacity-50 m3-button m3-button-filled magnetic-button">
                  {loading ? 'Saving...' : 'Save Record / සුරකින්න'}
                </button>
              )}
            </div>
          </form>
        </div>
      );
    }

    function ExpenseForm({ onComplete, currentUser, users, projectSettings, showNotification }) {
      const hasAccess = useMemo(() => {
        if (currentUser?.role === 'admin') return true;
        if (projectSettings?.allow_expense_entry === false) return false;
        const list = projectSettings?.expense_access_list;
        if (list && list.trim() !== '') {
          return list.split(',').includes(currentUser?.username);
        }
        return true;
      }, [currentUser, projectSettings]);

      if (!hasAccess) {
        return (
          <div className="max-w-3xl mx-auto glass rounded-2xl p-12 border border-slate-800 text-center animate-fade-in">
            <div className="w-20 h-20 bg-red-500/10 text-red-400 rounded-3xl flex items-center justify-center mx-auto mb-8">
              <svg className="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" /></svg>
            </div>
            <h2 className="text-2xl font-bold text-white mb-4">Access Restricted</h2>
            <p className="text-slate-400 leading-relaxed mb-0">මෙම අංශයට දත්ත ඇතුළත් කිරීමට ඔබට අවසර නොමැත.</p>
            <p className="text-slate-500 text-xs mt-2 italic">Please contact your system administrator for permission.</p>
          </div>
        );
      }

      const [step, setStep] = useState(1);
      const [selectedMainWithdrawers, setSelectedMainWithdrawers] = useState([]);
      const [showOtherWithdrawer, setShowOtherWithdrawer] = useState(false);
      const [otherWithdrawers, setOtherWithdrawers] = useState(['']);
      const totalSteps = 2;
      const [formData, setFormData] = useState({
        reason: '',
        date: new Date().toISOString().split('T')[0],
        time: new Date().toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' }),
        amount_taken: ''
      });
      const [receiptFile, setReceiptFile] = useState(null);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');

      const [sessionId] = useState(() => 'scan-' + Math.random().toString(36).substr(2, 9) + '-' + Date.now());
      const [remoteReceiptUrl, setRemoteReceiptUrl] = useState(null);
      const [remoteUploading, setRemoteUploading] = useState(false);

      useEffect(() => {
        if (!sessionId) return;

        const channel = supabase.channel(`remote-scan-${sessionId}`);

        channel.on('broadcast', { event: 'receipt-uploading' }, () => {
          setRemoteUploading(true);
        });

        channel.on('broadcast', { event: 'receipt-uploaded' }, (payload) => {
          setRemoteUploading(false);
          if (payload && payload.payload && payload.payload.receiptUrl) {
            setRemoteReceiptUrl(payload.payload.receiptUrl);
            if (showNotification) {
              showNotification({
                type: 'success',
                title: 'Receipt Synced!',
                sTitle: 'රිසිට්පත සාර්ථකව ලැබුණි.'
              });
            }
          }
        });

        channel.subscribe((status) => {
          console.log("Realtime subscribe status:", status);
        });

        return () => {
          supabase.removeChannel(channel);
        };
      }, [sessionId]);

      const handleChange = (e) => setFormData(prev => ({ ...prev, [e.target.name]: e.target.value }));

      const handleFormSubmit = async (e) => {
        e.preventDefault();
        if (step < totalSteps) {
          setStep(step + 1);
          return;
        }

        setLoading(true); setError('');

        try {
          let receipt_url = remoteReceiptUrl || null;

          if (receiptFile) {
            const fileExt = receiptFile.name.split('.').pop();
            const fileName = `${Math.random()}.${fileExt}`;
            const filePath = `${fileName}`;

            const { error: uploadError } = await supabase.storage.from('receipts').upload(filePath, receiptFile);
            if (uploadError) throw uploadError;

            const { data } = supabase.storage.from('receipts').getPublicUrl(filePath);
            receipt_url = data.publicUrl;
          }

          let allWithdrawers = [...selectedMainWithdrawers];
          if (showOtherWithdrawer) {
            allWithdrawers = [...allWithdrawers, ...otherWithdrawers.filter(n => n.trim() !== '')];
          }
          if (allWithdrawers.length === 0) {
            throw new Error("Please select or type at least one withdrawer.");
          }
          const finalWithdrawerName = allWithdrawers.join(', ');

          const payload = {
            reason: formData.reason,
            date: formData.date,
            time: formData.time,
            amount_taken: parseFloat(formData.amount_taken),
            withdrawer_name: finalWithdrawerName,
            receipt_url,
            reported_by: currentUser?.username,
            event_type: 'vesak'
          };

          const { data: dbData, error: dbErr } = await supabase.from('expenses').insert([payload]).select();
          if (dbErr) throw dbErr;

          const insertedRecord = dbData[0];

          // Add Notification Record
          const notifBody = `${payload.withdrawer_name} withdrew Rs. ${payload.amount_taken} for ${payload.reason}`;
          await supabase.from('notifications').insert([{
            title: 'New Expense Record',
            body: notifBody,
            type: 'expense',
            record_id: insertedRecord.id
          }]);

          if (typeof supabase.functions !== 'undefined') {
            supabase.functions.invoke('send_fcm_notification', {
              body: { record: { ...payload, reported_by: currentUser?.username }, type: 'INSERT' }
            }).catch(e => console.error("FCM invoke error:", e));
          }

          if (onComplete) onComplete(payload);
          setStep(1);
          setFormData({
            reason: '',
            date: new Date().toISOString().split('T')[0],
            time: new Date().toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' }),
            amount_taken: ''
          });
          setSelectedMainWithdrawers([]);
          setShowOtherWithdrawer(false);
          setOtherWithdrawers(['']);
          setReceiptFile(null);
          setRemoteReceiptUrl(null);
          // Only reset form natively to clear file input file selection
          e.target.reset();
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      };

      const StepIndicator = ({ current, total }) => (
        <div className="flex gap-2 mb-6">
          {Array.from({ length: total }).map((_, i) => (
            <div key={i} className={`h-2 flex-1 rounded-full transition-all duration-300 ${i + 1 <= current ? 'bg-red-500 shadow-[0_0_8px_rgba(239,68,68,0.5)]' : 'bg-slate-800'}`}></div>
          ))}
        </div>
      );

      return (
        <div className="max-w-3xl mx-auto glass rounded-2xl p-8 border border-slate-800" id="expense-page">
          <div className="flex justify-between items-end mb-6">
            <h2 className="text-2xl font-bold text-white flex flex-col">
              <span>Add New Expense</span>
              <span className="text-sm text-slate-400 font-normal mt-0.5">නව වියදමක් එකතු කරන්න - පියවර {step} / {totalSteps}</span>
            </h2>
          </div>
          <StepIndicator current={step} total={totalSteps} />

          {error && <div className="bg-red-500/20 text-red-300 p-3 rounded-lg mb-4 text-sm">{error}</div>}

          <form onSubmit={handleFormSubmit}>
            {step === 1 && (
              <div className="grid grid-cols-1 md:grid-cols-2 gap-x-6 animate-fade-in">
                <div className="md:col-span-2">
                  <InputField label="Reason for Expense" sLabel="වියදමට හේතුව" name="reason" value={formData.reason} onChange={handleChange} required />
                </div>
                <InputField label="Amount Taken (Rs)" sLabel="ලබාගත් මුදල (රු)" type="number" name="amount_taken" value={formData.amount_taken} onChange={handleChange} required prefix="Rs." />
                <div className="md:col-span-2 grid grid-cols-2 gap-x-6">
                  <InputField label="Date" sLabel="දිනය" type="date" name="date" value={formData.date} onChange={handleChange} required />
                  <InputField label="Time" sLabel="වේලාව" type="time" name="time" value={formData.time} onChange={handleChange} required />
                </div>
              </div>
            )}

            {step === 2 && (
              <div className="grid grid-cols-1 md:grid-cols-2 gap-x-6 animate-fade-in">
                <div className="md:col-span-2 mb-6">
                  <label className="text-sm font-medium text-slate-300 flex flex-col gap-0.5 leading-tight mb-3">
                    <span>Withdrawer Name(s) *</span>
                    <span className="text-[10.5px] text-brand-400 opacity-90">මුදල් ලබාගන්නාගේ නම (කිහිප දෙනෙක් වුවද තෝරාගත හැක)</span>
                  </label>
                  <div className="flex flex-wrap gap-4 mb-4">
                    {users && users.map(u => (
                      <div key={u.id} onClick={() => {
                        if (selectedMainWithdrawers.includes(u.username)) {
                          setSelectedMainWithdrawers(selectedMainWithdrawers.filter(n => n !== u.username));
                        } else {
                          setSelectedMainWithdrawers([...selectedMainWithdrawers, u.username]);
                        }
                      }} className={`flex flex-col items-center cursor-pointer transition-all duration-300 ${selectedMainWithdrawers.includes(u.username) ? 'scale-110 opacity-100' : 'opacity-50 hover:opacity-100 hover:scale-105'}`}>
                        <div className={`w-12 h-12 rounded-full overflow-hidden border-2 ${selectedMainWithdrawers.includes(u.username) ? 'border-red-500 shadow-[0_0_10px_rgba(239,68,68,0.5)]' : 'border-slate-700'}`}>
                          <img src={u.avatar_url || 'logo.png'} alt={u.username} className="w-full h-full object-cover" />
                        </div>
                        <span className="text-[10px] mt-1 text-slate-300 font-medium whitespace-nowrap">{u.username.split(' ')[0]}</span>
                      </div>
                    ))}
                    <div onClick={() => setShowOtherWithdrawer(!showOtherWithdrawer)} className={`flex flex-col items-center cursor-pointer transition-all duration-300 ${showOtherWithdrawer ? 'scale-110 opacity-100' : 'opacity-50 hover:opacity-100 hover:scale-105'}`}>
                      <div className={`w-12 h-12 rounded-full overflow-hidden border-2 bg-slate-800 flex items-center justify-center text-slate-300 ${showOtherWithdrawer ? 'border-red-500 shadow-[0_0_10px_rgba(239,68,68,0.5)]' : 'border-slate-700'}`}>
                        <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 4v16m8-8H4" /></svg>
                      </div>
                      <span className="text-[10px] mt-1 text-slate-300 font-medium">Other</span>
                    </div>
                  </div>

                  {showOtherWithdrawer && (
                    <div className="space-y-3 pl-2 border-l-2 border-slate-700 mt-4">
                      <label className="text-xs text-slate-400">Other Withdrawer Names (වෙනත් අයගේ නම්):</label>
                      {otherWithdrawers.map((name, idx) => (
                        <div key={idx} className="flex gap-2">
                          <input type="text" placeholder="Type name..." value={name} onChange={e => {
                            const newArr = [...otherWithdrawers];
                            newArr[idx] = e.target.value;
                            setOtherWithdrawers(newArr);
                          }} className="bg-slate-900 border border-slate-700 text-white text-sm rounded-lg p-2.5 outline-none flex-1 focus:border-red-500" />
                          {otherWithdrawers.length > 1 && (
                            <button type="button" onClick={() => setOtherWithdrawers(otherWithdrawers.filter((_, i) => i !== idx))} className="px-3 bg-slate-800 text-slate-400 rounded-lg hover:text-red-400 border border-slate-700 hover:border-red-500">
                              <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" /></svg>
                            </button>
                          )}
                        </div>
                      ))}
                      <button type="button" onClick={() => setOtherWithdrawers([...otherWithdrawers, ''])} className="text-xs text-brand-400 hover:text-brand-300 mt-2 font-medium">
                        + Add another person
                      </button>
                    </div>
                  )}
                </div>
                <div className="md:col-span-2 mt-6 border-t border-slate-800/60 pt-6">
                  <label className="text-sm font-bold text-white flex flex-col gap-0.5 leading-tight mb-4">
                    <span>Receipt / Bill Photo (Optional)</span>
                    <span className="text-xs text-slate-400 font-normal">රිසිට් / බිල්පත් ඡායාරූපය (මෙහිදී පරිගණකයෙන් හෝ ජංගම දුරකතනයෙන් සම්බන්ධ කල හැක)</span>
                  </label>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-6 items-stretch">
                    {/* Method 1: Local upload */}
                    <div className="glass-card rounded-2xl p-6 border border-slate-800/80 flex flex-col justify-center relative overflow-hidden group">
                      <div className="absolute top-0 right-0 -mr-8 -mt-8 w-24 h-24 rounded-full blur-[30px] bg-brand-500/5 transition-all duration-300 group-hover:bg-brand-500/10"></div>
                      <span className="text-xs font-bold text-brand-400 uppercase tracking-wider mb-3 block">Method 1: Direct Upload</span>
                      <p className="text-xs text-slate-400 mb-4 leading-relaxed">Select a file directly from this device / මෙම උපාංගයෙන් ගොනුවක් තෝරන්න.</p>

                      <input
                        type="file"
                        accept="image/*"
                        id="receipt-file-input"
                        disabled={!!remoteReceiptUrl}
                        onChange={(e) => {
                          setReceiptFile(e.target.files[0]);
                          if (e.target.files[0]) {
                            setRemoteReceiptUrl(null); // clear remote scan if local file chosen
                          }
                        }}
                        className="block w-full text-xs text-slate-400 file:mr-4 file:py-2 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-slate-800 file:text-brand-400 hover:file:bg-slate-700 transition cursor-pointer disabled:opacity-40 disabled:cursor-not-allowed"
                      />
                      {receiptFile && (
                        <div className="mt-3 flex items-center gap-2 text-xs text-brand-400 animate-fade-in font-bold">
                          <svg className="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.5} d="M5 13l4 4L19 7" /></svg>
                          <span>Local File Selected: {receiptFile.name}</span>
                        </div>
                      )}
                    </div>

                    {/* Method 2: Remote Scanner */}
                    <div className="glass-card rounded-2xl p-6 border border-slate-800/80 flex flex-col items-center justify-between relative overflow-hidden group">
                      <div className="absolute top-0 right-0 -mr-8 -mt-8 w-24 h-24 rounded-full blur-[30px] bg-indigo-500/5 transition-all duration-300 group-hover:bg-indigo-500/10"></div>
                      <div className="w-full">
                        <span className="text-xs font-bold text-indigo-400 uppercase tracking-wider mb-2 block">Method 2: Mobile QR Scanner</span>
                        <p className="text-xs text-slate-400 mb-3 leading-relaxed">No cable? Scan QR with phone to capture receipt instantly / දුරකතන කැමරාවෙන් ස්කෑන් කර රිසිට්පත එකතු කරන්න.</p>
                      </div>

                      {remoteUploading ? (
                        <div className="flex flex-col items-center justify-center py-6 animate-pulse">
                          <div className="w-10 h-10 rounded-full border-2 border-indigo-500 border-t-transparent animate-spin mb-3"></div>
                          <span className="text-xs text-indigo-400 font-bold tracking-wide">Phone is uploading...</span>
                          <span className="text-[10px] text-slate-500">දුරකතනය මඟින් රිසිට්පත උඩුගත වෙමින් පවතී...</span>
                        </div>
                      ) : remoteReceiptUrl ? (
                        <div className="w-full flex items-center gap-4 bg-slate-900/60 border border-slate-800 p-3 rounded-2xl animate-fade-in relative z-10">
                          <div className="w-16 h-16 rounded-xl overflow-hidden border border-slate-700 bg-slate-950 shrink-0">
                            <img src={remoteReceiptUrl} className="w-full h-full object-cover" />
                          </div>
                          <div className="flex-1 min-w-0">
                            <div className="flex items-center gap-1 text-emerald-400 font-extrabold text-xs">
                              <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.5} d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" /></svg>
                              <span>Synced Successfully!</span>
                            </div>
                            <p className="text-[10px] text-slate-400 truncate mt-0.5">රිසිට්පත සාර්ථකව සම්බන්ධ කරන ලදි!</p>
                            <button
                              type="button"
                              onClick={() => setRemoteReceiptUrl(null)}
                              className="text-[10px] text-red-400 hover:text-red-300 font-bold underline mt-1.5 block cursor-pointer"
                            >
                              Remove / ඉවත් කරන්න
                            </button>
                          </div>
                        </div>
                      ) : (
                        <div className="flex flex-col sm:flex-row items-center gap-4 w-full justify-center">
                          <div className="bg-white p-2 rounded-2xl shadow-lg border border-slate-800 shrink-0">
                            <img
                              src={`https://api.qrserver.com/v1/create-qr-code/?size=100x100&data=${encodeURIComponent(`${window.location.origin}${window.location.pathname}?action=remote-scan&session=${sessionId}`)}`}
                              alt="Scan to upload"
                              className="w-20 h-20"
                            />
                          </div>
                          <div className="text-center sm:text-left">
                            <span className="inline-flex items-center gap-1.5 px-2 py-0.5 bg-indigo-500/10 text-indigo-400 border border-indigo-500/30 rounded-full text-[9px] font-black uppercase tracking-wider mb-2">Live WebSocket Link</span>
                            <p className="text-[10px] text-slate-400 leading-normal max-w-[200px]">Scan with phone to open high-speed mobile receipt scanner / දුරකතනයෙන් ස්කෑන් කරන්න.</p>
                          </div>
                        </div>
                      )}
                    </div>
                  </div>
                </div>
              </div>
            )}

            <div className="flex gap-4 mt-8">
              {step > 1 && (
                <button type="button" onClick={() => setStep(step - 1)} className="m3-button m3-button-tonal flex-1">
                  Back / ආපසු
                </button>
              )}
              {step < totalSteps && (
                <button type="submit" className="flex-1 bg-red-600/80 hover:bg-red-500 text-white font-semibold py-4 px-6 rounded-lg transition-all duration-300 shadow-[0_0_15px_rgba(239,68,68,0.3)]">
                  Next Step / මීලඟ පියවර
                </button>
              )}
              {step === totalSteps && (
                <button type="submit" disabled={loading} className="flex-1 bg-red-600 hover:bg-red-500 text-white font-semibold py-4 px-6 rounded-lg transition-all duration-300 shadow-[0_0_15px_rgba(239,68,68,0.4)] disabled:opacity-50">
                  {loading ? 'Saving...' : 'Save Record / වියදම වාර්තා කරන්න'}
                </button>
              )}
            </div>
          </form>
        </div>
      );
    }

    function RemoteScannerView({ sessionId }) {
      const [cameraFile, setCameraFile] = useState(null);
      const [localPreview, setLocalPreview] = useState(null);
      const [compressing, setCompressing] = useState(false);
      const [uploading, setUploading] = useState(false);
      const [status, setStatus] = useState('idle'); // idle | reviewing | uploading | success | error
      const [errorMsg, setErrorMsg] = useState('');

      const channel = useMemo(() => supabase.channel(`remote-scan-${sessionId}`), [sessionId]);

      useEffect(() => {
        channel.subscribe((status) => {
          console.log("Scanner connected to channel status:", status);
        });
        return () => {
          supabase.removeChannel(channel);
        };
      }, [channel]);

      const compressImage = (file) => {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = (event) => {
            const img = new Image();
            img.onload = () => {
              const canvas = document.createElement('canvas');
              let width = img.width;
              let height = img.height;

              const maxDim = 1000;
              if (width > maxDim || height > maxDim) {
                if (width > height) {
                  height = Math.round((height * maxDim) / width);
                  width = maxDim;
                } else {
                  width = Math.round((width * maxDim) / height);
                  height = maxDim;
                }
              }

              canvas.width = width;
              canvas.height = height;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, width, height);

              canvas.toBlob((blob) => {
                if (blob) {
                  resolve(new File([blob], file.name || 'receipt.jpg', { type: 'image/jpeg' }));
                } else {
                  resolve(file);
                }
              }, 'image/jpeg', 0.75);
            };
            img.onerror = () => reject(new Error('Failed to load image for compression'));
            img.src = event.target.result;
          };
          reader.onerror = () => reject(new Error('Failed to read image file'));
          reader.readAsDataURL(file);
        });
      };

      const handleFileChange = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        setCameraFile(file);
        setLocalPreview(URL.createObjectURL(file));
        setStatus('reviewing');
        setErrorMsg('');
      };

      const handleUpload = async () => {
        if (!cameraFile) return;

        setStatus('uploading');
        setCompressing(true);
        setErrorMsg('');

        try {
          channel.send({
            type: 'broadcast',
            event: 'receipt-uploading',
            payload: {}
          });

          const compressed = await compressImage(cameraFile);
          setCompressing(false);
          setUploading(true);

          const fileExt = compressed.name.split('.').pop();
          const fileName = `remote-${Math.random().toString(36).substr(2, 9)}.${fileExt}`;
          const filePath = `${fileName}`;

          const { error: uploadError } = await supabase.storage
            .from('receipts')
            .upload(filePath, compressed);

          if (uploadError) throw uploadError;

          const { data } = supabase.storage.from('receipts').getPublicUrl(filePath);
          const receiptUrl = data.publicUrl;

          await channel.send({
            type: 'broadcast',
            event: 'receipt-uploaded',
            payload: { receiptUrl }
          });

          setStatus('success');
          if (typeof window.confetti === 'function') {
            window.confetti({ particleCount: 80, spread: 60, origin: { y: 0.8 } });
          }
        } catch (err) {
          console.error("Upload error:", err);
          setErrorMsg(err.message || 'Something went wrong during upload.');
          setStatus('error');
          channel.send({
            type: 'broadcast',
            event: 'receipt-uploaded',
            payload: { receiptUrl: null }
          });
        } finally {
          setCompressing(false);
          setUploading(false);
        }
      };

      const handleReset = () => {
        setCameraFile(null);
        setLocalPreview(null);
        setStatus('idle');
        setErrorMsg('');
      };

      return (
        <div className="min-h-screen bg-[#020617] text-white flex flex-col justify-between p-6 relative overflow-hidden font-sans">
          <div className="absolute top-1/4 left-1/2 -translate-x-1/2 w-[350px] h-[350px] bg-emerald-500/10 blur-[100px] rounded-full pointer-events-none"></div>

          <header className="flex flex-col items-center pt-8 relative z-10">
            <div className="w-14 h-14 bg-emerald-500/15 text-emerald-400 rounded-2xl flex items-center justify-center mb-3 shadow-[0_0_20px_rgba(16,185,129,0.1)] border border-emerald-500/20">
              <span className="material-symbols-rounded text-3xl">qr_code_scanner</span>
            </div>
            <h1 className="text-xl font-black tracking-tight text-white uppercase text-center leading-none">Remote Scanner</h1>
            <p className="text-[10px] text-emerald-400 font-extrabold uppercase tracking-[0.2em] mt-1">Quick Remote Scanner</p>
          </header>

          <main className="flex-1 flex flex-col items-center justify-center my-8 relative z-10 w-full max-w-sm mx-auto">
            {status === 'idle' && (
              <div className="glass-card w-full border border-slate-800/80 rounded-3xl p-8 text-center flex flex-col items-center gap-6 animate-fade-in shadow-2xl">
                <div className="w-20 h-20 bg-slate-900 border border-slate-800 rounded-full flex items-center justify-center text-slate-500 shadow-inner">
                  <span className="material-symbols-rounded text-4xl">photo_camera</span>
                </div>
                <div>
                  <h2 className="text-lg font-bold text-white mb-2">Capture receipt for PC Form</h2>
                  <p className="text-xs text-slate-400 leading-relaxed px-2">
                    Take a clear photo of the receipt/bill. It will automatically compress and sync to the expense form on your PC screen in real-time.
                  </p>
                  <p className="text-[11px] text-emerald-400/90 font-medium mt-2 italic">
                    රිසිට්පතෙහි පැහැදිලි ඡායාරූපයක් ගන්න. එය ස්වයංක්‍රීයව පරිගණකයට සම්බන්ධ වේ.
                  </p>
                </div>

                <label className="w-full flex items-center justify-center gap-2 bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-4 px-6 rounded-2xl transition cursor-pointer shadow-[0_10px_35px_rgba(16,185,129,0.3)] border border-emerald-500/20 active:scale-95 duration-150 text-sm">
                  <span className="material-symbols-rounded">camera_alt</span>
                  <span>Take Photo / ඡායාරූපයක් ගන්න</span>
                  <input type="file" accept="image/*" capture="environment" onChange={handleFileChange} className="hidden" />
                </label>
              </div>
            )}

            {status === 'reviewing' && (
              <div className="glass-card w-full border border-slate-800/80 rounded-3xl p-6 text-center flex flex-col items-center gap-6 animate-fade-in shadow-2xl">
                <span className="text-xs font-bold text-indigo-400 uppercase tracking-wider">Review Captured Photo</span>

                <div className="w-full aspect-[3/4] rounded-2xl overflow-hidden border border-slate-800 bg-slate-950 relative shadow-inner">
                  <img src={localPreview} className="w-full h-full object-contain" />
                </div>

                <div className="flex gap-4 w-full">
                  <button
                    onClick={handleReset}
                    className="flex-1 bg-slate-900 hover:bg-slate-800 text-slate-300 font-bold py-3.5 px-4 rounded-xl border border-slate-800 transition active:scale-95 text-xs"
                  >
                    Retake / නැවත ගන්න
                  </button>
                  <button
                    onClick={handleUpload}
                    className="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 px-4 rounded-xl border border-emerald-500/20 shadow-[0_5px_20px_rgba(16,185,129,0.2)] transition active:scale-95 text-xs"
                  >
                    Upload & Sync
                  </button>
                </div>
              </div>
            )}

            {status === 'uploading' && (
              <div className="glass-card w-full border border-slate-800/80 rounded-3xl p-8 text-center flex flex-col items-center gap-6 animate-fade-in shadow-2xl">
                <div className="relative py-8">
                  <div className="w-16 h-16 rounded-full border-4 border-emerald-500/20 border-t-emerald-400 animate-spin"></div>
                  <div className="absolute inset-0 flex items-center justify-center">
                    <span className="material-symbols-rounded text-emerald-400 text-2xl animate-pulse">cloud_upload</span>
                  </div>
                </div>
                <div className="space-y-2">
                  <h2 className="text-lg font-bold text-white">
                    {compressing ? 'Compressing Image...' : 'Uploading & Syncing...'}
                  </h2>
                  <p className="text-xs text-slate-400 leading-normal">
                    {compressing
                      ? 'Reducing image size for instant transfer / රිසිට්පතෙහි ප්‍රමාණය අඩු කරමින් පවතී...'
                      : 'Sending secure payload to PC screen / පරිගණකයට රිසිට්පත සම්බන්ධ කරමින් පවතී...'}
                  </p>
                </div>
              </div>
            )}

            {status === 'success' && (
              <div className="glass-card w-full border border-slate-800/80 rounded-3xl p-8 text-center flex flex-col items-center gap-6 animate-fade-in shadow-2xl">
                <div className="w-16 h-16 bg-emerald-500/10 text-emerald-400 rounded-full flex items-center justify-center shadow-[0_0_30px_rgba(16,185,129,0.2)] border border-emerald-500/20 animate-bounce">
                  <span className="material-symbols-rounded text-3xl font-extrabold">check</span>
                </div>
                <div className="space-y-2">
                  <h2 className="text-lg font-bold text-white">Receipt Synced Successfully!</h2>
                  <p className="text-xs text-slate-400 leading-relaxed">
                    The receipt image has been uploaded and linked to the form on your PC screen in real-time. You can now save the expense on your PC.
                  </p>
                  <p className="text-[11px] text-emerald-400/90 font-medium italic">
                    රිසිට්පත සාර්ථකව සම්බන්ධ කරන ලදි! දැන් ඔබට පරිගණකයෙන් වියදම් වාර්තාව සුරැකිය හැක.
                  </p>
                </div>

                <div className="w-full h-px bg-slate-800"></div>

                <button
                  onClick={handleReset}
                  className="w-full bg-slate-900 hover:bg-slate-800 text-slate-400 hover:text-white font-bold py-3.5 px-4 rounded-xl border border-slate-800 transition text-xs"
                >
                  Scan Another Receipt / තවත් රිසිට්පතක්
                </button>
              </div>
            )}

            {status === 'error' && (
              <div className="glass-card w-full border border-slate-800/80 rounded-3xl p-8 text-center flex flex-col items-center gap-6 animate-fade-in shadow-2xl">
                <div className="w-16 h-16 bg-red-500/10 text-red-400 rounded-full flex items-center justify-center border border-red-500/20">
                  <span className="material-symbols-rounded text-3xl">error_outline</span>
                </div>
                <div>
                  <h2 className="text-lg font-bold text-white mb-2">Upload Failed</h2>
                  <p className="text-xs text-red-300 font-bold mb-4 leading-normal">{errorMsg}</p>
                  <p className="text-xs text-slate-400 leading-relaxed">
                    An error occurred while uploading. Please ensure your device has internet access and try again.
                  </p>
                </div>
                <button
                  onClick={handleReset}
                  className="w-full bg-red-600 hover:bg-red-500 text-white font-bold py-3.5 px-4 rounded-xl transition text-xs shadow-lg active:scale-95"
                >
                  Try Again / නැවත උත්සාහ කරන්න
                </button>
              </div>
            )}
          </main>

          <footer className="text-center py-6 relative z-10 text-[9px] text-slate-600 font-bold uppercase tracking-[0.2em]">
            Vesak Finance Remote Scanner &copy; 2026
          </footer>
        </div>
      );
    }

    function PromisedList({ incomes, onRefresh, showNotification, users, setActiveTab, projectSettings, currentUser }) {
      const promised = incomes.filter(i => i.status === 'Promised');
      const totalPromisedCash = promised.filter(i => i.donation_type === 'Cash').reduce((sum, item) => sum + Number(item.amount || 0), 0);
      const [loadingId, setLoadingId] = useState(null);

      const hasAccess = useMemo(() => {
        if (currentUser?.role === 'admin') return true;
        if (projectSettings?.allow_pledge_entry === false) return false;
        const list = projectSettings?.pledge_access_list;
        if (list && list.trim() !== '') {
          return list.split(',').includes(currentUser?.username);
        }
        return true;
      }, [currentUser, projectSettings]);

      const confirmReceipt = async (id) => {
        if (!hasAccess) {
          alert("Unauthorized: You do not have permission to confirm pledges. / ඔබට මෙම ක්‍රියාව කිරීමට අවසර නොමැත.");
          return;
        }
        if (!window.confirm("Are you sure you received this donation? This will add it to the total balance.\nමෙම ආධාරය ලැබුණු බව තහවුරු කරනවාද?")) return;

        setLoadingId(id);
        try {
          const { error } = await supabase.from('incomes').update({ status: 'Received Today' }).eq('id', id);
          if (error) throw error;

          if (showNotification) {
            showNotification({
              type: 'success',
              title: 'Pledge Confirmed!',
              sTitle: 'ආධාරය තහවුරු කළා. මෙම මුදල මුළු ආදායමට එක්වී ඇත.'
            });
          }
          onRefresh();
        } catch (err) {
          if (showNotification) showNotification({ type: 'error', title: 'Error', sTitle: err.message });
          else alert("Error: " + err.message);
        } finally {
          setLoadingId(null);
        }
      };

      const handleCSV = () => {
        const headers = ["Date", "Name", "Phone", "Type", "Details", "Amount"];
        const rows = [headers, ...promised.map(p => [
          formatDate(p.date), p.name, p.phone_number || '-', p.donation_type,
          p.donation_type === 'Goods' ? p.item_description : p.donor_category,
          p.donation_type === 'Cash' ? p.amount : 'Goods'
        ])];
        exportToCSV("Pending_Pledges_Vesak", rows);
      };

      const handlePDF = () => {
        const headers = ["Date", "Name", "Details", "Type", "Amount"];
        const rows = promised.map(p => [
          formatDate(p.date), p.name,
          p.donation_type === 'Goods' ? p.item_description : p.donor_category,
          p.donation_type, p.donation_type === 'Cash' ? formatCurrency(p.amount) : 'Goods'
        ]);
        exportToPDF("Pending Pledges", headers, rows, "Pending_Pledges_Vesak");
      };

      return (
        <div className="glass rounded-2xl p-6 overflow-x-auto border border-slate-800">
          <button onClick={() => setActiveTab('dashboard')} className="mb-6 flex items-center gap-2 text-slate-400 hover:text-white transition group">
            <svg className="w-4 h-4 group-hover:-translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.5} d="M15 19l-7-7 7-7" /></svg>
            <span className="text-xs font-bold uppercase tracking-widest">Back to Dashboard</span>
          </button>
          <div className="flex flex-col sm:flex-row sm:items-center justify-between mb-6 gap-4">
            <h2 className="text-xl font-bold text-white flex flex-col">
              <span>Pending Pledges (Promised Donations)</span>
              <span className="text-sm text-slate-400 font-normal mt-0.5">පොරොන්දු වූ පරිත්‍යාග</span>
            </h2>
            <div className="flex flex-col sm:flex-row items-start sm:items-center gap-4">
              <div className="bg-yellow-500/10 border border-yellow-500/20 px-4 py-2 rounded-xl flex flex-col sm:items-end">
                <span className="text-xs text-yellow-500/70 font-semibold uppercase tracking-wider">Total Promised / පොරොන්දු මුදල</span>
                <span className="text-lg font-bold text-yellow-400">{formatCurrency(totalPromisedCash)}</span>
              </div>
              <ExportButtons onCsv={handleCSV} onPdf={handlePDF} />
            </div>
          </div>

          {promised.length === 0 ? (
            <div className="text-center py-10 text-slate-400 border border-dashed border-slate-700 rounded-xl flex flex-col">
              <span>No pending pledges found.</span>
              <span className="text-xs mt-1">පොරොන්දු වූ ආධාර කිසිවක් නොමැත</span>
            </div>
          ) : (
            <div className="overflow-x-auto min-w-full">
              <table className="w-full text-left text-sm text-slate-300 min-w-[700px]">
                <thead className="text-xs text-slate-400 uppercase bg-slate-900/50">
                  <tr>
                    <th className="px-4 py-3 rounded-tl-lg">Date <br /><span className="text-[9px] font-normal tracking-wide text-brand-400">දිනය</span></th>
                    <th className="px-4 py-3">Donor Name <br /><span className="text-[9px] font-normal tracking-wide text-brand-400">ආධාරකරුගේ නම</span></th>
                    <th className="px-4 py-3">Details <br /><span className="text-[9px] font-normal tracking-wide text-brand-400">විස්තර</span></th>
                    <th className="px-4 py-3 text-right">Amount <br /><span className="text-[9px] font-normal tracking-wide text-brand-400">මුදල / ද්‍රව්‍ය</span></th>
                    <th className="px-4 py-3 rounded-tr-lg text-center">Action <br /><span className="text-[9px] font-normal tracking-wide text-brand-400">ක්‍රියාව</span></th>
                  </tr>
                </thead>
                <tbody>
                  {promised.map(p => (
                    <tr key={p.id} className="border-b border-slate-800 hover:bg-slate-800/30 transition">
                      <td className="px-4 py-4 whitespace-nowrap">{formatDate(p.date)}</td>
                      <td className="px-4 py-4 font-medium text-slate-200">
                        <ReporterBadge name={p.name} users={users} showFullName={true} />
                        {p.phone_number && <span className="block text-xs text-slate-500 font-normal mt-1">{p.phone_number}</span>}
                      </td>
                      <td className="px-4 py-4 truncate max-w-xs">{p.donation_type === 'Goods' ? p.item_description + ` (x${p.quantity})` : p.donor_category}</td>
                      <td className="px-4 py-4 text-right font-semibold text-yellow-400 whitespace-nowrap">
                        {p.donation_type === 'Cash' ? formatCurrency(p.amount) : 'Goods'}
                      </td>
                      <td className="px-4 py-4 text-center">
                        <button onClick={() => confirmReceipt(p.id)} disabled={loadingId === p.id || !hasAccess} className="inline-flex items-center gap-1.5 px-3 py-2 bg-brand-500/20 text-brand-400 hover:bg-brand-500/30 border border-brand-500/50 rounded-lg transition text-xs font-semibold disabled:opacity-50">
                          <IconCheck />
                          <div className="flex flex-col text-left">
                            <span>{loadingId === p.id ? 'Confirming...' : 'Confirm'}</span>
                            {!loadingId && <span className="text-[9px] font-normal opacity-80">තහවුරු කරන්න</span>}
                          </div>
                        </button>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}
        </div>
      );
    }

    function NotificationToast({ show, data, onClose }) {
      if (!show || !data) return null;

      const isError = data.type === 'error';
      const isBlue = data.type === 'blue';
      const isReminder = data.type === 'reminder';
      // default / success → green

      const c = isError ? {
        border: 'border-red-500/40',
        bar: 'bg-red-500',
        icon: 'bg-red-500/20 text-red-400',
        accent: 'text-red-400',
        sub: 'text-red-300',
        btn: 'bg-red-600 hover:bg-red-500',
        glow: 'shadow-[0_25px_60px_rgba(239,68,68,0.35)]'
      } : isBlue ? {
        border: 'border-blue-500/40',
        bar: 'bg-blue-500',
        icon: 'bg-blue-500/20 text-blue-400',
        accent: 'text-blue-400',
        sub: 'text-blue-300',
        btn: 'bg-blue-600 hover:bg-blue-500',
        glow: 'shadow-[0_25px_60px_rgba(59,130,246,0.35)]'
      } : isReminder ? {
        border: 'border-yellow-500/40',
        bar: 'bg-yellow-500',
        icon: 'bg-yellow-500/20 text-yellow-400',
        accent: 'text-yellow-400',
        sub: 'text-yellow-300',
        btn: 'bg-yellow-600 hover:bg-yellow-500',
        glow: 'shadow-[0_25px_60px_rgba(234,179,8,0.35)]'
      } : {
        border: 'border-brand-500/40',
        bar: 'bg-brand-500',
        icon: 'bg-brand-500/20 text-brand-400',
        accent: 'text-brand-400',
        sub: 'text-brand-300',
        btn: 'bg-brand-600 hover:bg-brand-500',
        glow: 'shadow-[0_25px_60px_rgba(34,197,94,0.35)]'
      };

      const IconSvg = () => isError ? (
        <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
      ) : isReminder ? (
        <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" /></svg>
      ) : (
        <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={3} d="M5 13l4 4L19 7" /></svg>
      );

      return (
        <div
          className="fixed inset-0 z-[9999] flex items-center justify-center p-4"
          style={{ background: 'rgba(0,0,0,0.7)', backdropFilter: 'blur(6px)' }}
          onClick={onClose}
        >
          <style>{`
            @keyframes popupIn {
              0%   { opacity:0; transform: scale(0.75) translateY(30px); }
              100% { opacity:1; transform: scale(1)    translateY(0);    }
            }
            .popup-enter { animation: popupIn 0.35s cubic-bezier(0.34,1.56,0.64,1) both; }
          `}</style>

          <div
            className={`popup-enter relative w-full max-w-sm rounded-3xl bg-slate-900 border ${c.border} ${c.glow} overflow-hidden`}
            onClick={e => e.stopPropagation()}
          >
            {/* top color bar */}
            <div className={`absolute top-0 left-0 w-full h-1 ${c.bar}`}></div>
            {/* background glow blob */}
            <div className={`absolute -top-8 -right-8 w-40 h-40 rounded-full blur-3xl opacity-20 ${c.bar}`}></div>

            <div className="relative z-10 p-6 pt-8 flex flex-col items-center text-center">
              {/* close X */}
              <button onClick={onClose} className="absolute top-4 right-4 text-slate-500 hover:text-white transition p-1 rounded-full hover:bg-white/10">
                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" /></svg>
              </button>

              {/* icon circle */}
              <div className={`w-16 h-16 rounded-full flex items-center justify-center mb-4 ${c.icon} border border-current/20`}>
                <IconSvg />
              </div>

              {/* title */}
              <h3 className={`text-xl font-black tracking-tight ${c.accent}`}>{data.title}</h3>
              {data.sTitle && <p className={`text-[11px] mt-1 font-bold uppercase tracking-widest opacity-80 ${c.sub}`}>{data.sTitle}</p>}

              {/* details */}
              {data.details && data.details.length > 0 && (
                <div className="mt-4 w-full bg-slate-950/70 rounded-2xl p-4 border border-slate-800 text-left space-y-2">
                  {data.details.map((d, i) => (
                    <div key={i} className="flex justify-between items-start gap-3 border-b border-slate-800/50 last:border-0 pb-2 last:pb-0">
                      <span className="text-slate-400 text-xs font-semibold shrink-0">{d.label}</span>
                      <span className={`font-bold text-sm text-right break-all ${c.sub}`}>{d.value}</span>
                    </div>
                  ))}
                </div>
              )}

              {/* OK button */}
              <button
                onClick={onClose}
                className={`mt-5 w-full py-3.5 rounded-xl font-black text-sm uppercase tracking-widest transition-all text-white ${c.btn} active:scale-95 shadow-lg`}
              >
                OK / හරි
              </button>
            </div>
          </div>
        </div>
      );
    }

    function LoginScreen({ onLogin, onShowBalance, showNotification }) {
      const [users, setUsers] = useState([]);
      const [username, setUsername] = useState('');
      const [password, setPassword] = useState('');
      const [error, setError] = useState('');
      const [loading, setLoading] = useState(false);
      const [view, setView] = useState('login'); // 'login', 'change_password', 'forgot_password'
      const [newPassword, setNewPassword] = useState('');
      const [confirmPassword, setConfirmPassword] = useState('');
      const [currentUserData, setCurrentUserData] = useState(null);
      const [usePasswordFallback, setUsePasswordFallback] = useState(false);
      const [show2FAVerify, setShow2FAVerify] = useState(false);
      const [pendingUser, setPendingUser] = useState(null);
      const [userPasskeys, setUserPasskeys] = useState([]);
      const [showNewPassword, setShowNewPassword] = useState(false);
      const [showConfirmPassword, setShowConfirmPassword] = useState(false);

      const getPasswordStrength = (pass) => {
        let score = 0;
        if (!pass) return 0;
        if (pass.length >= 8) score++;
        if (/[A-Z]/.test(pass)) score++;
        if (/[a-z]/.test(pass)) score++;
        if (/\d/.test(pass)) score++;
        if (/[@$!%*?&]/.test(pass)) score++;
        return score;
      };

      const strengthData = [
        { label: 'None', color: 'bg-slate-800', text: 'text-slate-500' },
        { label: 'Weak', color: 'bg-red-500', text: 'text-red-400' },
        { label: 'Fair', color: 'bg-orange-500', text: 'text-orange-400' },
        { label: 'Good', color: 'bg-yellow-500', text: 'text-yellow-400' },
        { label: 'Strong', color: 'bg-brand-500', text: 'text-brand-400' },
        { label: 'Very Strong', color: 'bg-emerald-500', text: 'text-emerald-400' }
      ];

      const checkPassword = (pass, confirm) => ({
        length: pass.length >= 8 && pass.length <= 20,
        upperLower: /[A-Z]/.test(pass) && /[a-z]/.test(pass),
        numberSymbol: /\d/.test(pass) && /[@$!%*?&]/.test(pass),
        match: pass === confirm && pass.length > 0
      });


      useEffect(() => {
        fetchUsers();
      }, []);

      const fetchUsers = async () => {
        try {
          const { data, error } = await supabase.from('app_users').select('*');
          if (error) {
            if (error.message.includes('relation "public.app_users" does not exist')) {
              setError('Database setup required. Please ask Admin to run the SQL script.');
            } else {
              setError(error.message);
            }
          } else {
            setUsers(data || []);
          }
        } catch (err) {
          setError(err.message);
        }
      };

      const validatePassword = (pass) => {
        const regex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,20}$/;
        return regex.test(pass);
      };

      const fetchUserPasskeys = async (userId) => {
        const { data, error } = await supabase.from('user_passkeys').select('*').eq('user_id', userId);
        if (!error && data) setUserPasskeys(data);
        else setUserPasskeys([]);
      };

      useEffect(() => {
        if (username) {
          const user = users.find(u => u.username === username);
          if (user) fetchUserPasskeys(user.id);
        }
      }, [username, users]);

      const processLogin = (user) => {
        if (user.two_factor_enabled) {
          setPendingUser(user);
          setShow2FAVerify(true);
        } else {
          onLogin(user);
        }
      };


      const handleLogin = async (e) => {
        e.preventDefault();
        if (!username || !password) return setError("Please fill all fields");
        setLoading(true);
        setError('');

        try {
          const user = users.find(u => u.username === username);
          if (!user) {
            setError('User not found');
            setLoading(false);
            return;
          }

          const hashedInput = await hashPassword(password);
          if (user.password_hash !== password && user.password_hash !== hashedInput) {
            setError('Incorrect password');
            setLoading(false);
            return;
          }

          if (user.is_temp_password) {
            setCurrentUserData(user);
            setView('change_password');
            setLoading(false);
            return;
          }

          processLogin(user);
        } catch (err) {
          setError('Login failed: ' + err.message);
        } finally {
          setLoading(false);
        }
      };


      const handleFaceIdLogin = async () => {
        const user = users.find(u => u.username === username);
        if (!user || userPasskeys.length === 0) return;
        setLoading(true);
        setError('');
        try {
          const success = await authenticateWithFaceId(userPasskeys);
          if (success) {
            processLogin(user);
          } else {
            setError("Face ID verification failed.");
            setUsePasswordFallback(true);
          }
        } catch (err) {
          setError("Face ID error: " + err.message);
          setUsePasswordFallback(true);
        } finally {
          setLoading(false);
        }
      };


      const handleChangePassword = async (e) => {
        e.preventDefault();
        if (!validatePassword(newPassword)) {
          setError('Password must be 8-20 characters long, include uppercase, lowercase, numbers, and symbols.');
          return;
        }
        if (newPassword !== confirmPassword) {
          setError('Passwords do not match');
          return;
        }
        setLoading(true);
        try {
          const hashedNew = await hashPassword(newPassword);
          const { error: updateErr } = await supabase.from('app_users').update({
            password_hash: hashedNew,
            is_temp_password: false,
            reset_requested: false
          }).eq('id', currentUserData.id);

          if (updateErr) throw updateErr;

          showNotification({ type: 'success', title: 'Password Changed', sTitle: 'මුරපදය වෙනස් කරන ලදි' });
          onLogin({ ...currentUserData, password_hash: hashedNew, is_temp_password: false });
        } catch (err) {
          setError(err.message);
          setLoading(false);
        }
      };

      const handleForgotPassword = async (e) => {
        e.preventDefault();
        if (!username) return setError('Please select a username first');
        setLoading(true);
        try {
          const { error: reqErr } = await supabase.from('app_users').update({
            reset_requested: true
          }).eq('username', username);
          if (reqErr) throw reqErr;
          showNotification({ type: 'success', title: 'Request Sent', sTitle: 'ඇඩ්මින් වෙත යවන ලදි' });
          setView('login');
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="min-h-screen flex items-center justify-center p-4 relative">
          <div className="absolute inset-0 bg-brand-500/5 blur-[100px] pointer-events-none"></div>
          <div className="glass rounded-2xl p-8 max-w-sm w-full border border-slate-800 text-center relative z-10 animate-fade-in">
            <div className="w-16 h-16 rounded-2xl bg-[#0f172a] shadow-[0_0_15px_rgba(34,197,94,0.2)] border border-white/10 flex items-center justify-center mx-auto mb-6">
              <img src="logo.png" alt="Logo" className="w-[80%] h-[80%] object-contain" />
            </div>
            <h2 className="text-2xl font-bold text-white mb-2">System Login</h2>
            <p className="text-sm text-slate-400 mb-6">පද්ධතියට ඇතුල් වන්න</p>

            {error && <div className="bg-red-500/20 text-red-300 p-2 text-xs rounded mb-4">{error}</div>}

            {show2FAVerify && pendingUser && (
              <TwoFactorVerify
                secret={pendingUser.two_factor_secret}
                onVerify={() => onLogin(pendingUser)}
                onCancel={() => setShow2FAVerify(false)}
              />
            )}

            {view === 'login' && (
              <form onSubmit={handleLogin} className="space-y-4">

                <div className="flex flex-col gap-6 mb-8">
                  <div className="flex flex-wrap justify-center gap-5">
                    {users.filter(u => u.role !== 'admin').map(u => (
                      <div key={u.id} onClick={() => setUsername(u.username)} className={`flex flex-col items-center cursor-pointer transition-all duration-300 ${username === u.username ? 'scale-110 opacity-100' : 'opacity-60 hover:opacity-100 hover:scale-105'}`}>
                        <div className={`w-14 h-14 rounded-full overflow-hidden border-[3px] ${username === u.username ? 'border-brand-500 shadow-[0_0_15px_rgba(34,197,94,0.6)]' : 'border-slate-800'}`}>
                          <img src={u.avatar_url || 'logo.png'} alt={u.username} className="w-full h-full object-cover" />
                        </div>
                        <span className="text-[10px] mt-2 text-slate-300 font-bold tracking-wide">{u.username.split(' ')[0]}</span>
                      </div>
                    ))}
                  </div>
                  {users.some(u => u.role === 'admin') && (
                    <div className="flex flex-wrap justify-center gap-5 pt-5 border-t border-white/5 relative">
                      <span className="absolute -top-2 bg-[#0f172a] px-3 text-[8px] font-black tracking-widest uppercase text-brand-400/50 rounded-full">System Admins</span>
                      {users.filter(u => u.role === 'admin').map(u => (
                        <div key={u.id} onClick={() => setUsername(u.username)} className={`flex flex-col items-center cursor-pointer transition-all duration-300 ${username === u.username ? 'scale-110 opacity-100' : 'opacity-60 hover:opacity-100 hover:scale-105'}`}>
                          <div className={`w-14 h-14 rounded-full overflow-hidden border-[3px] ${username === u.username ? 'border-brand-500 shadow-[0_0_15px_rgba(34,197,94,0.6)]' : 'border-slate-800'}`}>
                            <img src={u.avatar_url || 'logo.png'} alt={u.username} className="w-full h-full object-cover" />
                          </div>
                          <span className="text-[10px] mt-2 text-brand-400 font-bold tracking-wide">{u.username.split(' ')[0]}</span>
                        </div>
                      ))}
                    </div>
                  )}
                </div>

                {username && (() => {
                  const selectedUser = users.find(u => u.username === username);
                  const hasPasskeys = userPasskeys.length > 0;

                  if (hasPasskeys && !usePasswordFallback) {
                    return (
                      <div className="animate-fade-in space-y-4">
                        <div className="flex justify-center mb-2">
                          {selectedUser.is_temp_password ? (
                            <span className="px-3 py-1 bg-amber-500/10 text-amber-500 border border-amber-500/30 rounded-full text-[9px] font-bold uppercase tracking-wider flex items-center gap-1.5">
                              <MaterialIcon name="warning" className="text-xs" /> Temporary Password
                            </span>
                          ) : (
                            <span className="px-3 py-1 bg-brand-500/10 text-brand-400 border border-brand-500/30 rounded-full text-[9px] font-bold uppercase tracking-wider flex items-center gap-1.5">
                              <MaterialIcon name="verified_user" className="text-xs" /> Secure Account
                            </span>
                          )}
                        </div>
                        <button type="button" onClick={handleFaceIdLogin} disabled={loading} className="w-full flex items-center justify-center gap-2 bg-slate-800 hover:bg-slate-700 text-white font-semibold py-4 rounded-xl transition border border-slate-600 disabled:opacity-50 m3-button m3-button-tonal">
                          <svg className="w-5 h-5 text-brand-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 11c0 3.517-1.009 6.799-2.753 9.571m-3.44-2.04l.054-.09A13.916 13.916 0 008 11a4 4 0 118 0c0 1.017-.07 2.019-.203 3m-2.118 6.844A21.88 21.88 0 0015.171 17m3.839 1.132c.645-2.266.99-4.659.99-7.132A8 8 0 008 4.07M3 15.364c.64-1.319 1-2.8 1-4.364 0-1.457.39-2.823 1.07-4" /></svg>
                          {loading ? 'Verifying...' : `Login with Passkey (${userPasskeys.length})`}
                        </button>
                        <button type="button" onClick={() => setUsePasswordFallback(true)} className="text-xs text-slate-400 hover:text-slate-300 w-full pt-2">
                          Use Password Instead
                        </button>
                      </div>
                    );
                  }

                  return (
                    <div className="animate-fade-in space-y-4">
                      <div className="flex justify-center mb-2">
                        {selectedUser.is_temp_password ? (
                          <span className="px-3 py-1 bg-amber-500/10 text-amber-500 border border-amber-500/30 rounded-full text-[9px] font-bold uppercase tracking-wider flex items-center gap-1.5">
                            <MaterialIcon name="warning" className="text-xs" /> Temporary Password
                          </span>
                        ) : (
                          <span className="px-3 py-1 bg-brand-500/10 text-brand-400 border border-brand-500/30 rounded-full text-[9px] font-bold uppercase tracking-wider flex items-center gap-1.5">
                            <MaterialIcon name="verified_user" className="text-xs" /> Secure Account
                          </span>
                        )}
                      </div>
                      <input type="text" name="username" value={username} readOnly className="hidden" autoComplete="username" />
                      <input
