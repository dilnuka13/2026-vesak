    <script type="text/babel" data-type="module" data-presets="react,env">
        const { useState, useEffect, useMemo, useRef } = React;

        const SUPABASE_URL = 'https://yqpkgybmjdovdnmekpnw.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlxcGtneWJtamRvdmRubWVrcG53Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY1MjUwMjAsImV4cCI6MjA5MjEwMTAyMH0.7C9jv1_zDRxSMCgs0tWfiNUGXGOkCLz5RE0CCDoc_yA';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const normalizeEventType = (record) => (!record?.event_type || record.event_type === 'vesak') ? 'vesak' : 'poson';

        const getRelativeAssetPath = (filename) => {
          const path = window.location.pathname;
          if (path.includes('/CLONE/') || path.includes('/clone/')) {
            return `../${filename}`;
          }
          return `./${filename}`;
        };

        const SafeImage = ({ src, alt = '', className = '', onClick, iconClassName = 'text-lg' }) => {
          const [failed, setFailed] = useState(false);
          useEffect(() => { setFailed(false); }, [src]);
          if (!src || failed) {
            return (
              <div className={`flex items-center justify-center bg-slate-800 text-slate-500 ${className}`} onClick={onClick} role={onClick ? 'button' : undefined}>
                <span className="material-symbols-rounded" style={{ fontSize: 'inherit' }}>image_not_supported</span>
              </div>
            );
          }
          return (
            <img src={src} alt={alt} className={className} onClick={onClick} onError={() => setFailed(true)} loading="lazy" />
          );
        };

        const MaterialIcon = ({ name, className = '' }) => (
            <span className={`material-symbols-rounded ${className}`} style={{ fontSize: 'inherit', display: 'inline-block', verticalAlign: 'middle' }}>{name}</span>
        );

        // Toast Notification System
        window.showToast = (message, type = 'success') => {
            const existing = document.getElementById('toast-overlay');
            if (existing) existing.remove();
            
            const overlay = document.createElement('div');
            overlay.id = 'toast-overlay';
            overlay.className = 'fixed top-4 right-4 z-[99999] flex items-center gap-3 p-4 rounded-xl shadow-2xl transition-all duration-300 transform translate-y-0 opacity-100 border border-white/10';
            overlay.style.background = type === 'success' ? '#16a34a' : '#dc2626';
            overlay.style.color = '#fff';
            overlay.innerHTML = `
                <span class="material-symbols-rounded">${type === 'success' ? 'check_circle' : 'error'}</span>
                <span class="text-sm font-bold">${message}</span>
            `;
            document.body.appendChild(overlay);
            setTimeout(() => {
                overlay.style.opacity = '0';
                overlay.style.transform = 'translateY(-20px)';
                setTimeout(() => overlay.remove(), 300);
            }, 3000);
        };

        // Hashing fallback for local security contexts
        const hashPassword = async (password) => {
          try {
            if (!window.crypto || !window.crypto.subtle) {
              console.warn("Secure context not detected. Using a fallback.");
              return btoa(password);
            }
            const msgUint8 = new TextEncoder().encode(password);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgUint8);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
          } catch (err) {
            console.error("Hash Error:", err);
            return btoa(password);
          }
        };

        const exportToCSV = (filename, rows) => {
          const csvContent = "\uFEFF" + rows.map(r => r.map(cell => {
            if (cell === null || cell === undefined) return '""';
            return `"${cell.toString().replace(/"/g, '""')}"`;
          }).join(",")).join("\n");
          const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
          const url = URL.createObjectURL(blob);
          const link = document.createElement("a");
          link.setAttribute("href", url);
          link.setAttribute("download", filename + ".csv");
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
        };

        const exportToPDF = (title, columns, dataRows, filename) => {
          const { jsPDF } = window.jspdf;
          const doc = new jsPDF();
          doc.setFontSize(16);
          doc.text(title, 14, 22);
          doc.autoTable({
            startY: 30,
            head: [columns],
            body: dataRows,
            theme: 'grid',
            styles: { font: 'helvetica', fontSize: 9 },
            headStyles: { fillColor: [34, 197, 94] }
          });
          doc.save(filename + ".pdf");
        };

        // Input Component
        const InputField = ({ label, type="text", name, value, onChange, options, required, prefix, autoComplete }) => (
            <div className="flex flex-col gap-1.5 mb-5 w-full group text-left">
                <label className="text-[10px] font-black text-slate-400 group-focus-within:text-brand-400 uppercase tracking-widest ml-1.5 transition-colors duration-300">
                    {label} {required && <span className="text-red-500">*</span>}
                </label>
                {type === 'textarea' ? (
                    <textarea 
                        name={name}
                        value={value || ''} 
                        onChange={onChange} 
                        required={required} 
                        className="bg-slate-950/40 border border-slate-800 hover:border-slate-700 focus:border-brand-500/80 text-white text-sm rounded-2xl p-3.5 outline-none h-28 transition-all duration-300 focus:ring-4 focus:ring-brand-500/10 placeholder:text-slate-600 backdrop-blur-md"
                    ></textarea>
                ) : type === 'select' ? (
                    <div className="relative">
                        <select 
                            name={name}
                            value={value || ''} 
                            onChange={onChange} 
                            required={required} 
                            className="bg-slate-950/40 border border-slate-800 hover:border-slate-700 focus:border-brand-500/80 text-white text-sm rounded-2xl p-3.5 pr-10 outline-none transition-all duration-300 focus:ring-4 focus:ring-brand-500/10 appearance-none cursor-pointer w-full backdrop-blur-md"
                        >
                            <option value="" className="bg-slate-950">Select Option</option>
                            {options && options.map(o => (
                                typeof o === 'object' 
                                    ? <option key={o.value} value={o.value} className="bg-slate-950">{o.label}</option> 
                                    : <option key={o} value={o} className="bg-slate-950">{o}</option>
                            ))}
                        </select>
                        <div className="absolute inset-y-0 right-0 pr-4 flex items-center pointer-events-none text-slate-500 group-focus-within:text-brand-400 transition-colors duration-300">
                            <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M19 9l-7 7-7-7" /></svg>
                        </div>
                    </div>
                ) : (
                    <div className="relative">
                        {prefix && (
                            <div className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                <span className="text-slate-500 text-sm font-bold group-focus-within:text-brand-400 transition-colors duration-300">{prefix}</span>
                            </div>
                        )}
                        <input 
                            type={type} 
                            name={name}
                            value={value || ''} 
                            onChange={onChange} 
                            required={required} 
                            autoComplete={autoComplete}
                            className={`bg-slate-950/40 border border-slate-800 hover:border-slate-700 focus:border-brand-500/80 text-white text-sm rounded-2xl p-3.5 outline-none transition-all duration-300 focus:ring-4 focus:ring-brand-500/10 w-full backdrop-blur-md ${prefix ? 'pl-12' : ''}`} 
                        />
                    </div>
                )}
            </div>
        );

        // Modal Component
        const Modal = ({ title, children, onClose }) => (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm animate-fade-in">
                <div className="glass-card rounded-[2rem] p-6 sm:p-8 w-full max-w-2xl max-h-[90vh] overflow-y-auto relative animate-scale-in">
                    <button onClick={onClose} className="absolute top-6 right-6 w-10 h-10 flex items-center justify-center bg-slate-800/50 hover:bg-red-500/20 text-slate-400 hover:text-red-400 rounded-full transition-all text-xl">&times;</button>
                    <h2 className="text-2xl font-bold text-white mb-6 border-b border-white/10 pb-4 text-left">{title}</h2>
                    {children}
                </div>
            </div>
        );

        // User Avatar Badge
        const ReporterBadge = ({ name, users, showFullName = false }) => {
          if (!name) return null;
          const user = users?.find(u => {
             const firstWord = u.username.split(' ')[0].toLowerCase();
             return name.toLowerCase().includes(firstWord) || u.username.toLowerCase() === name.toLowerCase();
          });
          const displayName = showFullName ? name : name.split(' ')[0];
          return (
            <div className="flex items-center gap-1.5 inline-flex">
              {user?.avatar_url ? (
                <div className="w-5 h-5 rounded-full overflow-hidden border border-slate-600 shrink-0 shadow-sm">
                  <SafeImage src={user.avatar_url} alt="" className="w-full h-full object-cover" iconClassName="text-[10px]" />
                </div>
              ) : (
                <div className="w-5 h-5 rounded-full bg-slate-800 flex items-center justify-center border border-slate-600 shrink-0 shadow-sm text-slate-400">
                  <svg className="w-3 h-3" fill="currentColor" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                </div>
              )}
              <span className={`font-medium text-slate-300 ${showFullName ? 'text-sm' : 'text-xs whitespace-nowrap'}`}>{displayName}</span>
            </div>
          );
        };

        // Charts
        const SimpleChart = ({ income, expense }) => {
          const max = Math.max(income, expense, 1);
          const incomePct = (income / max) * 100;
          const expensePct = (expense / max) * 100;

          return (
            <div className="glass-card p-6 rounded-[2rem] flex flex-col justify-center border border-white/5 bg-slate-900/40 text-left">
              <h3 className="text-sm font-bold mb-6 flex flex-col gap-1 text-white uppercase tracking-wider">
                <span>Overall Income vs Expenses</span>
                <span className="text-[10px] text-slate-500 font-normal normal-case">සමස්ථ ආදායම් සහ වියදම්</span>
              </h3>
              <div className="flex flex-col gap-6 w-full">
                <div>
                  <div className="flex justify-between items-end mb-2">
                    <span className="text-xs font-semibold text-slate-300">Total Valid Income</span>
                    <span className="text-sm font-bold text-brand-400">Rs. {Math.round(income).toLocaleString()}</span>
                  </div>
                  <div className="w-full bg-slate-950 rounded-full h-3 overflow-hidden border border-white/5">
                    <div className="bg-brand-500 h-full rounded-full transition-all duration-1000" style={{ width: `${incomePct}%` }}></div>
                  </div>
                </div>
                <div>
                  <div className="flex justify-between items-end mb-2">
                    <span className="text-xs font-semibold text-slate-300">Total Expenses</span>
                    <span className="text-sm font-bold text-red-400">Rs. {Math.round(expense).toLocaleString()}</span>
                  </div>
                  <div className="w-full bg-slate-950 rounded-full h-3 overflow-hidden border border-white/5">
                    <div className="bg-red-500 h-full rounded-full transition-all duration-1000" style={{ width: `${expensePct}%` }}></div>
                  </div>
                </div>
              </div>
            </div>
          );
        };

        const TodayStatsChart = ({ incomes, expenses }) => {
          const today = new Date().toISOString().split('T')[0];
          const todayIncome = incomes.filter(i => i.date === today && i.status === 'Received Today' && i.donation_type === 'Cash').reduce((sum, i) => sum + Number(i.amount || 0), 0);
          const todayExpense = expenses.filter(e => e.date === today).reduce((sum, e) => sum + Number(e.amount_taken || 0), 0);

          const max = Math.max(todayIncome, todayExpense, 1);
          const incPct = (todayIncome / max) * 100;
          const expPct = (todayExpense / max) * 100;

          return (
            <div className="glass-card p-6 rounded-[2rem] flex flex-col justify-center border border-white/5 bg-slate-900/40 text-left">
              <h3 className="text-sm font-bold mb-6 flex flex-col gap-1 text-white uppercase tracking-wider">
                <span>Today's Overview</span>
                <span className="text-[10px] text-slate-500 font-normal normal-case">අද දින සාරාංශය</span>
              </h3>
              <div className="flex flex-col gap-6 w-full">
                <div>
                  <div className="flex justify-between items-end mb-2">
                    <span className="text-xs font-semibold text-slate-300">Today's Income</span>
                    <span className="text-sm font-bold text-brand-400">Rs. {Math.round(todayIncome).toLocaleString()}</span>
                  </div>
                  <div className="w-full bg-slate-950 rounded-full h-3 overflow-hidden border border-white/5">
                    <div className="bg-brand-500 h-full rounded-full transition-all duration-1000" style={{ width: `${incPct}%` }}></div>
                  </div>
                </div>
                <div>
                  <div className="flex justify-between items-end mb-2">
                    <span className="text-xs font-semibold text-slate-300">Today's Expenses</span>
                    <span className="text-sm font-bold text-red-400">Rs. {Math.round(todayExpense).toLocaleString()}</span>
                  </div>
                  <div className="w-full bg-slate-950 rounded-full h-3 overflow-hidden border border-white/5">
                    <div className="bg-red-500 h-full rounded-full transition-all duration-1000" style={{ width: `${expPct}%` }}></div>
                  </div>
                </div>
              </div>
            </div>
          );
        };

        const LastWeekStatsChart = ({ incomes, expenses }) => {
          const todayDate = new Date();
          const lastWeekDate = new Date();
          lastWeekDate.setDate(todayDate.getDate() - 6);

          const todayStr = todayDate.toISOString().split('T')[0];
          const lastWeekStr = lastWeekDate.toISOString().split('T')[0];

          const lastWeekIncome = incomes.filter(i => {
            if (i.status !== 'Received Today' || i.donation_type !== 'Cash') return false;
            return i.date >= lastWeekStr && i.date <= todayStr;
          }).reduce((sum, i) => sum + Number(i.amount || 0), 0);

          const lastWeekExpense = expenses.filter(e => {
            return e.date >= lastWeekStr && e.date <= todayStr;
          }).reduce((sum, e) => sum + Number(e.amount_taken || 0), 0);

          const max = Math.max(lastWeekIncome, lastWeekExpense, 1);
          const incPct = (lastWeekIncome / max) * 100;
          const expPct = (lastWeekExpense / max) * 100;

          return (
            <div className="glass-card p-6 rounded-[2rem] flex flex-col justify-center border border-white/5 bg-slate-900/40 text-left">
              <h3 className="text-sm font-bold mb-6 flex flex-col gap-1 text-white uppercase tracking-wider">
                <span>Last 7 Days</span>
                <span className="text-[10px] text-slate-500 font-normal normal-case">පසුගිය දින 7 සාරාංශය</span>
              </h3>
              <div className="flex flex-col gap-6 w-full">
                <div>
                  <div className="flex justify-between items-end mb-2">
                    <span className="text-xs font-semibold text-slate-300">Income (ආදායම)</span>
                    <span className="text-sm font-bold text-brand-400">Rs. {Math.round(lastWeekIncome).toLocaleString()}</span>
                  </div>
                  <div className="w-full bg-slate-950 rounded-full h-3 overflow-hidden border border-white/5">
                    <div className="bg-brand-500 h-full rounded-full transition-all duration-1000" style={{ width: `${incPct}%` }}></div>
                  </div>
                </div>
                <div>
                  <div className="flex justify-between items-end mb-2">
                    <span className="text-xs font-semibold text-slate-300">Expenses (වියදම්)</span>
                    <span className="text-sm font-bold text-red-400">Rs. {Math.round(lastWeekExpense).toLocaleString()}</span>
                  </div>
                  <div className="w-full bg-slate-950 rounded-full h-3 overflow-hidden border border-white/5">
                    <div className="bg-red-500 h-full rounded-full transition-all duration-1000" style={{ width: `${expPct}%` }}></div>
                  </div>
                </div>
              </div>
            </div>
          );
        };

        const DailyBarChart = ({ incomes, expenses }) => {
          const [offsetDays, setOffsetDays] = useState(0);
          const [selectedDetails, setSelectedDetails] = useState(null);
          const chartRef = useRef(null);

          const days = [];
          for (let i = 6; i >= 0; i--) {
            const d = new Date();
            d.setDate(d.getDate() - (i + offsetDays));
            days.push(d.toISOString().split('T')[0]);
          }

          const data = days.map(day => {
            const dayIncomes = incomes.filter(i => i.date === day && i.status === 'Received Today' && i.donation_type === 'Cash');
            const dayExpenses = expenses.filter(e => e.date === day);
            const dayGoods = incomes.filter(i => i.date === day && i.status === 'Received Today' && i.donation_type === 'Goods');

            const inc = dayIncomes.reduce((sum, item) => sum + Number(item.amount || 0), 0);
            const exp = dayExpenses.reduce((sum, item) => sum + Number(item.amount_taken || 0), 0);
            const dObj = new Date(day);
            const label = dObj.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
            return { date: day, label, inc, exp, dayIncomes, dayExpenses, dayGoods };
          });

          const maxVal = Math.max(...data.map(d => Math.max(d.inc, d.exp)), 100);
          const svgWidth = 700;
          const svgHeight = 250;
          const margin = { top: 20, right: 20, bottom: 30, left: 60 };
          const chartWidth = svgWidth - margin.left - margin.right;
          const chartHeight = svgHeight - margin.top - margin.bottom;

          const formatYAxis = (val) => {
            if (val >= 100000) return (val / 100000).toFixed(1) + 'L';
            if (val >= 1000) return (val / 1000).toFixed(0) + 'k';
            return val;
          };

          return (
            <div ref={chartRef} className="glass-card p-6 rounded-[2.5rem] flex flex-col border border-white/5 overflow-hidden bg-slate-900/40 relative text-left">
              <div className="flex flex-col sm:flex-row justify-between sm:items-start mb-6 gap-4">
                <h3 className="text-sm font-bold flex flex-col gap-1 text-white uppercase tracking-wider">
                  <span>Financial Trend By Week</span>
                  <span className="text-[10px] text-slate-500 font-normal normal-case">සතිපතා මූල්‍ය ප්‍රවණතාවය</span>
                </h3>

                <div className="flex bg-slate-950/40 rounded-xl border border-slate-800 p-1 w-fit">
                  <button
                    type="button"
                    onClick={() => { setOffsetDays(prev => prev + 7); setSelectedDetails(null); }}
                    className="px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-300 hover:bg-slate-800 hover:text-white transition flex items-center gap-1"
                  >
                    &larr; Prev
                  </button>
                  <div className="w-[1px] bg-slate-800 mx-1"></div>
                  <button
                    type="button"
                    onClick={() => { setOffsetDays(prev => Math.max(0, prev - 7)); setSelectedDetails(null); }}
                    disabled={offsetDays === 0}
                    className="px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-300 hover:bg-slate-800 hover:text-white transition flex items-center gap-1 disabled:opacity-30 disabled:cursor-not-allowed"
                  >
                    Next &rarr;
                  </button>
                </div>
              </div>

              <div className="w-full relative min-h-[200px] sm:min-h-[250px] overflow-hidden">
                <svg viewBox={`0 0 ${svgWidth} ${svgHeight}`} className="w-full h-full drop-shadow-lg" preserveAspectRatio="xMidYMid meet">
                  {[4, 3, 2, 1, 0].map(tick => {
                    const y = margin.top + (chartHeight / 4) * tick;
                    const v = (maxVal / 4) * (4 - tick);
                    return (
                      <g key={tick}>
                        <line x1={margin.left} y1={y} x2={svgWidth - margin.right} y2={y} stroke="#1e293b" strokeWidth="1" strokeDasharray="4 4" />
                        <text x={margin.left - 10} y={y + 4} fill="#64748b" fontSize="12" textAnchor="end" fontFamily="sans-serif">
                          {formatYAxis(v)}
                        </text>
                      </g>
                    );
                  })}

                  {data.map((d, i) => {
                    const xCenter = margin.left + (chartWidth / 7) * (i + 0.5);
                    const incHeight = (d.inc / maxVal) * chartHeight;
                    const incY = margin.top + chartHeight - incHeight;
                    const expHeight = (d.exp / maxVal) * chartHeight;
                    const expY = margin.top + chartHeight - expHeight;
                    const barWidth = 14;
                    const spacing = 4;

                    return (
                      <g key={i} className="group">
                        <rect x={xCenter - barWidth - spacing - 10} y={margin.top} width={(barWidth * 2) + spacing + 20} height={chartHeight} fill="transparent" className="hover:fill-slate-800/20 transition-colors duration-300" />
                        <rect
                          x={xCenter - barWidth - (spacing / 2)}
                          y={incY}
                          width={barWidth}
                          height={incHeight > 0 ? incHeight : 0}
                          fill="#22c55e"
                          rx="3"
                          className="cursor-pointer transition-all duration-700 hover:brightness-125 hover:stroke-white stroke-1"
                          onClick={() => setSelectedDetails({ type: 'income', date: d.date, label: d.label, records: d.dayIncomes })}
                        >
                          <title>View Incomes: Rs. {d.inc.toLocaleString()}</title>
                        </rect>
                        <rect
                          x={xCenter + (spacing / 2)}
                          y={expY}
                          width={barWidth}
                          height={expHeight > 0 ? expHeight : 0}
                          fill="#ef4444"
                          rx="3"
                          className="cursor-pointer transition-all duration-700 hover:brightness-125 hover:stroke-white stroke-1"
                          onClick={() => setSelectedDetails({ type: 'expense', date: d.date, label: d.label, records: d.dayExpenses })}
                        >
                          <title>View Expenses: Rs. {d.exp.toLocaleString()}</title>
                        </rect>
                        {d.dayGoods.length > 0 && (
                          <circle
                            cx={xCenter}
                            cy={margin.top - 8}
                            r="5"
                            fill="#eab308"
                            className="cursor-pointer transition-all duration-300 hover:brightness-125 hover:stroke-white stroke-1"
                            onClick={() => setSelectedDetails({ type: 'goods', date: d.date, label: d.label, records: d.dayGoods })}
                          >
                            <title>View Goods Donations: {d.dayGoods.length} items</title>
                          </circle>
                        )}
                        <text x={xCenter} y={svgHeight - 8} fill="#94a3b8" fontSize="11" textAnchor="middle" fontFamily="sans-serif">
                          {d.label.split(' ')[1]} {d.label.split(' ')[0]}
                        </text>
                      </g>
                    );
                  })}
                </svg>
              </div>

              {selectedDetails && (
                <div className="mt-4 bg-slate-950/40 p-4 border border-white/5 rounded-2xl animate-fade-in flex flex-col">
                  <div className="flex justify-between items-center mb-4 border-b border-white/5 pb-2">
                    <h4 className={`font-bold text-sm ${selectedDetails.type === 'income' ? 'text-brand-400' : selectedDetails.type === 'expense' ? 'text-red-400' : 'text-yellow-400'}`}>
                      {selectedDetails.type === 'income' ? 'Income Records' : selectedDetails.type === 'expense' ? 'Expense Records' : 'Goods Donations'} - {selectedDetails.label}
                    </h4>
                    <button type="button" onClick={() => setSelectedDetails(null)} className="text-slate-400 hover:text-white bg-slate-800/50 w-6 h-6 flex justify-center items-center rounded-full transition text-lg leading-none">&times;</button>
                  </div>
                  <div className="max-h-[200px] overflow-y-auto pr-2 custom-scrollbar">
                    {selectedDetails.records.length === 0 ? (
                      <div className="text-xs text-slate-500 text-center py-6">No records found.</div>
                    ) : (
                      <ul className="space-y-2">
                        {selectedDetails.records.map((r, idx) => (
                          <li key={idx} className="flex flex-col sm:flex-row sm:justify-between sm:items-center text-xs p-3 rounded-xl bg-slate-950/20 border border-white/5 hover:bg-slate-900/40 transition gap-1">
                            <span className="text-slate-300 font-medium">{selectedDetails.type === 'income' ? r.name : selectedDetails.type === 'expense' ? r.reason : r.name}</span>
                            <span className={`font-bold ${selectedDetails.type === 'income' ? 'text-brand-400' : selectedDetails.type === 'expense' ? 'text-red-400' : 'text-yellow-400'}`}>
                              {selectedDetails.type === 'income' ? `Rs. ${Math.round(r.amount).toLocaleString()}` : selectedDetails.type === 'expense' ? `Rs. ${Math.round(r.amount_taken).toLocaleString()}` : `${r.item_description} (x${r.quantity})`}
                            </span>
                          </li>
                        ))}
                      </ul>
                    )}
                  </div>
                </div>
              )}
            </div>
          );
        };

        // --- RECEIPT CANVAS GENERATOR ---
        const generateReceiptCanvas = (donation) => {
            return new Promise((resolve) => {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                const width = 800;
                const height = 1150;
                canvas.width = width;
                canvas.height = height;

                const isPoson = donation.event_type === 'poson';

                const theme = isPoson ? {
                    background: '#FFFFFF',
                    surface: '#F8FAFC',
                    primary: '#451A03',     // Deep Amber/Brown
                    secondary: '#78350F',   // Amber
                    accent: '#D97706',      // Gold/Bronze accent
                    accentLight: '#FEF3C7', // Soft gold tint
                    textPrimary: '#0F172A', // Slate 900
                    textSecondary: '#475569', // Slate 600
                    textMuted: '#94A3B8',   // Slate 400
                    border: '#E2E8F0',      // Slate 200
                    success: '#D97706',     // Amber
                    successLight: '#FEF3C7',
                    watermark: '#F1F5F9'
                } : {
                    background: '#FFFFFF',
                    surface: '#F8FAFC',
                    primary: '#1E1B4B',     // Deep Indigo
                    secondary: '#312E81',   // Vibrant Indigo
                    accent: '#D97706',      // Gold/Bronze accent
                    accentLight: '#FEF3C7', // Soft gold tint
                    textPrimary: '#0F172A', // Slate 900
                    textSecondary: '#475569', // Slate 600
                    textMuted: '#94A3B8',   // Slate 400
                    border: '#E2E8F0',      // Slate 200
                    success: '#10B981',     // Emerald
                    successLight: '#D1FAE5',
                    watermark: '#F1F5F9'
                };

                const roundedRect = (x, y, w, h, r) => {
                    ctx.beginPath();
                    ctx.moveTo(x + r, y);
                    ctx.lineTo(x + w - r, y);
                    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
                    ctx.lineTo(x + w, y + h - r);
                    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
                    ctx.lineTo(x + r, y + h);
                    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
                    ctx.lineTo(x, y + r);
                    ctx.quadraticCurveTo(x, y, x + r, y);
                    ctx.closePath();
                    return ctx;
                };

                const loadImages = () => {
                    const logo = new Image();
                    logo.crossOrigin = "anonymous";
                    logo.src = getRelativeAssetPath(isPoson ? 'poson_logo.png' : 'logo.png');

                    const verify = new Image();
                    verify.crossOrigin = "anonymous";
                    verify.src = getRelativeAssetPath('ve1rify.png');

                    const dcIcon = new Image();
                    dcIcon.crossOrigin = "anonymous";
                    dcIcon.src = getRelativeAssetPath('dc.png');

                    return Promise.all([
                        new Promise(r => { logo.onload = () => r(logo); logo.onerror = () => r(null); }),
                        new Promise(r => { verify.onload = () => r(verify); verify.onerror = () => r(null); }),
                        new Promise(r => { dcIcon.onload = () => r(dcIcon); dcIcon.onerror = () => r(null); })
                    ]);
                };

                loadImages().then(([logoImg, verifyImg, dcImg]) => {
                    ctx.fillStyle = theme.background;
                    ctx.fillRect(0, 0, width, height);

                    // WATERMARK
                    ctx.save();
                    ctx.globalAlpha = 0.04;
                    ctx.translate(width / 2, height / 2);
                    for (let i = 0; i < 8; i++) {
                        ctx.rotate(Math.PI / 4);
                        ctx.beginPath();
                        ctx.moveTo(0, -150);
                        ctx.quadraticCurveTo(50, -75, 0, -20);
                        ctx.quadraticCurveTo(-50, -75, 0, -150);
                        ctx.fillStyle = theme.primary;
                        ctx.fill();
                        ctx.beginPath();
                        ctx.moveTo(0, -130);
                        ctx.quadraticCurveTo(35, -65, 0, -30);
                        ctx.quadraticCurveTo(-35, -65, 0, -130);
                        ctx.fillStyle = theme.accent;
                        ctx.fill();
                    }
                    ctx.restore();

                    // BORDERS
                    ctx.strokeStyle = theme.accent;
                    ctx.lineWidth = 2;
                    ctx.strokeRect(25, 25, width - 50, height - 50);

                    roundedRect(35, 35, width - 70, height - 70, 16);
                    ctx.strokeStyle = theme.primary;
                    ctx.lineWidth = 3;
                    ctx.stroke();

                    // Corner Dharma Wheels
                    if (dcImg) {
                        const dcSize = 45;
                        const offset = 70;
                        ctx.drawImage(dcImg, offset - dcSize / 2, offset - dcSize / 2, dcSize, dcSize); // Top Left
                        ctx.drawImage(dcImg, width - offset - dcSize / 2, offset - dcSize / 2, dcSize, dcSize); // Top Right
                        ctx.drawImage(dcImg, offset - dcSize / 2, height - offset - dcSize / 2, dcSize, dcSize); // Bottom Left
                        ctx.drawImage(dcImg, width - offset - dcSize / 2, height - offset - dcSize / 2, dcSize, dcSize); // Bottom Right
                    }

                    // HEADER
                    ctx.beginPath();
                    ctx.arc(width / 2, 110, 55, 0, Math.PI * 2);
                    ctx.fillStyle = theme.surface;
                    ctx.fill();
                    ctx.strokeStyle = theme.border;
                    ctx.lineWidth = 1;
                    ctx.stroke();

                    if (logoImg) {
                        const logoSize = 80;
                        ctx.drawImage(logoImg, width / 2 - logoSize / 2, 70, logoSize, logoSize);
                    }

                    ctx.textAlign = "center";
                    ctx.font = `bold 28px sans-serif`;
                    ctx.fillStyle = theme.primary;
                    ctx.fillText(isPoson ? "POSON FESTIVAL 2026" : "VESAK LANTERN PROJECT 2026", width / 2, 175);

                    ctx.font = `500 14px sans-serif`;
                    ctx.fillStyle = theme.textSecondary;
                    ctx.fillText(isPoson ? "මහා පොසොන් උත්සවය - දික්හේනපුර" : "මහා වෙසක් කූඩු ව්‍යාපෘතිය - දික්හේනපුර", width / 2, 200);

                    ctx.beginPath();
                    ctx.moveTo(width / 2 - 150, 215);
                    ctx.lineTo(width / 2 + 150, 215);
                    ctx.strokeStyle = theme.accent;
                    ctx.lineWidth = 1.5;
                    ctx.stroke();

                    // RECEIPT TITLE
                    ctx.font = `bold 32px sans-serif`;
                    ctx.fillStyle = theme.primary;
                    ctx.fillText("OFFICIAL RECEIPT OF DONATION", width / 2, 275);

                    ctx.font = `500 13px monospace`;
                    ctx.fillStyle = theme.textMuted;
                    ctx.fillText("බුදු සරණයි !", width / 2, 300);

                    // ID & DATE
                    const rawId = donation.id ? String(donation.id) : String(Math.floor(Math.random() * 10000));
                    const id = rawId.includes('-') ? rawId.split('-')[0].toUpperCase() : rawId.padStart(4, '0');
                    const dateStr = new Date(donation.date || Date.now()).toLocaleDateString('en-GB', { day: '2-digit', month: 'long', year: 'numeric' });

                    ctx.font = `bold 13px monospace`;
                    ctx.fillStyle = theme.textSecondary;
                    ctx.textAlign = "left";
                    ctx.fillText(`Receipt No: ${isPoson ? 'PFP' : 'VLP'}/2026/${id}`, 70, 340);
                    ctx.textAlign = "right";
                    ctx.fillText(`Date Issued: ${dateStr}`, width - 70, 340);
                    ctx.textAlign = "center";

                    ctx.beginPath();
                    ctx.moveTo(50, 365);
                    ctx.lineTo(width - 50, 365);
                    ctx.strokeStyle = theme.border;
                    ctx.lineWidth = 1;
                    ctx.stroke();

                    // DONOR CARD
                    roundedRect(50, 390, width - 100, 130, 12);
                    ctx.fillStyle = theme.surface;
                    ctx.fill();
                    ctx.strokeStyle = theme.border;
                    ctx.stroke();

                    ctx.font = `bold 12px sans-serif`;
                    ctx.fillStyle = theme.textMuted;
                    ctx.textAlign = "left";
                    ctx.fillText("DONOR INFORMATION", 70, 415);

                    ctx.font = `bold 22px sans-serif`;
                    ctx.fillStyle = theme.textPrimary;
                    ctx.fillText(donation.name || "Anonymous Donor", 70, 445);

                    ctx.font = `500 13px sans-serif`;
                    ctx.fillStyle = theme.textSecondary;
                    if (donation.phone_number) ctx.fillText(`Contact: ${donation.phone_number}`, 70, 475);
                    ctx.fillText(`Reported By: ${donation.reported_by || '-'}`, 70, 495);

                    if (verifyImg) {
                        const vSize = 30;
                        ctx.drawImage(verifyImg, width - 180, 400, vSize, vSize);
                        ctx.font = `bold 11px sans-serif`;
                        ctx.fillStyle = theme.accent;
                        ctx.fillText("VERIFIED DONOR", width - 145, 420);
                    }

                    // CONTRIBUTION DETAILS
                    roundedRect(50, 545, width - 100, 230, 12);
                    ctx.fillStyle = "#FFFFFF";
                    ctx.fill();
                    ctx.strokeStyle = theme.border;
                    ctx.stroke();

                    ctx.font = `bold 12px sans-serif`;
                    ctx.fillStyle = theme.textMuted;
                    ctx.fillText("CONTRIBUTION DETAILS", 70, 575);

                    let yOffset = 600;
                    ctx.font = `bold 14px sans-serif`;
                    ctx.fillStyle = theme.textSecondary;
                    ctx.fillText("Description", 70, yOffset);
                    ctx.fillText("Value / Amount", width - 200, yOffset);

                    ctx.beginPath();
                    ctx.moveTo(70, yOffset + 12);
                    ctx.lineTo(width - 70, yOffset + 12);
                    ctx.strokeStyle = theme.border;
                    ctx.stroke();

                    yOffset += 35;
                    ctx.font = `bold 18px sans-serif`;
                    ctx.fillStyle = theme.textPrimary;
                    const desc = donation.donation_type === 'Cash' ? (donation.donor_category || 'Cash Contribution') : `${donation.item_description} (x${donation.quantity})`;
                    ctx.fillText(desc, 70, yOffset);

                    ctx.font = `bold 22px sans-serif`;
                    ctx.fillStyle = theme.primary;
                    const amount = donation.donation_type === 'Cash' ? `LKR ${(Number(donation.amount) || 0).toLocaleString('en-LK')}` : 'GOODS';
                    ctx.textAlign = "right";
                    ctx.fillText(amount, width - 70, yOffset);
                    ctx.textAlign = "left";

                    yOffset += 45;
                    ctx.font = `500 12px sans-serif`;
                    ctx.fillStyle = theme.textMuted;
                    ctx.fillText(`Payment Method: ${donation.donation_type === 'Cash' ? 'Cash Payment' : 'Goods / In-kind'}`, 70, yOffset);

                    ctx.beginPath();
                    roundedRect(width - 170, yOffset - 8, 100, 24, 12);
                    ctx.fillStyle = theme.successLight;
                    ctx.fill();
                    ctx.font = `bold 11px sans-serif`;
                    ctx.fillStyle = theme.success;
                    ctx.textAlign = "center";
                    ctx.fillText("✓ RECEIVED", width - 120, yOffset + 8);
                    ctx.textAlign = "left";

                    yOffset += 40;
                    ctx.beginPath();
                    ctx.moveTo(70, yOffset);
                    ctx.lineTo(width - 70, yOffset);
                    ctx.strokeStyle = theme.border;
                    ctx.stroke();

                    yOffset += 25;
                    ctx.font = `bold 14px sans-serif`;
                    ctx.fillStyle = theme.textPrimary;
                    ctx.fillText("Total Contribution", 70, yOffset);
                    ctx.font = `bold 24px sans-serif`;
                    ctx.fillStyle = theme.accent;
                    ctx.textAlign = "right";
                    const finalTotal = donation.donation_type === 'Cash' ? `LKR ${(Number(donation.amount) || 0).toLocaleString('en-LK')}.00` : 'GOODS RECEIVED';
                    ctx.fillText(finalTotal, width - 70, yOffset);
                    ctx.textAlign = "center";

                    // SEAL
                    ctx.save();
                    ctx.translate(width - 120, height - 320);
                    ctx.beginPath();
                    ctx.arc(0, 0, 45, 0, Math.PI * 2);
                    ctx.strokeStyle = theme.accent;
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.arc(0, 0, 38, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.font = `bold 10px sans-serif`;
                    ctx.fillStyle = theme.accent;
                    ctx.fillText("VERIFIED", 0, -8);
                    ctx.font = `bold 18px sans-serif`;
                    ctx.fillStyle = theme.primary;
                    ctx.fillText("✓", 0, 12);
                    ctx.font = `8px sans-serif`;
                    ctx.fillStyle = theme.textMuted;
                    ctx.fillText("OFFICIAL SEAL", 0, 28);
                    ctx.restore();

                    // FOOTER
                    ctx.font = `italic 14px serif`;
                    ctx.fillStyle = theme.textSecondary;
                    ctx.fillText("“May the blessings of the Triple Gem be upon you.”", width / 2, height - 230);

                    ctx.font = `bold 11px sans-serif`;
                    ctx.fillStyle = theme.textMuted;
                    ctx.fillText(isPoson ? "This Dana is offered for the success of the Poson Festival and the happiness of all beings." : "This Dana is offered for the success of the Vesak Lantern Project and the happiness of all beings.", width / 2, height - 205);

                    ctx.beginPath();
                    ctx.moveTo(50, height - 175);
                    ctx.lineTo(width - 50, height - 175);
                    ctx.strokeStyle = theme.border;
                    ctx.stroke();

                    ctx.font = `bold 11px sans-serif`;
                    ctx.fillStyle = theme.textSecondary;
                    ctx.fillText('071 615 5666 (Isara Dilnuka)  |  071 084 6810 (Imesh Nilhan)', width / 2, height - 150);
                    ctx.fillText('isaradilnuka2005@gmail.com  |  imeshnilhan21@gmail.com', width / 2, height - 130);
                    ctx.font = `500 10px sans-serif`;
                    ctx.fillText(`Near New Temple, Dikhenapura · ${isPoson ? 'Poson Festival' : 'Vesak Lantern Project'} 2026`, width / 2, height - 110);

            // Modals State
            const [editIncome, setEditIncome] = useState(null);

            const [addUserModal, setAddUserModal] = useState(false);
            const [newUser, setNewUser] = useState({ username: '', phone_number: '', address: '', password: '', role: 'user', is_contributor: true, contribution_goal: 10000 });
            
            // Addition Modals
            const [addIncomeModal, setAddIncomeModal] = useState(false);
            const [newIncome, setNewIncome] = useState({ name: '', phone_number: '', address: '', donation_type: 'Cash', amount: '', donor_category: 'Regular Donor', item_description: '', quantity: '', status: 'Received Today', event_type: 'vesak', description: '', date: new Date().toISOString().split('T')[0] });

            // Form Step States
            const [incomeFormStep, setIncomeFormStep] = useState(1);
            const [expenseFormStep, setExpenseFormStep] = useState(1);
            const [selectedWithdrawers, setSelectedWithdrawers] = useState([]);

            const [otherWithdrawerName, setOtherWithdrawerName] = useState('');
            const [useVesakBalance, setUseVesakBalance] = useState(false);

            // Vesak Balance calculations for poson expenses
            const vesakBalanceRemaining = useMemo(() => {
                const vesakIncome = incomes
                    .filter(i => (i.event_type === 'vesak' || !i.event_type) && i.donation_type === 'Cash' && i.status === 'Received Today')
                    .reduce((sum, item) => sum + Number(item.amount || 0), 0);
                const vesakExpense = expenses
                    .filter(e => (e.event_type === 'vesak' || !e.event_type))
                    .reduce((sum, item) => sum + Number(item.amount_taken || 0), 0);
                const posonUsedVesak = expenses
                    .filter(e => e.event_type === 'poson' && (e.reason || '').startsWith('[Vesak Balance]'))
                    .reduce((sum, item) => sum + Number(item.amount_taken || 0), 0);
                return Math.max(0, vesakIncome - vesakExpense - posonUsedVesak);

            // Receipt Viewer Modal

            // Authentication Checker
            useEffect(() => {
              supabase.auth.getSession().then(({ data: { session } }) => {

                  if (window.location.hash.includes('type=recovery') || window.location.search.includes('type=recovery')) {
                    setAuthMode('reset');
                    setLoggedIn(false);

                    setError('Unauthorized: You do not have admin access.');

                  setLoggedIn(false);

              });

            const handleLogin = async (e) => {

                 setLoggedIn(false);
                 setCreds({...creds, pass: ''});

              setAuthLoading(false);

            const handleLogout = async () => {

            const fetchData = async () => {
                setLoading(true);

                    ]);
                    
                    if (inc.data) setIncomes(inc.data);
                    if (exp.data) setExpenses(exp.data);
                    if (users.data) setAppUsers(users.data);
                    if (sessions.data) setAllSessions(sessions.data);

                       try { parsedGallery = typeof vesakRes.data.gallery_links === 'string' ? JSON.parse(vesakRes.data.gallery_links) : vesakRes.data.gallery_links; } catch(e){}
                       setVesakSettings({ ...vesakRes.data, gallery_links: Array.isArray(parsedGallery) ? parsedGallery : [] });
                    }

                       let parsedGallery = [];
                       try { parsedGallery = typeof posonRes.data.gallery_links === 'string' ? JSON.parse(posonRes.data.gallery_links) : posonRes.data.gallery_links; } catch(e){}
                       setPosonSettings({ ...posonRes.data, gallery_links: Array.isArray(parsedGallery) ? parsedGallery : [] });

                } catch (error) {
                    console.error("Fetch error:", error);
                    window.showToast("Data loading failed.", "error");
                } finally {
                    setLoading(false);

            };

            // Income Actions
            const generateAIDescription = () => {

                    { s: ` රු. ${Number(amount || 0).toLocaleString()} ක මුදලක් වෙසක් කුඩුව සඳහා පරිත්‍යාග කරන ලදී.`, e: ` a sum of Rs. ${Number(amount || 0).toLocaleString()} was donated for the lantern.` },

                    { s: `${prefix}${donorName} පින්වතා විසින්`, e: `By ${ePrefix}${donorName},` },

                const goodsBodies = [
                    { s: ` ${item_description} (x${quantity || 1}) පරිත්‍යාග කරන ලදී.`, e: ` ${item_description} (x${quantity || 1}) were donated.` },

            const handleAddIncome = async (e) => {

            const handleDeleteIncome = async (id) => {

                setCanvasLoading(false);
              }

                e.preventDefault();

                    setExpenseFormStep(expenseFormStep + 1);
                    return;
                }
                setActionLoading(true);
                try {
                  let allWithdrawers = [...selectedWithdrawers];
                  if (showOtherWithdrawer && otherWithdrawerName.trim() !== '') {
                      allWithdrawers = [...allWithdrawers, ...otherWithdrawerName.split(',').map(s => s.trim()).filter(Boolean)];
                  }
                  if (allWithdrawers.length === 0) {
                      throw new Error("Please select or type at least one withdrawer.");
                  }
                  const finalWithdrawerName = allWithdrawers.join(', ');
                  const amountTaken = Number(newExpense.amount_taken);

                  if (useVesakBalance && newExpense.event_type === 'poson') {
                      if (amountTaken > vesakBalanceRemaining) {
                          throw new Error(`Vesak balance insufficient. Available: Rs. ${Math.round(vesakBalanceRemaining).toLocaleString()}`);
                      }
                  }

                  const formatVesakBalanceReason = (reason) => {
                      const clean = (reason || '').trim();
                      return clean.startsWith('[Vesak Balance]') ? clean : `[Vesak Balance] ${clean}`;
                  };

                  const uuid = crypto.randomUUID ? crypto.randomUUID() : 'id-' + Date.now();
                  let receipt_url = null;
                  if (newExpense.receiptFile) {
                    const fileExt = newExpense.receiptFile.name.split('.').pop();
                    const fileName = `${Math.random()}.${fileExt}`;

                    const { data } = supabase.storage.from('receipts').getPublicUrl(filePath);

                  await supabase.from('notifications').delete().eq('record_id', id);
                  fetchData(); 
                  window.showToast("Record Deleted", "success");

                catch(err) { window.showToast(err.message, "error"); }

              setActionLoading(true);

                const fileExt = file.name.split('.').pop();

                const filePath = `${fileName}`;

                const { error: uploadError } = await supabase.storage.from('receipts').upload(filePath, file);
                if (uploadError) throw uploadError;

                const { data } = supabase.storage.from('receipts').getPublicUrl(filePath);

                if (updateError) throw updateError;

                window.showToast("Receipt uploaded successfully!", "success");
                fetchData();
              } catch (err) {
                window.showToast("Upload failed: " + err.message, "error");
              } finally {
                setActionLoading(false);
              }
            };

                    const hashedPass = await hashPassword(newUser.password);

            // Global Project Settings Actions
            const handleSaveSettings = async (e) => {

                      expense_access_list: projectSettings.expense_access_list || '',
                      pledge_access_list: projectSettings.pledge_access_list || '',

                    };

                    if (existing) {
                      const { error: err } = await supabase.from('project_settings').update(params).eq('id', existing.id);

                } catch(err) { window.showToast(err.message, "error"); } finally { setActionLoading(false); }

            // Backup Utilities
            const generateSQLBackup = () => {
              let sql = `-- Vesak System Database Backup\n-- Generated on: ${new Date().toLocaleString()}\n\n`;
              
              sql += `-- Table: app_users\n`;
              appUsers.forEach(u => {
                const values = [u.id, u.username, u.password_hash, u.role, u.is_temp_password, u.phone_number, u.address, u.is_contributor, u.two_factor_enabled, u.fcm_token].map(v => v === null || v === undefined ? 'NULL' : `'${String(v).replace(/'/g, "''")}'`);
                sql += `INSERT INTO app_users (id, username, password_hash, role, is_temp_password, phone_number, address, is_contributor, two_factor_enabled, fcm_token) VALUES (${values.join(', ')});\n`;
              });

              sql += `\n-- Table: project_settings\n`;
              if (projectSettings.id) {
                const psVals = [projectSettings.id, projectSettings.allow_income_entry, projectSettings.allow_expense_entry, projectSettings.income_access_list, projectSettings.expense_access_list, projectSettings.pledge_access_list, projectSettings.allow_pledge_entry].map(v => v === null || v === undefined ? 'NULL' : `'${String(v).replace(/'/g, "''")}'`);
                sql += `INSERT INTO project_settings (id, allow_income_entry, allow_expense_entry, income_access_list, expense_access_list, pledge_access_list, allow_pledge_entry) VALUES (${psVals.join(', ')});\n`;
              }

              sql += `\n-- Table: incomes\n`;
              incomes.forEach(i => {
                const values = [i.id, i.date, i.name, i.phone_number, i.address, i.donation_type, i.amount, i.donor_category, i.item_description, i.quantity, i.status, i.reported_by, i.description].map(v => v === null || v === undefined ? 'NULL' : `'${String(v).replace(/'/g, "''")}'`);
                sql += `INSERT INTO incomes (id, date, name, phone_number, address, donation_type, amount, donor_category, item_description, quantity, status, reported_by, description) VALUES (${values.join(', ')});\n`;
              });

              sql += `\n-- Table: expenses\n`;
              expenses.forEach(e => {
                const values = [e.id, e.reason, e.withdrawer_name, e.date, e.time, e.amount_taken, e.receipt_url, e.reported_by].map(v => v === null || v === undefined ? 'NULL' : `'${String(v).replace(/'/g, "''")}'`);
                sql += `INSERT INTO expenses (id, reason, withdrawer_name, date, time, amount_taken, receipt_url, reported_by) VALUES (${values.join(', ')});\n`;
              });

              const blob = new Blob([sql], { type: 'text/plain' });
              const url = URL.createObjectURL(blob);
              const link = document.createElement('a');
              link.href = url;
              link.download = `Vesak_Backup_${new Date().toISOString().split('T')[0]}.sql`;
              document.body.appendChild(link);
              link.click();
              document.body.removeChild(link);
              window.showToast("SQL Backup file downloaded!", "success");
            };

            const generateXLSXBackup = () => {
              if (!window.XLSX) {
                 window.showToast("Excel export library is not loaded.", "error");
                 return;
              }
              try {
                const truncateObj = (obj) => {
                  const newObj = {};
                  for (const key in obj) {
                    if (typeof obj[key] === 'string' && obj[key].length > 32000) {
                      newObj[key] = obj[key].substring(0, 32000) + "... [TRUNCATED]";
                    } else { newObj[key] = obj[key]; }
                  }
                  return newObj;
                };

                const safeToSheet = (data) => {
                  if (!data || data.length === 0) return window.XLSX.utils.json_to_sheet([{"Message": "No data available"}]);
                  return window.XLSX.utils.json_to_sheet(data.map(truncateObj));
                };

                const wb = window.XLSX.utils.book_new();
                window.XLSX.utils.book_append_sheet(wb, safeToSheet(appUsers), "app_users");
                window.XLSX.utils.book_append_sheet(wb, safeToSheet(projectSettings.id ? [projectSettings] : []), "project_settings");
                window.XLSX.utils.book_append_sheet(wb, safeToSheet(incomes), "incomes");
                window.XLSX.utils.book_append_sheet(wb, safeToSheet(expenses), "expenses");
                
                window.XLSX.writeFile(wb, `Vesak_Backup_${new Date().toISOString().split('T')[0]}.xlsx`);
                window.showToast("Excel Backup generated!", "success");
              } catch (err) {
                window.showToast("Excel export error: " + err.message, "error");
              }
            };

            const handleGalleryUpload = async (e) => {
              const file = e.target.files[0];

              setActionLoading(true);

                const fileName = `${Date.now()}_${Math.random().toString(36).substring(7)}.${ext}`;
                const { error } = await supabase.storage.from('gallery_images').upload(fileName, file);
                if(error) throw error;
                
                const { data } = supabase.storage.from('gallery_images').getPublicUrl(fileName);
                const newItem = { title: file.name, url: data.publicUrl, type: 'image', path: fileName };
                
                if(invitationEventType === 'vesak') {
                  setVesakSettings(prev => ({...prev, gallery_links: [...(prev.gallery_links || []), newItem]}));
                } else {
                  setPosonSettings(prev => ({...prev, gallery_links: [...(prev.gallery_links || []), newItem]}));
                }
                window.showToast("Gallery image uploaded!", "success");
              } catch(err) { window.showToast("Upload error: " + err.message, "error"); } finally { setActionLoading(false); e.target.value = ''; }

            const handleAddGalleryLink = () => {

              } else {
                setPosonSettings(prev => ({...prev, gallery_links: [...(prev.gallery_links || []), newItem]}));
              }

              if(!window.confirm('Remove this gallery item?')) return;
              const settings = invitationEventType === 'vesak' ? vesakSettings : posonSettings;
              const item = settings.gallery_links[index];

              else setPosonSettings({...settings, gallery_links: newLinks});
            };

            // Filtering Calculations
            const filteredIncomes = incomes.filter(inc => {
                if (eventFilter !== 'all' && normalizeEventType(inc) !== eventFilter) return false;
                if (incomeSubTab === 'cash' && inc.donation_type !== 'Cash') return false;
                if (incomeSubTab === 'goods' && inc.donation_type !== 'Goods') return false;
                if (incomeSubTab === 'main_donors' && inc.donor_category !== 'Main Donor') return false;
                if (incomeSubTab === 'regular_donors' && inc.donor_category !== 'Regular Donor') return false;
                if (filterDate && inc.date !== filterDate) return false;
                if (searchTerm) {
                    const s = searchTerm.toLowerCase();
                    return (inc.name?.toLowerCase().includes(s) || inc.item_description?.toLowerCase().includes(s) || inc.phone_number?.includes(s));
                }
                return true;
            });

            const filteredExpenses = expenses.filter(exp => {
                if (eventFilter !== 'all' && normalizeEventType(exp) !== eventFilter) return false;
                if (filterDate && exp.date !== filterDate) return false;
                if (searchTerm) {
                    const s = searchTerm.toLowerCase();
                    return (exp.reason?.toLowerCase().includes(s) || exp.withdrawer_name?.toLowerCase().includes(s));
                }
                return true;
            });

            // Grouped Main Donors
            const groupedMainDonors = useMemo(() => {
                if (incomeSubTab !== 'main_donors') return [];
                const groups = {};
                filteredIncomes.forEach(inc => {
                  const key = (inc.name || 'Unknown').trim().toLowerCase();
                  if (!groups[key]) {
                    groups[key] = {
                      name: inc.name || 'Unknown',
                      total: 0,
                      records: [],
                      key
                    };
                  }
                  groups[key].total += Number(inc.amount || 0);
                  groups[key].records.push(inc);
                });
                return Object.values(groups).sort((a, b) => b.total - a.total);
            }, [filteredIncomes, incomeSubTab]);

            // Financial Totals
            const totalCash = filteredIncomes.filter(i => i.donation_type === 'Cash' && i.status === 'Received Today').reduce((s, i) => s + Number(i.amount||0), 0);
            const totalExp = filteredExpenses.reduce((s, e) => s + Number(e.amount_taken||0), 0);
            const balance = totalCash - totalExp;

            // Shares Split Logic
            const mainDonorsShares = useMemo(() => {
                const groups = {};
                filteredIncomes.filter(i => i.donor_category === 'Main Donor' && i.status === 'Received Today' && i.donation_type === 'Cash').forEach(inc => {
                    const name = inc.name || 'Unknown';
                    if(!groups[name]) groups[name] = 0;
                    groups[name] += Number(inc.amount||0);
                });
                const totalMainContributions = Object.values(groups).reduce((sum, val) => sum + val, 0);

                return Object.entries(groups).map(([name, amount]) => {
                    const pct = totalMainContributions > 0 ? (amount / totalMainContributions) * 100 : 0;
                    const share = (pct / 100) * Math.max(0, balance);
                    return { name, amount, pct, share };
                }).sort((a,b) => b.amount - a.amount);
            }, [filteredIncomes, balance]);

                          Update Password
                        </button>
                      </form>

                          </div>
                          <div className="flex gap-3 mt-4">
                            <button type="button" onClick={() => setAddUserModal(false)} className="m3-button m3-button-tonal flex-1 h-12">Cancel</button>
                            <button type="submit" disabled={actionLoading} className="m3-button m3-button-filled flex-1 h-12">Create User</button>
                          </div>
                        </form>
                      </Modal>
                    )}

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);

        // --- THREE.JS ANIMATED BACKGROUND ---
        (function() {
          const canvas = document.getElementById('bg-canvas');
          if (!canvas || !window.THREE) return;
          
          const scene = new THREE.Scene();
          const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
          const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
          renderer.setSize(window.innerWidth, window.innerHeight);
          renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

          const particlesGeometry = new THREE.BufferGeometry();
          const particlesCount = 1500;
          const posArray = new Float32Array(particlesCount * 3);
          const colorsArray = new Float32Array(particlesCount * 3);
          
          for(let i = 0; i < particlesCount * 3; i += 3) {
            posArray[i] = (Math.random() - 0.5) * 50;
            posArray[i+1] = (Math.random() - 0.5) * 50;
            posArray[i+2] = (Math.random() - 0.5) * 30;
            
            const colorChoice = Math.random();
            if(colorChoice < 0.5) {
              colorsArray[i] = 0.13; colorsArray[i+1] = 0.77; colorsArray[i+2] = 0.37; // green
            } else if(colorChoice < 0.8) {
              colorsArray[i] = 0.18; colorsArray[i+1] = 0.83; colorsArray[i+2] = 0.75; // teal
            } else {
              colorsArray[i] = 0.39; colorsArray[i+1] = 0.40; colorsArray[i+2] = 0.95; // indigo
            }
          }
          
          particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
          particlesGeometry.setAttribute('color', new THREE.BufferAttribute(colorsArray, 3));
          
          const particlesMaterial = new THREE.PointsMaterial({
            size: 0.05,
            vertexColors: true,
            transparent: true,
            opacity: 0.8,
            blending: THREE.AdditiveBlending
          });
          
          const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
          scene.add(particlesMesh);

          const linesMaterial = new THREE.LineBasicMaterial({ 
            color: 0x22c55e, 
            transparent: true, 
            opacity: 0.08 
          });
          const linesGeometry = new THREE.BufferGeometry();
          const linePositions = [];
          for(let i = 0; i < 200; i++) {
            const x1 = (Math.random() - 0.5) * 40;
            const y1 = (Math.random() - 0.5) * 40;
            const z1 = (Math.random() - 0.5) * 20;
            const x2 = x1 + (Math.random() - 0.5) * 10;
            const y2 = y1 + (Math.random() - 0.5) * 10;
            const z2 = z1 + (Math.random() - 0.5) * 5;
            linePositions.push(x1, y1, z1, x2, y2, z2);
          }
          linesGeometry.setAttribute('position', new THREE.Float32BufferAttribute(linePositions, 3));
          const lines = new THREE.LineSegments(linesGeometry, linesMaterial);
          scene.add(lines);

          camera.position.z = 15;

          let mouseX = 0, mouseY = 0;
          document.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
            mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
          });

          function animate() {
            requestAnimationFrame(animate);
            particlesMesh.rotation.y += 0.0005;
            particlesMesh.rotation.x += 0.0003;
            lines.rotation.y -= 0.0003;
            camera.position.x += (mouseX * 2 - camera.position.x) * 0.02;
            camera.position.y += (-mouseY * 2 - camera.position.y) * 0.02;
            camera.lookAt(scene.position);
            renderer.render(scene, camera);
          }
          animate();

          window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
          });
        })();
    </script>
</body>
</html>
