                        type="password"
                        name="password"
                        autoComplete="current-password"
                        placeholder={`Password for ${username.split(' ')[0]}`}
                        value={password}
                        onChange={e => setPassword(e.target.value)}
                        className="w-full bg-slate-900 border border-slate-700 text-white rounded-xl p-4 outline-none focus:border-brand-500 font-medium"
                        required
                      />
                      <button type="submit" disabled={loading} className="w-full bg-brand-600 hover:bg-brand-500 text-white font-black uppercase tracking-widest text-xs py-4 rounded-xl transition shadow-[0_10px_20px_rgba(34,197,94,0.3)] hover:shadow-[0_15px_30px_rgba(34,197,94,0.4)] hover:-translate-y-0.5 disabled:opacity-50 m3-button m3-button-filled magnetic-button">
                        {loading ? 'Logging in...' : 'Secure Login'}
                      </button>
                    </div>
                  );
                })()}
                <div className="flex flex-col items-center gap-3 mt-8 pt-6 border-t border-white/5">
                  <button type="button" onClick={() => setView('forgot_password')} className="text-xs text-brand-400 font-bold hover:text-brand-300 transition-colors">Forgot Password?</button>
                  <button type="button" onClick={onShowBalance} className="text-[10px] text-slate-400 hover:text-white transition-colors uppercase tracking-widest">View Current Balance</button>
                  <a href="view_income.html" className="mt-2 flex items-center gap-2 px-4 py-2 rounded-xl bg-brand-500/10 text-brand-400 hover:bg-brand-500/20 transition-all border border-brand-500/20 group">
                    <MaterialIcon name="public" className="text-sm group-hover:rotate-12 transition-transform" />
                    <span className="text-[10px] font-black uppercase tracking-widest">Public Donation Portal</span>
                  </a>
                </div>
              </form>
            )}

            {view === 'change_password' && (() => {
              const strength = getPasswordStrength(newPassword);
              const checks = checkPassword(newPassword, confirmPassword);
              const data = strengthData[strength];

              return (
                <form onSubmit={handleChangePassword} className="space-y-4 text-left animate-fade-in">
                  <div className="text-center mb-4">
                    <p className="text-xs text-brand-400 font-bold uppercase tracking-widest">Update Your Password</p>
                    <p className="text-[10px] text-slate-500 mt-1">Please set a new secure password to continue.</p>
                  </div>

                  <input type="text" name="username" value={username} readOnly className="hidden" autoComplete="username" />

                  <div className="space-y-4">
                    {/* New Password */}
                    <div className="relative">
                      <input
                        type={showNewPassword ? "text" : "password"}
                        name="new-password"
                        autoComplete="new-password"
                        placeholder="New Password"
                        value={newPassword}
                        onChange={e => setNewPassword(e.target.value)}
                        className="w-full bg-slate-900 border border-slate-700 text-white rounded-xl p-4 pr-12 outline-none focus:border-brand-500 font-medium transition-all"
                        required
                      />
                      <button type="button" onClick={() => setShowNewPassword(!showNewPassword)} className="absolute right-4 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-300 transition-colors">
                        <MaterialIcon name={showNewPassword ? "visibility_off" : "visibility"} className="text-xl" />
                      </button>
                    </div>

                    {/* Strength Meter */}
                    <div className="space-y-1.5 px-1">
                      <div className="flex justify-between items-center text-[10px] font-bold uppercase tracking-wider">
                        <span className="text-slate-500">Security Strength</span>
                        <span className={data.text}>{data.label}</span>
                      </div>
                      <div className="h-1.5 w-full bg-slate-800 rounded-full overflow-hidden flex gap-1">
                        {[1, 2, 3, 4, 5].map(step => (
                          <div
                            key={step}
                            className={`h-full flex-1 transition-all duration-500 ${step <= strength ? data.color : 'bg-slate-800'}`}
                          ></div>
                        ))}
                      </div>
                    </div>

                    {/* Confirm Password */}
                    <div className="relative">
                      <input
                        type={showConfirmPassword ? "text" : "password"}
                        name="confirm-password"
                        autoComplete="new-password"
                        placeholder="Confirm Password"
                        value={confirmPassword}
                        onChange={e => setConfirmPassword(e.target.value)}
                        className="w-full bg-slate-900 border border-slate-700 text-white rounded-xl p-4 pr-12 outline-none focus:border-brand-500 font-medium transition-all"
                        required
                      />
                      <button type="button" onClick={() => setShowConfirmPassword(!showConfirmPassword)} className="absolute right-4 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-300 transition-colors">
                        <MaterialIcon name={showConfirmPassword ? "visibility_off" : "visibility"} className="text-xl" />
                      </button>
                    </div>
                  </div>

                  {/* Checklist */}
                  <div className="bg-slate-900/50 rounded-xl p-4 border border-slate-800 space-y-2">
                    <div className={`flex items-center gap-2 text-[11px] transition-colors ${checks.length ? 'text-brand-400' : 'text-slate-500'}`}>
                      <MaterialIcon name={checks.length ? "check_circle" : "radio_button_unchecked"} className="text-sm" />
                      <span>8-20 characters long</span>
                    </div>
                    <div className={`flex items-center gap-2 text-[11px] transition-colors ${checks.upperLower ? 'text-brand-400' : 'text-slate-500'}`}>
                      <MaterialIcon name={checks.upperLower ? "check_circle" : "radio_button_unchecked"} className="text-sm" />
                      <span>Uppercase & lowercase letters</span>
                    </div>
                    <div className={`flex items-center gap-2 text-[11px] transition-colors ${checks.numberSymbol ? 'text-brand-400' : 'text-slate-500'}`}>
                      <MaterialIcon name={checks.numberSymbol ? "check_circle" : "radio_button_unchecked"} className="text-sm" />
                      <span>Numbers & symbols (@$!%*?&)</span>
                    </div>
                    <div className={`flex items-center gap-2 text-[11px] transition-colors ${checks.match ? 'text-brand-400' : 'text-slate-500'}`}>
                      <MaterialIcon name={checks.match ? "check_circle" : "radio_button_unchecked"} className="text-sm" />
                      <span>Passwords match (මුරපද සමානයි)</span>
                    </div>
                  </div>

                  <button
                    type="submit"
                    disabled={loading || strength < 5 || newPassword !== confirmPassword}
                    className="w-full bg-brand-600 hover:bg-brand-500 text-white font-black uppercase tracking-widest text-xs py-4 rounded-xl transition shadow-[0_10px_20px_rgba(34,197,94,0.3)] hover:shadow-[0_15px_30px_rgba(34,197,94,0.4)] hover:-translate-y-0.5 disabled:opacity-30 m3-button m3-button-filled magnetic-button"
                  >
                    {loading ? 'Processing...' : 'Complete Setup'}
                  </button>
                </form>
              );
            })()}

            {view === 'forgot_password' && (
              <div className="space-y-6 text-center animate-fade-in">
                <p className="text-sm text-slate-300">Select your account to request a password reset.</p>

                <div className="max-h-[300px] overflow-y-auto custom-scrollbar px-2 space-y-6">
                  {/* Regular Users */}
                  <div className="flex flex-wrap justify-center gap-5">
                    {users.filter(u => u.role !== 'admin').map(u => (
                      <div key={u.id} onClick={() => setUsername(u.username)} className={`flex flex-col items-center cursor-pointer transition-all duration-300 ${username === u.username ? 'scale-110 opacity-100' : 'opacity-60 hover:opacity-100 hover:scale-105'}`}>
                        <div className={`w-12 h-12 rounded-full overflow-hidden border-[3px] ${username === u.username ? 'border-brand-500 shadow-[0_0_15px_rgba(34,197,94,0.6)]' : 'border-slate-800'}`}>
                          <img src={u.avatar_url || 'logo.png'} alt={u.username} className="w-full h-full object-cover" />
                        </div>
                        <span className="text-[9px] mt-2 text-slate-300 font-bold tracking-wide">{u.username.split(' ')[0]}</span>
                      </div>
                    ))}
                  </div>

                  {/* Admins Section */}
                  {users.some(u => u.role === 'admin') && (
                    <div className="flex flex-wrap justify-center gap-5 pt-5 border-t border-white/5 relative">
                      <span className="absolute -top-2 left-1/2 -translate-x-1/2 bg-[#0f172a] px-3 text-[8px] font-black tracking-widest uppercase text-brand-400/50 rounded-full">System Admins</span>
                      {users.filter(u => u.role === 'admin').map(u => (
                        <div key={u.id} onClick={() => setUsername(u.username)} className={`flex flex-col items-center cursor-pointer transition-all duration-300 ${username === u.username ? 'scale-110 opacity-100' : 'opacity-60 hover:opacity-100 hover:scale-105'}`}>
                          <div className={`w-12 h-12 rounded-full overflow-hidden border-[3px] ${username === u.username ? 'border-brand-500 shadow-[0_0_15px_rgba(34,197,94,0.6)]' : 'border-slate-800'}`}>
                            <img src={u.avatar_url || 'logo.png'} alt={u.username} className="w-full h-full object-cover" />
                          </div>
                          <span className="text-[9px] mt-2 text-brand-400 font-bold tracking-wide">{u.username.split(' ')[0]}</span>
                        </div>
                      ))}
                    </div>
                  )}
                </div>

                {username && (() => {
                  const selectedUser = users.find(u => u.username === username);
                  if (!selectedUser) return null;
                  return (
                    <div className="flex justify-center animate-fade-in">
                      {selectedUser.is_temp_password ? (
                        <span className="px-3 py-1 bg-amber-500/10 text-amber-500 border border-amber-500/30 rounded-full text-[9px] font-bold uppercase tracking-wider flex items-center gap-1.5 animate-pulse">
                          <MaterialIcon name="warning" className="text-xs" /> Temporary Password
                        </span>
                      ) : (
                        <span className="px-3 py-1 bg-brand-500/10 text-brand-400 border border-brand-500/30 rounded-full text-[9px] font-bold uppercase tracking-wider flex items-center gap-1.5">
                          <MaterialIcon name="verified_user" className="text-xs" /> Secure Account
                        </span>
                      )}
                    </div>
                  );
                })()}

                <form onSubmit={handleForgotPassword} className="space-y-4">
                  <button type="submit" disabled={loading || !username} className="w-full bg-yellow-600 hover:bg-yellow-500 text-white font-black uppercase tracking-widest text-xs py-4 rounded-xl transition shadow-[0_10px_20px_rgba(234,179,8,0.3)] hover:shadow-[0_15px_30px_rgba(234,179,8,0.4)] hover:-translate-y-0.5 disabled:opacity-50 m3-button m3-button-filled">
                    {loading ? 'Requesting...' : 'Request Reset'}
                  </button>
                  <button type="button" onClick={() => { setView('login'); setUsername(''); }} className="w-full m3-button m3-button-tonal py-3 rounded-xl text-slate-400 hover:text-white transition">Back to Login</button>
                </form>
              </div>
            )}
          </div>
        </div>
      );
    }

    function SectionAccessModal({ type, settings, onSave, onClose, currentUser, users }) {
      const isAdmin = currentUser?.role === 'admin';
      const fieldMap = {
        'income': { label: 'Income Section', sLabel: 'ආදායම් අංශය', key: 'allow_income_entry', listKey: 'income_access_list' },
        'expense': { label: 'Expense Section', sLabel: 'වියදම් අංශය', key: 'allow_expense_entry', listKey: 'expense_access_list' },
        'pending': { label: 'Pending Pledges', sLabel: 'පොරොන්දු අංශය', key: 'allow_pledge_entry', listKey: 'pledge_access_list' }
      };

      const config = fieldMap[type];
      const [enabled, setEnabled] = useState(settings[config.key] !== false);
      const [restricted, setRestricted] = useState(!!settings[config.listKey]);
      const [selectedUsernames, setSelectedUsernames] = useState(settings[config.listKey] ? settings[config.listKey].split(',').filter(u => u.trim() !== '') : []);
      const [searchTerm, setSearchTerm] = useState('');
      const [saving, setSaving] = useState(false);

      const handleSave = async () => {
        setSaving(true);
        try {
          const listValue = restricted ? selectedUsernames.join(',') : '';
          await onSave(config.key, enabled, config.listKey, listValue);
          onClose();
        } catch (err) {
          alert("Error saving settings: " + err.message);
        } finally {
          setSaving(false);
        }
      };

      const toggleUser = (username) => {
        setSelectedUsernames(prev =>
          prev.includes(username) ? prev.filter(u => u !== username) : [...prev, username]
        );
      };

      const filteredUsers = users.filter(u =>
        u.username.toLowerCase().includes(searchTerm.toLowerCase())
      );

      return (
        <div className="fixed inset-0 z-[300] flex items-center justify-center bg-black/80 backdrop-blur-sm p-4 animate-fade-in" onClick={onClose}>
          <div className="glass p-8 rounded-[2.5rem] max-w-md w-full border border-white/10 shadow-[0_30px_60px_rgba(0,0,0,0.8)] relative overflow-hidden flex flex-col max-h-[90vh]" onClick={e => e.stopPropagation()}>
            <div className="absolute top-0 left-0 w-full h-1.5 bg-brand-500/20">
              <div className="h-full bg-brand-500" style={{ width: '100%' }}></div>
            </div>

            <button onClick={onClose} className="absolute top-6 right-6 text-slate-400 hover:text-white bg-slate-800/50 w-8 h-8 flex items-center justify-center rounded-full transition">&times;</button>

            <div className="mb-6">
              <h3 className="text-xl font-black text-white tracking-tight">{config.label} Access</h3>
              <p className="text-[10px] font-bold text-brand-400 uppercase tracking-widest mt-1">{config.sLabel} පාලනය</p>
            </div>

            {isAdmin ? (
              <div className="space-y-6 flex-1 flex flex-col overflow-hidden">
                <div className="flex items-center justify-between p-4 rounded-2xl bg-slate-900/50 border border-slate-800">
                  <div className="flex flex-col">
                    <span className="text-sm font-bold text-white">Enable Data Entry</span>
                    <span className="text-[10px] text-slate-500">දත්ත ඇතුළත් කිරීමට ඉඩ දෙන්න</span>
                  </div>
                  <label className="relative inline-flex items-center cursor-pointer">
                    <input type="checkbox" checked={enabled} onChange={e => setEnabled(e.target.checked)} className="sr-only peer" />
                    <div className="w-11 h-6 bg-slate-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-brand-500"></div>
                  </label>
                </div>

                {enabled && (
                  <>
                    <div className="flex items-center justify-between p-4 rounded-2xl bg-slate-900/50 border border-slate-800 animate-fade-in">
                      <div className="flex flex-col">
                        <span className="text-sm font-bold text-white">Specific Members Only</span>
                        <span className="text-[10px] text-slate-500">නිශ්චිත සාමාජිකයින්ට පමණක් ඉඩ දෙන්න</span>
                      </div>
                      <label className="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" checked={restricted} onChange={e => setRestricted(e.target.checked)} className="sr-only peer" />
                        <div className="w-11 h-6 bg-slate-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-brand-500"></div>
                      </label>
                    </div>

                    {restricted && (
                      <div className="flex-1 flex flex-col overflow-hidden animate-fade-in">
                        <div className="relative mb-3">
                          <input
                            type="text"
                            placeholder="Search users..."
                            value={searchTerm}
                            onChange={e => setSearchTerm(e.target.value)}
                            className="w-full bg-slate-900 border border-slate-800 text-xs rounded-xl p-3 outline-none focus:border-brand-500"
                          />
                        </div>
                        <div className="flex-1 overflow-y-auto custom-scrollbar space-y-2 pr-2">
                          {filteredUsers.map(u => (
                            <div
                              key={u.id}
                              onClick={() => toggleUser(u.username)}
                              className={`flex items-center gap-3 p-3 rounded-xl border transition cursor-pointer ${selectedUsernames.includes(u.username) ? 'bg-brand-500/10 border-brand-500/30' : 'bg-slate-900/30 border-slate-800 hover:border-slate-700'}`}
                            >
                              <div className={`w-8 h-8 rounded-full overflow-hidden border ${selectedUsernames.includes(u.username) ? 'border-brand-500' : 'border-slate-700'}`}>
                                <img src={u.avatar_url || 'logo.png'} className="w-full h-full object-cover" />
                              </div>
                              <div className="flex-1">
                                <p className="text-xs font-bold text-white leading-tight">{u.username}</p>
                                <p className="text-[9px] text-slate-500 uppercase font-medium">{u.role}</p>
                              </div>
                              <div className={`w-5 h-5 rounded-md flex items-center justify-center border transition ${selectedUsernames.includes(u.username) ? 'bg-brand-500 border-brand-500' : 'border-slate-700'}`}>
                                {selectedUsernames.includes(u.username) && (
                                  <svg className="w-3 h-3 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={3} d="M5 13l4 4L19 7" /></svg>
                                )}
                              </div>
                            </div>
                          ))}
                        </div>
                        <div className="mt-3 p-3 rounded-xl bg-slate-800/50 text-[10px] text-slate-400 font-medium">
                          Selected: {selectedUsernames.length} users
                        </div>
                      </div>
                    )}
                  </>
                )}

                <div className="flex gap-3 pt-4 border-t border-slate-800">
                  <button onClick={onClose} className="flex-1 py-3.5 rounded-2xl text-xs font-black uppercase tracking-widest bg-slate-800 text-slate-300 hover:bg-slate-700 transition-all m3-button m3-button-tonal">Cancel</button>
                  <button onClick={handleSave} disabled={saving} className="flex-1 py-3.5 rounded-2xl text-xs font-black uppercase tracking-widest bg-brand-600 hover:bg-brand-500 text-white transition-all shadow-lg shadow-brand-500/20 disabled:opacity-50 m3-button m3-button-filled magnetic-button">
                    {saving ? 'Saving...' : 'Save Settings'}
                  </button>
                </div>
              </div>
            ) : (
              <div className="flex flex-col items-center py-6 text-center">
                <div className="w-16 h-16 bg-blue-500/10 text-blue-400 rounded-2xl flex items-center justify-center mb-6">
                  <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" /></svg>
                </div>
                <p className="text-sm text-slate-300 font-bold mb-2">Access controlled by admin</p>
                <p className="text-xs text-slate-500 leading-relaxed">මෙම අංශයේ දත්ත ඇතුළත් කිරීමේ අවසරය ප්‍රධාන පාලක (Admin) විසින් තීරණය කරනු ලැබේ.</p>
                <button onClick={onClose} className="mt-8 w-full py-3.5 rounded-2xl text-xs font-black uppercase tracking-widest bg-slate-800 text-white hover:bg-slate-700 transition-all m3-button m3-button-tonal">Got It</button>
              </div>
            )}
          </div>
        </div>
      );
    }

    // --- DONATIONS VIEW COMPONENT ---
    function DonationsView({ incomes, users, setActiveTab }) {
      const [phoneSearch, setPhoneSearch] = useState('');
      const [phoneSearchResult, setPhoneSearchResult] = useState(null); // null | 'found' | 'not_found'
      const [phoneMatches, setPhoneMatches] = useState([]);
      const [filterCat, setFilterCat] = useState('all'); // all, pledge, cash, goods
      const [searchTerm, setSearchTerm] = useState('');
      const [receiptModal, setReceiptModal] = useState(null); // {donation}
      const [verifyPhone, setVerifyPhone] = useState('');
      const [verifyStatus, setVerifyStatus] = useState(null); // null | 'ok' | 'fail' | 'no_phone'
      const [receiptCanvas, setReceiptCanvas] = useState(null);
      const [canvasLoading, setCanvasLoading] = useState(false);

      // Combined all donations sorted by date desc
      const allDonations = useMemo(() => {
        return [...incomes].sort((a, b) => {
          const da = new Date(a.created_at || a.date);
          const db = new Date(b.created_at || b.date);
          return db - da;
        });
      }, [incomes]);

      const filtered = useMemo(() => {
        return allDonations.filter(d => {
          if (filterCat === 'pledge' && d.status !== 'Promised') return false;
          if (filterCat === 'cash' && (d.status === 'Promised' || d.donation_type !== 'Cash')) return false;
          if (filterCat === 'goods' && (d.status === 'Promised' || d.donation_type !== 'Goods')) return false;
          if (searchTerm) {
            const l = searchTerm.toLowerCase();
            return (d.name?.toLowerCase().includes(l) || d.phone_number?.includes(l) || d.item_description?.toLowerCase().includes(l));
          }
          return true;
        });
      }, [allDonations, filterCat, searchTerm]);

      const handlePhoneSearch = () => {
        const q = phoneSearch.trim();
        if (!q) return;
        const matches = allDonations.filter(d => d.phone_number && d.phone_number.replace(/\s/g, '') === q.replace(/\s/g, ''));
        if (matches.length > 0) {
          setPhoneMatches(matches);
          setPhoneSearchResult('found');
        } else {
          setPhoneMatches([]);
          setPhoneSearchResult('not_found');
        }
      };

      const openReceiptModal = (donation) => {
        setReceiptModal(donation);
        setVerifyPhone('');
        setVerifyStatus(null);
        setReceiptCanvas(null);
      };

      const handleVerifyPhone = async () => {
        if (!receiptModal) return;
        const donorPhone = receiptModal.phone_number ? receiptModal.phone_number.replace(/\s/g, '') : null;
        if (!donorPhone) {
          setVerifyStatus('no_phone');
          return;
        }
        if (verifyPhone.replace(/\s/g, '') === donorPhone) {
          setVerifyStatus('ok');
          setCanvasLoading(true);
          try {
            const canvas = await generateReceiptCanvas(receiptModal);
            setReceiptCanvas(canvas);
          } catch (e) { }
          setCanvasLoading(false);
        } else {
          setVerifyStatus('fail');
        }
      };

      const doDownloadPNG = () => {
        if (!receiptCanvas || !receiptModal) return;
        const a = document.createElement('a');
        a.href = receiptCanvas.toDataURL('image/png', 1.0);
        a.download = `Receipt_${getReceiptShortId(receiptModal)}.png`;
        a.click();
      };

      const doDownloadPDF = () => {
        if (!receiptCanvas || !receiptModal) return;
        const dataUrl = receiptCanvas.toDataURL('image/png', 1.0);
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF('p', 'px', [800, 1100]);
        pdf.addImage(dataUrl, 'PNG', 0, 0, 800, 1100);
        pdf.save(`Receipt_${getReceiptShortId(receiptModal)}.pdf`);
      };

      const getCatStyle = (d) => {
        if (d.status === 'Promised') return { dot: 'bg-yellow-500', badge: 'bg-yellow-500/15 text-yellow-400 border-yellow-500/30', row: 'border-l-yellow-500' };
        if (d.donation_type === 'Goods') return { dot: 'bg-purple-500', badge: 'bg-purple-500/15 text-purple-400 border-purple-500/30', row: 'border-l-purple-500' };
        return { dot: 'bg-emerald-500', badge: 'bg-emerald-500/15 text-emerald-400 border-emerald-500/30', row: 'border-l-emerald-500' };
      };

      const getCatLabel = (d) => {
        if (d.status === 'Promised') return 'Pledge';
        if (d.donation_type === 'Goods') return 'Goods';
        return 'Cash';
      };

      return (
        <div className="space-y-6" id="donations-view">
          <h2 className="text-2xl font-bold text-white flex flex-col">
            <span>All Donations Overview</span>
            <span className="text-sm text-slate-400 font-normal">සියලුම පරිත්‍යාග දළ විශ්ලේෂණය</span>
          </h2>

          {/* Phone Search Hero Card */}
          <div className="glass-card rounded-3xl p-6 border border-slate-700/50 bg-gradient-to-br from-indigo-900/20 to-slate-900/30 relative overflow-hidden">
            <div className="absolute top-0 right-0 w-56 h-56 bg-indigo-500/10 blur-[80px] rounded-full pointer-events-none"></div>
            <div className="relative z-10">
              <div className="flex items-center gap-3 mb-4">
                <div className="w-10 h-10 rounded-2xl bg-indigo-500/20 text-indigo-400 flex items-center justify-center">
                  <MaterialIcon name="phone_in_talk" />
                </div>
                <div>
                  <h3 className="font-bold text-white text-sm">Search Donations by Phone</h3>
                  <p className="text-[10px] text-slate-400">දුරකතන අංකයෙන් පරිත්‍යාග සොයන්න</p>
                </div>
              </div>
              <div className="flex gap-3 flex-col sm:flex-row">
                <input
                  type="tel"
                  value={phoneSearch}
                  onChange={e => { setPhoneSearch(e.target.value); setPhoneSearchResult(null); setPhoneMatches([]); }}
                  onKeyDown={e => e.key === 'Enter' && handlePhoneSearch()}
                  placeholder="eg: 071 615 5666"
                  className="flex-1 bg-slate-900/70 border border-slate-700 text-white rounded-2xl px-5 py-3 outline-none focus:border-indigo-500 transition text-sm font-medium placeholder-slate-600"
                />
                <button onClick={handlePhoneSearch} className="px-6 py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-2xl transition flex items-center gap-2 text-sm shadow-lg shadow-indigo-500/20 whitespace-nowrap">
                  <MaterialIcon name="search" /> Search / සොයන්න
                </button>
              </div>

              {phoneSearchResult === 'not_found' && (
                <div className="mt-4 p-4 bg-red-500/10 border border-red-500/20 rounded-2xl animate-fade-in flex items-start gap-3">
                  <div className="w-8 h-8 rounded-full bg-red-500/20 text-red-400 flex items-center justify-center shrink-0"><MaterialIcon name="error" /></div>
                  <div>
                    <p className="text-red-400 font-bold text-sm">Donations not found / පරිත්‍යාග හමු නොවිණ</p>
                    <p className="text-red-300/70 text-xs mt-1">පද්ධතියේ දැනට මෙම දුරකතන අංකය සඳහා පරිත්‍යාග උඩුගත වී නොමැත, දුරකතන අංකය වැරදී හෝ ඇත, නැවත check කරන්න.</p>
                  </div>
                </div>
              )}

              {phoneSearchResult === 'found' && phoneMatches.length > 0 && (
                <div className="mt-4 animate-fade-in">
                  <div className="flex items-center gap-2 mb-3">
                    <div className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></div>
                    <p className="text-emerald-400 font-bold text-sm">{phoneMatches.length} donation(s) found for this number</p>
                  </div>
                  <div className="space-y-2 max-h-64 overflow-y-auto pr-1">
                    {phoneMatches.map(d => {
                      const cs = getCatStyle(d);
                      return (
                        <div key={d.id} className={`flex items-center justify-between p-3 bg-slate-900/60 rounded-xl border border-l-4 ${cs.row} border-slate-800`}>
                          <div className="flex items-center gap-3">
                            <div>
                              <div className="font-semibold text-white text-sm">{d.name}</div>
                              <div className="text-xs text-slate-400">{formatDate(d.date)} • <span className={`px-1.5 py-0.5 rounded text-[10px] font-bold border ${cs.badge}`}>{getCatLabel(d)}</span></div>
                            </div>
                          </div>
                          <div className="flex items-center gap-2">
                            <span className="font-bold text-sm text-slate-200">
                              {d.donation_type === 'Cash' ? formatCurrency(d.amount) : `${d.item_description} x${d.quantity}`}
                            </span>
                            {d.status !== 'Promised' && (
                              <button onClick={() => openReceiptModal(d)} className="px-3 py-1.5 bg-indigo-500/20 text-indigo-400 border border-indigo-500/30 rounded-lg text-xs font-bold hover:bg-indigo-500/30 transition flex items-center gap-1">
                                <MaterialIcon name="download" /> Receipt
                              </button>
                            )}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}
            </div>
          </div>

          {/* Category Legend + Filters */}
          <div className="flex flex-wrap items-center gap-3">
            <div className="flex gap-2 flex-wrap">
              {[
                { key: 'all', label: 'All / සියල්ල', color: 'text-slate-300 border-slate-700' },
                { key: 'cash', label: 'Cash / මුදල්', color: 'text-emerald-400 border-emerald-500/40' },
                { key: 'goods', label: 'Goods / ද්‍රව්‍ය', color: 'text-purple-400 border-purple-500/40' },
                { key: 'pledge', label: 'Pledges / පොරොන්දු', color: 'text-yellow-400 border-yellow-500/40' },
              ].map(c => (
                <button key={c.key} onClick={() => setFilterCat(c.key)} className={`px-4 py-1.5 rounded-full text-xs font-bold border transition-all ${filterCat === c.key ? 'bg-white/10 ' + c.color : 'bg-transparent text-slate-500 border-slate-800 hover:border-slate-700'}`}>
                  {c.label}
                </button>
              ))}
            </div>
            <input type="text" value={searchTerm} onChange={e => setSearchTerm(e.target.value)} placeholder="Search name / phone..." className="ml-auto bg-slate-900 border border-slate-700 text-white text-xs rounded-xl px-4 py-2 outline-none focus:border-brand-500 w-full sm:w-56" />
          </div>

          {/* Color Legend */}
          <div className="flex flex-wrap gap-4 px-1">
            <div className="flex items-center gap-2"><div className="w-3 h-3 rounded-sm bg-emerald-500"></div><span className="text-xs text-slate-400">Cash Donation</span></div>
            <div className="flex items-center gap-2"><div className="w-3 h-3 rounded-sm bg-purple-500"></div><span className="text-xs text-slate-400">Goods Donation</span></div>
            <div className="flex items-center gap-2"><div className="w-3 h-3 rounded-sm bg-yellow-500"></div><span className="text-xs text-slate-400">Pledge (Pending)</span></div>
          </div>

          {/* Table */}
          {filtered.length === 0 ? (
            <div className="text-center py-16 border border-dashed border-slate-700 rounded-2xl text-slate-400">
              No records found. / වාර්තා නොමැත.
            </div>
          ) : (
            <div className="overflow-x-auto rounded-2xl border border-slate-800 bg-slate-900/30">
              <table className="w-full text-sm text-slate-300 min-w-[750px]">
                <thead>
                  <tr className="text-xs text-slate-500 uppercase bg-slate-900/70 border-b border-slate-800">
                    <th className="px-4 py-3 text-left rounded-tl-2xl">Date / Time<br /><span className="text-[9px] text-brand-400 font-normal normal-case">දිනය / වේලාව</span></th>
                    <th className="px-4 py-3 text-left">Name<br /><span className="text-[9px] text-brand-400 font-normal normal-case">නම</span></th>
                    <th className="px-4 py-3 text-left">Type<br /><span className="text-[9px] text-brand-400 font-normal normal-case">ආකාරය</span></th>
                    <th className="px-4 py-3 text-center">Status<br /><span className="text-[9px] text-brand-400 font-normal normal-case">තත්ත්වය</span></th>
                    <th className="px-4 py-3 text-right">Amount / Details<br /><span className="text-[9px] text-brand-400 font-normal normal-case">මුදල / විස්තර</span></th>
                    <th className="px-4 py-3 text-center rounded-tr-2xl">Action<br /><span className="text-[9px] text-brand-400 font-normal normal-case">ක්‍රියාව</span></th>
                  </tr>
                </thead>
                <tbody>
                  {filtered.map((d, idx) => {
                    const cs = getCatStyle(d);
                    const isPending = d.status === 'Promised';
                    const dt = new Date(d.created_at || d.date);
                    return (
                      <tr key={d.id} className={`border-b border-slate-800/60 hover:bg-slate-800/30 transition border-l-2 ${cs.row}`}>
                        <td className="px-4 py-3 whitespace-nowrap">
                          <div className="font-medium text-slate-200 text-xs">{formatDate(d.date)}</div>
                          <div className="text-[10px] text-slate-500">{d.created_at ? new Date(d.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : ''}</div>
                        </td>
                        <td className="px-4 py-3">
                          <div className="font-semibold text-slate-200 text-sm">{d.name || '—'}</div>
                          {d.phone_number && <div className="text-[10px] text-slate-500 mt-0.5">{d.phone_number}</div>}
                        </td>
                        <td className="px-4 py-3">
                          <span className={`px-2.5 py-1 rounded-full text-[10px] font-bold border ${cs.badge}`}>{getCatLabel(d)}</span>
                        </td>
                        <td className="px-4 py-3 text-center">
                          {isPending ? (
                            <span className="px-2 py-1 rounded-full text-[10px] font-bold bg-yellow-500/10 text-yellow-400 border border-yellow-500/30">Pending</span>
                          ) : (
                            <span className="px-2 py-1 rounded-full text-[10px] font-bold bg-emerald-500/10 text-emerald-400 border border-emerald-500/30">✓ Received</span>
                          )}
                        </td>
                        <td className="px-4 py-3 text-right font-semibold">
                          {d.donation_type === 'Cash' ? (
                            <span className="text-emerald-400">{formatCurrency(d.amount)}</span>
                          ) : d.status === 'Promised' && d.donation_type === 'Cash' ? (
                            <span className="text-yellow-400">{formatCurrency(d.amount)}</span>
                          ) : (
                            <span className="text-purple-400 text-xs">{d.item_description} <span className="text-slate-500">×{d.quantity}</span></span>
                          )}
                        </td>
                        <td className="px-4 py-3 text-center">
                          {!isPending && (
                            <button onClick={() => openReceiptModal(d)} className="inline-flex items-center gap-1 px-3 py-1.5 bg-indigo-500/20 text-indigo-400 border border-indigo-500/30 rounded-xl text-xs font-bold hover:bg-indigo-500/30 transition">
                              <MaterialIcon name="receipt_long" /> Receipt
                            </button>
                          )}
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          )}

          {/* Receipt Verify Modal */}
          {receiptModal && (
            <div className="fixed inset-0 z-[500] flex items-center justify-center bg-black/85 backdrop-blur-md p-4 animate-fade-in" onClick={() => setReceiptModal(null)}>
              <div className="glass rounded-[2.5rem] max-w-md w-full border border-white/10 shadow-[0_40px_80px_rgba(0,0,0,0.9)] overflow-hidden relative" onClick={e => e.stopPropagation()}>
                <div className="absolute top-0 left-0 w-full h-1.5 bg-indigo-500"></div>
                <div className="p-8">
                  <button onClick={() => setReceiptModal(null)} className="absolute top-5 right-5 w-8 h-8 rounded-full bg-white/5 text-slate-400 hover:text-white flex items-center justify-center transition">×</button>

                  <div className="text-center mb-6">
                    <div className="w-16 h-16 rounded-2xl bg-indigo-500/20 text-indigo-400 flex items-center justify-center mx-auto mb-4">
                      <MaterialIcon name="receipt_long" className="text-3xl" />
                    </div>
                    <h3 className="text-xl font-black text-white">Download Receipt</h3>
                    <p className="text-[10px] font-bold text-indigo-400 uppercase tracking-widest mt-1">රිසිට්පත බාගන්න</p>
                  </div>

                  <div className="bg-slate-900/60 rounded-2xl p-4 mb-6 border border-slate-800 space-y-2">
                    <div className="flex justify-between text-xs"><span className="text-slate-400">Donor</span><span className="font-bold text-white">{receiptModal.name}</span></div>
                    <div className="flex justify-between text-xs"><span className="text-slate-400">Date</span><span className="font-bold text-white">{formatDate(receiptModal.date)}</span></div>
                    <div className="flex justify-between text-xs"><span className="text-slate-400">Type</span><span className="font-bold text-white">{receiptModal.donation_type}</span></div>
                    <div className="flex justify-between text-xs">
                      <span className="text-slate-400">Amount</span>
                      <span className="font-bold text-emerald-400">{receiptModal.donation_type === 'Cash' ? formatCurrency(receiptModal.amount) : `${receiptModal.item_description} ×${receiptModal.quantity}`}</span>
                    </div>
                  </div>

                  {verifyStatus !== 'ok' && (
                    <>
                      <p className="text-xs text-slate-300 mb-3 text-center leading-relaxed">
                        ආරක්ෂාව සඳහා, රිසිට්පත බාගැනීමට ඔබේ දුරකතන අංකය ඇතුළත් කරන්න.
                      </p>
                      <div className="relative mb-4">
                        <MaterialIcon name="phone" className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-500" />
                        <input
                          type="tel"
                          value={verifyPhone}
                          onChange={e => { setVerifyPhone(e.target.value); setVerifyStatus(null); }}
                          placeholder="Enter your phone number"
                          className="w-full bg-slate-900 border border-slate-700 text-white rounded-2xl pl-12 pr-4 py-3.5 outline-none focus:border-indigo-500 transition text-sm"
                        />
                      </div>

                      {verifyStatus === 'fail' && (
                        <div className="bg-red-500/10 border border-red-500/20 p-3 rounded-xl mb-4 text-center animate-fade-in">
                          <p className="text-red-400 text-xs font-bold">Phone number does not match / දුරකතන අංකය නොගැලපේ.</p>
                          <p className="text-red-300/70 text-[10px] mt-1">නිවැරදි දුරකතන අංකය ඇතුළත් කරන්න.</p>
                        </div>
                      )}
                      {verifyStatus === 'no_phone' && (
                        <div className="bg-amber-500/10 border border-amber-500/20 p-3 rounded-xl mb-4 text-center animate-fade-in">
                          <p className="text-amber-400 text-xs font-bold">සමාවන්න!</p>
                          <p className="text-amber-300/70 text-[10px] mt-1">කරුණාකර පනහකූඩුව නිර්මානය කරන පුද්ගලයන් හමු වන්න, ඔබගේ පරිත්‍යාගය සඳහා නිවැරදි දුරකතන අංකය පද්ධතියට ඇතුළත් කරගන්න.</p>
                        </div>
                      )}

                      <button onClick={handleVerifyPhone} disabled={!verifyPhone.trim()} className="w-full py-3.5 bg-indigo-600 hover:bg-indigo-500 text-white font-black uppercase tracking-widest text-xs rounded-2xl transition disabled:opacity-40">
                        Verify & Unlock / තහවුරු කරන්න
                      </button>
                    </>
                  )}

                  {verifyStatus === 'ok' && (
                    <div className="animate-fade-in">
                      <div className="flex items-center justify-center gap-2 mb-5 p-3 bg-emerald-500/10 border border-emerald-500/20 rounded-2xl">
                        <MaterialIcon name="verified" className="text-emerald-400" />
                        <span className="text-emerald-400 font-bold text-sm">Verified! Download your receipt.</span>
                      </div>
                      {canvasLoading ? (
                        <div className="flex justify-center py-4">
                          <div className="w-8 h-8 border-4 border-indigo-500/20 border-t-indigo-500 rounded-full animate-spin"></div>
                        </div>
                      ) : receiptCanvas && (
                        <>
                          <div className="rounded-xl overflow-hidden border border-slate-700 mb-4 max-h-48 flex items-center justify-center bg-white">
                            <img src={receiptCanvas.toDataURL()} alt="Receipt Preview" className="w-full object-contain" />
                          </div>
                          <div className="flex gap-3">
                            <button onClick={doDownloadPNG} className="flex-1 py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-2xl text-xs flex items-center justify-center gap-2 transition">
                              <MaterialIcon name="image" /> PNG
                            </button>
                            <button onClick={doDownloadPDF} className="flex-1 py-3 bg-red-600 hover:bg-red-500 text-white font-bold rounded-2xl text-xs flex items-center justify-center gap-2 transition">
                              <MaterialIcon name="picture_as_pdf" /> PDF
                            </button>
                          </div>
                        </>
                      )}
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // --- MAIN APP COMPONENT ---
    function App() {
      const [currentUser, setCurrentUser] = useState(() => {
        const savedUser = localStorage.getItem('vesak_current_user');
        return savedUser ? JSON.parse(savedUser) : null;
      });
      const [showBalanceOnly, setShowBalanceOnly] = useState(false);
      const [activeTab, setActiveTab] = useState('dashboard');
      const [projectSettings, setProjectSettings] = useState({
        project_financial_goal: 100000,
        allow_income_entry: true,
        allow_expense_entry: true,
        allow_pledge_entry: true
      });
      const [showFaceIdSetup, setShowFaceIdSetup] = useState(false);

      useEffect(() => {
        if (currentUser) {
          localStorage.setItem('vesak_current_user', JSON.stringify(currentUser));
          if (typeof window.requestFCMPermission === 'function') {
            window.requestFCMPermission(currentUser.id);
          }
          registerSession(currentUser.id);
        } else {
          localStorage.removeItem('vesak_current_user');
        }
      }, [currentUser]);

      const registerSession = async (userId) => {
        try {
          let ip = "Unknown IP", loc = "Unknown Location";
          try {
            const res = await fetch('https://get.geojs.io/v1/ip/geo.json');
            const data = await res.json();
            if (data.ip) {
              ip = data.ip;
              loc = `${data.city || ''}, ${data.country || ''}`.replace(/^, | , $/g, '').trim();
            }
          } catch (e) {
            console.log("GeoJS failed, trying fallback...");
            try {
              const fallbackRes = await fetch('https://api.db-ip.com/v2/free/self');
              const fallbackData = await fallbackRes.json();
              if (fallbackData.ipAddress) {
                ip = fallbackData.ipAddress;
                loc = `${fallbackData.city || ''}, ${fallbackData.countryName || ''}`.replace(/^, | , $/g, '').trim();
              }
            } catch (fallbackErr) {
              console.error("IP fetch failed", fallbackErr);
            }
          }

          let sessionToken = localStorage.getItem('vesak_session_token');
          if (!sessionToken) {
            sessionToken = 'sess_' + Math.random().toString(36).substr(2, 9) + '_' + Date.now();
            localStorage.setItem('vesak_session_token', sessionToken);
          }

          const ua = navigator.userAgent;
          let browser = "Unknown Browser";
          if (ua.includes("Firefox/")) browser = "Firefox";
          else if (ua.includes("Edg/")) browser = "Edge";
          else if (ua.includes("Chrome/")) browser = "Chrome";
          else if (ua.includes("Safari/") && !ua.includes("Chrome")) browser = "Safari";

          let os = "Unknown OS";
          if (ua.includes("Win")) os = "Windows";
          else if (ua.includes("Mac")) os = "MacOS";
          else if (ua.includes("Linux")) os = "Linux";
          else if (ua.includes("Android")) os = "Android";
          else if (ua.includes("like Mac")) os = "iOS";

          const deviceName = `${os} - ${browser}`;

          await supabase.from('user_sessions').upsert({
            session_token: sessionToken,
            user_id: userId,
            device_name: deviceName,
            location: loc,
            ip_address: ip,
            last_active: new Date().toISOString(),
            is_online: true
          }, { onConflict: 'session_token' });
        } catch (err) { console.error('Session Error:', err); }
      };

      const [users, setUsers] = useState([]);
      const [incomes, setIncomes] = useState([]);
      const [expenses, setExpenses] = useState([]);
      const [loading, setLoading] = useState(true);
      const [notification, setNotification] = useState(null);
      const [notifications, setNotifications] = useState([]);
      const [isNotificationModalOpen, setIsNotificationModalOpen] = useState(false);
      const [hasUnreadNotifications, setHasUnreadNotifications] = useState(false);
      const [viewingReceipt, setViewingReceipt] = useState(null);

      const ReceiptModal = ({ url, title, onClose }) => {
        const [zoomLevel, setZoomLevel] = useState(1);
        const [imgPos, setImgPos] = useState({ x: 0, y: 0 });
        const [isDragging, setIsDragging] = useState(false);
        const [dragStart, setDragStart] = useState({ x: 0, y: 0 });

        const handleZoomIn = () => setZoomLevel(z => Math.min(z + 0.5, 5));
        const handleZoomOut = () => {
          setZoomLevel(z => {
            const nz = Math.max(z - 0.5, 1);
            if (nz === 1) setImgPos({ x: 0, y: 0 });
            return nz;
          });
        };
        const handleWheel = (e) => {
          e.preventDefault();
          if (e.deltaY < 0) handleZoomIn();
          else handleZoomOut();
        };
        const handleImgMouseDown = (e) => {
          if (zoomLevel <= 1) return;
          e.preventDefault();
          setIsDragging(true);
          setDragStart({ x: e.clientX - imgPos.x, y: e.clientY - imgPos.y });
        };
        const handleImgMouseMove = (e) => {
          if (!isDragging) return;
          setImgPos({ x: e.clientX - dragStart.x, y: e.clientY - dragStart.y });
        };
        const handleImgMouseUp = () => setIsDragging(false);
        const handleTouchStart = (e) => {
          if (zoomLevel <= 1 || e.touches.length !== 1) return;
          setIsDragging(true);
          setDragStart({ x: e.touches[0].clientX - imgPos.x, y: e.touches[0].clientY - imgPos.y });
        };
        const handleTouchMove = (e) => {
          if (!isDragging || e.touches.length !== 1) return;
          setImgPos({ x: e.touches[0].clientX - dragStart.x, y: e.touches[0].clientY - dragStart.y });
        };
        const handleTouchEnd = () => setIsDragging(false);

        return (
          <div className="fixed inset-0 z-[9999] flex items-center justify-center bg-black/90 backdrop-blur-xl animate-fade-in"
            onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}
            onMouseMove={handleImgMouseMove}
            onMouseUp={handleImgMouseUp}
            onMouseLeave={handleImgMouseUp}
            style={{ touchAction: 'none' }}
          >
            {/* Top bar */}
            <div className="absolute top-0 left-0 right-0 flex items-center justify-between px-6 py-4 z-10" style={{ background: 'linear-gradient(180deg,rgba(0,0,0,0.8) 0%,transparent 100%)' }}>
              <div className="flex flex-col text-left">
                <span className="text-white text-base font-black tracking-tight truncate max-w-[200px] sm:max-w-none">{title || 'Receipt'}</span>
                <span className="text-slate-400 text-xs font-bold uppercase tracking-wider mt-0.5">බිල්පත / Receipt</span>
              </div>
              <button onClick={onClose} className="w-10 h-10 flex items-center justify-center rounded-full bg-white/10 hover:bg-white/20 text-white text-xl transition">&times;</button>
            </div>

            {/* Image container */}
            <div className="relative w-full h-full flex items-center justify-center overflow-hidden p-4"
              onWheel={handleWheel}
              onTouchStart={handleTouchStart}
              onTouchMove={handleTouchMove}
              onTouchEnd={handleTouchEnd}
            >
              <img
                src={url}
                alt="Receipt"
                className="max-w-[90vw] max-h-[80vh] object-contain rounded-xl shadow-2xl select-none border border-white/5"
                style={{
                  transform: `scale(${zoomLevel}) translate(${imgPos.x / zoomLevel}px, ${imgPos.y / zoomLevel}px)`,
                  cursor: zoomLevel > 1 ? (isDragging ? 'grabbing' : 'grab') : 'default',
                  transition: isDragging ? 'none' : 'transform 0.2s ease'
                }}
                onMouseDown={handleImgMouseDown}
                draggable={false}
              />
            </div>

            {/* Bottom controls */}
            <div className="absolute bottom-8 left-1/2 -translate-x-1/2 flex items-center gap-3 bg-slate-900/80 backdrop-blur-md rounded-full px-5 py-3 border border-white/10 shadow-2xl">
              <button onClick={handleZoomOut} disabled={zoomLevel <= 1} className="w-9 h-9 flex items-center justify-center rounded-full bg-white/10 hover:bg-white/20 text-white text-lg font-bold transition disabled:opacity-30 disabled:cursor-not-allowed">−</button>
              <span className="text-white text-xs font-black min-w-[50px] text-center">{Math.round(zoomLevel * 100)}%</span>
              <button onClick={handleZoomIn} disabled={zoomLevel >= 5} className="w-9 h-9 flex items-center justify-center rounded-full bg-white/10 hover:bg-white/20 text-white text-lg font-bold transition disabled:opacity-30 disabled:cursor-not-allowed">+</button>
              <div className="w-px h-6 bg-white/20"></div>
              <button onClick={() => { setZoomLevel(1); setImgPos({ x: 0, y: 0 }); }} className="w-9 h-9 flex items-center justify-center rounded-full bg-white/10 hover:bg-white/20 text-white transition" title="Reset Zoom">
                <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.5} d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>
              </button>
              <button onClick={() => window.open(url, '_blank')} className="w-9 h-9 flex items-center justify-center rounded-full bg-white/10 hover:bg-white/20 text-white transition" title="Open in New Tab">
                <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.5} d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" /></svg>
              </button>
            </div>
          </div>
        );
      };

      const showNotification = (data) => {
        setNotification(data);
        // No auto-dismiss — user must press OK or tap backdrop
      };


      // URL Hash Navigation Logic
      useEffect(() => {
        const handleHashChange = () => {
          const hash = window.location.hash.replace('#', '');
          const validTabs = ['dashboard', 'income-page', 'income-list', 'event-income-list', 'goods-list', 'expense-page', 'expense-list', 'pledges', 'profile', 'donations-view'];
          if (hash && validTabs.includes(hash)) {
            setActiveTab(hash);
          }
        };

        window.addEventListener('hashchange', handleHashChange);
        // Initial check
        handleHashChange();
        return () => window.removeEventListener('hashchange', handleHashChange);
      }, []);

      useEffect(() => {
        window.location.hash = activeTab;
      }, [activeTab]);

      // FCM Foreground Handler removed to prevent duplicate toasts.
      // Notifications are handled by onComplete callbacks and Supabase DB polling.

      // Scheduled Reminders (8 AM & 8 PM)
      useEffect(() => {
        if (!currentUser) return;

        const checkReminders = () => {
          const now = new Date();
          const hours = now.getHours();
          const mins = now.getMinutes();
          const today = now.toISOString().split('T')[0];
          const lastReminderKey = `vesak_last_reminder_${currentUser.id}`;
          const lastReminder = localStorage.getItem(lastReminderKey);

          // Check if it's around 8 AM or 8 PM
          const isMorning = hours === 8 && mins < 30;
          const isEvening = hours === 20 && mins < 30;

          if ((isMorning || isEvening) && lastReminder !== `${today}_${hours}`) {
            // Only send reminder if user is a contributor and has a goal
            if (currentUser.is_contributor) {
              const target = Number(currentUser.contribution_goal) || 10000;
              const totalCont = incomes.filter(i => {
                const firstWord = currentUser.username.split(' ')[0].toLowerCase();
                return i.name?.toLowerCase().includes(firstWord) && i.status === 'Received Today' && i.donation_type === 'Cash';
              }).reduce((sum, i) => sum + Number(i.amount || 0), 0);

              const remaining = Math.round(target - totalCont);
              if (remaining > 0) {
                const title = "🔔 Payment Reminder";
                const body = `ඔබගේ ඉතිරි දායකත්ව මුදල වන Rs. ${remaining.toLocaleString()} හැකි ඉක්මනින් ලබා දී සහයෝගය දක්වන්න.`;

                showNotification({ title, sTitle: 'Reminder', details: [{ label: 'Remaining', value: `Rs. ${remaining.toLocaleString()}` }] });

                supabase.from('notifications').insert([{
                  title, body, type: 'reminder', user_id: currentUser.id
                }]).then(() => fetchData());

                localStorage.setItem(lastReminderKey, `${today}_${hours}`);
              }
            }
          }
        };

        checkReminders();
        const interval = setInterval(checkReminders, 60000 * 5); // Check every 5 mins
        return () => clearInterval(interval);
      }, [currentUser, incomes]);

      const fetchData = async () => {
        setLoading(true);
        try {
          // Build notifications query conditionally to avoid passing 'undefined' as a value
          let notifQuery;
          if (currentUser && currentUser.id) {
            // Fetch notifications meant for everyone (user_id is null) OR specifically for the current user
            notifQuery = supabase.from('notifications').select('*').or(`user_id.is.null,user_id.eq.${currentUser.id}`).order('created_at', { ascending: false }).limit(50);
          } else {
            // No authenticated user — only fetch notifications that are global (user_id is NULL)
            notifQuery = supabase.from('notifications').select('*').is('user_id', null).order('created_at', { ascending: false }).limit(50);
          }

          const [incRes, expRes, usersRes, notifRes, settingsRes] = await Promise.all([
            supabase.from('incomes').select('*').or('event_type.eq.vesak,event_type.is.null').order('created_at', { ascending: false }),
            supabase.from('expenses').select('*').or('event_type.eq.vesak,event_type.is.null').order('created_at', { ascending: false }),
            supabase.from('app_users').select('*'),
            notifQuery,
            supabase.from('project_settings').select('*').maybeSingle()
          ]);

          if (!usersRes.error) {
            setUsers(usersRes.data || []);
            // Live-sync: update cached currentUser with latest DB data (role, avatar, etc.)
            if (currentUser && usersRes.data) {
              const freshUser = usersRes.data.find(u => u.id === currentUser.id);
              if (freshUser) {
                const keysToSync = ['role', 'avatar_url', 'username', 'phone_number', 'address', 'is_contributor', 'two_factor_enabled', 'two_factor_secret', 'account_status'];
                const needsUpdate = keysToSync.some(k => freshUser[k] !== currentUser[k]);
                if (needsUpdate) {
                  const synced = { ...currentUser, ...Object.fromEntries(keysToSync.map(k => [k, freshUser[k]])) };
                  setCurrentUser(synced);
                  localStorage.setItem('vesak_current_user', JSON.stringify(synced));
                  console.log('🔄 User data synced from DB (role/profile updated)');
                }
              }
            }
          }
          if (!notifRes.error) setNotifications(notifRes.data || []);
          if (!settingsRes.error && settingsRes.data) setProjectSettings(settingsRes.data);

          if (incRes.error) console.error(incRes.error);
          else {
            const incData = incRes.data || [];
            setIncomes(incData);

            // Check for confetti condition!
            const totalCash = incData.filter(i => i.status === 'Received Today' && i.donation_type === 'Cash').reduce((sum, item) => sum + Number(item.amount || 0), 0);
            if (totalCash >= 80000 && activeTab === 'dashboard') {
              setTimeout(() => {
                window.confetti({
                  particleCount: 150,
                  spread: 80,
                  origin: { y: 0.1 },
                  colors: ['#22c55e', '#eab308', '#3b82f6', '#ec4899']
                });
              }, 800);
            }
          }

          if (expRes.error) console.error(expRes.error);
          else setExpenses(expRes.data || []);

        } catch (err) {
          console.error("Fetch error:", err);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        fetchData();
      }, []);

      // Swipe Gestures for Mobile Navigation
      const handleTouchStart = (e) => {
        // Prevent swipe on tables and interactive scroll areas
        if (e.target.closest('.overflow-x-auto') || e.target.closest('table') || e.target.closest('input') || e.target.closest('textarea')) return;
        window.touchStartX = e.changedTouches[0].screenX;
        window.touchStartY = e.changedTouches[0].screenY;
      };

      const handleTouchEnd = (e) => {
        if (window.touchStartX === undefined || window.touchStartX === null) return;

        const touchEndX = e.changedTouches[0].screenX;
        const touchEndY = e.changedTouches[0].screenY;

        const deltaX = touchEndX - window.touchStartX;
        const deltaY = touchEndY - window.touchStartY;

        // Thresholds: min 70px horizontal, and horizontal must be 2x vertical
        if (Math.abs(deltaX) > 70 && Math.abs(deltaX) > Math.abs(deltaY) * 2) {
          const MAIN_TABS = ['dashboard', 'income-page', 'expense-page', 'pledges'];

          // Determine current base tab (handling sub-pages)
          let baseTab = activeTab;
          if (['income-list', 'goods-list', 'event-income-list'].includes(activeTab)) baseTab = 'income-page';
          if (activeTab === 'expense-list') baseTab = 'expense-page';

          const currentIndex = MAIN_TABS.indexOf(baseTab);

          if (currentIndex !== -1) {
            if (deltaX < 0 && currentIndex < MAIN_TABS.length - 1) {
              // Swipe Left -> Go Right
              setActiveTab(MAIN_TABS[currentIndex + 1]);
              window.scrollTo({ top: 0, behavior: 'smooth' });
            } else if (deltaX > 0 && currentIndex > 0) {
              // Swipe Right -> Go Left
              setActiveTab(MAIN_TABS[currentIndex - 1]);
              window.scrollTo({ top: 0, behavior: 'smooth' });
            }
          }
        }
        window.touchStartX = null;
        window.touchStartY = null;
      };

      const navigateTabs = (direction) => {
        const MAIN_TABS = ['dashboard', 'income-page', 'expense-page', 'pledges', 'profile'];
        // Special case for subpages
        let currentBase = activeTab;
        if (['income-list', 'goods-list', 'event-income-list'].includes(activeTab)) currentBase = 'income-page';
        if (activeTab === 'expense-list') currentBase = 'expense-page';

        const currentIndex = MAIN_TABS.indexOf(currentBase);

        const checkAccess = (tab) => {
          if (currentUser?.role === 'admin') return true;

          const mapping = {
            'income-page': { key: 'allow_income_entry', list: 'income_access_list' },
            'expense-page': { key: 'allow_expense_entry', list: 'expense_access_list' },
            'pledges': { key: 'allow_pledge_entry', list: 'pledge_access_list' }
          };

          const config = mapping[tab];
          if (!config) return true;

          if (projectSettings[config.key] === false) return false;

          const list = projectSettings[config.list];
          if (list && list.trim() !== '') {
            const allowedUsers = list.split(',');
            return allowedUsers.includes(currentUser?.username);
          }

          return true;
        };

        const trySetTab = (newTab) => {
          if (!checkAccess(newTab)) {
            alert("Access Restricted: You do not have permission to enter data in this section. / මෙම අංශයට දත්ත ඇතුළත් කිරීමට ඔබට අවසර නොමැත.");
            return;
          }
          setActiveTab(newTab);
        };

        if (direction === 'next' && currentIndex < MAIN_TABS.length - 1) {
          trySetTab(MAIN_TABS[currentIndex + 1]);
        } else if (direction === 'prev' && currentIndex > 0) {
          trySetTab(MAIN_TABS[currentIndex - 1]);
        } else if (direction === 'prev' && currentIndex === -1) {
          setActiveTab('dashboard');
        }
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const handleTabSwitch = (id) => {
        const mapping = {
          'income-page': { key: 'allow_income_entry', list: 'income_access_list' },
          'expense-page': { key: 'allow_expense_entry', list: 'expense_access_list' },
          'pledges': { key: 'allow_pledge_entry', list: 'pledge_access_list' }
        };

        const config = mapping[id];
        if (config && currentUser?.role !== 'admin') {
          if (projectSettings[config.key] === false) {
            alert("Access Restricted: This section is currently disabled by admin. / මෙම අංශය Admin විසින් අත්හිටුවා ඇත.");
            return;
          }
          const list = projectSettings[config.list];
          if (list && list.trim() !== '') {
            const allowedUsers = list.split(',');
            if (!allowedUsers.includes(currentUser?.username)) {
              alert("Access Restricted: You are not authorized to enter data in this section. / මෙම අංශයට දත්ත ඇතුළත් කිරීමට ඔබට අවසර නොමැත.");
              return;
            }
          }
        }
        setActiveTab(id);
      };

      const updateProjectAccess = async (key, value, listKey, listValue) => {
        const updateObj = { [key]: value };
        if (listKey) updateObj[listKey] = listValue;

        const { error } = await supabase
          .from('project_settings')
          .update(updateObj)
          .eq('id', projectSettings.id || 1); // Assuming ID 1 for global settings

        if (!error) {
          setProjectSettings(prev => ({ ...prev, ...updateObj }));
          showNotification({ type: 'success', title: 'Access Updated!', sTitle: 'අවසරයන් යාවත්කාලීන කරන ලදි.' });
        } else throw error;
      };

      // Desktop Top Navigation Button
      const NavigationButton = ({ id, label, sLabel, icon }) => (
        <button
          onClick={() => handleTabSwitch(id)}
          className={`flex items-start gap-3 px-5 py-3.5 rounded-2xl transition-all duration-500 w-auto group relative overflow-hidden ${activeTab === id
            ? 'bg-gradient-to-r from-brand-600/20 to-brand-500/10 text-white shadow-[0_0_20px_rgba(34,197,94,0.15)] border border-brand-500/30'
            : 'text-slate-400 hover:text-white hover:bg-slate-800/80 border border-transparent hover:border-slate-700/50'
            }`}
        >
          {activeTab === id && (
            <div className="absolute inset-0 bg-gradient-to-r from-brand-400/0 via-brand-400/10 to-brand-400/0 translate-x-[-100%] animate-[shimmer_2s_infinite]"></div>
          )}
          <div className={`mt-0.5 transition-transform duration-300 ${activeTab === id ? 'scale-110 text-brand-400 drop-shadow-[0_0_8px_rgba(34,197,94,0.5)]' : 'group-hover:scale-110 group-hover:text-slate-300'}`}>
            {icon}
          </div>
          <div className="flex flex-col text-left relative z-10">
            <span className="font-bold text-sm tracking-wide leading-tight">{label}</span>
            <span className={`text-[10px] font-medium mt-0.5 transition-opacity ${activeTab === id ? 'text-brand-300 opacity-90' : 'opacity-60 group-hover:opacity-100'}`}>{sLabel}</span>
          </div>
          {id === 'pledges' && incomes.filter(i => i.status === 'Promised').length > 0 && (
            <span className="ml-2 self-center px-2 py-0.5 rounded-full bg-yellow-500/20 text-yellow-500 text-[10px] font-extrabold border border-yellow-500/30 shadow-[0_0_10px_rgba(234,179,8,0.3)] animate-pulse">
              {incomes.filter(i => i.status === 'Promised').length}
            </span>
          )}
        </button>
      );

      // Mobile Bottom Fixed Navigation Button
      const MobileNavButton = ({ id, label, sLabel, icon }) => (
        <button
          onClick={() => handleTabSwitch(id)}
          className={`flex flex-col items-center justify-center flex-1 py-2 rounded-2xl transition-all duration-500 relative group overflow-hidden ${activeTab === id
            ? 'text-brand-400 font-bold bg-brand-500/10 shadow-[inset_0_1px_1px_rgba(255,255,255,0.1)] border border-brand-500/20'
            : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/50'
            }`}
        >
          <div className={`mb-1 transition-all duration-300 ${activeTab === id ? '-translate-y-0.5 scale-110 drop-shadow-[0_0_10px_rgba(34,197,94,0.6)]' : 'group-hover:scale-110'}`}>
            {icon}
          </div>
          <span className={`text-[10px] uppercase tracking-wider leading-none transition-all duration-300 ${activeTab === id ? 'font-extrabold' : 'font-medium'}`}>{label}</span>
          <span className={`text-[8px] mt-1 transition-all duration-300 ${activeTab === id ? 'text-brand-300 opacity-100' : 'font-normal opacity-60'}`}>{sLabel}</span>

          {id === 'pledges' && incomes.filter(i => i.status === 'Promised').length > 0 && (
            <span className="absolute top-1.5 right-3 sm:right-6 w-2.5 h-2.5 rounded-full bg-yellow-500 border border-slate-900 shadow-[0_0_10px_rgba(234,179,8,1)] animate-ping" style={{ animationDuration: '2s' }}></span>
          )}
          {id === 'pledges' && incomes.filter(i => i.status === 'Promised').length > 0 && (
            <span className="absolute top-1.5 right-3 sm:right-6 w-2.5 h-2.5 rounded-full bg-yellow-500 border border-slate-900 shadow-[0_0_5px_rgba(234,179,8,0.8)]"></span>
          )}
        </button>
      );

      if (!currentUser) {
        if (showBalanceOnly) {
          const totalInc = incomes.filter(i => i.status === 'Received Today' && i.donation_type === 'Cash').reduce((sum, item) => sum + Number(item.amount || 0), 0);
          const totalExp = expenses.reduce((sum, item) => sum + Number(item.amount_taken || 0), 0);
          const currentBalance = totalInc - totalExp;
          return (
            <div className="min-h-screen flex items-center justify-center p-4 relative">
              <div className="absolute inset-0 bg-brand-500/5 blur-[100px] pointer-events-none"></div>
              <div className="glass rounded-2xl p-8 max-w-sm w-full border border-slate-800 text-center relative z-10 animate-fade-in">
                <div className="w-16 h-16 rounded-full bg-brand-500/20 text-brand-400 flex items-center justify-center mx-auto mb-6">
                  <IconWallet />
                </div>
                <h2 className="text-xl font-bold text-white mb-2">Current Balance</h2>
                <p className="text-sm text-slate-400 mb-6">දැනට ඉතිරි මුදල</p>
                <div className="text-4xl font-bold text-brand-400 mb-8 neon-text">{formatCurrency(currentBalance)}</div>
                <button onClick={() => setShowBalanceOnly(false)} className="m3-button m3-button-tonal flex-1">
                  Back to Login
                </button>
              </div>
            </div>
          );
        }
        const handleLoginSuccess = (user) => {
          setCurrentUser(user);
          if (!user.passkey_id) {
            setShowFaceIdSetup(true);
          }
        };

        return <LoginScreen onLogin={handleLoginSuccess} onShowBalance={() => setShowBalanceOnly(true)} showNotification={showNotification} />;
      }

      const targetAmount = currentUser?.contribution_goal || 10000;

      const userTotalContribution = incomes
        .filter(i => {
          if (!currentUser || !i.name) return false;
          const firstWord = currentUser.username.split(' ')[0].toLowerCase();
          return i.name.toLowerCase().includes(firstWord) && i.donation_type === 'Cash' && i.status === 'Received Today';
        })
        .reduce((sum, item) => sum + Number(item.amount || 0), 0);

      const balanceToPay = targetAmount - userTotalContribution;

      const NotificationModal = () => (
        <div className="fixed inset-0 z-[200] flex items-center justify-center bg-black/80 backdrop-blur-md p-4 animate-fade-in">
          <div className="glass p-6 rounded-3xl max-w-md w-full border border-brand-500/30 max-h-[80vh] flex flex-col shadow-[0_20px_50px_rgba(0,0,0,0.5)]">
            <div className="flex justify-between items-center mb-6">
              <div className="flex flex-col">
                <h3 className="text-xl font-bold text-white flex items-center gap-2">
                  <svg className="w-5 h-5 text-brand-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" /></svg>
                  Notifications
                </h3>
                <span className="text-[10px] text-slate-400 font-bold uppercase tracking-widest mt-1">දැනුම්දීම් ඉතිහාසය</span>
              </div>
              <div className="flex gap-2">
                <button
                  onClick={async () => {
                    const { error } = await supabase.from('notifications').delete().eq('user_id', currentUser.id);
                    if (!error) fetchData();
                  }}
                  className="text-[10px] text-slate-500 hover:text-red-400 px-2 py-1 rounded-lg border border-transparent hover:border-red-500/20 transition-all font-bold uppercase tracking-widest"
                >
                  Clear All
                </button>
                <button type="button" onClick={() => { setIsNotificationModalOpen(false); setHasUnreadNotifications(false); }} className="text-slate-400 hover:text-white transition">
                  <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" /></svg>
                </button>
              </div>
            </div>

            <div className="overflow-y-auto flex-1 custom-scrollbar pr-2 space-y-3">
              {notifications.length === 0 ? (
                <div className="text-center py-20 flex flex-col items-center gap-4">
                  <div className="w-16 h-16 rounded-full bg-slate-900 border border-slate-800 flex items-center justify-center text-slate-700">
                    <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4" /></svg>
                  </div>
                  <p className="text-slate-500 text-sm font-medium">No notifications yet. / දැනුම්දීම් කිසිවක් නැත.</p>
                </div>
              ) : (
                notifications.map(n => (
                  <div key={n.id} className="bg-slate-900/50 p-4 rounded-2xl border border-slate-800 hover:border-slate-700 transition group relative overflow-hidden">
                    <div className="absolute top-0 left-0 w-1 h-full bg-brand-500/30"></div>
                    <div className="flex justify-between items-start mb-1">
                      <h4 className="font-bold text-white text-sm group-hover:text-brand-400 transition-colors">{n.title}</h4>
                      <span className="text-[9px] font-bold text-slate-500 uppercase tracking-tighter">{new Date(n.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>
                    </div>
                    <p className="text-xs text-slate-400 leading-relaxed">{n.body}</p>
                    <div className="mt-2 text-[8px] text-slate-600 font-bold uppercase tracking-widest">{new Date(n.created_at).toLocaleString()}</div>
                  </div>
                ))
              )}
            </div>

            <button
              onClick={() => { setIsNotificationModalOpen(false); setHasUnreadNotifications(false); }}
              className="m3-button m3-button-tonal flex-1"
            >
              Close / වසන්න
            </button>
          </div>
        </div>
