<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Offline | Vesak Finance System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --brand-500: #22c55e;
      --m3-surface: #020617;
    }
    
    body {
      background-color: var(--m3-surface);
      font-family: 'Outfit', sans-serif;
      overflow: hidden;
    }

    .glass {
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .neural-glow {
      position: fixed;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(34, 197, 94, 0.15) 0%, transparent 70%);
      filter: blur(60px);
      z-index: -1;
      animation: drift 15s ease-in-out infinite alternate;
    }

    @keyframes drift {
      from { transform: translate(-20%, -20%); }
      to { transform: translate(20%, 20%); }
    }

    @keyframes pulse-ring {
      0% { transform: scale(0.8); opacity: 0.5; }
      100% { transform: scale(1.5); opacity: 0; }
    }

    .status-ring {
      position: relative;
    }
    .status-ring::before {
      content: '';
      position: absolute;
      inset: -10px;
      border: 2px solid var(--brand-500);
      border-radius: 50%;
      animation: pulse-ring 2s cubic-bezier(0.455, 0.03, 0.515, 0.955) infinite;
    }

    .shimmer {
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
      background-size: 200% 100%;
      animation: shimmer 2s infinite;
    }

    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }

    .float { animation: float 6s ease-in-out infinite; }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-20px); }
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6 text-white selection:bg-brand-500/30">
  
  <div class="neural-glow top-0 left-0"></div>
  <div class="neural-glow bottom-0 right-0" style="background: radial-gradient(circle, rgba(99, 102, 241, 0.1) 0%, transparent 70%); animation-delay: -5s;"></div>

  <div class="w-full max-w-lg relative">
    <!-- Corner Ornaments -->
    <div class="absolute -top-12 -left-12 opacity-10 pointer-events-none float">
      <img src="dc.png" class="w-32 h-32 rotate-12" alt="Sacred Ornament" />
    </div>
    <div class="absolute -bottom-12 -right-12 opacity-10 pointer-events-none float" style="animation-delay: -3s;">
      <img src="dc.png" class="w-32 h-32 -rotate-12" alt="Sacred Ornament" />
    </div>

    <div class="glass rounded-[3rem] p-10 md:p-12 text-center border border-white/5 shadow-2xl relative overflow-hidden">
      <div class="absolute inset-0 shimmer pointer-events-none opacity-30"></div>
      
      <div class="flex flex-col items-center gap-8 relative z-10">
        <!-- Offline Icon -->
        <div class="status-ring">
          <div class="w-24 h-24 rounded-full bg-slate-900 border border-slate-800 flex items-center justify-center shadow-inner">
            <svg class="w-12 h-12 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M18.364 5.636a9 9 0 010 12.728m0 0l-2.829-2.829m2.829 2.829L21 21M15.536 8.464a5 5 0 010 7.072m0 0l-2.829-2.829m-4.243 2.829a4.978 4.978 0 01-1.414-2.83m-1.414 5.658a9 9 0 01-2.167-9.238m7.824 2.167a1 1 0 111.414 1.414m-1.414-1.414L3 3" />
            </svg>
          </div>
        </div>

        <div class="space-y-6">
          <div class="space-y-2">
            <h1 class="text-4xl font-black tracking-tighter uppercase italic text-transparent bg-clip-text bg-gradient-to-r from-white to-slate-500">You're Offline</h1>
            <p class="text-brand-500 font-black text-[10px] tracking-[0.5em] uppercase">සම්බන්ධතාවය බිඳ වැටී ඇත</p>
          </div>

          <div class="space-y-4 max-w-sm mx-auto">
            <p class="text-slate-400 text-sm leading-relaxed">
              We couldn't reach the server. Please check your internet connection and try again.
            </p>
            <p class="text-slate-500 text-[11px] font-medium leading-relaxed">
              සේවාදායකය සමඟ සම්බන්ධ වීමට නොහැක. කරුණාකර ඔබගේ අන්තර්ජාල සම්බන්ධතාවය පරීක්ෂා කර නැවත උත්සාහ කරන්න.
            </p>
          </div>
        </div>

        <div class="w-full h-px bg-gradient-to-r from-transparent via-slate-800 to-transparent"></div>

        <div class="flex flex-col w-full gap-4">
          <button onclick="window.location.reload()" class="group relative w-full h-16 bg-brand-500 text-slate-950 font-black rounded-2xl flex items-center justify-center gap-3 overflow-hidden transition-all active:scale-95 shadow-[0_10px_30px_rgba(34,197,94,0.3)]">
            <div class="absolute inset-0 bg-white/20 translate-x-[-100%] group-hover:translate-x-[100%] transition-transform duration-500"></div>
            <svg class="w-6 h-6 group-hover:rotate-180 transition-transform duration-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>
            <span class="uppercase tracking-widest text-sm">Retry Connection / නැවත උත්සාහ කරන්න</span>
          </button>
          
          <button onclick="window.history.back()" class="w-full h-14 bg-white/5 hover:bg-white/10 text-white font-bold rounded-2xl border border-white/5 transition-all flex items-center justify-center gap-2 text-xs uppercase tracking-widest">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" /></svg>
            Go Back
          </button>
        </div>
      </div>

      <!-- Footer Info -->
      <div class="mt-12 flex items-center justify-center gap-3 opacity-30">
        <img src="logo.png" class="w-8 h-8 object-contain grayscale" alt="Logo" />
        <div class="w-px h-6 bg-white/20"></div>
        <p class="text-[9px] font-black uppercase tracking-[0.2em]">Neural Gateway 2026</p>
      </div>
    </div>
  </div>

</body>
</html>
