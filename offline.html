<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline / නොබැඳිව ඇත</title>
    <style>
        body {
            background-color: #020617;
            color: #f8fafc;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 400px;
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(20px);
            padding: 40px 30px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        .icon {
            font-size: 48px;
            margin-bottom: 20px;
            color: #ef4444;
        }
        h1 {
            font-size: 24px;
            font-weight: 800;
            margin: 0 0 10px 0;
        }
        p {
            color: #94a3b8;
            font-size: 14px;
            line-height: 1.5;
            margin: 0 0 20px 0;
        }
        button {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: #022c15;
            border: none;
            padding: 12px 24px;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
        }
        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">📡</div>
        <h1>Connection Lost</h1>
        <h2 style="font-size: 18px; color: #a1a1aa; font-weight: 500; margin-top: 0;">නොබැඳිව ඇත</h2>
        <p>Please check your internet connection and try reloading the page.<br>කරුණාකර අන්තර්ජාල සම්බන්ධතාවය පරීක්ෂා කර නැවත උත්සාහ කරන්න.</p>
        <button onclick="window.location.reload()">Reload / නැවත පූරණය</button>
    </div>
</body>
</html>
