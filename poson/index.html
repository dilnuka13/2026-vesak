<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dikhenagama Poson System</title>
    <link rel="icon" href="../poson_logo.png">
    <link rel="stylesheet" href="../index.css">
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        theme: 'var(--theme-color)',
                        'theme-hover': 'var(--theme-color-hover)'
                    }
                }
            }
        }
    </script>
    <style>
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background-color: #020617;
        }
    </style>
</head>
<body class="text-slate-200 poson-theme">
    <div id="canvas-container"></div>
    
    <main class="min-h-screen flex flex-col items-center justify-center p-6 relative z-10 fade-in">
        <div class="glass-card p-6 md:p-10 flex flex-col items-center max-w-2xl w-full text-center fade-in" style="animation-delay: 0.2s;">
            <img src="../poson_logo.png" alt="Poson Logo" class="h-32 mb-6 drop-shadow-2xl">
            <h1 class="text-4xl md:text-5xl font-bold mb-4 text-white tracking-tight">Dikhenagama Maha Poson Zone</h1>
            <p class="text-slate-400 mb-8 text-lg">Experience the light of wisdom. Join us for the grand festival.</p>
            
            <div class="flex flex-col sm:flex-row flex-wrap gap-4 justify-center mb-10 w-full">
                <!-- Assuming invitation for Poson might come later, linking to # for now as not explicitly instructed, but let's point to poson_invitation if needed or just view_income -->
                <a href="view_income.html" class="w-full sm:flex-1 sm:min-w-[200px] glass-card p-4 sm:p-6 hover:bg-white/5 transition-all group flex flex-col items-center cursor-pointer border-transparent hover:border-theme/30">
                    <span class="material-symbols-rounded text-theme text-4xl mb-3 group-hover:scale-110 transition-transform">receipt_long</span>
                    <h3 class="font-semibold text-lg text-white">Donation Portal</h3>
                    <p class="text-sm text-slate-400 mt-1">Search & download receipts</p>
                </a>
            </div>

            <div class="mt-4">
                <a href="../admin.html" class="text-sm text-slate-500 hover:text-white transition-colors flex items-center justify-center gap-2">
                    <span class="material-symbols-rounded text-sm">admin_panel_settings</span>
                    Admin Dashboard
                </a>
            </div>
        </div>
    </main>

    <!-- Three.js for 3D Background -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const particlesGeometry = new THREE.BufferGeometry();
        const particlesCount = 1000;
        const posArray = new Float32Array(particlesCount * 3);

        for(let i = 0; i < particlesCount * 3; i++) {
            posArray[i] = (Math.random() - 0.5) * 5;
        }

        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        
        const material = new THREE.PointsMaterial({
            size: 0.005,
            color: new THREE.Color('#f59e0b'), // Amber color for Poson
            transparent: true,
            opacity: 0.8,
            blending: THREE.AdditiveBlending
        });

        const particlesMesh = new THREE.Points(particlesGeometry, material);
        scene.add(particlesMesh);
        camera.position.z = 2;

        let mouseX = 0;
        let mouseY = 0;
        
        document.addEventListener('mousemove', (event) => {
            mouseX = event.clientX / window.innerWidth - 0.5;
            mouseY = event.clientY / window.innerHeight - 0.5;
        });

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();
            
            particlesMesh.rotation.y = -0.05 * elapsedTime;
            particlesMesh.rotation.x = -0.05 * elapsedTime;
            
            particlesMesh.position.x += (mouseX * 0.5 - particlesMesh.position.x) * 0.05;
            particlesMesh.position.y += (-mouseY * 0.5 - particlesMesh.position.y) * 0.05;
            
            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
