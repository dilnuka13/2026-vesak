<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maintenance - Poson System</title>
    <link rel="icon" href="../poson_logo.png">
    <link rel="stylesheet" href="../index.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        theme: 'var(--theme-color)',
                        'theme-hover': 'var(--theme-color-hover)'
                    }
                }
            }
        }
    </script>
</head>
<body class="poson-theme min-h-screen flex items-center justify-center p-6 bg-[url('../poson_logo.png')] bg-center bg-no-repeat bg-fixed bg-blend-overlay" style="background-size: 40%;">
    <div class="glass-card p-10 max-w-lg w-full text-center fade-in">
        <span class="material-symbols-rounded text-theme text-6xl mb-4">construction</span>
        <h1 class="text-3xl font-bold text-white mb-4">Under Maintenance</h1>
        <p class="text-slate-400 mb-6">We are currently updating the Poson system. Please check back later. Thank you for your patience!</p>
        <button onclick="window.location.reload()" class="bg-theme hover:bg-theme-hover text-white px-6 py-2 rounded font-semibold transition">
            Refresh Page
        </button>
    </div>
</body>
</html>
