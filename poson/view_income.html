<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poson Donation Portal</title>
    <link rel="icon" href="../poson_logo.png">
    <link rel="stylesheet" href="../index.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        theme: 'var(--theme-color)',
                        'theme-hover': 'var(--theme-color-hover)'
                    }
                }
            }
        }
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script type="module">
        import { supabase } from '../supabase-client.js';
        
        window.searchDonation = async function(e) {
            e.preventDefault();
            const phone = document.getElementById('phone-input').value;
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<p class="text-center text-slate-400">Searching...</p>';
            
            const { data, error } = await supabase
                .from('incomes')
                .select('*')
                .eq('phone_number', phone)
                .eq('event_type', 'poson') // Fetch Poson event type only
                .order('created_at', { ascending: false });
                
            if (error) {
                resultsDiv.innerHTML = `<p class="text-red-400 text-center">Error: ${error.message}</p>`;
                return;
            }
            
            if (!data || data.length === 0) {
                resultsDiv.innerHTML = '<p class="text-slate-400 text-center">No donations found for this phone number.</p>';
                return;
            }
            
            let html = '<div class="space-y-4">';
            data.forEach(donation => {
                html += `
                    <div class="glass-card p-4 flex justify-between items-center fade-in">
                        <div>
                            <h4 class="font-bold text-white text-lg">${donation.name}</h4>
                            <p class="text-slate-400 text-sm">${donation.date} &bull; ${donation.donation_type}</p>
                            <p class="text-theme font-semibold mt-1">Rs. ${donation.amount || 0}</p>
                        </div>
                        <button onclick='generateReceipt(${JSON.stringify(donation)})' class="bg-theme hover:bg-theme-hover text-white px-4 py-2 rounded transition flex items-center gap-2">
                            <span class="material-symbols-rounded">download</span> PDF
                        </button>
                    </div>
                `;
            });
            html += '</div>';
            resultsDiv.innerHTML = html;
        };
        
        // Expose function globally so the inline onclick can access it
        window.generateReceipt = async function(donation) {
            const { jsPDF } = window.jspdf;
            
            // Create a canvas to draw the receipt
            const canvas = document.createElement('canvas');
            canvas.width = 800;
            canvas.height = 1000;
            const ctx = canvas.getContext('2d');
            
            // Background
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Pre-load images
            const loadImage = (src) => new Promise((resolve) => {
                const img = new Image();
                img.crossOrigin = 'Anonymous';
                img.onload = () => resolve(img);
                img.onerror = () => resolve(null);
                img.src = src;
            });
            
            const [logo, verify, dc] = await Promise.all([
                loadImage('../poson_logo.png'),
                loadImage('../ve1rify.png'),
                loadImage('../dc.png')
            ]);
            
            // Draw DC corners
            if(dc) {
                ctx.drawImage(dc, 20, 20, 80, 80);
                ctx.drawImage(dc, canvas.width - 100, 20, 80, 80);
                ctx.drawImage(dc, 20, canvas.height - 100, 80, 80);
                ctx.drawImage(dc, canvas.width - 100, canvas.height - 100, 80, 80);
            }
            
            // Draw Logo
            if(logo) {
                // center logo
                ctx.drawImage(logo, (canvas.width - 150) / 2, 40, 150, 150);
            }
            
            ctx.fillStyle = '#0f172a';
            ctx.font = 'bold 40px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('Dikhenagama Maha Poson Zone', canvas.width / 2, 230);
            
            ctx.font = '24px Arial';
            ctx.fillStyle = '#64748b';
            ctx.fillText('Official Donation Receipt', canvas.width / 2, 270);
            
            // Draw Separator line
            ctx.beginPath();
            ctx.moveTo(100, 310);
            ctx.lineTo(canvas.width - 100, 310);
            ctx.strokeStyle = '#e2e8f0';
            ctx.lineWidth = 2;
            ctx.stroke();
            
            // Content
            ctx.textAlign = 'left';
            ctx.font = 'bold 20px Arial';
            ctx.fillStyle = '#334155';
            
            const startY = 380;
            const lineH = 50;
            
            ctx.fillText('Receipt ID:', 150, startY);
            ctx.font = '20px Arial';
            ctx.fillText(donation.id.split('-')[0], 350, startY);
            
            ctx.font = 'bold 20px Arial';
            ctx.fillText('Date:', 150, startY + lineH);
            ctx.font = '20px Arial';
            ctx.fillText(donation.date, 350, startY + lineH);
            
            ctx.font = 'bold 20px Arial';
            ctx.fillText('Donor Name:', 150, startY + lineH * 2);
            ctx.font = '20px Arial';
            ctx.fillText(donation.name, 350, startY + lineH * 2);
            
            ctx.font = 'bold 20px Arial';
            ctx.fillText('Phone Number:', 150, startY + lineH * 3);
            ctx.font = '20px Arial';
            ctx.fillText(donation.phone_number || 'N/A', 350, startY + lineH * 3);
            
            ctx.font = 'bold 20px Arial';
            ctx.fillText('Amount:', 150, startY + lineH * 4);
            ctx.font = 'bold 24px Arial';
            ctx.fillStyle = '#f59e0b'; // Amber for poson
            ctx.fillText(`Rs. ${donation.amount || 0}`, 350, startY + lineH * 4);
            
            // Verification stamp
            if(verify) {
                ctx.globalAlpha = 0.8;
                ctx.drawImage(verify, 500, 600, 150, 150);
                ctx.globalAlpha = 1.0;
            }
            
            ctx.fillStyle = '#94a3b8';
            ctx.font = '16px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('Thank you for your generous contribution!', canvas.width / 2, 850);
            ctx.fillText('This is a computer generated receipt and does not require a signature.', canvas.width / 2, 880);
            
            // Convert to PDF
            const imgData = canvas.toDataURL('image/jpeg', 1.0);
            const pdf = new jsPDF({
                orientation: 'portrait',
                unit: 'px',
                format: [canvas.width, canvas.height]
            });
            pdf.addImage(imgData, 'JPEG', 0, 0, canvas.width, canvas.height);
            pdf.save(`Poson_Receipt_${donation.name.replace(/\s+/g, '_')}_${donation.date}.pdf`);
        };
    </script>
</head>
<body class="poson-theme min-h-screen flex flex-col items-center bg-[url('../poson_logo.png')] bg-center bg-no-repeat bg-fixed bg-blend-overlay" style="background-size: 50%;">
    
    <header class="w-full p-6 flex justify-between items-center max-w-4xl mx-auto relative z-10">
        <a href="index.html" class="flex items-center gap-3 text-white hover:text-theme transition">
            <span class="material-symbols-rounded">arrow_back</span> Back
        </a>
        <img src="../poson_logo.png" alt="Poson Logo" class="h-10">
    </header>

    <main class="w-full max-w-2xl px-6 py-10 relative z-10 flex-1">
        <div class="glass-card p-8 text-center fade-in">
            <span class="material-symbols-rounded text-theme text-5xl mb-4">search</span>
            <h1 class="text-3xl font-bold text-white mb-2">Find Your Poson Receipt</h1>
            <p class="text-slate-400 mb-8">Enter your registered phone number to view and download your official donation receipt.</p>
            
            <form onsubmit="window.searchDonation(event)" class="flex gap-2">
                <input type="tel" id="phone-input" placeholder="e.g. 0712345678" required
                    class="flex-1 bg-slate-900/60 border border-slate-700 rounded-lg p-4 text-white focus:outline-none focus:border-theme transition" />
                <button type="submit" class="bg-theme hover:bg-theme-hover text-white px-8 rounded-lg font-semibold transition">
                    Search
                </button>
            </form>
        </div>

        <div id="results" class="mt-8"></div>
    </main>
    
</body>
</html>
