<!DOCTYPE html>
<html>
<body>
<canvas id="c" width="800" height="1150"></canvas>
<script>
      const canvas = document.getElementById('c');
      const ctx = canvas.getContext('2d');
      const width = 800;
      const height = 1150;
      
      const donation = {
        id: '123', date: '2026-05-10', name: 'Test Donor', phone_number: '0712345678', reported_by: 'Admin', donation_type: 'Cash', amount: 5000
      };

      // Canvas roundRect Polyfill
      if (!ctx.roundRect) {
        ctx.roundRect = function (x, y, w, h, r) {
          if (!Array.isArray(r)) { r = [r, r, r, r]; }
          this.beginPath();
          this.moveTo(x + r[0], y);
          this.lineTo(x + w - r[1], y);
          this.quadraticCurveTo(x + w, y, x + w, y + r[1]);
          this.lineTo(x + w, y + h - r[2]);
          this.quadraticCurveTo(x + w, y + h, x + w - r[2], y + h);
          this.lineTo(x + r[3], y + h);
          this.quadraticCurveTo(x, y + h, x, y + h - r[3]);
          this.lineTo(x, y + r[0]);
          this.quadraticCurveTo(x, y, x + r[0], y);
          this.closePath();
          return this;
        };
      }

      const theme = {
        surface: '#1A1C18',              
        surfaceContainer: '#21251E',     
        surfaceContainerHigh: '#2B2F27', 
        primary: '#9CD67D',              
        onPrimaryContainer: '#D7F5C4',   
        primaryContainer: '#1F510D',     
        onSurface: '#E2E3DD',            
        onSurfaceVariant: '#C2C9BD',     
        outlineVariant: '#43483E'        
      };

      ctx.fillStyle = theme.surface;
      ctx.fillRect(0, 0, width, height);

      const drawContent = () => {
        try {
            ctx.fillStyle = theme.surfaceContainer;
            ctx.roundRect(40, 40, width - 80, height - 80, 32);
            ctx.fill();

            ctx.fillStyle = theme.primaryContainer;
            ctx.roundRect(40, 40, width - 80, 165, [32, 32, 0, 0]);
            ctx.fill();

            // Skip image drawing to avoid async issues
            
            ctx.textAlign = 'center';
            ctx.fillStyle = theme.onPrimaryContainer;
            ctx.font = '900 40px sans-serif'; 
            ctx.fillText('VESAK LANTERN 2026', width / 2, 105);

            ctx.fillStyle = theme.primary;
            ctx.font = '600 20px sans-serif'; 
            ctx.letterSpacing = '1px';
            ctx.fillText('OFFICIAL DONATION RECEIPT', width / 2, 140);
            
            let currentY = 295;
            const drawDivider = (y) => {
              ctx.fillStyle = theme.outlineVariant;
              ctx.roundRect(100, y, width - 200, 2, 1);
              ctx.fill();
            };
            drawDivider(230);
            
            // Text footer
            currentY += 210;
            ctx.fillStyle = theme.primary;
            ctx.fillText('Thank you for your generous contribution!', width/2, currentY);
            
            console.log("Drawing finished completely");
        } catch(e) {
            console.error("ERROR DURING DRAWING:", e);
        }
      };
      
      drawContent();
</script>
</body>
</html>
