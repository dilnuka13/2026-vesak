<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#020617" />
    <link rel="apple-touch-icon" href="logo.png" />
    <link rel="icon" href="logo.png" type="image/png" />
    <title>Vesak Lantern Project - Donation Portal</title>

    <!-- Material Symbols Rounded -->
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />
    <!-- Google Fonts: Outfit -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            400: '#4ade80',
                            500: '#22c55e',
                            600: '#16a34a',
                        },
                        m3: {
                            primary: '#22c55e',
                            onPrimary: '#022c15',
                            primaryContainer: '#14532d',
                            onPrimaryContainer: '#86efac',

                            onSurface: '#f8fafc',
                        }
                    }
                }
            }
        }

    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel -->

    <style>
        :root {
            --brand-400: #4ade80;
            --brand-500: #22c55e;
            --brand-600: #16a34a;
        }

        body {
            background-color: #020617;
            color: #f8fafc;
            font-family: 'Outfit', system-ui, sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        /* Shimmer Effect */
        @keyframes shimmer {
            100% {
                transform: translateX(100%);
            }
        }

        .shimmer-bg {
            position: relative;
            overflow: hidden;
        }

        .shimmer-bg::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            transform: translateX(-100%);
            background-image: linear-gradient(90deg,
                    rgba(255, 255, 255, 0) 0%,
                    rgba(255, 255, 255, 0.05) 20%,
                    rgba(255, 255, 255, 0.1) 60%,
                    rgba(255, 255, 255, 0) 100%);
            animation: shimmer 3s infinite;
        }

        .neural-flow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            background: radial-gradient(circle at 50% 50%, #020617 0%, #000000 100%);
            overflow: hidden;
        }

        .neural-flow::after {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            top: -50%;
            left: -50%;
            background-image:
                radial-gradient(circle at 20% 30%, rgba(34, 197, 94, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(139, 92, 246, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 50% 20%, rgba(59, 130, 246, 0.03) 0%, transparent 40%);
            animation: flow 25s infinite alternate cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes flow {
            0% {
                transform: translate(0, 0) rotate(0deg);
            }

            100% {
                transform: translate(2%, 2%) rotate(3deg);
            }
        }

        .glass-card {
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .glass-modal {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        @keyframes fade-in {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes scale-in {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes slide-right {
            from { opacity: 0; transform: translateX(-30px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes shimmer-sweep {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .animate-fade-in { animation: fade-in 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
        .animate-scale-in { animation: scale-in 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
        .animate-slide-right { animation: slide-right 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }

        .delay-100 { animation-delay: 100ms; }
        .delay-200 { animation-delay: 200ms; }
        .delay-300 { animation-delay: 300ms; }
        .delay-500 { animation-delay: 500ms; }

        .neon-text {
            text-shadow: 0 0 10px rgba(34, 197, 94, 0.5), 0 0 20px rgba(34, 197, 94, 0.3);
        }

        .shimmer-sweep {
            position: relative;
            overflow: hidden;
        }

        .shimmer-sweep::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
            animation: shimmer-sweep 2s infinite;
        }

        /* Premium Loader */
        .loader-ring {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            position: relative;
            padding: 3px;
            background: conic-gradient(from 0deg, transparent, #22c55e);
            animation: rotate 1s linear infinite;
        }

        .loader-ring::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: conic-gradient(from 0deg, transparent, transparent, transparent, #22c55e);
            filter: blur(10px);
        }

        .loader-inner {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: #020617;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .loader-logo-pulse {
            animation: logo-pulse 2s ease-in-out infinite;
        }

        @keyframes logo-pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.8; }
        }

        /* Mobile Table Grid Layout */
        @media (max-width: 768px) {
            .mobile-card-table thead {
                display: none;
            }

            .mobile-card-table tbody {
                display: grid;
                grid-template-columns: 1fr;
                gap: 12px;
                padding: 12px;
            }

            .mobile-card-table tr {
                display: grid !important;
                grid-template-areas:
                    "icon info amount"
                    "icon info action";
                grid-template-columns: 48px 1fr auto;
                padding: 16px !important;
                background: rgba(15, 23, 42, 0.6) !important;
                border-radius: 24px !important;
                border: 1px solid rgba(255, 255, 255, 0.05) !important;
                border-left: 4px solid var(--border-color, #10b981) !important;
                gap: 4px 12px;
            }

            .mobile-card-table td {
                padding: 0 !important;
                border: none !important;
                display: block !important;
            }

            .mob-icon-cell {
                grid-area: icon;
                align-self: start;
                pt-1;
            }

            .mob-info-cell {
                grid-area: info;
            }

            .mob-amount-cell {
                grid-area: amount;
                text-align: right;
            }

            .mob-action-cell {
                grid-area: action;
                text-align: right;
                margin-top: 4px;
            }
        }

        /* Maintenance Mode Styles */
        .maintenance-container {
            background: radial-gradient(circle at 50% 50%, rgba(34, 197, 94, 0.05) 0%, transparent 70%);
        }

        .maintenance-icon {
            filter: drop-shadow(0 0 30px rgba(34, 197, 94, 0.3));
            animation: maintenance-float 4s ease-in-out infinite;
        }

        @keyframes maintenance-float {

            0%,
            100% {
                transform: translateY(0) scale(1);
                filter: drop-shadow(0 0 20px rgba(34, 197, 94, 0.2));
            }

            50% {
                transform: translateY(-15px) scale(1.05);
                filter: drop-shadow(0 0 40px rgba(34, 197, 94, 0.4));
            }
        }

        .gear-spin {
            animation: spin 8s linear infinite;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // --- SUPABASE INITIALIZATION ---
        const supabaseUrl = 'https://yqpkgybmjdovdnmekpnw.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlxcGtneWJtamRvdmRubWVrcG53Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY1MjUwMjAsImV4cCI6MjA5MjEwMTAyMH0.7C9jv1_zDRxSMCgs0tWfiNUGXGOkCLz5RE0CCDoc_yA';
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        // --- UTILS ---
        const formatCurrency = (amount) => {
            if (!amount) return "LKR. 0";
            return "LKR. " + Math.round(parseFloat(amount)).toLocaleString('en-US');
        };

        const formatDate = (dateString) => {
            if (!dateString) return '';
            const d = new Date(dateString);
            return d.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
        };

        const getReceiptShortId = (donation) => {
            const rawId = donation.id ? String(donation.id) : String(Math.floor(Math.random() * 10000));
            return rawId.includes('-') ? rawId.split('-')[0].toUpperCase() : rawId.padStart(4, '0');
        };

        const MaterialIcon = ({ name, className = '' }) => (
            <span className={`material-symbols-rounded ${className}`} style={{ fontSize: 'inherit', display: 'inline-block', verticalAlign: 'middle' }}>{name}</span>
        );

        const generateReceiptCanvas = (donation) => {
            return new Promise((resolve) => {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                const width = 800;
                const height = 1150;
                canvas.width = width;
                canvas.height = height;

                // Modern Premium Theme Palette (Indigo/Slate with Gold Accents)
                const theme = {
                    background: '#FFFFFF',
                    surface: '#F8FAFC',
                    primary: '#1E1B4B',     // Deep Indigo
                    secondary: '#312E81',   // Vibrant Indigo
                    accent: '#D97706',      // Gold/Bronze accent
                    accentLight: '#FEF3C7', // Soft gold tint
                    textPrimary: '#0F172A', // Slate 900
                    textSecondary: '#475569', // Slate 600
                    textMuted: '#94A3B8',   // Slate 400
                    border: '#E2E8F0',      // Slate 200
                    success: '#10B981',     // Emerald
                    successLight: '#D1FAE5',
                    watermark: '#F1F5F9'    // Extremely subtle watermark
                };

                // Helper function for rounded rectangles
                const roundedRect = (x, y, w, h, r) => {
                    ctx.beginPath();
                    ctx.moveTo(x + r, y);
                    ctx.lineTo(x + w - r, y);
                    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
                    ctx.lineTo(x + w, y + h - r);
                    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
                    ctx.lineTo(x + r, y + h);
                    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
                    ctx.lineTo(x, y + r);
                    ctx.quadraticCurveTo(x, y, x + r, y);
                    ctx.closePath();
                    return ctx;
                };

                const loadImages = () => {
                    const logo = new Image();
                    logo.crossOrigin = "anonymous";
                    logo.src = 'logo.png';

                    const verify = new Image();
                    verify.crossOrigin = "anonymous";
                    verify.src = 've1rify.png';

                    const dcIcon = new Image();
                    dcIcon.crossOrigin = "anonymous";
                    dcIcon.src = 'dc.png';

                    return Promise.all([
                        new Promise(r => { logo.onload = () => r(logo); logo.onerror = () => r(null); }),
                        new Promise(r => { verify.onload = () => r(verify); verify.onerror = () => r(null); }),
                        new Promise(r => { dcIcon.onload = () => r(dcIcon); dcIcon.onerror = () => r(null); })
                    ]);
                };

                loadImages().then(([logoImg, verifyImg, dcImg]) => {
                    // ========== BACKGROUND ==========
                    ctx.fillStyle = theme.background;
                    ctx.fillRect(0, 0, width, height);

                    // ========== WATERMARK (Subtle Lotus inspired) ==========
                    ctx.save();
                    ctx.globalAlpha = 0.04;
                    ctx.translate(width / 2, height / 2);
                    for (let i = 0; i < 8; i++) {
                        ctx.rotate(Math.PI / 4);
                        ctx.beginPath();
                        ctx.moveTo(0, -150);
                        ctx.quadraticCurveTo(50, -75, 0, -20);
                        ctx.quadraticCurveTo(-50, -75, 0, -150);
                        ctx.fillStyle = theme.primary;
                        ctx.fill();
                        ctx.beginPath();
                        ctx.moveTo(0, -130);
                        ctx.quadraticCurveTo(35, -65, 0, -30);
                        ctx.quadraticCurveTo(-35, -65, 0, -130);
                        ctx.fillStyle = theme.accent;
                        ctx.fill();
                    }
                    ctx.restore();

                    // ========== OUTER DOUBLE BORDER ==========
                    ctx.strokeStyle = theme.accent;
                    ctx.lineWidth = 2;
                    ctx.strokeRect(25, 25, width - 50, height - 50);

                    roundedRect(35, 35, width - 70, height - 70, 16);
                    ctx.strokeStyle = theme.primary;
                    ctx.lineWidth = 3;
                    ctx.stroke();

                    // Corner Dharma Wheels (Inside Frame)
                    if (dcImg) {
                        const dcSize = 45;
                        const offset = 70;
                        ctx.drawImage(dcImg, offset - dcSize / 2, offset - dcSize / 2, dcSize, dcSize); // Top Left
                        ctx.drawImage(dcImg, width - offset - dcSize / 2, offset - dcSize / 2, dcSize, dcSize); // Top Right
                        ctx.drawImage(dcImg, offset - dcSize / 2, height - offset - dcSize / 2, dcSize, dcSize); // Bottom Left
                        ctx.drawImage(dcImg, width - offset - dcSize / 2, height - offset - dcSize / 2, dcSize, dcSize); // Bottom Right
                    }

                    // ========== HEADER SECTION ==========
                    ctx.beginPath();
                    ctx.arc(width / 2, 110, 55, 0, Math.PI * 2);
                    ctx.fillStyle = theme.surface;
                    ctx.fill();
                    ctx.strokeStyle = theme.border;
                    ctx.lineWidth = 1;
                    ctx.stroke();

                    if (logoImg) {
                        const logoSize = 80;
                        ctx.drawImage(logoImg, width / 2 - logoSize / 2, 70, logoSize, logoSize);
                    }

                    ctx.textAlign = "center";
                    ctx.font = `bold 28px sans-serif`;
                    ctx.fillStyle = theme.primary;
                    ctx.fillText("VESAK LANTERN PROJECT 2026", width / 2, 175);

                    ctx.font = `500 14px sans-serif`;
                    ctx.fillStyle = theme.textSecondary;
                    ctx.fillText("මහා වෙසක් කූඩු ව්‍යාපෘතිය - දික්හේනපුර", width / 2, 200);

                    ctx.beginPath();
                    ctx.moveTo(width / 2 - 150, 215);
                    ctx.lineTo(width / 2 + 150, 215);
                    ctx.strokeStyle = theme.accent;
                    ctx.lineWidth = 1.5;
                    ctx.stroke();

                    // ========== RECEIPT TITLE ==========
                    ctx.font = `bold 32px sans-serif`;
                    ctx.fillStyle = theme.primary;
                    ctx.fillText("OFFICIAL RECEIPT OF DONATION", width / 2, 275);

                    ctx.font = `500 13px monospace`;
                    ctx.fillStyle = theme.textMuted;
                    ctx.fillText("බුදු සරණයි !", width / 2, 300);

                    // ========== RECEIPT ID & DATE ==========
                    const id = getReceiptShortId(donation);
                    const dateStr = new Date(donation.date || Date.now()).toLocaleDateString('en-GB', { day: '2-digit', month: 'long', year: 'numeric' });

                    ctx.font = `bold 13px monospace`;
                    ctx.fillStyle = theme.textSecondary;
                    ctx.textAlign = "left";
                    ctx.fillText(`Receipt No: VLP/2026/${id}`, 70, 340);
                    ctx.textAlign = "right";
                    ctx.fillText(`Date Issued: ${dateStr}`, width - 70, 340);
                    ctx.textAlign = "center";

                    ctx.beginPath();
                    ctx.moveTo(50, 365);
                    ctx.lineTo(width - 50, 365);
                    ctx.strokeStyle = theme.border;
                    ctx.lineWidth = 1;
                    ctx.stroke();

                    // ========== DONOR CARD ==========
                    roundedRect(50, 390, width - 100, 130, 12);
                    ctx.fillStyle = theme.surface;
                    ctx.fill();
                    ctx.strokeStyle = theme.border;
                    ctx.stroke();

                    ctx.font = `bold 12px sans-serif`;
                    ctx.fillStyle = theme.textMuted;
                    ctx.textAlign = "left";
                    ctx.fillText("DONOR INFORMATION", 70, 415);

                    ctx.font = `bold 22px sans-serif`;
                    ctx.fillStyle = theme.textPrimary;
                    ctx.fillText(donation.name || "Anonymous Donor", 70, 445);

                    ctx.font = `500 13px sans-serif`;
                    ctx.fillStyle = theme.textSecondary;
                    if (donation.phone_number) ctx.fillText(`Contact: ${donation.phone_number}`, 70, 475);
                    ctx.fillText(`Reported By: ${donation.reported_by || '-'}`, 70, 495);

                    if (verifyImg) {
                        const vSize = 30;
                        ctx.drawImage(verifyImg, width - 180, 400, vSize, vSize);
                        ctx.font = `bold 11px sans-serif`;
                        ctx.fillStyle = theme.accent;
                        ctx.fillText("VERIFIED DONOR", width - 145, 420);
                    }

                    // ========== DONATION DETAILS CARD ==========
                    roundedRect(50, 545, width - 100, 230, 12);
                    ctx.fillStyle = "#FFFFFF";
                    ctx.fill();
                    ctx.shadowColor = "rgba(0,0,0,0.05)";
                    ctx.shadowBlur = 8;
                    ctx.strokeStyle = theme.border;
                    ctx.stroke();
                    ctx.shadowColor = "transparent";

                    ctx.font = `bold 12px sans-serif`;
                    ctx.fillStyle = theme.textMuted;
                    ctx.fillText("CONTRIBUTION DETAILS", 70, 575);

                    let yOffset = 600;
                    ctx.font = `bold 14px sans-serif`;
                    ctx.fillStyle = theme.textSecondary;
                    ctx.fillText("Description", 70, yOffset);
                    ctx.fillText("Value / Amount", width - 200, yOffset);

                    ctx.beginPath();
                    ctx.moveTo(70, yOffset + 12);
                    ctx.lineTo(width - 70, yOffset + 12);
                    ctx.strokeStyle = theme.border;
                    ctx.stroke();

                    yOffset += 35;
                    ctx.font = `bold 18px sans-serif`;
                    ctx.fillStyle = theme.textPrimary;
                    const desc = donation.donation_type === 'Cash' ? (donation.donor_category || 'Cash Contribution') : `${donation.item_description} (x${donation.quantity})`;
                    ctx.fillText(desc, 70, yOffset);

                    ctx.font = `bold 22px sans-serif`;
                    ctx.fillStyle = theme.primary;
                    const amount = donation.donation_type === 'Cash' ? `LKR ${(Number(donation.amount) || 0).toLocaleString('en-LK')}` : 'GOODS';
                    ctx.textAlign = "right";
                    ctx.fillText(amount, width - 70, yOffset);
                    ctx.textAlign = "left";

                    yOffset += 45;
                    ctx.font = `500 12px sans-serif`;
                    ctx.fillStyle = theme.textMuted;
                    ctx.fillText(`Payment Method: ${donation.donation_type === 'Cash' ? 'Cash Payment' : 'Goods / In-kind'}`, 70, yOffset);

                    ctx.beginPath();
                    roundedRect(width - 170, yOffset - 8, 100, 24, 12);
                    ctx.fillStyle = theme.successLight;
                    ctx.fill();
                    ctx.font = `bold 11px sans-serif`;
                    ctx.fillStyle = theme.success;
                    ctx.textAlign = "center";
                    ctx.fillText("✓ RECEIVED", width - 120, yOffset + 8);
                    ctx.textAlign = "left";

                    yOffset += 40;
                    ctx.beginPath();
                    ctx.moveTo(70, yOffset);
                    ctx.lineTo(width - 70, yOffset);
                    ctx.strokeStyle = theme.border;
                    ctx.stroke();

                    yOffset += 25;
                    ctx.font = `bold 14px sans-serif`;
                    ctx.fillStyle = theme.textPrimary;
                    ctx.fillText("Total Contribution", 70, yOffset);
                    ctx.font = `bold 24px sans-serif`;
                    ctx.fillStyle = theme.accent;
                    ctx.textAlign = "right";
                    const finalTotal = donation.donation_type === 'Cash' ? `LKR ${(Number(donation.amount) || 0).toLocaleString('en-LK')}.00` : 'GOODS RECEIVED';
                    ctx.fillText(finalTotal, width - 70, yOffset);
                    ctx.textAlign = "center";

                    // ========== VERIFICATION STAMP ==========
                    ctx.save();
                    ctx.translate(width - 120, height - 320);
                    ctx.beginPath();
                    ctx.arc(0, 0, 45, 0, Math.PI * 2);
                    ctx.strokeStyle = theme.accent;
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.arc(0, 0, 38, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.font = `bold 10px sans-serif`;
                    ctx.fillStyle = theme.accent;
                    ctx.fillText("VERIFIED", 0, -8);
                    ctx.font = `bold 18px sans-serif`;
                    ctx.fillStyle = theme.primary;
                    ctx.fillText("✓", 0, 12);
                    ctx.font = `8px sans-serif`;
                    ctx.fillStyle = theme.textMuted;
                    ctx.fillText("OFFICIAL SEAL", 0, 28);
                    ctx.restore();

                    // ========== FOOTER SECTION ==========
                    ctx.font = `italic 14px serif`;
                    ctx.fillStyle = theme.textSecondary;
                    ctx.fillText("“May the blessings of the Triple Gem be upon you.”", width / 2, height - 230);

                    ctx.font = `bold 11px sans-serif`;
                    ctx.fillStyle = theme.textMuted;
                    ctx.fillText("This Dana is offered for the success of the Vesak Lantern Project and the happiness of all beings.", width / 2, height - 205);

                    ctx.beginPath();
                    ctx.moveTo(50, height - 175);
                    ctx.lineTo(width - 50, height - 175);
                    ctx.strokeStyle = theme.border;
                    ctx.stroke();

                    // Contact Details
                    ctx.font = `bold 11px sans-serif`;
                    ctx.fillStyle = theme.textSecondary;
                    ctx.fillText('071 615 5666 (Isara Dilnuka)  |  071 084 6810 (Imesh Nilhan)', width / 2, height - 150);
                    ctx.fillText('isaradilnuka2005@gmail.com  |  imeshnilhan21@gmail.com', width / 2, height - 130);

                                                         <span className="text-[7px] opacity-60">
                                                             {c === 'all' && 'සියල්ල'}
                                                             {c === 'cash' && 'මුදල්'}
                                                             {c === 'goods' && 'ද්‍රව්‍ය'}
                                                             {c === 'pledge' && 'පොරොන්දු'}

                                             </div>
                                         </div>

                                         <div className="px-2">
                                             <div className="relative group">

                                                     className="w-full bg-slate-900/50 border border-white/5 text-white rounded-2xl pl-14 pr-6 py-4 text-xs outline-none focus:border-brand-500 focus:ring-4 focus:ring-brand-500/5 transition-all shadow-inner"
                                                 />
                                             </div>
                                         </div>
                                     </div>

                                     <div className="glass-card rounded-[2.5rem] overflow-hidden border border-white/10 shadow-2xl animate-scale-in delay-500">
                                        <div className="overflow-x-auto custom-scrollbar">
                                            <table className="w-full text-left border-collapse mobile-card-table">
                                                <thead>
                                                    <tr className="text-[10px] text-slate-500 font-black uppercase tracking-[0.2em] bg-white/5 border-b border-white/5">
                                                        <th className="px-8 py-5">
                                                            <div>Event Date</div>
                                                            <div className="text-[8px] opacity-50">දිනය</div>
                                                        </th>
                                                        <th className="px-8 py-5">
                                                            <div>Donor</div>
                                                            <div className="text-[8px] opacity-50">පරිත්‍යාගශීලියා</div>
                                                        </th>
                                                        <th className="px-8 py-5 text-right">

                                                        </th>
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y divide-white/5">
                                                    {filtered.map(d => {
                                                        const cs = getCatStyle(d);
                                                        const borderCol = d.status === 'Promised' ? '#eab308' : (d.donation_type === 'Goods' ? '#a855f7' : '#22c55e');
                                                        return (
                                                            <tr key={d.id} className={`hover:bg-white/5 transition-all group border-l-4 ${cs.row}`} style={{ '--border-color': borderCol }}>
                                                                <td className="px-8 py-6 md:table-cell hidden mob-icon-cell">
                                                                    <div className="w-10 h-10 rounded-full flex items-center justify-center bg-white/5 text-slate-400">
                                                                        <MaterialIcon name={d.donation_type === 'Goods' ? 'inventory_2' : 'payments'} />
                                                                    </div>
                                                                </td>
                                                                <td className="px-8 py-6 mob-info-cell">
                                                                    <div className="md:hidden flex items-center gap-2 mb-2">
                                                                        <div className="w-8 h-8 rounded-lg flex items-center justify-center bg-white/5 text-slate-400 shrink-0">
                                                                            <MaterialIcon name={d.donation_type === 'Goods' ? 'inventory_2' : 'payments'} className="text-sm" />
                                                                        </div>
                                                                        <div className="text-[10px] text-slate-500 font-black uppercase tracking-tighter">{formatDate(d.date)}</div>
                                                                    </div>
                                                                    <div className="md:block hidden">
                                                                        <div className="text-white font-black tracking-tight">{formatDate(d.date)}</div>
                                                                        <div className="text-[10px] text-slate-500 font-black uppercase mt-0.5">{d.created_at ? new Date(d.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : 'Verified'}</div>
                                                                    </div>
                                                                    <div className="text-slate-200 font-bold mt-1 md:mt-0">{d.name || 'Anonymous'}</div>
                                                                    <div className={`mt-2 inline-flex px-2 py-0.5 rounded text-[8px] font-black uppercase border tracking-[0.1em] ${cs.badge}`}>{getCatLabel(d)}</div>
                                                                </td>
                                                                <td className="px-8 py-6 mob-amount-cell text-right">
                                                                    <div className="font-black text-slate-200 tracking-tight">
                                                                        {d.donation_type === 'Cash' ? formatCurrency(d.amount) : `${d.item_description} x${d.quantity}`}
                                                                    </div>
                                                                </td>
                                                                <td className="px-8 py-6 mob-action-cell text-center">
                                                                    {d.status !== 'Promised' ? (
                                                                        <button onClick={() => { setReceiptModal(d); setVerifyStatus(null); setVerifyPhone(''); setReceiptCanvas(null); }} className="w-10 h-10 rounded-xl bg-brand-500/10 text-brand-400 hover:bg-brand-500 hover:text-white transition-all shadow-md group-hover:scale-110">
                                                                            <MaterialIcon name="receipt_long" />
                                                                        </button>
                                                                    ) : (
                                                                        <div className="flex flex-col items-center">
                                                                            <div className="text-[9px] text-slate-600 font-black uppercase tracking-widest border border-slate-800 px-3 py-1.5 rounded-lg inline-block">Pending</div>
                                                                            <span className="text-[7px] text-slate-700 font-bold mt-1">පොරොන්දුවක්</span>
                                                                        </div>
                                                                    )}
                                                                </td>
                                                            </tr>
                                                        );
                                                    })}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                </div>
                            </>
                        )}
                    </div>

                    <footer className="pt-12 pb-8 border-t border-white/5 text-center space-y-4">
                        <div className="flex flex-col items-center gap-1">
                            <p className="text-[10px] text-slate-600 font-black uppercase tracking-[0.5em]">Digital Transparency System</p>
                            <p className="text-[8px] text-slate-700 font-bold uppercase tracking-widest">ඩිජිටල් විනිවිදභාවය තහවුරු කිරීමේ පද්ධතිය</p>
                        </div>
                        <div className="flex justify-center gap-6">
                            <img src="logo.png" className="w-6 h-6 grayscale opacity-20" />
                            <img src="ve1rify.png" className="w-6 h-6 grayscale opacity-20" />
                        </div>
                    </footer>
                </div>
            );
        }

        function MaintenanceView() {
            return (
                <div className="min-h-screen flex items-center justify-center p-6 maintenance-container overflow-hidden">
                    <div className="max-w-xl w-full text-center space-y-12 relative animate-fade-in">
                        {/* Background Ornaments */}
                        <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[200%] h-[200%] opacity-20 pointer-events-none">
                            <div className="absolute top-0 left-1/2 -translate-x-1/2 w-1 h-full bg-gradient-to-b from-transparent via-brand-500/20 to-transparent"></div>
                            <div className="absolute top-1/2 left-0 -translate-y-1/2 h-1 w-full bg-gradient-to-r from-transparent via-brand-500/20 to-transparent"></div>
                        </div>

                        <div className="relative inline-block">
                            <div className="w-48 h-48 rounded-[3rem] bg-slate-900/50 border border-white/10 flex items-center justify-center maintenance-icon shadow-2xl backdrop-blur-3xl">
                                <img src="logo.png" className="w-32 h-32 object-contain filter drop-shadow-[0_0_15px_rgba(34,197,94,0.4)]" alt="Logo" />
                                <div className="absolute -top-4 -right-4 w-16 h-16 rounded-2xl bg-indigo-500/20 border border-indigo-500/30 backdrop-blur-xl flex items-center justify-center gear-spin shadow-lg">
                                    <MaterialIcon name="settings" className="text-3xl text-indigo-400" />
                                </div>
                            </div>
                        </div>

                        <div className="space-y-6 relative z-10">
                            <div className="space-y-3">
                                <p className="text-brand-500 font-black uppercase tracking-[0.6em] text-xs">Public Access Suspended</p>
                                <h1 className="text-5xl md:text-6xl font-black text-white tracking-tighter leading-none">
                                    Portal Under <br />
                                    <span className="text-transparent bg-clip-text bg-gradient-to-r from-brand-400 to-emerald-600">Maintenance</span>
                                </h1>
                            </div>
                            <p className="text-slate-400 text-sm md:text-base leading-relaxed max-w-md mx-auto font-medium">
                                The public donation verification portal is currently undergoing scheduled maintenance or has been disabled by the administrator. Please try again later.
                                <br /><br />
                                <span className="text-[11px] text-slate-500 uppercase tracking-widest font-black">පද්ධතිය දැනට නඩත්තු කටයුතු සඳහා තාවකාලිකව නවතා ඇත. පසුව උත්සාහ කරන්න.</span>
                            </p>
                        </div>

                        <div className="pt-8 flex flex-col items-center gap-6">
                            <div className="w-24 h-1 bg-gradient-to-r from-transparent via-brand-500/50 to-transparent rounded-full"></div>
                            <p className="text-[10px] text-slate-600 font-black uppercase tracking-[0.5em]">Vesak Finance System • Offline State</p>
                        </div>
                    </div>
                </div>
            );
        }

        function LoadingScreen() {
            return (
                <div className="fixed inset-0 z-[100] bg-[#020617] flex flex-col items-center justify-center p-8 overflow-hidden">
                    {/* Background Accents */}
                    <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-brand-500/10 blur-[120px] rounded-full animate-pulse"></div>
                    
                    <div className="relative space-y-12 flex flex-col items-center">
                        {/* Logo and Ring */}
                        <div className="relative">
                            <div className="loader-ring">
                                <div className="loader-inner">
                                    <img src="logo.png" className="w-10 h-10 object-contain loader-logo-pulse" alt="Logo" />
                                </div>
                            </div>
                            <div className="absolute -inset-4 border border-white/5 rounded-full"></div>
                        </div>

                        {/* Text Content */}
                        <div className="text-center space-y-4">
                            <div className="space-y-1">
                                <h2 className="text-white text-2xl font-black tracking-tighter uppercase animate-fade-in">Vesak Finance</h2>
                                <p className="text-brand-500 font-black text-[10px] tracking-[0.5em] uppercase animate-fade-in delay-100">Public Portal</p>
                            </div>
                            
                            <div className="flex flex-col items-center gap-3">
                                <div className="w-48 h-1 bg-white/5 rounded-full overflow-hidden">
                                    <div className="h-full bg-brand-500 w-1/3 animate-[shimmer-sweep_1.5s_infinite]"></div>
                                </div>
                                <p className="text-slate-500 text-[9px] font-black uppercase tracking-widest animate-pulse">Initializing Secure Connection...</p>
                            </div>
                        </div>

                        {/* Bottom Branding */}
                        <div className="absolute bottom-[-100px] flex items-center gap-4 opacity-20">
                            <img src="ve1rify.png" className="w-8 h-8 grayscale" />
                            <div className="h-4 w-px bg-white/20"></div>
                            <p className="text-[8px] text-white font-black uppercase tracking-[0.3em]">BEYOND VERIFIED</p>
                        </div>
                    </div>
                </div>
            );
        }

        function App() {
            const [incomes, setIncomes] = useState([]);
            const [settings, setSettings] = useState(null);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                fetchInitialData();
            }, []);

            const fetchInitialData = async () => {
                try {
                    const [incRes, setRes] = await Promise.all([
                        supabase.from('incomes').select('*').or('event_type.eq.vesak,event_type.is.null').order('created_at', { ascending: false }),
                        supabase.from('project_settings').select('*').maybeSingle()
                    ]);

                    if (incRes.error) throw incRes.error;
                    setIncomes(incRes.data || []);
                    setSettings(setRes.data || { public_portal_enabled: true });
                } catch (err) {
                    console.error("Fetch error:", err);
                } finally {
                    setLoading(false);
                }
            };

            if (loading) {
                return (
                    <div className="min-h-screen flex items-center justify-center">
                        <div className="flex flex-col items-center gap-8 animate-pulse">
                            <div className="w-16 h-16 border-[6px] border-brand-500/10 border-t-brand-500 rounded-full animate-spin shadow-2xl shadow-brand-500/20"></div>
                            <div className="space-y-2 text-center">
                                <p className="text-white font-black uppercase tracking-[0.4em] text-xs">Vesak Finance System</p>
                                <p className="text-brand-500/60 font-bold uppercase tracking-[0.2em] text-[9px]">Initializing Public Portal...</p>
                            </div>
                        </div>
                    </div>
                );
            }

            if (settings?.public_portal_enabled === false) {
                return <MaintenanceView />;
            }

            return <DonationsView incomes={incomes} />;
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
