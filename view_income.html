<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donation Portal - Dikhenagama</title>
    <link rel="icon" href="logo.png">
    <link rel="stylesheet" href="index.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        theme: 'var(--theme-color)',
                        'theme-hover': 'var(--theme-color-hover)'
                    }
                }
            }
        }
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script type="module">
        import { supabase } from './supabase-client.js';
        
        window.searchDonation = async function(e) {
            e.preventDefault();
            const phone = document.getElementById('phone-input').value;
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<p class="text-center text-slate-400">Searching...</p>';
            
            const { data, error } = await supabase
                .from('incomes')
                .select('*')
                .eq('phone_number', phone)
                .order('created_at', { ascending: false });
                
            if (error) {
                resultsDiv.innerHTML = `<p class="text-red-400 text-center">Error: ${error.message}</p>`;
                return;
            }
            
            if (!data || data.length === 0) {
                resultsDiv.innerHTML = '<p class="text-slate-400 text-center">No donations found for this phone number.</p>';
                return;
            }
            
            let html = '<div class="space-y-4">';
            data.forEach(donation => {
                html += `
                    <div class="glass-card p-4 flex justify-between items-center fade-in">
                        <div>
                            <h4 class="font-bold text-white text-lg">${donation.name}</h4>
                            <p class="text-slate-400 text-sm">${donation.date} &bull; ${donation.donation_type}</p>
                            <p class="text-theme font-semibold mt-1">Rs. ${donation.amount || 0}</p>
                        </div>
                        <button onclick='generateReceipt(${JSON.stringify(donation)})' class="bg-theme hover:bg-theme-hover text-white px-4 py-2 rounded transition flex items-center gap-2">
                            <span class="material-symbols-rounded">download</span> PDF
                        </button>
                    </div>
                `;
            });
            html += '</div>';
            resultsDiv.innerHTML = html;
        };
        
        const getReceiptShortId = (donation) => {
            const rawId = donation.id ? String(donation.id) : String(Math.floor(Math.random() * 10000));
            return rawId.includes('-') ? rawId.split('-')[0].toUpperCase() : rawId.padStart(4, '0');
        };

        window.generateReceipt = async function(donation) {
            const { jsPDF } = window.jspdf;
            
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const width = 800;
            const height = 1150;
            canvas.width = width;
            canvas.height = height;

            // Modern Premium Theme Palette (Indigo/Slate with Gold Accents)
            const theme = {
                background: '#FFFFFF',
                surface: '#F8FAFC',
                primary: '#1E1B4B',     // Deep Indigo
                secondary: '#312E81',   // Vibrant Indigo
                accent: '#D97706',      // Gold/Bronze accent
                accentLight: '#FEF3C7', // Soft gold tint
                textPrimary: '#0F172A', // Slate 900
                textSecondary: '#475569', // Slate 600
                textMuted: '#94A3B8',   // Slate 400
                border: '#E2E8F0',      // Slate 200
                success: '#10B981',     // Emerald
                successLight: '#D1FAE5',
                watermark: '#F1F5F9'    // Extremely subtle watermark
            };

            // Helper function for rounded rectangles
            const roundedRect = (x, y, w, h, r) => {
                ctx.beginPath();
                ctx.moveTo(x + r, y);
                ctx.lineTo(x + w - r, y);
                ctx.quadraticCurveTo(x + w, y, x + w, y + r);
                ctx.lineTo(x + w, y + h - r);
                ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
                ctx.lineTo(x + r, y + h);
                ctx.quadraticCurveTo(x, y + h, x, y + h - r);
                ctx.lineTo(x, y + r);
                ctx.quadraticCurveTo(x, y, x + r, y);
                ctx.closePath();
                return ctx;
            };

            const loadImages = () => {
                const logo = new Image();
                logo.crossOrigin = "anonymous";
                logo.src = 'logo.png';

                const verify = new Image();
                verify.crossOrigin = "anonymous";
                verify.src = 've1rify.png';

                const dcIcon = new Image();
                dcIcon.crossOrigin = "anonymous";
                dcIcon.src = 'dc.png';

                return Promise.all([
                    new Promise(r => { logo.onload = () => r(logo); logo.onerror = () => r(null); }),
                    new Promise(r => { verify.onload = () => r(verify); verify.onerror = () => r(null); }),
                    new Promise(r => { dcIcon.onload = () => r(dcIcon); dcIcon.onerror = () => r(null); })
                ]);
            };

            const [logoImg, verifyImg, dcImg] = await loadImages();

            // ========== BACKGROUND ==========
            ctx.fillStyle = theme.background;
            ctx.fillRect(0, 0, width, height);

            // ========== WATERMARK (Subtle Lotus inspired) ==========
            ctx.save();
            ctx.globalAlpha = 0.04;
            ctx.translate(width / 2, height / 2);
            for (let i = 0; i < 8; i++) {
                ctx.rotate(Math.PI / 4);
                ctx.beginPath();
                ctx.moveTo(0, -150);
                ctx.quadraticCurveTo(50, -75, 0, -20);
                ctx.quadraticCurveTo(-50, -75, 0, -150);
                ctx.fillStyle = theme.primary;
                ctx.fill();
                ctx.beginPath();
                ctx.moveTo(0, -130);
                ctx.quadraticCurveTo(35, -65, 0, -30);
                ctx.quadraticCurveTo(-35, -65, 0, -130);
                ctx.fillStyle = theme.accent;
                ctx.fill();
            }
            ctx.restore();

            // ========== OUTER DOUBLE BORDER ==========
            ctx.strokeStyle = theme.accent;
            ctx.lineWidth = 2;
            ctx.strokeRect(25, 25, width - 50, height - 50);

            roundedRect(35, 35, width - 70, height - 70, 16);
            ctx.strokeStyle = theme.primary;
            ctx.lineWidth = 3;
            ctx.stroke();

            // Corner Dharma Wheels (Inside Frame)
            if (dcImg) {
                const dcSize = 45;
                const offset = 70;
                ctx.drawImage(dcImg, offset - dcSize / 2, offset - dcSize / 2, dcSize, dcSize); // Top Left
                ctx.drawImage(dcImg, width - offset - dcSize / 2, offset - dcSize / 2, dcSize, dcSize); // Top Right
                ctx.drawImage(dcImg, offset - dcSize / 2, height - offset - dcSize / 2, dcSize, dcSize); // Bottom Left
                ctx.drawImage(dcImg, width - offset - dcSize / 2, height - offset - dcSize / 2, dcSize, dcSize); // Bottom Right
            }

            // ========== HEADER SECTION ==========
            ctx.beginPath();
            ctx.arc(width / 2, 110, 55, 0, Math.PI * 2);
            ctx.fillStyle = theme.surface;
            ctx.fill();
            ctx.strokeStyle = theme.border;
            ctx.lineWidth = 1;
            ctx.stroke();

            if (logoImg) {
                const logoSize = 80;
                ctx.drawImage(logoImg, width / 2 - logoSize / 2, 70, logoSize, logoSize);
            }

            ctx.textAlign = "center";
            ctx.font = `bold 28px sans-serif`;
            ctx.fillStyle = theme.primary;
            ctx.fillText("VESAK LANTERN PROJECT 2026", width / 2, 175);

            ctx.font = `500 14px sans-serif`;
            ctx.fillStyle = theme.textSecondary;
            ctx.fillText("මහා වෙසක් කූඩු ව්‍යාපෘතිය - දික්හේනපුර", width / 2, 200);

            ctx.beginPath();
            ctx.moveTo(width / 2 - 150, 215);
            ctx.lineTo(width / 2 + 150, 215);
            ctx.strokeStyle = theme.accent;
            ctx.lineWidth = 1.5;
            ctx.stroke();

            // ========== RECEIPT TITLE ==========
            ctx.font = `bold 32px sans-serif`;
            ctx.fillStyle = theme.primary;
            ctx.fillText("OFFICIAL RECEIPT OF DONATION", width / 2, 275);

            ctx.font = `500 13px monospace`;
            ctx.fillStyle = theme.textMuted;
            ctx.fillText("බුදු සරණයි !", width / 2, 300);

            // ========== RECEIPT ID & DATE ==========
            const id = getReceiptShortId(donation);
            const dateStr = new Date(donation.date || Date.now()).toLocaleDateString('en-GB', { day: '2-digit', month: 'long', year: 'numeric' });

            ctx.font = `bold 13px monospace`;
            ctx.fillStyle = theme.textSecondary;
            ctx.textAlign = "left";
            ctx.fillText(`Receipt No: VLP/2026/${id}`, 70, 340);
            ctx.textAlign = "right";
            ctx.fillText(`Date Issued: ${dateStr}`, width - 70, 340);
            ctx.textAlign = "center";

            ctx.beginPath();
            ctx.moveTo(50, 365);
            ctx.lineTo(width - 50, 365);
            ctx.strokeStyle = theme.border;
            ctx.lineWidth = 1;
            ctx.stroke();

            // ========== DONOR CARD ==========
            roundedRect(50, 390, width - 100, 130, 12);
            ctx.fillStyle = theme.surface;
            ctx.fill();
            ctx.strokeStyle = theme.border;
            ctx.stroke();

            ctx.font = `bold 12px sans-serif`;
            ctx.fillStyle = theme.textMuted;
            ctx.textAlign = "left";
            ctx.fillText("DONOR INFORMATION", 70, 415);

            ctx.font = `bold 22px sans-serif`;
            ctx.fillStyle = theme.textPrimary;
            ctx.fillText(donation.name || "Anonymous Donor", 70, 445);

            ctx.font = `500 13px sans-serif`;
            ctx.fillStyle = theme.textSecondary;
            if (donation.phone_number) ctx.fillText(`Contact: ${donation.phone_number}`, 70, 475);
            ctx.fillText(`Reported By: ${donation.reported_by || '-'}`, 70, 495);

            if (verifyImg) {
                const vSize = 30;
                ctx.drawImage(verifyImg, width - 180, 400, vSize, vSize);
                ctx.font = `bold 11px sans-serif`;
                ctx.fillStyle = theme.accent;
                ctx.fillText("VERIFIED DONOR", width - 145, 420);
            }

            // ========== DONATION DETAILS CARD ==========
            roundedRect(50, 545, width - 100, 230, 12);
            ctx.fillStyle = "#FFFFFF";
            ctx.fill();
            ctx.shadowColor = "rgba(0,0,0,0.05)";
            ctx.shadowBlur = 8;
            ctx.strokeStyle = theme.border;
            ctx.stroke();
            ctx.shadowColor = "transparent";

            ctx.font = `bold 12px sans-serif`;
            ctx.fillStyle = theme.textMuted;
            ctx.fillText("CONTRIBUTION DETAILS", 70, 575);

            let yOffset = 600;
            ctx.font = `bold 14px sans-serif`;
            ctx.fillStyle = theme.textSecondary;
            ctx.fillText("Description", 70, yOffset);
            ctx.fillText("Value / Amount", width - 200, yOffset);

            ctx.beginPath();
            ctx.moveTo(70, yOffset + 12);
            ctx.lineTo(width - 70, yOffset + 12);
            ctx.strokeStyle = theme.border;
            ctx.stroke();

            yOffset += 35;
            ctx.font = `bold 18px sans-serif`;
            ctx.fillStyle = theme.textPrimary;
            const desc = donation.donation_type === 'Cash' ? (donation.donor_category || 'Cash Contribution') : `${donation.item_description || 'Goods'} ${donation.quantity ? '(x'+donation.quantity+')' : ''}`;
            ctx.fillText(desc, 70, yOffset);

            ctx.font = `bold 22px sans-serif`;
            ctx.fillStyle = theme.primary;
            const amount = donation.donation_type === 'Cash' ? `LKR ${(Number(donation.amount) || 0).toLocaleString('en-LK')}` : 'GOODS';
            ctx.textAlign = "right";
            ctx.fillText(amount, width - 70, yOffset);
            ctx.textAlign = "left";

            yOffset += 45;
            ctx.font = `500 12px sans-serif`;
            ctx.fillStyle = theme.textMuted;
            ctx.fillText(`Payment Method: ${donation.donation_type === 'Cash' ? 'Cash Payment' : 'Goods / In-kind'}`, 70, yOffset);

            ctx.beginPath();
            roundedRect(width - 170, yOffset - 8, 100, 24, 12);
            ctx.fillStyle = theme.successLight;
            ctx.fill();
            ctx.font = `bold 11px sans-serif`;
            ctx.fillStyle = theme.success;
            ctx.textAlign = "center";
            ctx.fillText("✓ RECEIVED", width - 120, yOffset + 8);
            ctx.textAlign = "left";

            yOffset += 40;
            ctx.beginPath();
            ctx.moveTo(70, yOffset);
            ctx.lineTo(width - 70, yOffset);
            ctx.strokeStyle = theme.border;
            ctx.stroke();

            yOffset += 25;
            ctx.font = `bold 14px sans-serif`;
            ctx.fillStyle = theme.textPrimary;
            ctx.fillText("Total Contribution", 70, yOffset);
            ctx.font = `bold 24px sans-serif`;
            ctx.fillStyle = theme.accent;
            ctx.textAlign = "right";
            const finalTotal = donation.donation_type === 'Cash' ? `LKR ${(Number(donation.amount) || 0).toLocaleString('en-LK')}.00` : 'GOODS RECEIVED';
            ctx.fillText(finalTotal, width - 70, yOffset);
            ctx.textAlign = "center";

            // ========== VERIFICATION STAMP ==========
            ctx.save();
            ctx.translate(width - 120, height - 320);
            ctx.beginPath();
            ctx.arc(0, 0, 45, 0, Math.PI * 2);
            ctx.strokeStyle = theme.accent;
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(0, 0, 38, 0, Math.PI * 2);
            ctx.stroke();
            ctx.font = `bold 10px sans-serif`;
            ctx.fillStyle = theme.accent;
            ctx.fillText("VERIFIED", 0, -8);
            ctx.font = `bold 18px sans-serif`;
            ctx.fillStyle = theme.primary;
            ctx.fillText("✓", 0, 12);
            ctx.font = `8px sans-serif`;
            ctx.fillStyle = theme.textMuted;
            ctx.fillText("OFFICIAL SEAL", 0, 28);
            ctx.restore();

            // ========== FOOTER SECTION ==========
            ctx.font = `italic 14px serif`;
            ctx.fillStyle = theme.textSecondary;
            ctx.fillText("“May the blessings of the Triple Gem be upon you.”", width / 2, height - 230);

            ctx.font = `bold 11px sans-serif`;
            ctx.fillStyle = theme.textMuted;
            ctx.fillText("This Dana is offered for the success of the Vesak Lantern Project and the happiness of all beings.", width / 2, height - 205);

            ctx.beginPath();
            ctx.moveTo(50, height - 175);
            ctx.lineTo(width - 50, height - 175);
            ctx.strokeStyle = theme.border;
            ctx.stroke();

            // Contact Details
            ctx.font = `bold 11px sans-serif`;
            ctx.fillStyle = theme.textSecondary;
            ctx.fillText('071 615 5666 (Isara Dilnuka)  |  071 084 6810 (Imesh Nilhan)', width / 2, height - 150);
            ctx.fillText('isaradilnuka2005@gmail.com  |  imeshnilhan21@gmail.com', width / 2, height - 130);
            ctx.font = `500 10px sans-serif`;
            ctx.fillText('Near New Temple, Dikhenapura · Vesak Lantern Project 2026', width / 2, height - 110);
            ctx.fillText('This is a computer-generated receipt and requires no signature.', width / 2, height - 90);

            ctx.font = `bold 10px monospace`;
            ctx.fillStyle = theme.textMuted;
            ctx.textAlign = "left";
            ctx.fillText(`TXN REF: ${id}`, 55, height - 45);
            ctx.textAlign = "right";
            ctx.fillText(`Generated: ${new Date().toLocaleTimeString()}`, width - 55, height - 45);

            // Convert to PDF
            const imgData = canvas.toDataURL('image/jpeg', 1.0);
            const pdf = new jsPDF({
                orientation: 'portrait',
                unit: 'px',
                format: [width, height]
            });
            pdf.addImage(imgData, 'JPEG', 0, 0, width, height);
            pdf.save(`Receipt_${(donation.name || 'Anonymous').replace(/\\s+/g, '_')}_${donation.date}.pdf`);
        };
    </script>
</head>
<body class="min-h-screen flex flex-col items-center bg-[url('logo.png')] bg-center bg-no-repeat bg-fixed bg-blend-overlay" style="background-size: 50%;">
    
    <header class="w-full p-6 flex justify-between items-center max-w-4xl mx-auto relative z-10">
        <a href="index.html" class="flex items-center gap-3 text-white hover:text-theme transition">
            <span class="material-symbols-rounded">arrow_back</span> Back
        </a>
        <img src="logo.png" alt="Logo" class="h-10">
    </header>

    <main class="w-full max-w-2xl px-6 py-10 relative z-10 flex-1">
        <div class="glass-card p-8 text-center fade-in">
            <span class="material-symbols-rounded text-theme text-5xl mb-4">search</span>
            <h1 class="text-3xl font-bold text-white mb-2">Find Your Receipt</h1>
            <p class="text-slate-400 mb-8">Enter your registered phone number to view and download your official donation receipt.</p>
            
            <form onsubmit="window.searchDonation(event)" class="flex gap-2">
                <input type="tel" id="phone-input" placeholder="e.g. 0712345678" required
                    class="flex-1 bg-slate-900/60 border border-slate-700 rounded-lg p-4 text-white focus:outline-none focus:border-theme transition" />
                <button type="submit" class="bg-theme hover:bg-theme-hover text-white px-8 rounded-lg font-semibold transition">
                    Search
                </button>
            </form>
        </div>

        <div id="results" class="mt-8"></div>
    </main>
    
</body>
</html>
